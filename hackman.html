    "sheet": "In general, a large, broad piece of anything thin, as paper, cloth, etc.; a broad, thin portion of any substance; an expanded superficies.",
    "shelf": "1. (Arch.)  A flat tablet or ledge of any material set horizontally at a distance from the floor, to hold objects of use or ornament. 2. A sand bank in the sea, or a rock, or ledge of rocks, rendering the water shallow, and dangerous to ships.",
    "shell": "1. A hard outside covering, as of a fruit or an animal.",
    "shelter": "1. That which covers or defends from injury or annoyance; a protection; a screen.",
    "shelve": "1. To furnish with shelves; as, to shelve a closet or a library. 2. To place on a shelf.",
    "shelving": "Sloping gradually; inclining; as, a shelving shore.",
    "sherry": "A Spanish light-colored dry wine, made in Andalusia.",
    "shield": "1. A broad piece of defensive armor, carried on the arm, -- formerly in general use in war, for the protection of the body.",
    "shifter": "1. One who, or that which, shifts; one who plays tricks or practices artifice; a cozener.",
    "shifting": "1. Changing in place, position, or direction; varying; variable; fickle; as, shifting winds; shifting opinions or principles. 2. Adapted or used for shifting anything.",
    "shiftless": "Destitute of expedients, or not using successful expedients; characterized by failure, especially by failure to provide for one's own support, through negligence or incapacity; hence, lazy; improvident; thriftless; as, a shiftless fellow; shiftless management.",
    "shifty": "Full of, or ready with, shifts; fertile in expedients or contrivance.",
    "shimmer": "To shine with a tremulous or intermittent light; to shine faintly; to gleam; to glisten; to glimmer.",
    "shimmy": "A chemise.",
    "shine": "1. To emit rays of light; to give light; to beam with steady radiance; to exhibit brightness or splendor; as, the sun shines by day; the moon shines by night.",
    "shining": "1. Emitting light, esp. in a continuous manner; radiant; as, shining lamps; also, bright by the reflection of light; as, shining armor.",
    "shiny": "Bright; luminous; clear; unclouded.",
    "ship": "Pay; reward.",
    "shirt": "A loose under-garment for the upper part of the body, made of cotton, linen, or other material; -- formerly used of the under- garment of either sex, now commonly restricted to that worn by men and boys.",
    "shock": "1. A pile or assemblage of sheaves of grain, as wheat, rye, or the like, set up in a field, the sheaves varying in number from twelve to sixteen; a stook.",
    "shore": "imp. of Shear.",
    "shorten": "1. To make short or shorter in measure, extent, or time; as, to shorten distance; to shorten a road; to shorten days of calamity. 2. To reduce or diminish in amount, quantity, or extent; to lessen; to abridge; to curtail; to contract; as, to shorten work, an allowance of food, etc.",
    "shorthand": "A compendious and rapid method or writing by substituting characters, abbreviations, or symbols, for letters, words, etc.; short writing; stenography.",
    "shortly": "1. In a short or brief time or manner; soon; quickly.",
    "shout": "To utter a sudden and loud outcry, as in joy, triumph, or exultation, or to attract attention, to animate soldiers, etc.",
    "shove": "1. To drive along by the direct and continuous application of strength; to push; especially, to push (a body) so as to make it move along the surface of another body; as, to shove a boat on the water; to shove a table across the floor. 2. To push along, aside, or away, in a careless or rude manner; to jostle.",
    "shower": "1. One who shows or exhibits. 2. That which shows; a mirror.",
    "showing": "1. Appearance; display; exhibition. 2. Presentation of facts; statement.",
    "showy": ", a. Etym: [Compar.",
    "shrapnel": "Applied as an appellation to a kind of shell invented by Gen.",
    "shredding": "1. The act of cutting or tearing into shreds. 2. That which is cut or torn off; a piece.",
    "shriek": "To utter a loud, sharp, shrill sound or cry, as do some birds and beasts; to scream, as in a sudden fright, in horror or anguish.",
    "shrill": "Acute; sharp; piercing; having or emitting a sharp, piercing tone or sound; -- said a sound, or of that which produces a sound.",
    "shrimp": "To contract; to shrink.",
    "shrine": "1. A case, box, or receptacle, especially one in which are deposited sacred relics, as the bones of a saint. 2. Any sacred place, as an altar, tromb, or the like.",
    "shrink": "1. To wrinkle, bend, or curl; to shrivel; hence, to contract into a less extent or compass; to gather together; to become compacted.",
    "shrivel": "To draw, or be drawn, into wrinkles; to shrink, and form corrugations; as, a leaf shriveles in the hot sun; the skin shrivels with age; -- often with up.",
    "shrouded": "Provided with a shroud or shrouds.",
    "shrubbery": "1. A collection of shrubs. 2. A place where shrubs are planted.",
    "shrug": "To draw up or contract (the shoulders), especially by way of expressing dislike, dread, doubt, or the like.",
    "shudder": "To tremble or shake with fear, horrer, or aversion; to shiver with cold; to quake.",
    "shuffle": "1. To shove one way and the other; to push from one to another; as, to shuffle money from hand to hand. 2. To mix by pushing or shoving; to confuse; to throw into disorder; especially, to change the relative positions of, as of the cards in a pack.",
    "shuffling": "1. Moving with a dragging, scraping step.",
    "shun": "To avoid; to keep clear of; to get out of the way of; to escape from; to eschew; as, to shun rocks, shoals, vice.",
    "shut": "1. To close so as to hinder ingress or egress; as, to shut a door or a gate; to shut one's eyes or mouth. 2. To forbid entrance into; to prohibit; to bar; as, to shut the ports of a country by a blockade.",
    "shy": "1. Easily frightened; timid; as, a shy bird.",
    "siberian": "Of or pertaining to Siberia, a region comprising all northern Asia and belonging to Russia; as, a Siberian winter. -- n.  A native or inhabitant of Siberia.",
    "sierra": "A ridge of mountain and craggy rocks, with a serrated or irregular outline; as, the Sierra Nevada.",
    "sift": "1. To separate with a sieve, as the fine part of a substance from the coarse; as, to sift meal or flour; to sift powder; to sift sand or lime. 2. To separate or part as if with a sieve.",
    "sighing": "Uttering sighs; grieving; lamenting.",
    "silent": "1. Free from sound or noise; absolutely still; perfectly quiet.",
    "silicon": "A nonmetalic element analogous to carbon.",
    "silk": "1. The fine, soft thread produced by various species of caterpillars in forming the cocoons within which the worm is inclosed during the pupa state, especially that produced by the larvæ of Bombyx mori. 2. Hence, thread spun, or cloth woven, from the above-named material. 3. That which resembles silk, as the filiform styles of the female flower of maize.",
    "silly": "1. Happy; fortunate; blessed.",
    "silo": "A pit or vat for packing away green fodder for winter use so as to exclude air and outside moisture.",
    "silt": "Mud or fine earth deposited from running or standing water.",
    "silver": "1. (Chem.)  A soft white metallic element, sonorous, ductile, very malleable, and capable of a high degree of polish.",
    "simile": "A word or phrase by which anything is likened, in one or more of its aspects, to something else; a similitude; a poetical or imaginative comparison.",
    "simple": "1. Single; not complex; not infolded or entangled; uncombined; not compounded; not blended with something else; not complicated; as, a simple substance; a simple idea; a simple sound; a simple machine; a simple problem; simple tasks. 2. Plain; unadorned; as, simple dress.",
    "simplify": "To make simple; to make less complex; to make clear by giving the explanation for; to show an easier or shorter process for doing or making.",
    "simply": "1. In a simple manner or state; considered in or by itself; without addition; along; merely; solely; barely.",
    "sincere": "1. Pure; unmixed; unadulterated.",
    "sincerity": "The quality or state of being sincere; honesty of mind or intention; freedom from simulation, hypocrisy, disguise, or false pretense; sincereness.",
    "singer": "One who, or that which, singes.",
    "singing": "from Sing, v. Singing bird.",
    "single": "1. One only, as distinguished from more than one; consisting of one alone; individual; separate; as, a single star.",
    "singular": "1. Separate or apart from others; single; distinct.",
    "sinister": "1. On the left hand, or the side of the left hand; left; -- opposed to dexter, or right.",
    "sinless": "Free from sin.",
    "sinner": "One who has sinned; especially, one who has sinned without repenting; hence, a persistent and incorrigible transgressor; one condemned by the law of God.",
    "sinuous": "Bending in and out; of a serpentine or undulating form; winding; crooked.",
    "sip": "1. To drink or imbibe in small quantities; especially, to take in with the lips in small quantities, as a liquid; as, to sip tea.",
    "siren": "1. (Class.",
    "sister": "1. A female who has the same parents with another person, or who has one of them only.",
    "situated": "1. Having a site, situation, or location; being in a relative position; permanently fixed; placed; located; as, a town situated, or situate, on a hill or on the seashore. 2. Placed; residing.",
    "situation": "1. Manner in which an object is placed; location, esp. as related to something else; position; locality site; as, a house in a pleasant situation. 2. Position, as regards the conditions and circumstances of the case.",
    "sizable": "1. Of considerable size or bulk.",
    "sizzle": "To make a hissing sound; to fry, or to dry and shrivel up, with a hissing sound.",
    "skater": "1. One who skates. 2. (Zoöl.)  Any one of numerous species of hemipterous insects belonging to Gerris, Pyrrhocoris, Prostemma, and allied genera.",
    "skedaddle": "To betake one's self to flight, as if in a panic; to flee; to run away.",
    "skeleton": "1. (Anat.) (a) The bony and cartilaginous framework which supports the soft parts of a vertebrate animal.",
    "skeptic": "1. One who is yet undecided as to what is true; one who is looking or inquiring for what is true; an inquirer after facts or reasons. 2. (Metaph.)  A doubter as to whether any fact or truth can be certainly known; a universal doubter; a Pyrrhonist; hence, in modern usage, occasionally, a person who questions whether any truth or fact can be established on philosophical grounds; sometimes, a critical inquirer, in opposition to a dogmatist.",
    "sketch": "An outline or general delineation of anything; a first rough or incomplete draught or plan of any design; especially, in the fine arts, such a representation of an object or scene as serves the artist's purpose by recording its chief features; also, a preliminary study for an original work.",
    "skewer": "A pin of wood or metal for fastening meat to a spit, or for keeping it in form while roasting.",
    "skid": "1. A shoe or clog, as of iron, attached to a chain, and placed under the wheel of a wagon to prevent its turning when descending a steep hill; a drag; a skidpan; also, by extension, a hook attached to a chain, and used for the same purpose. 2. A piece of timber used as a support, or to receive pressure.",
    "skillful": "1. Discerning; reasonable; judicious; cunning.",
    "skimmer": "1. One who, or that which, skims; esp., a utensil with which liquids are skimmed. 2. (Zoöl.)  Any species of longwinged marine birds of the genus Rhynchops, allied to the terns, but having the lower mandible compressed and much longer than the upper one.",
    "skinny": "Consisting, or chiefly consisting, of skin; wanting flesh.",
    "skipper": "1. One who, or that which, skips. 2. A young, thoughtless person.",
    "skirt": "1. The lower and loose part of a coat, dress, or other like garment; the part below the waist; as, the skirt of a coat, a dress, or a mantle. 2. A loose edging to any part of a dress.",
    "skittle": "Pertaining to the game of skittles.",
    "slab": "1. A thin piece of anything, especially of marble or other stone, having plane surfaces.",
    "slam": "1. To shut with force and a loud noise; to bang; as, he slammed the door. 2. To put in or on some place with force and loud noise; -- usually with down; as, to slam a trunk down on the pavement. 3. To strike with some implement with force; hence, to beat or cuff.",
    "slander": "1. A false tale or report maliciously uttered, tending to injure the reputation of another; the malicious utterance of defamatory reports; the dissemination of malicious tales or suggestions to the injury of another.",
    "slang": "imp. of Sling.",
    "slapping": "Very large; monstrous; big.",
    "slashed": "1. Marked or cut with a slash or slashes; deeply gashed; especially, having long, narrow openings, as a sleeve or other part of a garment, to show rich lining or under vesture.",
    "slate": "1. (Min.)  An argillaceous rock which readily splits into thin plates; argillite; argillaceous schist. 2. Any rock or stone having a slaty structure. 3. A prepared piece of such stone.",
    "sled": "1. A vehicle on runners, used for conveying loads over the snow or ice; -- in England called sledge. 2. A small, light vehicle with runners, used, mostly by young persons, for sliding on snow or ice.",
    "sleek": "1. Having an even, smooth surface; smooth; hence, glossy; as, sleek hair.",
    "sleep": "imp. of Sleep.",
    "sleet": "The part of a mortar extending from the chamber to the trunnions.",
    "slick": "See Schlich.",
    "slider": "See Slidder.",
    "sliding": "1. That slides or slips; gliding; moving smoothly. 2. Slippery; elusory.",
    "slightly": "1. In a slight manner. 2. Slightingly; negligently.",
    "slimy": "Of or pertaining to slime; resembling slime; of the nature of slime; viscous; glutinous; also, covered or daubed with slime; yielding, or abounding in, slime.",
    "slinky": "Thin; lank.",
    "slip": "1. To move along the surface of a thing without bounding, rolling, or stepping; to slide; to glide. 2. To slide; to lose one's footing or one's hold; not to tread firmly; as, it is necessary to walk carefully lest the foot should slip. 3. To move or fly (out of place); to shoot; -- often with out, off, etc.; as, a bone may slip out of its place. 4. To depart, withdraw, enter, appear, intrude, or escape as if by sliding; to go or come in a quiet, furtive manner; as, some errors slipped into the work.",
    "slit": "3d. pers. sing. pres. of Slide.",
    "sliver": "To cut or divide into long, thin pieces, or into very small pieces; to cut or rend lengthwise; to slit; as, to sliver wood.",
    "slobbery": "Wet; sloppy, as land.",
    "slogan": "The war cry, or gathering word, of a Highland clan in Scotland; hence, any rallying cry.",
    "sloping": "Inclining or inclined from the plane of the horizon, or from a horizontal or other right line; oblique; declivous; slanting.",
    "slot": "1. A broad, flat, wooden bar; a slat or sloat. 2. A bolt or bar for fastening a door.",
    "slouchy": "Slouching.",
    "sludge": "1. Mud; mire; soft mud; slush.",
    "slug": "1. A drone; a slow, lazy fellow; a sluggard.",
    "slum": "1. A foul back street of a city, especially one filled with a poor, dirty, degraded, and often vicious population; any low neighborhood or dark retreat; -- usually in the plural; as, Westminster slums are haunts for theives.",
    "sly": "1. Dexterous in performing an action, so as to escape notice; nimble; skillful; cautious; shrewd; knowing; -- in a good sense.",
    "small": "1. Having little size, compared with other things of the same kind; little in quantity or degree; diminutive; not large or extended in dimension; not great; not much; inconsiderable; as, a small man; a small river.",
    "smasher": "1. One who, or that which, smashes or breaks things to pieces. 2. Anything very large or extraordinary.",
    "smell": "1. To perceive by the olfactory nerves, or organs of smell; to have a sensation of, excited through the nasal organs when affected by the appropriate materials or qualities; to obtain the scent of; as, to smell a rose; to smell perfumes. 2. To detect or perceive, as if by the sense of smell; to scent out; -- often with out.",
    "smelting": "a. & n. from Smelt.",
    "smile": "1. To express amusement, pleasure, moderate joy, or love and kindness, by the features of the face; to laugh silently.",
    "smilingly": "In a smiling manner.",
    "smirk": "To smile in an affected or conceited manner; to smile with affected complaisance; to simper.",
    "smite": "1. To strike; to inflict a blow upon with the hand, or with any instrument held in the hand, or with a missile thrown by the hand; as, to smite with the fist, with a rod, sword, spear, or stone.",
    "smith": "1. One who forgess with the hammer; one who works in metals; as, a blacksmith, goldsmith, silversmith, and the like.",
    "smock": "1. A woman's under-garment; a shift; a chemise.",
    "smokeless": "Making or having no smoke.",
    "smoking": "from Smoke.",
    "smoky": "1. Emitting smoke, esp. in large quantities or in an offensive manner; fumid; as, smoky fires. 2. Having the appearance or nature of smoke; as, a smoky fog.",
    "smolder": "1. To burn and smoke without flame; to waste away by a slow and supressed combustion.",
    "smooth": "1. Having an even surface, or a surface so even that no roughness or points can be perceived by the touch; not rough; as, smooth glass; smooth porcelain.",
    "smudge": "1. A suffocating smoke.",
    "smugly": "In a smug manner.",
    "snack": "1. A share; a part or portion; -- obsolete, except in the colloquial phrase, to go snacks, i. e., to share.",
    "snap": "1. To break at once; to break short, as substances that are brittle.",
    "snare": "1. A contrivance, often consisting of a noose of cord, or the like, by which a bird or other animal may be entangled and caught; a trap; a gin. 2. Hence, anything by which one is entangled and brought into trouble.",
    "sneak": "1. To creep or steal (away or about) privately; to come or go meanly, as a person afraid or ashamed to be seen; as, to sneak away from company. imp. & p. p. \"snuck\" is more common now, but not even mentioned here.",
    "sneer": "1. To show contempt by turning up the nose, or by a particular facial expression. 2. To inssinuate contempt by a covert expression; to speak derisively.",
    "sneeze": "To emit air, chiefly through the nose, audibly and violently, by a kind of involuntary convulsive force, occasioned by irritation of the inner membrane of the nose.",
    "snide": "Tricky; deceptive; contemptible; as, a snide lawyer; snide goods.",
    "sniff": "To draw air audibly up the nose; to snuff; -- sometimes done as a gesture of suspicion, offense, or contempt.",
    "snippet": "A small part or piece.",
    "snooze": "A short sleep; a nap.",
    "snore": "To breathe with a rough, hoarse, nasal voice in sleep.",
    "snoring": "The act of respiring through the open mouth so that the currents of inspired and expired air cause a vibration of the uvula and soft palate, thus giving rise to a sound more or less harsh.",
    "snort": "1. To force the air with violence through the nose, so as to make a noise, as do high-spirited horsed in prancing and play.",
    "snout": "1. The long, projecting nose of a beast, as of swine. 2. The nose of a man; -- in contempt.",
    "snowbird": "(a) An arctic finch (Plectrophenax, or Plectrophanes, nivalis) common, in winter, both in Europe and the United States, and often appearing in large flocks during snowstorms.",
    "snowcap": "A very small humming bird (Microchæra albocoronata) native of New Grenada.",
    "snowdrop": "A bulbous plant (Galanthus nivalis) bearing white flowers, which often appear while the snow is on the ground.",
    "snowy": "1. White like snow.",
    "snub": "To sob with convulsions.",
    "snuff": "The part of a candle wick charred by the flame, whether burning or not.",
    "speak": "1. To utter words or articulate sounds, as human beings; to express thoughts by words; as, the organs may be so obstructed that a man may not be able to speak.",
    "spearfish": "(a) A large and powerful fish (Tetrapturus albidus) related to the swordfish, but having scales and ventral fins.",
    "spearman": "One who is armed with a spear.",
    "spearmint": "A species of mint (Mentha viridis) growing in moist soil.",
    "species": "1. Visible or sensible presentation; appearance; a sensible percept received by the imagination; an image.",
    "specimen": "A part, or small portion, of anything, or one of a number of things, intended to exhibit the kind and quality of the whole, or of what is not exhibited; a sample; as, a specimen of a man's handwriting; a specimen of painting; aspecimen of one's art.",
    "speckled": "Marked or variegated with small spots of a different color from that of the rest of the surface.",
    "spectacle": "1. Something exhibited to view; usually, something presented to view as extraordinary, or as unusual and worthy of special notice; a remarkable or noteworthy sight; a show; a pageant; a gazingstock.",
    "spectator": "One who on; one who sees or beholds; a beholder; one who is personally present at, and sees, any exhibition; as, the spectators at a show.",
    "spectrum": "1. An apparition; a specter.",
    "speculate": "1. To consider by turning a subject in the mind, and viewing it in its different aspects and relations; to meditate; to contemplate; to theorize; as, to speculate on questions in religion; to speculate on political events.",
    "speech": "1. The faculty of uttering articulate sounds or words; the faculty of expressing thoughts by words or articulate sounds; the power of speaking.",
    "speed": "1. Prosperity in an undertaking; favorable issue; success.",
    "spellbind": "To bind or hold by, or as if by, a spell or charm; to fascinate, esp. by eloquence of speech, as in a political campaign.",
    "speller": "1. One who spells. 2. A spelling book.",
    "spelling": "The act of one who spells; formation of words by letters; orthography.",
    "spending": "The act of expending; expenditure.",
    "spent": "1. Exhausted; worn out; having lost energy or motive force.",
    "spew": "1. To eject from the stomach; to vomit. 2. To cast forth with abhorrence or disgust; to eject.",
    "sphere": "1. (Geom.)  A body or space contained under a single surface, which in every part is equally distant from a point within called its center. 2. Hence, any globe or globular body, especially a celestial one, as the sun, a planet, or the earth.",
    "spherical": "1. Having the form of a sphere; like a sphere; globular; orbicular; as, a spherical body. 2. Of or pertaining to a sphere. 3. Of or pertaining to the heavenly orbs, or to the sphere or spheres in which, according to ancient astronomy and astrology, they were set.",
    "sphinx": "1. (a) In Egyptian art, an image of granite or porphyry, having a human head, or the head of a ram or of a hawk, upon the wingless body of a lion.",
    "spider": "1. (Zoöl.)  Any one of numerous species of arachnids comprising the order Araneina.",
    "spill": "1. A bit of wood split off; a splinter.",
    "spilt": "imp. & p. p. of Spill.",
    "spinach": "A common pot herb (Spinacia oleracea) belonging to the Goosefoot family.",
    "spinal": "1. (Anat.)  Of, pertaining to, or in the region of, the backbone, or vertebral column; rachidian; vertebral. 2. Of or pertaining to a spine or spines.",
    "spindle": "1. The long, round, slender rod or pin in spinning wheels by which the thread is twisted, and on which, when twisted, it is wound; also, the pin on which the bobbin is held in a spinning machine, or in the shuttle of a loom. 2. A slender rod or pin on which anything turns; an axis; as, the spindle of a vane.",
    "spinner": "1. One who, or that which, spins one skilled in spinning; a spinning machine. 2. A spider.",
    "spinning": "from Spin.",
    "spinster": "1. A woman who spins, or whose occupation is to spin.",
    "spiny": "1. Full of spines; thorny; as, a spiny tree. 2. Like a spine in shape; slender.",
    "spiral": "1. Winding or circling round a center or pole and gradually receding from it; as, the spiral curve of a watch spring. 2. Winding round a cylinder or imaginary axis, and at the same time rising or advancing forward; winding like the thread of a screw; helical. 3. (Geom.)  Of or pertaining to a spiral; like a spiral.",
    "spirited": "1. Animated or possessed by a spirit.",
    "spiritual": "1. Consisting of spirit; not material; incorporeal; as, a spiritual substance or being.",
    "spleen": "1. (Anat.)  A peculiar glandlike but ductless organ found near the stomach or intestine of most vertebrates and connected with the vascular system; the milt.",
    "splendor": "1. Great brightness; brilliant luster; brilliancy; as, the splendor ot the sun.",
    "splice": "1. To unite, as two ropes, or parts of a rope, by a particular manner of interweaving the strands, -- the union being between two ends, or between an end and the body of a rope. 2. To unite, as spars, timbers, rails, etc., by lapping the two ends together, or by applying a piece which laps upon the two ends, and then binding, or in any way making fast. 3. To unite in marrige.",
    "splinter": "1. To split or rend into long, thin pieces; to shiver; as, the lightning splinters a tree.",
    "splurge": "A blustering demonstration, or great effort; a great display.",
    "spoken": "1. Uttered in speech; delivered by word of mouth; oral; as, a spoken narrative; the spoken word. 2. Characterized by a certain manner or style in speaking; -- often in composition; as, a pleasant-spoken man.",
    "spokesman": "One who speaks for another.",
    "sponge": "1. (Zoöl.)  Any one of numerous species of Spongiæ, or Porifera.",
    "spongy": "1. Soft, and full of cavities; of an open, loose, pliable texture; as, a spongy excrescence; spongy earth; spongy cake; spongy bones. 2. Wet; drenched; soaked and soft, like sponge; rainy.",
    "spool": "A piece of cane or red with a knot at each end, or a hollow cylinder of wood with a ridge at each end, used to wind thread or yarn upon.",
    "spoon": "See Spoom.",
    "spore": "1. (Bot.) (a) One of the minute grains in flowerless plants, which are analogous to seeds, as serving to reproduce the species.",
    "sporting": "Of pertaining to, or engaging in, sport or sporrts; exhibiting the character or conduct of one who, or that which, sports.",
    "spotless": "Without a spot; especially, free from reproach or impurity; pure; untained; innocent; as, a spotless mind; spotless behavior.",
    "spotlight": "The projected spot or circle of light used to illuminate brilliantly a single person or object or group on the stage; leaving the rest of the stage more or less unilluminated; hence, conspicuous public notice.",
    "spotted": "Marked with spots; as, a spotted garment or character.",
    "spousal": "Of or pertaining to a spouse or marriage; nuptial; matrimonial; conjugal; bridal; as, spousal rites; spousal ornaments.",
    "spouse": "1. A man or woman engaged or joined in wedlock; a married person, husband or wife.",
    "spout": "1. To throw out forcibly and abudantly, as liquids through an office or a pipe; to eject in a jet; as, an elephant spouts water from his trunk.",
    "sprain": "To weaken, as a joint, ligament, or muscle, by sudden and excessive exertion, as by wrenching; to overstrain, or stretch injuriously, but without luxation; as, to sprain one's ankle.",
    "sprawl": "1. To spread and stretch the body or limbs carelessly in a horizontal position; to lie with the limbs stretched out ungracefully. 2. To spread irregularly, as vines, plants, or tress; to spread ungracefully, as chirography. 3. To move, when lying down, with awkward extension and motions of the limbs; to scramble in creeping.",
    "spray": "1. A small shoot or branch; a twig.",
    "spree": "A merry frolic; especially, a drinking frolic; a carousal.",
    "sprig": "1. A small shoot or twig of a tree or other plant; a spray; as, a sprig of laurel or of parsley. 2. A youth; a lad; -- used humorously or in slight disparagement.",
    "spring": "1. To leap; to bound; to jump.",
    "sprint": "To run very rapidly; to run at full speed.",
    "sprite": "1. A spirit; a soul; a shade; also, an apparition.",
    "sprout": "1. To shoot, as the seed of a plant; to germinate; to push out new shoots; hence, to grow like shoots of plants. 2. To shoot into ramifications.",
    "spruce": "1. (Bot.)  Any coniferous tree of the genus Picea, as the Norway spruce (P. excelsa), and the white and black spruces of America (P. alba and P. nigra), besides several others in the far Northwest.",
    "sprung": "imp. & p. p. of Spring.",
    "spry": "Having great power of leaping or running; nimble; active.",
    "spud": "1. A sharp, narrow spade, usually with a long handle, used by farmers for digging up large-rooted weeds; a similarly shaped implement used for various purposes.",
    "spur": "(a) A sparrow.",
    "sputter": "1. To spit, or to emit saliva from the mouth in small, scattered portions, as in rapid speaking. 2. To utter words hastily and indistinctly; to speak so rapidly as to emit saliva.",
    "squabble": "1. To contend for superiority in an unseemly maner; to scuffle; to struggle; to wrangle; to quarrel. 2. To debate peevishly; to dispute.",
    "squad": "1. (Mil.)  A small party of men assembled for drill, inspection, or other purposes. 2. Hence, any small party.",
    "squall": "A sudden violent gust of wind often attended with rain or snow.",
    "squander": "1. To scatter; to disperse.",
    "squash": "An American animal allied to the weasel.",
    "squatter": "1. One who squats; specifically, one who settles unlawfully upon land without a title.",
    "squeak": "1. To utter a sharp, shrill cry, usually of short duration; to cry with an acute tone, as an animal; or, to make a sharp, disagreeable noise, as a pipe or quill, a wagon wheel, a door; to creak.",
    "squeamish": "Having a stomach that is easily or nauseated; hence, nice to excess in taste; fastidious; easily disgusted; apt to be offended at trifling improprieties.",
    "squeeze": "1. To press between two bodies; to press together closely; to compress; often, to compress so as to expel juice, moisture, etc.; as, to squeeze an orange with the fingers; to squeeze the hand in friendship. 2. Fig.: To oppress with hardships, burdens, or taxes; to harass; to crush.",
    "squeezing": "1. The act of pressing; compression; oppression. 2. pl.",
    "squid": "1. (Zoöl.)  Any one of numerous species of ten-armed cephalopods having a long, tapered body, and a caudal fin on each side; especially, any species of Loligo, Ommastrephes, and related genera.",
    "squiggle": "To shake and wash a fluid about in the mouth with the lips closed.",
    "squint": "1. Looking obliquely.",
    "squire": "A square; a measure; a rule.",
    "squirt": "To drive or eject in a stream out of a narrow pipe or orifice; as, to squirt water.",
    "stability": "1. The state or quality of being stable, or firm; steadiness; firmness; strength to stand without being moved or overthrown; as, the stability of a structure; the stability of a throne or a constitution. 2. Steadiness or firmness of character, firmness of resolution or purpose; the quality opposite to Ant: fickleness, Ant: irresolution, or Ant: inconstancy; constancy; steadfastness; as, a man of little stability, or of unusual stability. 3. Fixedness; -- as opposed to Ant: fluidity.",
    "stable": "1. Firmly established; not easily moved, shaken, or overthrown; fixed; as, a stable government.",
    "stack": "1. A large pile of hay, grain, straw, or the like, usually of a nearly conical form, but sometimes rectangular or oblong, contracted at the top to a point or ridge, and sometimes covered with thatch.",
    "stadium": "1. A Greek measure of length, being the chief one used for itinerary distances, also adopted by the Romans for nautical and astronomical measurements.",
    "staff": "1. A long piece of wood; a stick; the long handle of an instrument or weapon; a pole or srick, used for many purposes; as, a surveyor's staff; the staff of a spear or pike.",
    "stage": "1. A floor or story of a house.",
    "stagnant": "1. That stagnates; not flowing; not running in a current or steam; motionless; hence, impure or foul from want of motion; as, a stagnant lake or pond; stagnant blood in the veins. 2. Not active or brisk; dull; as, business in stagnant.",
    "stagnate": "1. To cease to flow; to be motionless; as, blood stagnates in the veins of an animal; hence, to become impure or foul by want of motion; as, air stagnates in a close room. 2. To cease to be brisk or active; to become dull or inactive; as, commerce stagnates; business stagnates.",
    "stainless": "Free from stain; immaculate.",
    "stalemate": "The position of the king when he can not move without being placed on check and there is no other piece which can be moved.",
    "stalling": "Stabling.",
    "stammer": "To make involuntary stops in uttering syllables or words; to hesitate or falter in speaking; to speak with stops and diffivulty; to stutter.",
    "stamp": "1. To strike beat, or press forcibly with the bottom of the foot, or by thrusting the foot downward.",
    "stand": "1. To be at rest in an erect position; to be fixed in an upright or firm position; as: (a) To be supported on the feet, in an erect or nearly erect position; -- opposed to lie, sit, kneel, etc.",
    "stank": "Weak; worn out.",
    "staple": "1. A settled mart; an emporium; a city or town to which merchants brought commodities for sale or exportation in bulk; a place for wholesale traffic.",
    "starboard": "That side of a vessel which is one of the right hand of a person who stands on board facing the bow; -- opposed to Ant: larboard, or Ant: port.",
    "starch": "Stiff; precise; rigid.",
    "starfish": "1. (Zoöl.)  Any one of numerous species of echinoderms belonging to the class Asterioidea, in which the body is star-shaped and usually has five rays, though the number of rays varies from five to forty or more.",
    "stark": "1. Stiff; rigid.",
    "starless": "Being without stars; having no stars visible; as, a starless night.",
    "starlight": "The light given by the stars.",
    "starry": "1. Abounding with stars; adorned with stars.",
    "starting": "from Start, v. Starting bar (Steam Eng.), a hand lever for working the values in starting an engine.",
    "startle": "To move suddenly, or be excited, on feeling alarm; to start.",
    "state": "1. The circumstances or condition of a being or thing at any given time.",
    "static": "1. Resting; acting by mere weight without motion; as, statical pressure; static objects. 2. Pertaining to bodies at rest or in equilibrium.",
    "statue": "1. The likeness of a living being sculptured or modeled in some solid substance, as marble, bronze, or wax; an image; as, a statue of Hercules, or of a lion.",
    "stature": "The natural height of an animal body; -- generally used of the human body.",
    "statute": "1. An act of the legislature of a state or country, declaring, commanding, or prohibiting something; a positive law; the written will of the legislature expressed with all the requisite forms of legislation; -- used in distinction fraom common law.",
    "steadfast": "1. Firmly fixed or established; fast fixed; firm.",
    "steam": "1. The elastic, aëriform fluid into which water is converted when heated to the boiling points; water in the state of vapor. 2. The mist formed by condensed vapor; visible vapor; -- so called in popular usage. 3. Any exhalation.",
    "steed": "A horse, especially a spirited horse for state of war; -- used chiefly in poetry or stately prose.",
    "steep": "Bright; glittering; fiery.",
    "steersman": "One who steers; the helmsman of a vessel.",
    "stellar": "1. Of or pertaining to stars; astral; as, a stellar figure; stellary orbs.",
    "stem": "To gleam.",
    "stench": "To stanch.",
    "stencil": "A thin plate of metal, leather, or other material, used in painting, marking, etc.",
    "step": "1. To move the foot in walking; to advance or recede by raising and moving one of the feet to another resting place, or by moving both feet in succession. 2. To walk; to go on foot; esp., to walk a little distance; as, to step to one of the neighbors. 3. To walk slowly, gravely, or resolutely.",
    "sterilize": "1. To make sterile or unproductive; to impoverish, as land; to exhaust of fertility.",
    "sternum": "1. (Anat.)  A plate of cartilage, or a series of bony or cartilaginous plates or segments, in the median line of the pectoral skeleton of most vertebrates above fishes; the breastbone.",
    "stew": "1. A small pond or pool where fish are kept for the table; a vivarium.",
    "stick": "1. A small shoot, or branch, separated, as by a cutting, from a tree or shrub; also, any stem or branch of a tree, of any size, cut for fuel or timber.",
    "stiffen": "1. tiono make stiff; to make less pliant or flexible; as, to stiffen cloth with starch.",
    "stiffness": "The quality or state of being stiff; as, the stiffness of cloth or of paste; stiffness of manner; stiffness of character.",
    "stifle": "The joint next above the hock, and near the flank, in the hind leg of the horse and allied animals; the joint corresponding to the knee in man; -- called also stifle joint.",
    "stillness": "1. The quality or state of being still; quietness; silence; calmness; inactivity.",
    "stilt": "1. A pole, or piece of wood, constructed with a step or loop to raise the foot above the ground in walking.",
    "stimulate": "1. To excite as if with a goad; to excite, rouse, or animate, to action or more vigorous exertion by some pungent motive or by persuasion; as, to stimulate one by the hope of reward, or by the prospect of glory.",
    "stimulus": "1. A goad; hence, something that rouses the mind or spirits; an incentive; as, the hope of gain is a powerful stimulus to labor and action. 2. That which excites or produces a temporary increase of vital action, either in the whole organism or in any of its parts; especially (Physiol.), any substance or agent capable of evoking the activity of a nerve or irritable muscle, or capable of producing an impression upon a sensory organ or more particularly upon its specific end organ.",
    "stinger": "One who, or that which, stings.",
    "stinging": "Piercing, or capable of piercing, with a sting; inflicting acute pain as if with a sting, goad, or pointed weapon; pungent; biting; as, stinging cold; a stinging rebuke.",
    "stingray": "Any one of numerous rays of the family Dasyatidæ, syn.",
    "stingy": "Stinging; able to sting.",
    "stinking": "from Stink, v. Stinking badger (Zoöl.), the teledu.",
    "stipend": "Settled pay or compensation for services, whether paid daily, monthly, or annually.",
    "stipulate": "Furnished with stipules; as, a stipulate leaf.",
    "stir": "1. To change the place of in any manner; to move.",
    "stitch": "1. A single pass of a needle in sewing; the loop or turn of the thread thus made. 2. A single turn of the thread round a needle in knitting; a link, or loop, of yarn; as, to let down, or drop, a stitch; to take up a stitch. 3. Etym: [Cf. OE. sticche, stecche, stucche, a piece, AS. stycce.",
    "stock": "1. The stem, or main body, of a tree or plant; the fixed, strong, firm part; the trunk.",
    "stoic": "1. A disciple of the philosopher Zeno; one of a Greek sect which held that men should be free from passion, unmoved by joy or grief, and should submit without complaint to unavoidable necessity, by which all things are governed. 2. Hence, a person not easily excited; an apathetic person; one who is apparently or professedly indifferent to pleasure or pain.",
    "stoke": "1. To stick; to thrust; to stab.",
    "stole": "imp. of Steal.",
    "stomp": "To stamp with the foot.",
    "stonework": "Work or wall consisting of stone; mason's work of stone.",
    "stony": "1. Of or pertaining to stone, consisting of, or abounding in, stone or stones; resembling stone; hard; as, a stony tower; a stony cave; stony ground; a stony crust. 2. Converting into stone; petrifying; petrific.",
    "stool": "A plant from which layers are propagated by bending its branches into the soil.",
    "stoop": "Originally, a covered porch with seats, at a house door; the Dutch stoep as introduced by the Dutch into New York.",
    "stopper": "1. One who stops, closes, shuts, or hinders; that which stops or obstructs; that which closes or fills a vent or hole in a vessel. 2. (Naut.)  A short piece of rope having a knot at one or both ends, with a lanyard under the knot, -- used to secure something.",
    "stopping": "1. Material for filling a cavity. 2. (Mining)  A partition or door to direct or prevent a current of air. 3. (Far.)  A pad or poultice of dung or other material applied to a horse's hoof to keep it moist.",
    "storage": "1. The act of depositing in a store or warehouse for safe keeping; also, the safe keeping of goods in a warehouse. 2. Space for the safe keeping of goods. 3. The price changed for keeping goods in a store.",
    "storm": "1. A violent disturbance of the atmosphere, attended by wind, rain, snow, hail, or thunder and lightning; hence, often, a heavy fall of rain, snow, or hail, whether accompanied with wind or not.",
    "stout": "1. Strong; lusty; vigorous; robust; sinewy; muscular; hence, firm; resolute; dauntless.",
    "straddle": "1. To part the legs wide; to stand or to walk with the legs far apart. 2. To stand with the ends staggered; -- said of the spokes of a wagon wheel where they join the hub.",
    "straggler": "1. One who straggles, or departs from the direct or proper course, or from the company to which he belongs; one who falls behind the rest; one who rambles without any settled direction. 2. A roving vagabond.",
    "straining": "from Strain.",
    "strangely": "1. As something foreign, or not one's own; in a manner adapted to something foreign and strange.",
    "stranger": "1. One who is strange, foreign, or unknown.",
    "strangle": "1. To compress the windpipe of (a person or animal) until death results from stoppage of respiration; to choke to death by compressing the throat, as with the hand or a rope.",
    "strategic": "Of or pertaining to strategy; effected by artifice.",
    "stratus": "A form of clouds in which they are arranged in a horizontal band or layer.",
    "straw": "To spread or scatter.",
    "stray": "1. To wander, as from a direct course; to deviate, or go out of the way.",
    "streak": "To stretch; to extend; hence, to lay out, as a dead body.",
    "stream": "1. A current water or other fluid; a liquid flowing continuously in a line or course, either on the earth, as a river, brook, etc., or from a vessel, reservoir, or fountain; specifically, any course of running water; as, many streams are blended in the Mississippi; gas and steam came from the earth in streams; a stream of molten lead from a furnace; a stream of lava from a volcano. 2. A beam or ray of light.",
    "street": "Originally, a paved way or road; a public highway; now commonly, a thoroughfare in a city or village, bordered by dwellings or business houses.",
    "strength": "1. The quality or state of being strong; ability to do or to bear; capacity for exertion or endurance, whether physical, intellectual, or moral; force; vigor; power; as, strength of body or of the arm; strength of mind, of memory, or of judgment.",
    "strenuous": "Eagerly pressing or urgent; zealous; ardent; earnest; bold; valiant; intrepid; as, a strenuous advocate for national rights; a strenuous reformer; a strenuous defender of his country.",
    "stress": "1. Distress.",
    "stretch": "1. To reach out; to extend; to put forth.",
    "stricken": "1. Struck; smitten; wounded; as, the stricken deer.",
    "strict": "1. Strained; drawn close; tight; as, a strict embrace; a strict ligature.",
    "stride": "1. To walk with long steps, especially in a measured or pompous manner.",
    "strife": "1. The act of striving; earnest endeavor.",
    "strike": "1. To touch or hit with some force, either with the hand or with an instrument; to smite; to give a blow to, either with the hand or with any instrument or missile.",
    "striking": "a. & n. from Strike, v. Striking distance, the distance through which an object can be reached by striking; the distance at which a force is effective when directed to a particular object.",
    "strive": "1. To make efforts; to use exertions; to endeavor with earnestness; to labor hard.",
    "striving": "from Strive.",
    "strode": "See Strude.",
    "struck": "imp. & p. p. of Strike.",
    "structure": "1. The act of building; the practice of erecting buildings; construction.",
    "struggle": "1. To strive, or to make efforts, with a twisting, or with contortions of the body. 2. To use great efforts; to labor hard; to strive; to contend forcibly; as, to struggle to save one's life; to struggle with the waves; to struggle with adversity.",
    "strut": "1. To swell; to bulge out.",
    "stubbed": "1. Reduced to a stub; short and thick, like something truncated; blunt; obtuse. 2. Abounding in stubs; stubby.",
    "stubble": "The stumps of wheat, rye, barley, oats, or buckwheat, left in the ground; the part of the stalk left by the scythe or sickle.",
    "stubborn": "Firm as a stub or stump; stiff; unbending; unyielding; persistent; hence, unreasonably obstinate in will or opinion; not yielding to reason or persuasion; refractory; harsh; -- said of persons and things; as, stubborn wills; stubborn ore; a stubborn oak; as stubborn as a mule.",
    "stucco": "1. Plaster of any kind used as a coating for walls, especially, a fine plaster, composed of lime or gypsum with sand and pounded marble, used for internal decorations and fine work. 2. Work made of stucco; stuccowork.",
    "stuck": "imp. & p. p. of Stick.",
    "student": "1. A person engaged in study; one who is devoted to learning; a learner; a pupil; a scholar; especially, one who attends a school, or who seeks knowledge from professional teachers or from books; as, the students of an academy, a college, or a university; a medical student; a hard student.",
    "studied": "1. Closely examined; read with diligence and attention; made the subject of study; well considered; as, a studied lesson. 2. Well versed in any branch of learning; qualified by study; learned; as, a man well studied in geometry.",
    "study": "1. A setting of the mind or thoughts upon a subject; hence, application of mind to books, arts, or science, or to any subject, for the purpose of acquiring knowledge.",
    "stuffing": "1. That which is used for filling anything; as, the stuffing of a saddle or cushion. 2. (Cookery)  Any seasoning preparation used to stuff meat; especially, a composition of bread, condiments, spices, etc.; forcemeat; dressing. 3. A mixture of oil and tallow used in softening and dressing leather.",
    "stuffy": "1. Stout; mettlesome; resolute.",
    "stumble": "1. To trip in walking or in moving in any way with the legs; to strike the foot so as to fall, or to endanger a fall; to stagger because of a false step.",
    "stump": "1. The part of a tree or plant remaining in the earth after the stem or trunk is cut off; the stub. 2. The part of a limb or other body remaining after a part is amputated or destroyed; a fixed or rooted remnant; a stub; as, the stump of a leg, a finger, a tooth, or a broom. 3. pl.",
    "stunner": "1. One who, or that which, stuns. 2. Something striking or amazing in quality; something of extraordinary excellence.",
    "stunning": "1. Overpowering consciousness; overpowering the senses; especially, overpowering the sense of hearing; confounding with noise. 2. Striking or overpowering with astonishment, especially on account of excellence; as, stunning poetry.",
    "stunt": "To hinder from growing to the natural size; to prevent the growth of; to stint, to dwarf; as, to stunt a child; to stunt a plant.",
    "sturdy": "1. Foolishly obstinate or resolute; stubborn; unrelenting; unfeeling; stern.",
    "stylist": "One who is a master or a model of style, especially in writing or speaking; a critic of style.",
    "stylus": "An instrument for writing.",
    "suave": "Sweet; pleasant; delightful; gracious or agreeable in manner; bland.",
    "subdivide": "To divide the parts of (anything) into more parts; to part into smaller divisions; to divide again, as what has already been divided.",
    "subgroup": "A subdivision of a group, as of animals.",
    "subject": "1. Placed or situated under; lying below, or in a lower situation.",
    "sublease": "A lease by a tenant or lessee to another person; an underlease.",
    "sublime": "1. Lifted up; high in place; exalted aloft; uplifted; lofty.",
    "submarine": "Being, acting, or growing, under water in the sea; as, submarine navigators; submarine plants.",
    "submerge": "1. To put under water; to plunge. 2. To cover or overflow with water; to inundate; to flood; to drown.",
    "submitter": "One who submits.",
    "subscribe": "1. To write underneath, as one's name; to sign (one's name) to a document.",
    "subscript": "Written below or underneath; as, iota subscript.",
    "subside": "1. To sink or fall to the bottom; to settle, as lees. 2. To tend downward; to become lower; to descend; to sink.",
    "subsidize": "To furnish with a subsidy; to purchase the assistance of by the payment of a subsidy; to aid or promote, as a private enterprise, with public money; as, to subsidize a steamship line.",
    "subsidy": "1. Support; aid; coöperation; esp., extraordinary aid in money rendered to the sovereign or to a friendly power.",
    "subsoil": "The bed, or stratum, of earth which lies immediately beneath the surface soil.",
    "substance": "1. That which underlies all outward manifestations; substratum; the permanent subject or cause of phenomena, whether material or spiritual; that in which properties inhere; that which is real, in distinction from that which is apparent; the abiding part of any existence, in distinction from any accident; that which constitutes anything what it is; real or existing essence.",
    "subtly": "In a subtle manner; slyly; artfully; cunningly.",
    "suburb": "1. An outlying part of a city or town; a smaller place immediately adjacent to a city; in the plural, the region which is on the confines of any city or large town; as, a house stands in the suburbs; a garden situated in the suburbs of Paris.",
    "succulent": "Full of juice; juicy.",
    "such": "1. Of that kind; of the like kind; like; resembling; similar; as, we never saw such a day; -- followed by that or as introducing the word or proposition which defines the similarity, or the standard of comparison; as, the books are not such that I can recommend them, or, not such as I can recommend; these apples are not such as those we saw yesterday; give your children such precepts as tend to make them better.",
    "suction": "The act or process of sucking; the act of drawing, as fluids, by exhausting the air.",
    "sudden": "1. Happening without previous notice or with very brief notice; coming unexpectedly, or without the common preparation; immediate; instant; speedy.",
    "suds": "Water impregnated with soap, esp. when worked up into bubbles and froth.",
    "suffering": "The bearing of pain, inconvenience, or loss; pain endured; distress, loss, or injury incurred; as, sufferings by pain or sorrow; sufferings by want or by wrongs.",
    "suffice": "To be enough, or sufficient; to meet the need (of anything); to be equal to the end proposed; to be adequate.",
    "suffix": "1. A letter, letters, syllable, or syllables added or appended to the end of a word or a root to modify the meaning; a postfix. 2. (Math.)  A subscript mark, number, or letter.",
    "suffocate": "Suffocated; choked.",
    "suffrage": "1. A vote given in deciding a controverted question, or in the choice of a man for an office or trust; the formal expression of an opinion; assent; vote.",
    "sugar": "1. A sweet white (or brownish yellow) crystalline substance, of a sandy or granular consistency, obtained by crystallizing the evaporated juice of certain plants, as the sugar cane, sorghum, beet root, sugar maple, etc.",
    "suggest": "1. To introduce indirectly to the thoughts; to cause to be thought of, usually by the agency of other objects.",
    "suing": "The process of soaking through anything.",
    "suitable": "Capable of suiting; fitting; accordant; proper; becoming; agreeable; adapted; as, ornaments suitable to one's station; language suitable for the subject.",
    "suitor": "1. One who sues, petitions, or entreats; a petitioner; an applicant.",
    "sulk": "A furrow.",
    "sullen": "1. Lonely; solitary; desolate.",
    "sulphuric": "1. Of or pertaining to sulphur; as, a sulphuric smell. 2. (Chem.)  Derived from, or containing, sulphur; specifically, designating those compounds in which the element has a higher valence as contrasted with the sulphurous compounds; as, sulphuric acid.",
    "sultry": "1. Very hot, burning, and oppressive; as, Libya's sultry deserts.",
    "superior": "1. More elevated in place or position; higher; upper; as, the superior limb of the sun; the superior part of an image. 2. Higher in rank or office; more exalted in dignity; as, a superior officer; a superior degree of nobility. 3. Higher or greater in excellence; surpassing others in the greatness, or value of any quality; greater in quality or degree; as, a man of superior merit; or of superior bravery. 4. Beyond the power or influence of; too great or firm to be subdued or affected by; -- with to.",
    "supervise": "1. To oversee for direction; to superintend; to inspect with authority; as, to supervise the construction of a steam engine, or the printing of a book. 2. To look over so as to read; to peruse.",
    "supper": "A meal taken at the close of the day; the evening meal.",
    "supply": "1. To fill up, or keep full; to furnish with what is wanted; to afford, or furnish with, a sufficiency; as, rivers are supplied by smaller streams; an aqueduct supplies an artificial lake; -- often followed by with before the thing furnished; as, to supply a furnace with fuel; to supply soldiers with ammunition. 2. To serve instead of; to take the place of.",
    "support": "1. To bear by being under; to keep from falling; to uphold; to sustain, in a literal or physical sense; to prop up; to bear the weight of; as, a pillar supports a structure; an abutment supports an arch; the trunk of a tree supports the branches. 2. To endure without being overcome, exhausted, or changed in character; to sustain; as, to support pain, distress, or misfortunes.",
    "supremacy": "The state of being supreme, or in the highest station of power; highest or supreme authority or power; as, the supremacy of a king or a parliament.",
    "supreme": "1. Highest in authority; holding the highest place in authority, government, or power.",
    "surcharge": "1. To overload; to overburden; to overmatch; to overcharge; as, to surcharge a beast or a ship; to surcharge a cannon.",
    "surely": "1. In a sure or certain manner; certainly; infallibly; undoubtedly; assuredly.",
    "sureness": "The state of being sure; certainty.",
    "surface": "1. The exterior part of anything that has length and breadth; one of the limits that bound a solid, esp. the upper face; superficies; the outside; as, the surface of the earth; the surface of a diamond; the surface of the body.",
    "surfer": "The surf duck.",
    "surgical": "Of or pertaining to surgeons or surgery; done by means of surgery; used in surgery; as, a surgical operation; surgical instruments.",
    "surname": "1. A name or appellation which is added to, or over and above, the baptismal or Christian name, and becomes a family name.",
    "surpass": "To go beyond in anything good or bad; to exceed; to excel.",
    "surplus": "1. That which remains when use or need is satisfied, or when a limit is reached; excess; overplus. 2. Specifically, an amount in the public treasury at any time greater than is required for the ordinary purposes of the government.",
    "surprise": "1. The act of coming upon, or taking, unawares; the act of seizing unexpectedly; surprisal; as, the fort was taken by surprise. 2. The state of being surprised, or taken unawares, by some act or event which could not reasonably be foreseen; emotion excited by what is sudden and strange; a suddenly excited feeling of wonder or astonishment.",
    "surrender": "1. To yield to the power of another; to give or deliver up possession of (anything) upon compulsion or demand; as, to surrender one's person to an enemy or to an officer; to surrender a fort or a ship. 2. To give up possession of; to yield; to resign; as, to surrender a right, privilege, or advantage.",
    "surrogate": "1. A deputy; a delegate; a substitute. 2. The deputy of an ecclesiastical judge, most commonly of a bishop or his chancellor, especially a deputy who grants marriage licenses.",
    "surround": "1. To inclose on all sides; to encompass; to environ. 2. To lie or be on all sides of; to encircle; as, a wall surrounds the city.",
    "survey": "1. To inspect, or take a view of; to view with attention, as from a high place; to overlook; as, to stand on a hill, and survey the surrounding country.",
    "survival": "1. A living or continuing longer than, or beyond the existence of, another person, thing, or event; an outliving. 2. (Arhæol.",
    "survive": "To live beyond the life or existence of; to live longer than; to outlive; to outlast; as, to survive a person or an event.",
    "survivor": "1. One who survives or outlives another person, or any time, event, or thing.",
    "suspect": "1. Suspicious; inspiring distrust.",
    "suspend": "1. To attach to something above; to hang; as, to suspend a ball by a thread; to suspend a needle by a loadstone. 2. To make to depend; as, God hath suspended the promise of eternal life on the condition of obedience and holiness of life.",
    "suspense": "1. Held or lifted up; held or prevented from proceeding.",
    "sustainer": "One who, or that which, sustains.",
    "swab": "To clean with a mop or swab; to wipe when very wet, as after washing; as, to swab the desk of a ship.",
    "swaddling": "from Swaddle, v. Swaddling band, Swaddling cloth, or Swaddling clout, a band or cloth wrapped round an infant, especially round a newborn infant.",
    "swagger": "1. To walk with a swaying motion; hence, to walk and act in a pompous, consequential manner.",
    "swan": "1. (Zoöl.)  Any one of numerous species of large aquatic birds belonging to Cygnus, Olor, and allied genera of the subfamily Cygninæ. They have a large and strong beak and a long neck, and are noted for their graceful movements when swimming.",
    "swarm": "To climb a tree, pole, or the like, by embracing it with the arms and legs alternately.",
    "sway": "1. To move or wield with the hand; to swing; to wield; as, to sway the scepter.",
    "swear": "1. To affirm or utter a solemn declaration, with an appeal to God for the truth of what is affirmed; to make a promise, threat, or resolve on oath; also, to affirm solemnly by some sacred object, or one regarded as sacred, as the Bible, the Koran, etc.",
    "sweat": "1. To excrete sensible moisture from the pores of the skin; to perspire.",
    "sweep": "1. To pass a broom across (a surface) so as to remove loose dirt, dust, etc.; to brush, or rub over, with a broom for the purpose of cleaning; as, to sweep a floor, the street, or a chimney.",
    "swell": "1. To grow larger; to dilate or extend the exterior surface or dimensions, by matter added within, or by expansion of the inclosed substance; as, the legs swell in dropsy; a bruised part swells; a bladder swells by inflation. 2. To increase in size or extent by any addition; to increase in volume or force; as, a river swells, and overflows its banks; sounds swell or diminish. 3. To rise or be driven into waves or billows; to heave; as, in tempest, the ocean swells into waves. 4. To be puffed up or bloated; as, to swell with pride.",
    "swerve": "1. To stray; to wander; to rope.",
    "swifter": "(a) A rope used to retain the bars of the capstan in their sockets while men are turning it. (b) A rope used to encircle a boat longitudinally, to strengthen and defend her sides. (c) The forward shroud of a lower mast.",
    "swiftly": "In a swift manner; with quick motion or velocity; fleetly.",
    "swimmer": "1. One who swims. 2. (Far.)  A protuberance on the leg of a horse. 3. (Zoöl.)  A swimming bird; one of the natatores.",
    "swimming": "1. That swims; capable of swimming; adapted to, or used in, swimming; as, a swimming bird; a swimming motion. 2. Suffused with moisture; as, swimming eyes.",
    "swipe": "1. A swape or sweep.",
    "swirl": "To whirl, or cause to whirl, as in an eddy.",
    "switch": "1. A small, flexible twig or rod.",
    "swivel": "1. (Mech.)  A piece, as a ring or hook, attached to another piece by a pin, in such a manner as to permit rotation about the pin as an axis. 2. (Mil.)  A small piece of ordnance, turning on a point or swivel; -- called also swivel gun.",
    "swizzle": "To drink; to swill.",
    "swoop": "1. To fall on at once and seize; to catch while on the wing; as, a hawk swoops a chicken. 2. To seize; to catch up; to take with a sweep.",
    "sworn": "p. p. of Swear.",
    "sycamore": "(a) A large tree (Ficus Sycomorus) allied to the common fig.",
    "sympathy": "1. Feeling corresponding to that which another feels; the quality of being affected by the affection of another, with feelings correspondent in kind, if not in degree; fellow-feeling.",
    "symphony": "1. A consonance or harmony of sounds, agreeable to the ear, whether the sounds are vocal or instrumental, or both.",
    "symptom": "1. (Med.)  Any affection which accompanies disease; a perceptible change in the body or its functions, which indicates disease, or the kind or phases of disease; as, the causes of disease often lie beyond our sight, but we learn their nature by the symptoms exhibited.",
    "syndrome": "Concurrence.",
    "synergy": "Combined action; especially (Med.),  the combined healty action of every organ of a particular system; as, the digestive synergy.",
    "synopsis": "A general view, or a collection of heads or parts so arranged as to exhibit a general view of the whole; an abstract or summary of a discourse; a syllabus; a conspectus.",
    "synthesis": "1. Composition, or the putting of two or more things together, as in compounding medicines. 2. (Chem.)  The art or process of making a compound by putting the ingredients together, as contrasted with analysis; thus, water is made by synthesis from hydrogen and oxygen; hence, specifically, the building up of complex compounds by special reactions, whereby their component radicals are so grouped that the resulting substances are identical in every respect with the natural articles when such occur; thus, artificial alcohol, urea, indigo blue, alizarin, etc., are made by synthesis. 3. (Logic)  The combination of separate elements of thought into a whole, as of simple into complex conceptions, species into genera, individual propositions into systems; -- the opposite of Ant: analysis.",
    "synthetic": "1. Of or pertaining to synthesis; consisting in synthesis or composition; as, the synthetic method of reasoning, as opposed to analytical.",
    "syrup": "1. A thick and viscid liquid made from the juice of fruits, herbs, etc., boiled with sugar. 2. A thick and viscid saccharine solution of superior quality (as sugarhouse sirup or molasses, maple sirup); specifically, in pharmacy and often in cookery, a saturated solution of sugar and water (simple sirup), or such a solution flavored or medicated.",
    "system": "1. An assemblage of objects arranged in regular subordination, or after some distinct method, usually logical or scientific; a complete whole of objects related by some common law, principle, or end; a complete exhibition of essential principles or facts, arranged in a rational dependence or connection; a regular union of principles or parts forming one entire thing; as, a system of philosophy; a system of government; a system of divinity; a system of botany or chemistry; a military system; the solar system.",
    "tablet": "1. A small table or flat surface. 2. A flat piece of any material on which to write, paint, draw, or engrave; also, such a piece containing an inscription or a picture. 3. Hence, a small picture; a miniature.",
    "tabloid": "A compressed portion of one or more drugs or chemicals, or of food, etc.",
    "tacking": "A union of securities given at different times, all of which must be redeemed before an intermediate purchaser can interpose his claim.",
    "tackle": "1. Apparatus for raising or lowering heavy weights, consisting of a rope and pulley blocks; sometimes, the rope and attachments, as distinct from the block. 2. Any instruments of action; an apparatus by which an object is moved or operated; gear; as, fishing tackle, hunting tackle; formerly, specifically, weapons.",
    "tackling": "1. Furniture of the masts and yards of a vessel, as cordage, sails, etc. 2. Instruments of action; as, fishing tackling.",
    "tacky": "Sticky; adhesive; raw; -- said of paint, varnish, etc., when not well dried.",
    "tactical": "Of or pertaining to the art of military and naval tactics.",
    "tactics": "1. The science and art of disposing military and naval forces in order for battle, and performing military and naval evolutions.",
    "tactile": "Of or pertaining to the organs, or the sense, of touch; perceiving, or perceptible, by the touch; capable of being touched; as, tactile corpuscles; tactile sensations.",
    "tadpole": "1. (Zoöl.)  The young aquatic larva of any amphibian.",
    "tag": "1. Any slight appendage, as to an article of dress; something slight hanging loosely; specifically, a direction card, or label. 2. A metallic binding, tube, or point, at the end of a string, or lace, to stiffen it. 3. The end, or catchword, of an actor's speech; cue. 4. Something mean and paltry; the rabble.",
    "take": "Taken.",
    "taking": "1. Apt to take; alluring; attracting.",
    "talisman": "1. A magical figure cut or engraved under certain superstitious observances of the configuration of the heavens, to which wonderful effects are ascribed; the seal, figure, character, or image, of a heavenly sign, constellation, or planet, engraved on a sympathetic stone, or on a metal corresponding to the star, in order to receive its influence. 2. Hence, something that produces extraordinary effects, esp. in averting or repelling evil; an amulet; a charm; as, a talisman to avert diseases.",
    "tall": "1. High in stature; having a considerable, or an unusual, extension upward; long and comparatively slender; having the diameter or lateral extent small in proportion to the height; as, a tall person, tree, or mast.",
    "talon": "1. The claw of a predaceous bird or animal, especially the claw of a bird of prey.",
    "tank": "A small Indian dry measure, averaging 240 grains in weight; also, a Bombay weight of 72 grains, for pearls.",
    "tannery": "1. A place where the work of tanning is carried on. 2. The art or process of tanning.",
    "tanning": "The art or process of converting skins into leather.",
    "tantrum": "A whim, or burst of ill-humor; an affected air.",
    "tapered": "Lighted with a taper or tapers; as, a tapered choir.",
    "tapering": "Becoming gradually smaller toward one end.",
    "tapestry": "A fabric, usually of worsted, worked upon a warp of linen or other thread by hand, the designs being usually more or less pictorial and the stuff employed for wall hangings and the like.",
    "tapioca": "A coarsely granular substance obtained by heating, and thus partly changing, the moistened starch obtained from the roots of the cassava.",
    "tarantula": "Any one of several species of large spiders, popularly supposed to be very venomous, especially the European species (Tarantula apuliæ). The tarantulas of Texas and adjacent countries are large species of Mygale.",
    "tarnish": "To soil, or change the appearance of, especially by an alternation induced by the air, or by dust, or the like; to diminish, dull, or destroy the luster of; to sully; as, to tarnish a metal; to tarnish gilding; to tarnish the purity of color.",
    "tarot": "A game of cards; -- called also taroc.",
    "tartar": "1. (Chem.)  A reddish crust or sediment in wine casks, consisting essentially of crude cream of tartar, and used in marking pure cream of tartar, tartaric acid, potassium carbonate, black flux, etc., and, in dyeing, as a mordant for woolen goods; -- called also argol, wine stone, etc. 2. A correction which often incrusts the teeth, consisting of salivary mucus, animal matter, and phosphate of lime.",
    "tartness": "The quality or state of being tart.",
    "task": "1. Labor or study imposed by another, often in a definite quantity or amount.",
    "tassel": "A male hawk.",
    "taste": "1. To try by the touch; to handle; as, to taste a bow.",
    "tasty": "1. Having a good taste; -- applied to persons; as, a tasty woman.",
    "tattle": "1. To prate; to talk idly; to use many words with little meaning; to chat.",
    "tattling": "Given to idle talk; apt to tell tales.",
    "tattoo": "A beat of drum, or sound of a trumpet or bugle, at night, giving notice to soldiers to retreat, or to repair to their quarters in garrison, or to their tents in camp.",
    "taunt": "Very high or tall; as, a ship with taunt masts.",
    "thank": "A expression of gratitude; an acknowledgment expressive of a sense of favor or kindness received; obligation, claim, or desert, or gratitude; -- now generally used in the plural.",
    "that": "1. As a demonstrative pronoun (pl.",
    "thaw": "1. To melt, dissolve, or become fluid; to soften; -- said of that which is frozen; as, the ice thaws. 2. To become so warm as to melt ice and snow; -- said in reference to the weather, and used impersonally. 3. Fig.: To grow gentle or genial.",
    "theater": "1. An edifice in which dramatic performances or spectacles are exhibited for the amusement of spectators; anciently uncovered, except the stage, but in modern times roofed. 2. Any room adapted to the exhibition of any performances before an assembly, as public lectures, scholastic exercises, anatomical demonstrations, surgical operations, etc. 3. That which resembles a theater in form, use, or the like; a place rising by steps or gradations, like the seats of a theater.",
    "thee": "To thrive; to prosper.",
    "theft": "1. (Law)  The act of stealing; specifically, the felonious taking and removing of personal property, with an intent to deprive the rightful owner of the same; larceny.",
    "theme": "1. A subject or topic on which a person writes or speaks; a proposition for discussion or argument; a text.",
    "theology": "The science of God or of religion; the science which treats of the existence, character, and attributes of God, his laws and government, the doctrines we are to believe, and the duties we are to practice; divinity; (as more commonly understood) \"the knowledge derivable from the Scriptures, the systematic exhibition of revealed truth, the science of Christian faith and life.\" Many speak of theology as a science of religion [instead of \"science of God\"] because they disbelieve that there is any knowledge of God to be attained.",
    "thermal": "Of or pertaining to heat; warm; hot; as, the thermal unit; thermal waters.",
    "these": "The plural of this.",
    "thesis": "1. A position or proposition which a person advances and offers to maintain, or which is actually maintained by argument. 2. Hence, an essay or dissertation written upon specific or definite theme; especially, an essay presented by a candidate for a diploma or degree.",
    "thicken": "To make thick (in any sense of the word). Specifically: -- (a) To render dense; to inspissate; as, to thicken paint. (b) To make close; to fill up interstices in; as, to thicken cloth; to thicken ranks of trees or men. (c) To strengthen; to confirm.",
    "thicket": "A wood or a collection of trees, shrubs, etc., closely set; as, a ram caught in a thicket.",
    "thievish": "1. Given to stealing; addicted to theft; as, a thievish boy, a thievish magpie. 2. Like a thief; acting by stealth; sly; secret.",
    "thigh": "1. (Anat.)  The proximal segment of the hind limb between the knee and the trunk.",
    "thimble": "1. A kind of cap or cover, or sometimes a broad ring, for the end of the finger, used in sewing to protect the finger when pushing the needle through the material.",
    "thing": "1. Whatever exists, or is conceived to exist, as a separate entity, whether animate or inanimate; any separable or distinguishable object of thought.",
    "think": "1. To seem or appear; -- used chiefly in the expressions methinketh or methinks, and methought.",
    "thirsty": "1. Feeling thirst; having a painful or distressing sensation from want of drink; hence, having an eager desire.",
    "thong": "A strap of leather; especially, one used for fastening anything.",
    "thorn": "1. A hard and sharp-pointed projection from a woody stem; usually, a branch so transformed; a spine. 2. (Bot.)  Any shrub or small tree which bears thorns; especially, any species of the genus Cratægus, as the hawthorn, whitethorn, cockspur thorn. 3. Fig.: That which pricks or annoys as a thorn; anything troublesome; trouble; care.",
    "those": "The plural of that.",
    "thousand": "1. The number of ten hundred; a collection or sum consisting of ten times one hundred units or objects. 2. Hence, indefinitely, a great number.",
    "thrash": "1. To beat out grain from, as straw or husks; to beat the straw or husk of (grain) with a flail; to beat off, as the kernels of grain; as, to thrash wheat, rye, or oats; to thrash over the old straw.",
    "thread": "1. A very small twist of flax, wool, cotton, silk, or other fibrous substance, drawn out to considerable length; a compound cord consisting of two or more single yarns doubled, or joined together, and twisted. 2. A filament, as of a flower, or of any fibrous substance, as of bark; also, a line of gold or silver. 3. The prominent part of the spiral of a screw or nut; the rib.",
    "threaten": "1. To utter threats against; to menace; to inspire with apprehension; to alarm, or attempt to alarm, as with the promise of something evil or disagreeable; to warn.",
    "threefold": "Consisting of three, or thrice repeated; triple; as, threefold justice.",
    "thrift": "1. A thriving state; good husbandry; economical management in regard to property; frugality.",
    "thrill": "A warbling; a trill.",
    "thrive": "1. To posper by industry, economy, and good management of property; to increase in goods and estate; as, a farmer thrives by good husbandry.",
    "throat": "1. (Anat.) (a) The part of the neck in front of, or ventral to, the vertebral column. (b) Hence, the passage through it to the stomach and lungs; the pharynx; -- sometimes restricted to the fauces.",
    "throng": "1. A multitude of persons or of living beings pressing or pressed into a close body or assemblage; a crowd. 2. A great multitude; as, the heavenly throng.",
    "throttle": "1. The windpipe, or trachea; the weasand.",
    "thrower": "One who throws.",
    "thud": "A dull sound without resonance, like that produced by striking with, or striking against, some comparatively soft substance; also, the stroke or blow producing such sound; as, the thrud of a cannon ball striking the earth.",
    "thumb": "The short, thick first digit of the human hand, differing from the other fingers in having but two phalanges; the pollex.",
    "thumping": "Heavy; large.",
    "thursday": "The fifth day of the week, following Wednesday and preceding Friday.",
    "thyself": "An emphasized form of the personal pronoun of the second person; -- used as a subject commonly with thou; as, thou thyself shalt go; that is, thou shalt go, and no other.",
    "tiara": "1. A form of headdress worn by the ancient Persians.",
    "tibia": "1. (Anat.)  The inner, or preaxial, and usually the larger, of the two bones of the leg or hind limb below the knee. 2. (Zoöl.)  The fourth joint of the leg of an insect.",
    "tidal": "Of or pertaining to tides; caused by tides; having tides; periodically rising and falling, or following and ebbing; as, tidal waters.",
    "tidbit": "A delicate or tender piece of anything eatable; a delicious morsel.",
    "tidings": "Account of what has taken place, and was not before known; news.",
    "tidy": "The wren; -- called also tiddy.",
    "tiger": "1. A very large and powerful carnivore (Felis tigris) native of Southern Asia and the East Indies.",
    "tighten": "To draw tighter; to straiten; to make more close in any manner.",
    "tigress": "The female of the tiger.",
    "tiling": "1. A surface covered with tiles, or composed of tiles.",
    "till": "A vetch; a tare.",
    "tilt": "1. A covering overhead; especially, a tent.",
    "timid": "Wanting courage to meet danger; easily frightened; timorous; not bold; fearful; shy.",
    "timothy": "A kind of grass (Phleum pratense) with long cylindrical spikes; -- called also herd's grass, in England, cat's-tail grass, and meadow cat's-tail grass.",
    "tingle": "1. To feel a kind of thrilling sensation, as in hearing a shrill sound.",
    "tinker": "1. A mender of brass kettles, pans, and other metal ware.",
    "tinkling": "1. A tinkle, or succession of tinkles.",
    "tinsel": "1. A shining material used for ornamental purposes; especially, a very thin, gauzelike cloth with much gold or silver woven into it; also, very thin metal overlaid with a thin coating of gold or silver, brass foil, or the like.",
    "tint": "A slight coloring.",
    "tiny": "Very small; little; puny.",
    "tipper": "A kind of ale brewed with brackish water obtained from a particular well; -- so called from the first brewer of it, one Thomas Tipper.",
    "tiptop": "The highest or utmost degree; the best of anything.",
    "tissue": "1. A woven fabric. 2. A fine transparent silk stuff, used for veils, etc.; specifically, cloth interwoven with gold or silver threads, or embossed with figures.",
    "tracing": "1. The act of one who traces; especially, the act of copying by marking on thin paper, or other transparent substance, the lines of a pattern placed beneath; also, the copy thus producted. 2. A regular path or track; a course.",
    "track": "1. A mark left by something that has passed along; as, the track, or wake, of a ship; the track of a meteor; the track of a sled or a wheel.",
    "traction": "1. The act of drawing, or the state of being drawn; as, the traction of a muscle. 2. Specifically, the act of drawing a body along a plane by motive power, as the drawing of a carriage by men or horses, the towing of a boat by a tug. 3. Attraction; a drawing toward.",
    "tractor": "1. That which draws, or is used for drawing. 2. pl.",
    "trade": "1. A track; a trail; a way; a path; also, passage; travel; resort.",
