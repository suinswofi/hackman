    "bronchial": "Belonging to the bronchi and their ramifications in the lungs.",
    "bronze": "1. An alloy of copper and tin, to which small proportions of other metals, especially zinc, are sometimes added.",
    "bronzing": "1. The act or art of communicating to articles in metal, wood, clay, plaster, etc., the appearance of bronze by means of bronze powders, or imitative painting, or by chemical processes.",
    "brook": "A natural stream of water smaller than a river or creek.",
    "broom": "1. (Bot.)  A plant having twigs suitable for making brooms to sweep with when bound together; esp., the Cytisus scoparius of Western Europe, which is a low shrub with long, straight, green, angular branches, mintue leaves, and large yellow flowers.",
    "browbeat": "To depress or bear down with haughty, stern looks, or with arrogant speech and dogmatic assertions; to abash or disconcert by impudent or abusive words or looks; to bully; as, to browbeat witnesses.",
    "browse": "The tender branches or twigs of trees and shrubs, fit for the food of cattle and other animals; green food.",
    "browsing": "Browse; also, a place abounding with shrubs where animals may browse.",
    "brunt": "1. The heat, or utmost violence, of an onset; the strength or greatest fury of any contention; as, the brunt of a battle. 2. The force of a blow; shock; collision.",
    "brush": "1. An instrument composed of bristles, or other like material, set in a suitable back or handle, as of wood, bone, or ivory, and used for various purposes, as in removing dust from clothes, laying on colors, etc.",
    "brussels": "A city of Belgium, giving its name to a kind of carpet, a kind of lace, etc.",
    "brute": "1. Not having sensation; senseless; inanimate; unconscious; without intelligence or volition; as, the brute earth; the brute powers of nature. 2. Not possessing reason, irrational; unthinking; as, a brute beast; the brute creation.",
    "bubble": "1. A thin film of liquid inflated with air or gas; as, a soap bubble; bubbles on the surface of a river.",
    "bubbly": "Abounding in bubbles; bubbling.",
    "buccaneer": "A robber upon the sea; a pirate; -- a term applied especially to the piratical adventurers who made depredations on the Spaniards in America in the 17th and 18th centuries.",
    "bucket": "1. A vessel for drawing up water from a well, or for catching, holding, or carrying water, sap, or other liquids.",
    "buckle": "1. A device, usually of metal, consisting of a frame with one more movable tongues or catches, used for fastening things together, as parts of dress or harness, by means of a strap passing through the frame and pierced by the tongue. 2. A distortion bulge, bend, or kink, as in a saw blade or a plate of sheet metal.",
    "buckskin": "1. The skin of a buck. 2. A soft strong leather, usually yellowish or grayish in color, made of deerskin. 3. A person clothed in buckskin, particularly an American soldier of the Revolutionary war.",
    "bucktooth": "Any tooth that juts out.",
    "buddhism": "The religion based upon the doctrine originally taught by the Hindoo sage Gautama Siddartha, surnamed Buddha, \"the awakened or enlightened,\" in the sixth century b.c., and adopted as a religion by the greater part of the inhabitants of Central and Eastern Asia and the Indian Islands.",
    "buddhist": "One who accepts the teachings of Buddhism.",
    "budding": "1. The act or process of producing buds. 2. (Biol.)  A process of asexual reproduction, in which a new organism or cell is formed by a protrusion of a portion of the animal or vegetable organism, the bud thus formed sometimes remaining attached to the parent stalk or cell, at other times becoming free; gemmation.",
    "budget": "1. A bag or sack with its contents; hence, a stock or store; an accumulation; as, a budget of inventions. 2. The annual financial statement which the British chancellor of the exchequer makes in the House of Commons.",
    "buffalo": "1. (Zoöl.)  A species of the genus Bos or Bubalus (B. bubalus), originally from India, but now found in most of the warmer countries of the eastern continent.",
    "buffer": "1. (Mech.) (a) An elastic apparatus or fender, for deadening the jar caused by the collision of bodies; as, a buffer at the end of a railroad car. (b) A pad or cushion forming the end of a fender, which recieves the blow; -- sometimes called buffing apparatus. 2. One who polishes with a buff. 3. A wheel for buffing; a buff. 4. A good-humored, slow-witted fellow; -- usually said of an elderly man.",
    "buffoon": "A man who makes a practice of amusing others by low tricks, antic gestures, etc.; a droll; a mimic; a harlequin; a clown; a merry-andrew.",
    "bulb": "1. (Bot.)  A spheroidal body growing from a plant either above or below the ground (usually below), which is strictly a bud, consisting of a cluster of partially developed leaves, and producing, as it grows, a stem above, and roots below, as in the onion, tulip, etc.",
    "bulge": "1. The bilge or protuberant part of a cask. 2. A swelling, protuberant part; a bending outward, esp. when caused by pressure; as, a bulge in a wall. 3. (Naut.)  The bilge of a vessel.",
    "bulk": "1. Magnitude of material substance; dimensions; mass; size; as, an ox or ship of great bulk.",
    "bulldog": "1. (Zoöl.)  A variety of dog, of remarkable ferocity, courage, and tenacity of grip; -- so named, probably, from being formerly employed in baiting bulls. 2. (Metal.)  A refractory material used as a furnace lining, obtained by calcining the cinder or slag from the puddling furnace of a rolling mill.",
    "bulldozer": "One who bulldozes.",
    "bullfight": "A barbarous sport, of great antiquity, in which men torment, and fight with, a bull or bulls in an arena, for public amusement, -- still popular in Spain.",
    "bullion": "1. Uncoined gold or silver in the mass.",
    "bullish": "Partaking of the nature of a bull, or a blunder.",
    "bully": "1. A noisy, blustering fellow, more insolent than courageous; one who is threatening and quarrelsome; an insolent, tyrannical fellow.",
    "bunch": "1. A protuberance; a hunch; a knob or lump; a hump.",
    "bundle": "A number of things bound together, as by a cord or envelope, into a mass or package convenient for handling or conveyance; a loose package; a roll; as, a bundle of straw or of paper; a bundle of old clothes.",
    "bunion": "Same as Bunyon.",
    "bunny": "A great collection of ore without any vein coming into it or going out from it.",
    "bunt": "A fungus (Ustilago foetida) which affects the ear of cereals, filling the grains with a fetid dust; -- also called pepperbrand.",
    "bush": "1. A thicket, or place abounding in trees or shrubs; a wild forest.",
    "bust": "1. A piece of sculpture representing the upper part of the human figure, including the head, shoulders, and breast.",
    "busybody": "One who officiously concerns himself with the affairs of others; a meddling person.",
    "buzz": "To make a low, continuous, humming or sibilant sound, like that made by bees with their wings.",
    "cabbage": "1. An esculent vegetable of many varieties, derived from the wild Brassica oleracea of Europe.",
    "cable": "1. A large, strong rope or chain, of considerable length, used to retain a vessel at anchor, and for other purposes.",
    "caboose": "1. (Naut.)  A house on deck, where the cooking is done; -- commonly called the galley. 2. (Railroad)  A car used on freight or construction trains for brakemen, workmen, etc.; a tool car.",
    "cache": "A hole in the ground, or hiding place, for concealing and preserving provisions which it is inconvenient to carry.",
    "cackle": "1. To make a sharp, broken noise or cry, as a hen or goose does.",
    "cactus": "Any plant of the order Cactacæ, as the prickly pear and the night-blooming cereus.",
    "caddie": "A Scotch errand boy, porter, or messenger.",
    "cadet": "1. The younger of two brothers; a younger brother or son; the youngest son.",
    "cadillac": "A large pear, shaped like a flattened top, used chiefly for cooking.",
    "cadmium": "A comparatively rare element related to zinc, and occurring in some zinc ores.",
    "cage": "1. A box or inclosure, wholly or partly of openwork, in wood or metal, used for confining birds or other animals.",
    "cake": "1. A small mass of dough baked; especially, a thin loaf from unleavened dough; as, an oatmeal cake; johnnycake. 2. A sweetened composition of flour and other ingredients, leavened or unleavened, baked in a loaf or mass of any size or shape. 3. A thin wafer-shaped mass of fried batter; a griddlecake or pancake; as buckwheat cakes. 4. A mass of matter concreted, congealed, or molded into a solid mass of any form, esp. into a form rather flat than high; as, a cake of soap; an ague cake.",
    "calamity": "1. Any great misfortune or cause of misery; -- generally applied to events or disasters which produce extensive evil, either to communities or individuals.",
    "calcium": "An elementary substance; a metal which combined with oxygen forms lime.",
    "calculate": "1. To ascertain or determine by mathematical processes, usually by the ordinary rules of arithmetic; to reckon up; to estimate; to compute.",
    "calculus": "1. (Med.)  Any solid concretion, formed in any part of the body, but most frequent in the organs that act as reservoirs, and in the passages connected with them; as, biliary calculi; urinary calculi, etc. 2. (Math.)  A method of computation; any process of reasoning by the use of symbols; any branch of mathematics that may involve calculation.",
    "caliber": "1. (Gunnery)  The diameter of the bore, as a cannon or other firearm, or of any tube; or the weight or size of the projectile which a firearm will carry; as, an 8 inch gun, a 12-pounder, a 44 caliber.",
    "calm": "Freodom from motion, agitation, or disturbance; a cessation or abeence of that which causes motion or disturbance, as of winds or waves; tranquility; stilness; quiet; serenity.",
    "caloric": "The principle of heat, or the agent to which the phenomena of heat and combustion were formerly ascribed; -- not now used in scientific nomenclature, but sometimes used as a general term for heat.",
    "cameo": "A carving in relief, esp. one on a small scale used as a jewel for personal adornment, or like.",
    "camera": "A chamber, or instrument having a chamber.",
    "camping": "1. Lodging in a camp. 2. Etym: [See Camp, n., 6]  A game of football.",
    "canal": "1. An artificial channel filled with water and designed for navigation, or for irrigating land, etc. 2. (Anat.)  A tube or duct; as, the alimentary canal; the semicircular canals of the ear.",
    "canary": "1. Of or pertaining to the Canary Islands; as, canary wine; canary birds. 2. Of a pale yellowish color; as, Canary stone.",
    "cancel": "1. To inclose or surround, as with a railing, or with latticework.",
    "candied": "1. Preserved in or with sugar; incrusted with a candylike substance; as, candied fruits. 2. (a) Converted wholly or partially into sugar or candy; as candied sirup. (b) Conted or more or less with sugar; as, candidied raisins. (c) Figuratively; Honeyed; sweet; flattering.",
    "candle": "1. A slender, cylindrical body of tallow, containing a wick composed of loosely twisted linen of cotton threads, and used to furnish light.",
    "candy": "1. To conserve or boil in sugar; as, to candy fruits; to candy ginger. 2. To make sugar crystals of or in; to form into a mass resembling candy; as, to candy sirup. 3. To incrust with sugar or with candy, or with that which resembles sugar or candy.",
    "cane": "1. (Bot.) (a) A name given to several peculiar palms, species of Calamus and Dæmanorops, having very long, smooth flexible stems, commonly called rattans. (b) Any plant with long, hard, elastic stems, as reeds and bamboos of many kinds; also, the sugar cane. (c) Stems of other plants are sometimes called canes; as, the canes of a raspberry.",
    "canine": "1. Of or pertaining to the family Canidæ, or dogs and wolves; having the nature or qualities of a dog; like that or those of a dog. 2. (Anat.)  Of or pertaining to the pointed tooth on each side the incisors.",
    "cannabis": "A genus of a single species belonging to the order Uricaceæ; hemp.",
    "cannon": "1. A great gun; a piece of ordnance or artillery; a firearm for discharging heavy shot with great force.",
    "canon": "1. A law or rule.",
    "canopy": "1. A covering fixed over a bed, dais, or the like, or carried on poles over an exalted personage or a sacred object, etc. chiefly as a mark of honor.",
    "canteen": "1. A vessel used by soldiers for carrying water, liquor, or other drink.",
    "canyon": "A deep gorge, ravine, or gulch, between high and steep banks, worn by water courses.",
    "capable": "1. Possessing ability, qualification, or susceptibility; having capacity; of sufficient size or strength; as, a room capable of holding a large number; a castle capable of resisting a long assault.",
    "capacity": "1. The power of receiving or containing; extent of room or space; passive power; -- used in reference to physical things.",
    "cape": "A piece or point of land, extending beyind the adjacent coast into the sea or a lake; a promonotory; a headland.",
    "capillary": "1. Resembling a hair; fine; minute; very slender; having minute tubes or interspaces; having very small bore; as, the capillary vessels of animals and plants. 2. Pertaining to capillary tubes or vessels; as, capillary action.",
    "capital": "1. Of or pertaining to the head.",
    "capitol": "1. The temple of Jupiter, at Rome, on the Mona Capitolinus, where the Senate met.",
    "capricorn": "1. (Astron.)  The tenth sign of zodiac, into which the sun enters at the winter solstice, about December 21. See Tropic.",
    "capsize": "To upset or overturn, as a vessel or other body.",
    "capsule": "1. (Bot.)  a dry fruit or pod which is made up of several parts or carpels, and opens to discharge the seeds, as, the capsule of the poppy, the flax, the lily, etc. 2. (Chem.) (a) A small saucer of clay for roasting or melting samples of ores, etc.; a scorifier. (b) a small, shallow, evaporating dish, usually of porcelain. 3. (Med.)  A small cylindrical or spherical gelatinous envelope in which nauseous or acrid doses are inclosed to be swallowed. 4. (Anat.)  A membranous sac containing fluid, or investing an organ or joint; as, the capsule of the lens of the eye.",
    "caption": "1. A caviling; a sophism.",
    "captivate": "1. To take prisoner; to capture; to subdue.",
    "captive": "1. A prisoner taken by force or stratagem, esp., by an enemy, in war; one kept in bondage or in the power of another.",
    "captivity": "1. The state of being a captive or a prisoner.",
    "capture": "1. The act of seizing by force, or getting possession of by superior power or by stratagem; as, the capture of an enemy, a vessel, or a criminal.",
    "caramel": "1. (Chem.)  Burnt sugar; a brown or black porous substance obtained by heating sugar.",
    "carat": "1. The weight by which precious stones and pearls are weighed.",
    "carbon": "An elementary substance, not metallic in its nature, which is present in all organic compounds.",
    "cardiac": "1. (Anat.)  Pertaining to, resembling, or hear the heart; as, the cardiac arteries; the cardiac, or left, end of the stomach. 2. (Med.)  Exciting action in the heart, through the medium of the stomach; cordial; stimulant.",
    "cardinal": "Of fundamental importance; preëminet; superior; chief; principal.",
    "careless": "1. Free from care or anxiety. hence, cheerful; light-hearted.",
    "caress": "An act of endearment; any act or expression of affection; an embracing, or touching, with tenderness.",
    "cargo": "The lading or freight of a ship or other vessel; the goods, merchandise, or whatever is conveyed in a vessel or boat; load; freight.",
    "carnage": "1. Flesh of slain animals or men.",
    "carnation": "1. The natural color of flesh; rosy pink.",
    "carnival": "1. A festival celebrated with merriment and revelry in Roman Gatholic countries during the week before Lent, esp. at Rome and Naples, during a few days (three to ten) before Lent, ending with Shrove Tuesday.",
    "carol": "1. A round dance.",
    "carpenter": "An artificer who works in timber; a framer and builder of houses, ships, etc.",
    "carry": "1. To convey or transport in any manner from one place to another; to bear; -- often with away or off.",
    "cartel": "1. (Mil.)  An agreement between belligerents for the exchange of prisoners.",
    "carton": "Pasteboard for paper boxes; also, a pasteboard box.",
    "cartridge": "A complete charge for a firearm, contained in, or held together by, a case, capsule, or shell of metal, pasteboard, or other material.",
    "carve": "1. To cut.",
    "carving": "1. The act or art of one who carves. 2. A piece of decorative work cut in stone, wood, or other material.",
    "cascade": "A fall of water over a precipice, as in a river or brook; a waterfall less than a cataract.",
    "case": "1. A box, sheath, or covering; as, a case for holding goods; a case for spectacles; the case of a watch; the case (capsule) of a cartridge; a case (cover) for a book. 2. A box and its contents; the quantity contained in a box; as, a case of goods; a case of instruments. 3. (Print.)  A shallow tray divided into compartments or \"boxes\" for holding type.",
    "cash": "A place where money is kept, or where it is deposited and paid out; a money box.",
    "casing": "1. The act or process of inclosing in, or covering with, a case or thin substance, as plaster, boards, etc. 2. An outside covering, for protection or ornament, or to precent the radiation of heat. 3. An inclosing frame; esp. the framework around a door or a window.",
    "casino": "1. A small country house. 2. A building or room used for meetings, or public amusements, for dancing, gaming, etc. 3. A game at cards.",
    "casket": "1. A small chest or box, esp. of rich material or ornamental character, as for jewels, etc.",
    "casualty": "1. That which comes without design or without being foreseen; contingency.",
    "catacomb": "A cave, grotto, or subterraneous place of large extent used for the burial of the dead; -- commonly in the plural.",
    "catapult": "1. (Mil.",
    "catcall": "A sound like the cry of a cat, such as is made in playhouses to express dissatisfaction with a play; also, a small shrill instrument for making such a noise.",
    "catchable": "Capable of being caught.",
    "catching": "1. Infections; contagious. 2. Captavating; alluring.",
    "catchy": "1. Apt or tending to catch the fancy or attention; catching; taking; as, catchy music. 2.  Tending to catch or insnare; entangling; -- usually used fig.; as, a catchy question. 3.  Consisting of, or occuring in, disconnected parts or snatches; changeable; as, a catchy wind.",
    "caterer": "One who caters.",
    "catfish": "A name given in the United States to various species of siluroid fishes; as, the yellow cat (Amiurus natalis); the bind cat (Gronias nigrilabrus); the mud cat (Pilodictic oilwaris), the stone cat (Noturus flavus); the sea cat (Arius felis), etc.",
    "catnip": "A well-know plant of the genus Nepeta (N. Cataria), somewhat like mint, having a string scent, and sometimes used in medicine.",
    "catsup": "A table sauce made from mushrooms, tomatoes, walnuts, etc.",
    "cattle": "Quadrupeds of the Bovine family; sometimes, also, including all domestic quadrupeds, as sheep, goats, horses, mules, asses, and swine.",
    "caucus": "A meeting, especially a preliminary meeting, of persons belonging to a party, to nominate candidates for public office, or to select delegates to a nominating convention, or to confer regarding measures of party policy; a political primary meeting.",
    "causal": "Relating to a cause or causes; inplying or containing a cause or causes; expressing a cause; causative.",
    "causation": "The act of causing; also the act or agency by which an effect is produced.",
    "cause": "1. That which produces or effects a result; that from which anything proceeds, and without which it would not exist.",
    "cauterize": "1. To burn or sear with a cautery or caustic.",
    "caution": "1. A careful attention to the probable effects of an act, in order that failure or harm may be avoided; prudence in regard to danger; provident care; wariness. 2. Security; guaranty; bail.",
    "cautious": "Attentive to examine probable effects and consequences of acts with a view to avoid danger or misfortune; prudent; circumspect; wary; watchful; as, a cautious general.",
    "cavalier": "1. A military man serving on horseback; a knight. 2. A gay, sprightly, military man; hence, a gallant. 3. One of the court party in the time of king Charles L. as contrasted with a Roundhead or an adherent of Parliament.",
    "cavalry": "That part of military force which serves on horseback.",
    "caviar": "The roes of the sturgeon, prepared and salted; -- used as a relish, esp. in Russia.",
    "cavity": "1. Hollowness.",
    "cedar": "The name of several evergreen trees.",
    "celestial": "1. Belonging to the aërial regions, or visible heavens.",
    "celibacy": "The state of being unmarried; single life, esp. that of a bachelor, or of one bound by vows not to marry.",
    "celibate": "1. Celibate state; celibacy.",
    "celtic": "Of or pertaining to the Celts; as, Celtic people, tribes, literature, tongue.",
    "cement": "1. Any substance used for making bodies adhere to each other, as mortar, glue, etc. 2. A kind of calcined limestone, or a calcined mixture of clay and lime, for making mortar which will harden under water. 3. The powder used in cementation.",
    "census": "1. (Bot.",
    "ceramics": "1. The art of making things of baked clay; as pottery, tiles, etc. 2. pl.",
    "ceremony": "1. Ar act or series of acts, often of a symbolical character, prescribed by law, custom, or authority, in the conduct of important matters, as in the performance of religious duties, the transaction of affairs of state, and the celebration of notable events; as, the ceremony of crowning a sovereign; the ceremonies observed in consecrating a church; marriage and baptismal ceremonies.",
    "certainty": "1. The quality, state, or condition, of being certain.",
    "certify": "1. To give cetain information to; to assure; to make certain.",
    "cesspool": "A cistern in the course, or the termination, of a drain, to collect sedimentary or superfluous matter; a privy vault; any receptace of filth.",
    "chafe": "1. To ecxite heat in by friction; to rub in order to stimulate and make warm.",
    "chain": "1. A series of links or rings, usually of metal, connected, or fitted into one another, used for various purposes, as of support, of restraint, of ornament, of the exertion and transmission of mechanical power, etc.",
    "chair": "1. A movable single seat with a back. 2. An official seat, as of a chief magistrate or a judge, but esp. that of a professor; hence, the office itself.",
    "challenge": "1. An invitation to engage in a contest or controversy of any kind; a defiance; specifically, a summons to fight a duel; also, the letter or message conveying the summons.",
    "chamber": "1. A retired room, esp. an upper room used for sleeping; a bedroom; as, the house had four chambers. 2. pl.",
    "chamomile": "A genus of herbs (Anthemis) of the Composite family.",
    "champion": "1. One who engages in any contest; esp. one who in ancient times contended in single combat in behalf of another's honor or rights; or one who acts or speaks in behalf of a person or a cause; a defender; an advocate; a hero.",
    "chance": "1. A supposed material or psychical agent or mode of activity other than a force, law, or purpose; fortune; fate; -- in this sense often personifed.",
    "change": "1. To alter; to make different; to cause to pass from one state to another; as, to change the position, character, or appearance of a thing; to change the countenance.",
    "channel": "1. The hollow bed where a stream of water runs or may run. 2. The deeper part of a river, harbor, strait, etc., where the main current flows, or which affords the best and safest passage for vessels. 3. (Geog.)  A strait, or narrow sea, between two portions of lands; as, the British Channel. 4. That through which anything passes; means of passing, conveying, or transmitting; as, the news was conveyed to us by different channels.",
    "chant": "1. To utter with a melodious voice; to sing.",
    "chaos": "1. An empty, immeasurable space; a yawning chasm.",
    "chaps": "The jaws, or the fleshy parts about them.",
    "chapter": "1. A division of a book or treatise; as, Genesis has fifty chapters. 2. (Eccl.) (a) An assembly of monks, or of the prebends and other clergymen connected with a cathedral, conventual, or collegiate church, or of a diocese, usually presided over by the dean. (b) A community of canons or canonesses. (c) A bishop's council. (d) A business meeting of any religious community. 3. An organized branch of some society or fraternity as of the Freemasons.",
    "character": "1. A distinctive mark; a letter, figure, or symbol.",
    "charcoal": "1. Impure carbon prepared from vegetable or animal substances; esp., coal made by charring wood in a kiln, retort, etc., from which air is excluded.",
    "charger": "1. One who, or that which charges. 2. An instrument for measuring or inserting a charge. 3. A large dish.",
    "chariot": "1. (Antiq.)  A two-wheeled car or vehicle for war, racing, state processions, etc.",
    "charity": "1. Love; universal benevolence; good will.",
    "charm": "1. A melody; a song.",
    "charter": "1. A written evidence in due form of things done or granted, contracts made, etc., between man and man; a deed, or conveyance.",
    "chase": "1. To pursue for the purpose of killing or taking, as an enemy, or game; to hunt.",
    "chaste": "1. Pure from unlawful sexual intercourse; virtuous; continent.",
    "chastise": "1. To inflict pain upon, by means of stripes, or in any other manner, for the purpose of punishment or reformation; to punish, as with stripes.",
    "chastity": "1. The state of being chaste; purity of body; freedom from unlawful sexual intercourse.",
    "chatter": "1. To utter sounds which somewhat resemble language, but are inarticulate and indistinct.",
    "chatty": "Given to light, familiar talk; talkative.",
    "cheek": "1. The side of the face below the eye. 2. The cheek bone.",
    "cheer": "1. The face; the countenance or its expression.",
    "cheese": "1. The curd of milk, coagulated usually with rennet, separated from the whey, and pressed into a solid mass in a hoop or mold. 2. A mass of pomace, or ground apples, pressed togehter in the form of a cheese. 3. The flat, circuliar, mucilaginous fruit of the dwarf mallow (Malva rotundifolia). [Colloq.] 4. A low courtesy; -- so called on account of the cheese form assumed by a woman's dress when she stoops after extending the skirts by a rapid gyration.",
    "chef": "1. A chief of head person. 2. The head cook of large establishment, as a club, a family, etc. 3. (Her.)  Same as Chief.",
    "cherisher": "One who cherishes.",
    "cherub": "1. A mysterious composite being, the winged footstool and chariot of the Almighty, described in Ezekiel i. and x. I knew that they were the cherubim.",
    "chess": "A game played on a chessboard, by two persons, with two differently colored sets of men, sixteen in each set.",
    "chest": "1. A large box of wood, or other material, having, like a trunk, a lid, but no covering of skin, leather, or cloth.",
    "chevron": "1. (Her.)  One of the nine honorable ordinaries, consisting of two broad bands of the width of the bar, issuing, respectively from the dexter and sinister bases of the field and conjoined at its center. 2. (Mil.)  A distinguishing mark, above the elow, on the sleeve of a noncommisioned officer's coat. 3. (Arch.)  A zigzag molding, or group of moldings, common in Norman architecture.",
    "chevy": "See Chivy, v. t. [Slang, Eng.] One poor fellow was chevied about among the casks in the storm for ten minutes.",
    "chief": "1. The head or leader of any body of men; a commander, as of an army; a head man, as of a tribe, clan, or family; a person in authority who directs the work of others; the pricipal actio or agent. 2. The principal part; the most valuable portion.",
    "childhood": "1. The state of being a child; the time in which persons are children; the condition or time from infancy to puberty.",
    "childish": "1. Of, pertaining to, befitting, or resembling, a child.",
    "childlike": "Resembling a child, or that which belongs to children; becoming a child; meek; submissive; dutiful.",
    "chili": "A kind of red pepper.",
    "chill": "1. A moderate but disagreeable degree of cold; a disagreeable sensation of coolness, accompanied with shivering.",
    "chip": "1. To cut small pieces from; to diminsh or reduce to shape, by cutting away a little at a time; to hew.",
    "chirping": "Cheering; enlivening.",
    "chivalry": "1. A body or order of cavaliers or knights serving on horseback; illustrious warriors, collectively; cavalry.",

    "chloride": "A binary compound of chlorine with another element or radical; as, chloride of sodium (common salt). Chloride of ammonium, sal ammoniac.",
    "chlorine": "One of the elementary substances, commonly isolated as a greenish yellow gas, two and one half times as heavy as air, of an intensely disagreeable suffocating odor, and exceedingly poisonous.",
    "choice": "1. Act of choosing; the voluntary act of selecting or separating from two or more things that which is preferred; the determination of the mind in preferring one thing to another; election. 2. The power or opportunity of choosing; option.",

    "circle": "1. A plane figure, bounded by a single curve line called its circumference, every part of which is equally distant from a point within it, called the center. 2. The line that bounds sush a figure; a circumference; a ring. 3. (Astron.)  An instrument of observation, the graduated limb of which consists of an entire circle.",
    "circular": "1. In the form of, or bounded by, a circle; round. 2. repeating itself; ending in itself; reverting to the point of beginning; hence, illogical; inconclusive; as, circular reasoning. 3. Adhering to a fixed circle of legends; cyclic; hence, mean; inferior.",
    "circulate": "1. To move in a circle or circuitously; to move round and return to the same point; as, the blood circulates in the body.",

    "citadel": "A fortress in or near a fortified city, commanding the city and fortifications, and intended as a final point of defense.",

    "city": "1. A large town. 2. A corporate town; in the United States, a town or collective body of inhabitants, incorporated and governed by a mayor and aldermen or a city council consisting of a board of aldermen and a common council; in Great Britain, a town corporate, which is or has been the seat of a bishop, or the capital of his see.",
    "civic": "Relating to, or derived from, a city or citizen; relating to man as a member of society, or to civil affairs.",
    "civil": "1. Pertaining to a city or state, or to a citizen in his relations to his fellow citizens or to the state; within the city or state. 2. Subject to government; reduced to order; civilized; not barbarous; -- said of the community.",

    "clamor": "1. A great outcry or vociferation; loud and continued shouting or exclamation.",
    "clamp": "1. Something rigid that holds fast or binds things together; a piece of wood or metal, used to hold two or more pieces together. 2. (a) An instrument with a screw or screws by which work is held in its place or two parts are temporarily held together. (b) (Joinery) A piece of wood placed across another, or inserted into another, to bind or strengthen. 3. One of a pair of movable pieces of lead, or other soft material, to cover the jaws of a vise and enable it to grasp without bruising. 4. (Shipbuilding)  A thick plank on the inner part of a ship's side, used to sustuan the ends of beams. 5. A mass of bricks heaped up to be burned; or of ore for roasting, or of coal coking. 6. A mollusk.",
    "clang": "To strike together so as to produce a ringing metallic sound.",

    "clarify": "1. To make clear or bright by freeing from feculent matter; to defecate; to fine; -- said of liquids, as wine or sirup.",
    "clarinet": "A wind instrument, blown by a single reed, of richer and fuller tone than the oboe, which has a double reed.",

    "clash": "1. To make a noise by striking against something; to dash noisily together. 2. To meet in opposition; to act in a contrary direction; to come onto collision; to interfere.",
    "clasp": "1. To shut or fasten together with, or as with, a clasp; to shut or fasten (a clasp, or that which fastens with a clasp). 2. To inclose and hold in the hand or with the arms; to grasp; to embrace. 3. To surround and cling to; to entwine about.",
    "class": "1. A group of individuals ranked together as possessing common characteristics; as, the different classes of society; the educated class; the lower classes. 2. A number of students in a school or college, of the same standing, or pursuing the same studies. 3. A comprehensive division of animate or inanimate objects, grouped together on account of their common characteristics, in any classification in natural science, and subdivided into orders, families, tribes, gemera, etc. 4. A set; a kind or description, species or variety.",
    "clatter": "1. To make a rattling sound by striking hard bodies together; to make a succession of abrupt, rattling sounds.",
    "clause": "1. A separate portion of a written paper, paragraph, or sentence; an article, stipulation, or proviso, in a legal document.",
    "clavicle": "The collar bone, which is joined at one end to the scapula, or shoulder blade, and at the other to the sternum, or breastbone.",
    "claw": "1. A sharp, hooked nail, as of a beast or bird. 2. The whole foot of an animal armed with hooked nails; the pinchers of a lobster, crab, etc. 3. Anything resembling the claw of an animal, as the curved and forked end of a hammer for drawing nails. 4. (Bot.)  A slender appendage or process, formed like a claw, as the base of petals of the pink.",
    "clay": "1. A soft earth, which is plastuc, or may be molded with the hands, consisting of hydrous silicate of alumunium.",

    "coherent": "1. Sticking together; cleaving; as the parts of bodies; solid or fluid.",

    "collar": "1. Something worn round the neck, whether for use, ornament, restraint, or identification; as, the collar of a coat; a lady's collar; the collar of a dog. 2. (Arch.) (a) A ring or cinture. (b) A collar beam. 3. (Bot.)  The neck or line of junction between the root of a plant and its stem.",

    "corrode": "1. To eat away by degrees; to wear away or diminish by gradually separating or destroying small particles of, as by action of a strong acid or a caustic alkali.",

    "cosmic": "1. Pertaining to the universe, and having special reference to universal law or order, or to the one grand harmonious system of things; hence; harmonious; orderly. 2. Pertaining to the solar system as a whole, and not to the earth alone. 3. Characteristic of the cosmos or universe; inconceivably great; vast; as, cosmic speed.",

    "curtain": "1. A hanging screen intended to darken or conceal, and admitting of being drawn back or up, and reclosed at pleasure; esp., drapery of cloth or lace hanging round a bed or at a window; in theaters, and like places, a movable screen for concealing the stage. 2. (Fort.)  That part of the rampart and parapet which is between two bastions or two gates.",

    "delivery": "1. The act of delivering from restraint; rescue; release; liberation; as, the delivery of a captive from his dungeon. 2. The act of delivering up or over; surrender; transfer of the body or substance of a thing; distribution; as, the delivery of a fort, of hostages, of a criminal, of goods, of letters. 3. The act or style of utterance; manner of speaking; as, a good delivery; a clear delivery. 4. The act of giving birth; parturition; the expulsion or extraction of a fetus and its membranes. 5. The act of exerting one's strength or limbs.",

    "democracy": "1. Government by the people; a form of government in which the supreme power is retained and directly exercised by the people. 2. Government by popular representation; a form of government in which the supreme power is retained by the people, but is indirectly exercised through a system of representation and delegated authority periodically renewed; a constitutional representative government; a republic. 3. Collectively, the people, regarded as the source of government.",

    "density": "1. The quality of being dense, close, or thick; compactness; -- opposed to rarity. 2. (Physics)  The ratio of mass, or quantity of matter, to bulk or volume, esp. as compared with the mass and volume of a portion of some substance used as a standard.",
    "dental": "1. Of or pertaining to the teeth or to dentistry; as, dental surgery. 2. (Phon.)  Formed by the aid of the teeth; -- said of certain articulations and the letters representing them; as, d t are dental letters.",
    "deny": "1. To declare not to be true; to gainsay; to contradict; -- opposed to affirm, allow, or admit.",
    "departure": "1. Division; separation; putting away.",
    "depict": "Depicted.",
    "deplete": "1. (Med.)  To empty or unload, as the vessels of human system, by bloodletting or by medicine.",
    "deploy": "To open out; to unfold; to spread out (a body of troops) in such a way that they shall display a wider front and less depth; -- the reverse of ploy; as, to deploy a column of troops into line of battle.",
    "deport": "1. To transport; to carry away; to exile; to send into banishment.",
    "depose": "1. To lay down; to divest one's self of; to lay aside.",
    "depravity": "The stae of being depraved or corrupted; a vitiated state of moral character; general badness of character; wickedness of mind or heart; absence of religious feeling and principle.",
    "deprecate": "To pray against, as an evil; to seek to avert by player; to desire the removal of; to seek deliverance from; to express deep regret for; to disapprove of strongly.",
    "depress": "1. To press down; to cause to sink; to let fall; to lower; as, to depress the muzzle of a gun; to depress the eyes.",
    "deprive": "1. To take away; to put an end; to destroy.",
    "depth": "1. The quality of being deep; deepness; perpendicular measurement downward from the surface,or horizontal measurement backward from the front; as, the depth of a river; the depth of a body of troops. 2. Profoundness; extent or degree of intensity; abundance; completeness; as, depth of knowledge, or color.",
    "deputy": "1. One appointed as the substitue of another, and empowered to act for him, in his name or his behalf; a substitute in office; a lieutenant; a representative; a delegate; a vicegerent; as, the deputy of a prince, of a sheriff, of a township, etc.",
    "derail": "To cause to run off from the rails of a railroad, as a locomotive.",
    "deranged": "Disordered; especially, disordered in mind; crazy; insane.",
    "derby": "1. A race for three-old horses, run annually at Epsom (near London), for the Derby stakes.",
    "desecrate": "To divest of a sacred character or office; to divert from a sacred purpose; to violate the sanctity of; to profane; to put to an unworthy use; -- the opposite of consecrate.",
    "deserve": "1. To earn by service; to be worthy of (something due, either good or evil); to merit; to be entitled to; as, the laborer deserves his wages; a work of value deserves praise.",
    "deserving": "Desert; merit.",
    "designate": "Designated; appointed; chosen.",
    "designing": "Intriguing; artful; scheming; as, a designing man.",
    "deskwork": "Work done at a desk, as by a clerk or writer.",
    "desolate": "1. Destitute or deprived of inhabitants; deserted; uninhabited; hence, gloomy; as, a desolate isle; a desolate wilderness; a desolate house.",
    "despair": "To be hopeless; to have no hope; to give up all hope or expectation; -- often with of.",
    "despise": "To look down upon with disfavor or contempt; to contemn; to scorn; to disdain; to have a low opinion or contemptuous dislike of.",
    "despite": "1. Malice; malignity; spite; malicious anger; contemptuous hate.",
    "destiny": "1. That to which any person or thing is destined; predetermined state; condition foreordained by the Divine or by human will; fate; lot; doom.",
    "destitute": "1. Forsaken; not having in possession (something necessary, or desirable); deficient; lacking; devoid; -- often followed by of.",
    "destruct": "To destroy.",
    "detached": "Separate; unconnected, or imperfectly connected; as, detached parcels.",
    "detail": "1. A minute portion; one of the small parts; a particular; an item; - - used chiefly in the plural; as, the details of a scheme or transaction.",
    "detection": "The act of detecting; the laying open what was concealed or hidden; discovery; as, the detection of a thief; the detection of fraud, forgery, or a plot.",
    "detective": "Fitted for, or skilled in, detecting; employed in detecting crime or criminals; as, a detective officer.",
    "detector": "One who, or that which, detects; a detecter.",
    "detention": "1. The act of detaining or keeping back; a withholding. 2. The state of being detained (stopped or hindered); delay from necessity. 3. Confinement; restraint; custody.",
    "detest": "1. To witness against; to denounce; to condemn.",
    "detonate": "To explode with a sudden report; as, niter detonates with sulphur.",
    "detract": "1. To take away; to withdraw.",
    "deuce": "1. (Gaming)  Two; a card or a die with two spots; as, the deuce of hearts. 2. (Tennis)  A condition of the score beginning whendeuce, which decides the game.",
    "deviant": "Deviating.",
    "deviate": "To go out of the way; to turn aside from a course or a method; to stray or go astray; to err; to digress; to diverge; to vary.",
    "deviation": "1. The act of deviating; a wandering from the way; variation from the common way, from an established rule, etc.; departure, as from the right course or the path of duty. 2. The state or result of having deviated; a transgression; an act of sin; an error; an offense. 2. (Com.)  The voluntary and unnecessary departure of a ship from, or delay in, the regular and usual course of the specific voyage insured, thus releasing the underwriters from their responsibility.",
    "device": "1. That which is devised, or formed by design; a contrivance; an invention; a project; a scheme; often, a scheme to deceive; a stratagem; an artifice.",
    "devious": "1. Out of a straight line; winding; varying from directness; as, a devious path or way. 2. Going out of the right or common course; going astray; erring; wandering; as, a devious step.",
    "devotee": "One who is wholly devoted; esp., one given wholly to religion; one who is superstitiously given to religious duties and ceremonies; a bigot.",
    "devotion": "1. The act of devoting; consecration. 2. The state of being devoted; addiction; eager inclination; strong attachment love or affection; zeal; especially, feelings toward God appropriately expressed by acts of worship; devoutness.",
    "devoutly": "1. In a devout and reverent manner; with devout emotions; piously.",
    "dexterity": "1. Right-handedness. 2. Readiness and grace in physical activity; skill and ease in using the hands; expertness in manual acts; as, dexterity with the chisel.",
    "dexterous": "1. Ready and expert in the use of the body and limbs; skillful and active with the hands; handy; ready; as, a dexterous hand; a dexterous workman. 2. Skillful in contrivance; quick at inventing expedients; expert; as, a dexterous manager.",
    "diabetes": "A disease which is attended with a persistent, excessive discharge of urine.",
    "diabetic": "Pertaining to diabetes; as, diabetic or diabetical treatment.",
    "diabolic": "Pertaining to the devil; resembling, or appropriate, or appropriate to, the devil; devilish; infernal; impious; atrocious; nefarious; outrageously wicked; as, a diabolic or diabolical temper or act.",
    "diagnosis": "1. (Med.)  The art or act of recognizing the presence of disease from its signs or symptoms, and deciding as to its character; also, the decision arrived at. 2. Scientific determination of any kind; the concise description of characterization of a species. 3. Critical perception or scrutiny; judgment based on such scrutiny; esp., perception pf, or judgment concerning, motives and character.",
    "diagram": "1. (Geom.)  A figure or drawing made to illustrate a statement, or facilitate a demonstration; a plan. 2. Any simple drawing made for mathematical or scientific purposes, or to assist a verbal explanation which refers to it; a mechanical drawing, as distinguished from an artistical one.",
    "dial": "1. An instrument, formerly much used for showing the time of day from the shadow of a style or gnomon on a graduated arc or surface; esp., a sundial; but there are lunar and astral dials.",
    "diameter": "1. (Geom.) (a) Any right line passing through the center of a figure or body, as a circle, conic section, sphere, cube, etc., and terminated by the opposite boundaries; a straight line which bisects a system of parallel chords drawn in a curve. (b) A diametral plane. 2. The length of a straight line through the center of an object from side to side; width; thickness; as, the diameter of a tree or rock.",
    "diaper": "1. Any textile fabric (esp. linen or cotton toweling) woven in diaper pattern.",
    "diaphragm": "1. A dividing membrane or thin partition, commonly with an opening through it. 2. (Anat.)  The muscular and tendinous partition separating the cavity of the chest from that of the abdomen; the midriff. 3. (Zoöl.)  A calcareous plate which divides the cavity of certain shells into two parts. 4. (Opt.)  A plate with an opening, which is generally circular, used in instruments to cut off marginal portions of a beam of light, as at the focus of a telescope. 5. (Mach.)  A partition in any compartment, for various purposes.",
    "dice": "Small cubes used in gaming or in determining by chance; also, the game played with dice.",
    "dicing": "1. An ornamenting in squares or cubes. 2. Gambling with dice.",
    "dictate": "1. To tell or utter so that another may write down; to inspire; to compose; as, to dictate a letter to an amanuensis.",
    "dictation": "1. The act of dictating; the act or practice of prescribing; also that which is dictated.",
    "dictator": "1. One who dictates; one who prescribes rules and maxims authoritatively for the direction of others.",
    "difficult": "1. Hard to do or to make; beset with difficulty; attended with labor, trouble, or pains; not easy; arduous.",
    "diffused": "Spread abroad; dispersed; loose; flowing; diffuse.",
    "diffusion": "1. The act of diffusing, or the state of being diffused; a spreading; extension; dissemination; circulation; dispersion.",
    "diffusive": "Having the quality of diffusing; capable of spreading every way by flowing; spreading widely; widely reaching; copious; diffuse.",
    "dig": "1. To turn up, or delve in, (earth) with a spade or a hoe; to open, loosen, or break up (the soil) with a spade, or other sharp instrument; to pierce, open, or loosen, as if with a spade.",
    "dilation": "Delay.",
    "diligence": "1. The quality of being diligent; carefulness; careful attention; -- the opposite of negligence. 2. Interested and persevering application; devoted and painstaking effort to accomplish what is undertaken; assiduity in service.",
    "diligent": "1. Prosecuted with careful attention and effort; careful; painstaking; not careless or negligent.",
    "dill": "An herb (Peucedanum graveolens), the seeds of which are moderately warming, pungent, and aromatic, and were formerly used as a soothing medicine for children; -- called also dill-seed.",
    "dilute": "1. To make thinner or more liquid by admixture with something; to thin and dissolve by mixing.",
    "dime": "A silver coin of the United States, of the value of ten cents; the tenth of a dollar.",
    "diminish": "1. To make smaller in any manner; to reduce in bulk or amount; to lessen; -- opposed to augment or increase.",
    "dimness": "1. The state or quality 2. Dullness, or want of clearness, of vision or of intellectual perception.",
    "dimple": "1. A slight natural depression or indentation on the surface of some part of the body, esp. on the cheek or chin.",
    "dinghy": "1. A kind of boat used in the East Indies.",
    "dingo": "A wild dog found in Australia, but supposed to have introduced at a very early period.",
    "dingy": "1. A kind of boat used in the East Indies.",
    "dinner": "1. The principal meal of the day, eaten by most people about midday, but by many (especially in cities) at a later hour. 2. An entertainment; a feast.",
    "diocese": "The circuit or extent of a bishop's jurisdiction; the district in which a bishop exercises his ecclesiastical authority.",
    "dioxide": "(a) An oxide containing two atoms of oxygen in each molecule; binoxide. (b) An oxide containing but one atom or equivalent of oxygen to two of a metal; a suboxide.",
    "dipper": "1. One who, or that which, dips; especially, a vessel used to dip water or other liquid; a ladle. 2. (Zoöl.) (a) A small grebe; the dabchick. (b) The buffel duck. (c) The water ouzel (Cinolus aquaticus) of Europe. (d) The American dipper or ouzel (Cinclus Mexicanus). The Dipper (Astron.), the seven principal stars in the constellation of the Great Bear; popularly so called from their arrangement in the form of a dipper; -- called also Charles's Wain.",
    "dipping": "1. The act or process of immersing. 2. The act of inclining downward. 3. The act of lifting or moving a liquid with a dipper, ladle, or the like. 4. The process of cleaning or brightening sheet metal or metalware, esp. brass, by dipping it in acids, etc. 5. The practice of taking snuff by rubbing the teeth or gums with a stick or brush dipped in snuff.",
    "direction": "1. The act of directing, of aiming, regulating, guiding, or ordering; guidance; management; superintendence; administration; as, the direction o. I do commit his youth To your direction.",
    "directive": "1. Having power to direct; tending to direct, guide, or govern; showing the way.",
    "directly": "1. In a direct manner; in a straight line or course.",
    "direness": "Terribleness; horror; woefulness.",
    "disagree": "1. To fail to accord; not to agree; to lack harmony; to differ; to be unlike; to be at variance.",
    "disallow": "To refuse to allow; to deny the force or validity of; to disown and reject; as, the judge disallowed the executor's charge.",
    "disarm": "1. To deprive of arms; to take away the weapons of; to deprive of the means of attack or defense; to render defenseless.",
    "disarray": "1. To throw into disorder; to break the array of.",
    "disaster": "1. An unpropitious or baleful aspect of a planet or star; malevolent influence of a heavenly body; hence, an ill portent.",
    "disband": "1. To loose the bands of; to set free; to disunite; to scatter; to disperse; to break up the organization of; especially, to dismiss from military service; as, to disband an army.",
    "disbelief": "The act of disbelieving;; a state of the mind in which one is fully persuaded that an opinion, assertion, or doctrine is not true; refusal of assent, credit, or credence; denial of belief.",
    "disburse": "To pay out; to expend; -- usually from a public fund or treasury.",
    "discard": "1. (Card Playing)  To throw out of one's hand, as superfluous cards; to lay aside (a card or cards). 2. To cast off as useless or as no longer of service; to dismiss from employment, confidence, or favor; to discharge; to turn away.",
    "discern": "1. To see and identify by noting a difference or differences; to note the distinctive character of; to discriminate; to distinguish.",
    "discharge": "1. To relieve of a charge, load, or burden; to empty of a load or cargo; to unburden; to unload; as, to discharge a vessel. 2. To free of the missile with which anything is charged or loaded; to let go the charge of; as, to discharge a bow, catapult, etc.; especially, said of firearms, -- to fire off; to shoot off; also, to relieve from a state of tension, as a Leyden jar.",
    "disclose": "1. To unclose; to open; -- applied esp. to eggs in the sense of to hatch.",
    "discolor": "1. To alter the natural hue or color of; to change to a different color; to stain; to tinge; as, a drop of wine will discolor water; silver is discolored by sea water. 2. To alter the true complexion or appearance of; to put a false hue upon.",
    "discount": "1. To deduct from an account, debt, charge, and the like; to make an abatement of; as, merchants sometimes discount five or six per cent for prompt payment of bills. 2. To lend money upon, deducting the discount or allowance for interest; as, the banks discount notes and bills of exchange.",
    "discourse": "1. The power of the mind to reason or infer by running, as it were, from one fact or reason to another, and deriving a conclusion; an exercise or act of this power; reasoning; range of reasoning faculty.",
    "discover": "1. To uncover.",
    "discuss": "1. To break to pieces; to shatter.",
    "disdain": "1. A feeling of contempt and aversion; the regarding anything as unworthy of or beneath one; scorn.",
    "disengage": "To release from that with which anything is engaged, engrossed, involved, or entangled; to extricate; to detach; to set free; to liberate; to clear; as, to disengage one from a party, from broils and controversies, from an oath, promise, or occupation; to disengage the affections a favorite pursuit, the mind from study.",
    "disfigure": "To mar the figure of; to render less complete, perfect, or beautiful in appearance; to deface; to deform.",
    "disgrace": "1. The condition of being out of favor; loss of favor, regard, or respect.",
    "dish": "1. A vessel, as a platter, a plate, a bowl, used for serving up food at the table.",
    "disinfect": "To free from infectious or contagious matter; to destroy putrefaction; to purify; to make innocuous.",
    "disjoin": "To part; to disunite; to separate; to sunder.",
    "disk": "1. A discus; a quoit.",
    "dislike": "1. To regard with dislike or aversion; to disapprove; to disrelish.",
    "dislocate": "To displace; to put out of its proper place.",
    "dislodge": "1. To drive from a lodge or place of rest; to remove from a place of quiet or repose; as, shells resting in the sea at a considerate depth are not dislodged by storms. 2. To drive out from a place of hiding or defense; as, to dislodge a deer, or an enemy.",
    "disloyal": "Not loyal; not true to a sovereign or lawful superior, or to the government under which one lives; false where allegiance is due; faithless; as, a subject disloyal to the king; a husband disloyal to his wife.",
    "dismantle": "1. To strip or deprive of dress; to divest. 2. To strip of furniture and equipments, guns, etc.; to unrig; to strip of walls or outworks; to break down; as, to dismantle a fort, a town, or a ship.",
    "dismay": "1. To disable with alarm or apprehensions; to depress the spirits or courage of; to deprive or firmness and energy through fear; to daunt; to appall; to terrify.",
    "dismiss": "1. To send away; to give leave of departure; to cause or permit to go; to put away.",
    "dismount": "1. To come down; to descend.",
    "disobey": "Not to obey; to neglect or refuse to obey (a superior or his commands, the laws, etc.); to transgress the commands of (one in authority); to violate, as an order; as, refractory children disobey their parents; men disobey their Maker and the laws.",
    "disorder": "1. Want of order or regular disposition; lack of arrangement; confusion; disarray; as, the troops were thrown into disorder; the papers are in disorder. 2. Neglect of order or system; irregularity.",
    "disown": "1. To refuse to own or acknowledge as belonging to one's self; to disavow or deny, as connected with one's self personally; as, a parent can hardly disown his child; an author will sometimes disown his writings. 2. To refuse to acknowledge or allow; to deny.",
    "disparate": "1. Unequal; dissimilar; separate.",
    "disparity": "Inequality; difference in age, rank, condition, or excellence; dissimilitude; -- followed by between, in, of, as to, etc.; as, disparity in, or of, years; a disparity as to color.",
    "dispatch": "1. To dispose of speedily, as business; to execute quickly; to make a speedy end of; to finish; to perform.",
    "dispense": "1. To deal out in portions; to distribute; to give; as, the steward dispenses provisions according directions; Nature dispenses her bounties; to dispense medicines.",
    "dispersal": "The act or result of dispersing or scattering; dispersion.",
    "dispersed": "Scattered.",
    "displace": "1. To change the place of; to remove from the usual or proper place; to put out of place; to place in another situation; as, the books in the library are all displaced. 2. To crowd out; to take the place of.",
    "display": "1. To unfold; to spread wide; to expand; to stretch out; to spread.",
    "displease": "1. To make not pleased; to excite a feeling of disapprobation or dislike in; to be disagreeable to; to offend; to vex; -- often followed by with or at.",
    "disposal": "1. The act of disposing, or disposing of, anything; arrangement; orderly distribution; a putting in order; as, the disposal of the troops in two lines. 2. Ordering; regulation; adjustment; management; government; direction.",
    "dispose": "1. To distribute and put in place; to arrange; to set in order; as, to dispose the ships in the form of a crescent.",
    "disprove": "1. To prove to be false or erroneous; to confute; to refute.",
    "dispute": "To contend in argument; to argue against something maintained, upheld, or claimed, by another; to discuss; to reason; to debate; to altercate; to wrangle.",
    "disregard": "Not to regard; to pay no heed to; to omit to take notice of; to neglect to observe; to slight as unworthy of regard or notice; as, to disregard the admonitions of conscience.",
    "disrupt": "Rent off; torn asunder; severed; disrupted.",
    "dissuade": "1. To advise or exhort against; to try to persuade (one from a course). [Obsolescent] Mr. Burchell, on the contrary, dissuaded her with great ardor: and I stood neuter.",
    "distance": "1. The space between two objects; the length of a line, especially the shortest line joining two points or things that are separate; measure of separation in place.",
    "distant": "1. Separated; having an intervening space; at a distance; away.",
    "distaste": "1. Aversion of the taste; dislike, as of food or drink; disrelish.",
    "distill": "1. To drop; to fall in drops; to trickle.",
    "distinct": "1. Distinguished; having the difference marked; separated by a visible sign; marked out; specified.",
    "distort": "Distorted; misshapen.",
    "distract": "1. Separated; drawn asunder.",
    "distress": "1. Extreme pain or suffering; anguish of body or mind; as, to suffer distress from the gout, or from the loss of friends.",
    "district": "Rigorous; stringent; harsh.",
    "distrust": "To feel absence of trust in; not to confide in or rely upon; to deem of questionable sufficiency or reality; to doubt; to be suspicious of; to mistrust.",
    "ditch": "1. A trench made in the earth by digging, particularly a trench for draining wet land, for guarding or fencing inclosures, or for preventing an approach to a town or fortress.",
    "ditto": "The aforesaid thing; the same (as before). Often contracted to do., or to two \"turned commas\" (\"), or small marks.",
    "dividable": "1. Capable of being divided; divisible. 2. Divided; separated; parted.",
    "dividing": "That divides; separating; marking divisions; graduating.",
    "divinely": "1. In a divine or godlike manner; holily; admirably or excellently in a supreme degree.",
    "diving": "That dives or is used or diving.",
    "divinity": "1. The state of being divine; the nature or essence of God; deity; godhead.",
    "divisible": "Capable of being divided or separated.",
    "division": "1. The act or process of diving anything into parts, or the state of being so divided; separation.",
    "divisive": "1. Indicating division or distribution.",
    "dizzy": "1. Having in the head a sensation of whirling, with a tendency to fall; vertiginous; giddy; hence, confused; indistinct.",
    "doable": "Capable of being done.",
    "docile": "1. Teachable; easy to teach; docible.",
    "dock": "A genus of plants (Rumex), some species of which are well-known weeds which have a long taproot and are difficult of extermination.",
    "doctrine": "1. Teaching; instruction.",
    "document": "1. That which is taught or authoritatively set forth; precept; instruction; dogma.",
    "dodge": "1. To start suddenly aside, as to avoid a blow or a missile; to shift place by a sudden start.",
    "doily": "1. A kind of woolen stuff.",
    "doing": "Anything done; a deed; an action good or bad; hence, in the plural, conduct; behavior.",
    "dole": "grief; sorrow; lamentation.",
    "dollar": "1. (a) A silver coin of the United States containing 371.25 grains of silver and 41.25 grains of alloy, that is, having a total weight of 412.5 grains. (b) A gold coin of the United States containing 23.22 grains of gold and 2.58 grains of alloy, that is, having a total weight of 25.8 grains, nine-tenths fine.",
    "dolly": "1. (Mining)  A contrivance, turning on a vertical axis by a handle or winch, and giving a circular motion to the ore to be washed; a stirrer. 2. (Mach.)  A tool with an indented head for shaping the head of a rivet.",
    "dolphin": "1. (Zool.) (a) A cetacean of the genus Delphinus and allied genera (esp.",
    "domain": "1. Dominion; empire; authority. 2. The territory over which dominion or authority is exerted; the possessions of a sovereign or commonwealth, or the like.",
    "domestic": "1. Of or pertaining to one's house or home, or one's household or family; relating to home life; as, domestic concerns, life, duties, cares, happiness, worship, servants.",
    "dominion": "1. Sovereign or supreme authority; the power of governing and controlling; independent right of possession, use, and control; sovereignty; supremacy.",
    "donation": "1. The act of giving or bestowing; a grant.",
    "donor": "1. One who gives or bestows; one who confers anything gratuitously; a benefactor. 2. (Law)  One who grants an estate; in later use, one who confers a power; -- the opposite of donee.",
    "dormitory": "1. A sleeping room, or a building containing a series of sleeping rooms; a sleeping apartment capable of containing many beds; esp., one connected with a college or boarding school.",
    "dorsal": "1. (Anat.)  Pertaining to, or situated near, the back, or dorsum, of an animal or of one of its parts; notal; tergal; neural; as, the dorsal fin of a fish; the dorsal artery of the tongue; -- opposed to ventral. 2. (Bot.) (a) Pertaining to the surface naturally inferior, as of a leaf. (b) Pertaining to the surface naturally superior, as of a creeping hepatic moss.",
    "dose": "1. The quantity of medicine given, or prescribed to be taken, at one time. 2. A sufficient quantity; a portion; as much as one can take, or as falls to one to receive. 3. Anything nauseous that one is obliged to take; a disagreeable portion thrust upon one.",
    "dotted": "Marked with, or made of, dots or small spots; diversified with small, detached objects.",
    "doubling": "1. The act of one that doubles; a making double; reduplication; also, that which is doubled. 2. A turning and winding; as, the doubling of a hunted hare; shift; trick; artifice.",
    "dove": "1. (Zoöl.)  A pigeon of the genus Columba and various related genera.",
    "down": "1. Fine, soft, hairy outgrowth from the skin or surface of animals or plants, not matted and fleecy like wool; esp.: (a) (Zoöl.) The soft under feathers of birds.",
    "dowry": "1. A gift; endowment.",
    "doze": "To slumber; to sleep lightly; to be in a dull or stupefied condition, as if half asleep; to be drowsy.",
    "drab": "1. A low, sluttish woman.",
    "dragonish": "resembling a dragon.",
    "drainage": "1. A draining; a gradual flowing off of any liquid; also, that which flows out of a drain. 2. The mode in which the waters of a country pass off by its streams and rivers. 3. (Engin.)  The system of drains and their operation, by which superfluous water is removed from towns, railway beds, mines, and other works. 4. Area or district drained; as, the drainage of the Po, the Thames, etc.",
    "dramatic": "Of or pertaining to the drama; appropriate to, or having the qualities of, a drama; theatrical; vivid.",
    "dramatize": "To compose in the form of the drama; to represent in a drama; to adapt to dramatic representation; as, to dramatize a novel, or an historical episode.",
    "drank": "of Drink.",
    "drapery": "1. The occupation of a draper; cloth-making, or dealing in cloth.",
    "drastic": "Acting rapidly and violently; efficacious; powerful; -- opposed to bland; as, drastic purgatives. -- n. (Med.)  A violent purgative.",
    "draw": "1. To cause to move continuously by force applied in advance of the thing moved; to pull along; to haul; to drag; to cause to follow.",
    "dreadful": "1. Full of dread or terror; fearful.",
    "dreamily": "As if in a dream; softly; slowly; languidly.",
    "dreamland": "An unreal, delightful country such as in sometimes pictured in dreams; region of fancies; fairyland.",
    "dreamless": "Free from, or without, dreams.",
    "dreamy": "Abounding in dreams or given to dreaming; appropriate to, or like, dreams; visionary.",
    "dreary": "1. Sorrowful; distressful.",
    "drench": "1. To cause to drink; especially, to dose by force; to put a potion down the throat of, as of a horse; hence. to purge violently by physic.",
    "dress": "1. To direct; to put right or straight; to regulate; to order.",
    "dribble": "1. To fall in drops or small drops, or in a quick succession of drops; as, water dribbles from the eaves. 2. To slaver, as a child or an idiot; to drivel. 3. To fall weakly and slowly.",
    "dried": "of Day.",
    "drift": "1. A driving; a violent movement.",
    "drilling": "1. The act of piercing with a drill. 2. A training by repeated exercises.",
    "drinkable": "Capable of being drunk; suitable for drink; potable.",
    "drinking": "1. The act of one who drinks; the act of imbibing. 2. The practice of partaking to excess of intoxicating liquors. 3. An entertainment with liquors; a carousal.",
    "dripping": "1. A falling in drops, or the sound so made. 2. That which falls in drops, as fat from meat in roasting.",
    "driven": "of Drive.",
    "driver": "1. One who, or that which, drives; the person or thing that urges or compels anything else to move onward. 2. The person who drives beasts or a carriage; a coachman; a charioteer, etc.; hence, also, one who controls the movements of a locomotive. 3. An overseer of a gang of slaves or gang of convicts at their work. 4. (Mach.)  A part that transmits motion to another part by contact with it, or through an intermediate relatively movable part, as a gear which drives another, or a lever which moves another through a link, etc.",
    "driving": "1. Having great force of impulse; as, a driving wind or storm. 2. Communicating force; impelling; as, a driving shaft.",
    "drizzle": "To rain slightly in very small drops; to fall, as water from the clouds, slowly and in fine particles; as, it drizzles; drizzling drops or rain.",
    "drizzly": "Characterized by small rain, or snow; moist and disagreeable.",
    "drone": "1. (Zoöl.)  The male of bees, esp. of the honeybee.",
    "drool": "To drivel, or drop saliva; as, the child drools.",
    "droop": "1. To hang bending downward; to sink or hang down, as an animal, plant, etc., from physical inability or exhaustion, want of nourishment, or the like.",
    "droplet": "A little drop; a tear.",
    "dropper": "1. One who, or that which, drops.",
    "drown": "To be suffocated in water or other fluid; to perish in water.",
    "drudge": "To perform menial work; to labor in mean or unpleasant offices with toil and fatigue.",
    "drum": "1. (Mus.)  An instrument of percussion, consisting either of a hollow cylinder, over each end of which is stretched a piece of skin or vellum, to be beaten with a stick; or of a metallic hemisphere (kettledrum) with a single piece of skin to be so beaten; the common instrument for marking time in martial music; one of the pair of tympani in an orchestra, or cavalry band.",
    "dry": "1. Free from moisture; having little humidity or none; arid; not wet or moist; deficient in the natural or normal supply of moisture, as rain or fluid of any kind; -- said especially: (a) Of the weather: Free from rain or mist.",
    "duchess": "The wife or widow of a duke; also, a lady who has the sovereignty of a duchy in her own right.",
    "ducking": ", from Duck, v. t. & i. Ducking stool, a stool or chair in which common scolds were formerly tied, and plunged into water, as a punishment.",
    "duckling": "A young or little duck.",
    "duct": "1. Any tube or canal by which a fluid or other substance is conducted or conveyed. 2. (Anat.)  One of the vessels of an animal body by which the products of glandular secretion are conveyed to their destination. 3. (Bot.)  A large, elongated cell, either round or prismatic, usually found associated with woody fiber.",
    "dude": "A kind of dandy; especially, one characterized by an ultrafashionable style of dress and other affectations.",
    "duffel": "A kind of coarse woolen cloth, having a thick nap or frieze.",
    "dugout": "1. A canoe or boat dug out from a large log.",
    "duke": "1. A leader; a chief; a prince.",
    "dullness": "The state of being dull; slowness; stupidity; heaviness; drowsiness; bluntness; obtuseness; dimness; want of luster; want of vividness, or of brightness.",
    "dupe": "One who has been deceived or who is easily deceived; a gull; as, the dupe of a schemer.",
    "duplex": "Double; twofold.",
    "duplicate": "Double; twofold.",
    "duplicity": "1. Doubleness; a twofold state.",
    "durable": "Able to endure or continue in a particular condition; lasting; not perishable or changeable; not wearing out or decaying soon; enduring; as, durable cloth; durable happiness.",
    "duration": "The state or quality of lasting; continuance in time; the portion of time during which anything exists.",
    "duress": "1. Hardship; constraint; pressure; imprisonment; restraint of liberty.",
    "dusk": "Tending to darkness or blackness; moderately dark or black; dusky.",
    "dust": "1. Fine, dry particles of earth or other matter, so comminuted that they may be raised and wafted by the wind; that which is crumbled too minute portions; fine powder; as, clouds of dust; bone dust.",
    "dutiful": "1. Performing, or ready to perform, the duties required by one who has the right to claim submission, obedience, or deference; submissive to natural or legal superiors; obedient, as to parents or superiors; as, a dutiful son or daughter; a dutiful ward or servant; a dutiful subject. 2. Controlled by, proceeding from, a sense of duty; respectful; deferential; as, dutiful affection.",
    "duty": "1. That which is due; payment.",
    "dwarf": "An animal or plant which is much below the ordinary size of its species or kind; especially, a diminutive human being.",
    "dweller": "An inhabitant; a resident; as, a cave dweller.",
    "dwelling": "Habitation; place or house in which a person lives; abode; domicile.",
    "dwindle": "To diminish; to become less; to shrink; to waste or consume away; to become degenerate; to fall away.",
    "dynamic": "1. Of or pertaining to dynamics; belonging to energy or power; characterized by energy or production of force.",
    "dynamite": "An explosive substance consisting of nitroglycerin absorbed by some inert, porous solid, as infusorial earth, sawdust, etc.",
    "dynasty": "1. Sovereignty; lordship; dominion.",
    "each": "1. Every one of the two or more individuals composing a number of objects, considered separately from the rest.",
    "eagle": "1. (Zoöl.)  Any large, rapacious bird of the Falcon family, esp. of the genera Aquila and Haliæetus.",
    "eardrum": "The tympanum.",
    "early": "Soon; in good season; seasonably; betimes; as, come early.",
    "earmark": "1. A mark on the ear of sheep, oxen, dogs, etc., as by cropping or slitting. 2. A mark for identification; a distinguishing mark.",
    "earshot": "Reach of the ear; distance at which words may be heard.",
    "earthling": "An inhabitant of the earth; a mortal.",
    "earthly": "1. Pertaining to the earth; belonging to this world, or to man's existence on the earth; not heavenly or spiritual; carnal; worldly; as, earthly joys; earthly flowers; earthly praise.",
    "earthworm": "1. (Zoöl.)  Any worm of the genus Lumbricus and allied genera, found in damp soil.",
    "earthy": "1. Consisting of, or resembling, earth; terrene; earthlike; as, earthy matter.",
    "earwig": "1. (Zoöl.)  Any insect of the genus Forticula and related genera, belonging to the order Euplexoptera. 2. (Zoöl.)  In America, any small chilopodous myriapod, esp. of the genus Geophilus.",
    "easeful": "Full of ease; suitable for affording ease or rest; quiet; comfortable; restful.",
    "easel": "A frame (commonly) of wood serving to hold a canvas upright, or nearly upright, for the painter's convenience or for exhibition.",
    "easily": "1. With ease; without difficulty or much effort; as, this task may be easily performed; that event might have been easily foreseen. 2. Without pain, anxiety, or disturbance; as, to pass life well and easily.",
    "easiness": "1. The state or condition of being easy; freedom from distress; rest. 2. Freedom from difficulty; ease; as the easiness of a task. 3. Freedom from emotion; compliance; disposition to yield without opposition; unconcernedness.",
    "easter": "1. An annual church festival commemorating Christ's resurrection, and occurring on Sunday, the second day after Good Friday.",
    "eating": "1. The act of tasking food; the act of consuming or corroding. 2. Something fit to be eaten; food; as, a peach is good eating.",
    "ebony": "A hard, heavy, and durable wood, which admits of a fine polish or gloss.",
    "eccentric": "1. Deviating or departing from the center, or from the line of a circle; as, an eccentric or elliptical orbit; pertaining to deviation from the center or from true circular motion. 2. Not having the same center; -- said of circles, ellipses, spheres, etc., which, though coinciding, either in whole or in part, as to area or volume, have not the same center; -- opposed to concentric. 3. (Mach.)  Pertaining to an eccentric; as, the eccentric rod in a steam engine. 4. Not coincident as to motive or end.",
    "echo": "1. A sound reflected from an opposing surface and repeated to the ear of a listener; repercussion of sound; repetition of a sound.",
    "eclipse": "1. (Astron.)  An interception or obscuration of the light of the sun, moon, or other luminous body, by the intervention of some other body, either between it and the eye, or between the luminous body and that illuminated by it.",
    "economic": "1. Pertaining to the household; domestic.",
    "economist": "1. One who economizes, or manages domestic or other concerns with frugality; one who expends money, time, or labor, judiciously, and without waste.",
    "economy": "1. The management of domestic affairs; the regulation and government of household matters; especially as they concern expense or disbursement; as, a careful economy.",
    "edge": "1. The thin cutting side of the blade of an instrument; as, the edge of an ax, knife, sword, or scythe.",
    "edging": "1. That which forms an edge or border, as the fringe, trimming, etc., of a garment, or a border in a garden.",
    "edgy": "1. Easily irritated; sharp; as, an edgy temper. 2. (Fine Arts)  Having some of the forms, such as drapery or the like, too sharply defined.",
    "education": "The act or process of educating; the result of educating, as determined by the knowledge skill, or discipline of character, acquired; also, the act or process of training by a prescribed or customary course of study or discipline; as, an education for the bar or the pulpit; he has finished his education.",
    "eel": "An elongated fish of many genera and species.",
    "effective": "Having the power to produce an effect or effects; producing a decided or decisive effect; efficient; serviceable; operative; as, an effective force, remedy, speech; the effective men in a regiment.",
    "efficient": "Causing effects; producing results; that makes the effect to be what it is; actively operative; not inactive, slack, or incapable; characterized by energetic and useful activity; as, an efficient officer, power.",
    "effort": "1. An exertion of strength or power, whether physical or mental, in performing an act or aiming at an object; more or less strenuous endeavor; struggle directed to the accomplishment of an object; as, an effort to scale a wall.",
    "eggshell": "1. The shell or exterior covering of an egg.",
    "egotism": "The practice of too frequently using the word I; hence, a speaking or writing overmuch of one's self; self-exaltation; self- praise; the act or practice of magnifying one's self or parading one's own doings.",
    "egotistic": "Addicted to, or manifesting, egotism.",
    "either": "1. One of two; the one or the other; -- properly used of two things, but sometimes of a larger number, for any one.",
    "eject": "1. To expel; to dismiss; to cast forth; to thrust or drive out; to discharge; as, to eject a person from a room; to eject a traitor from the country; to eject words from the language.",
    "elaborate": "Wrought with labor; finished with great care; studied; executed with exactness or painstaking; as, an elaborate discourse; an elaborate performance; elaborate research.",
    "elastic": "1. Springing back; having a power or inherent property of returning to the form from which a substance is bent, drawn, pressed, or twisted; springy; having the power of rebounding; as, a bow is elastic; the air is elastic; India rubber is elastic.",
    "elbow": "1. The joint or bend of the arm; the outer curve in the middle of the arm when bent.",
    "eldest": "1. Oldest; longest in duration.",
    "election": "1. The act of choosing; choice; selection. 2. The act of choosing a person to fill an office, or to membership in a society, as by ballot, uplifted hands, or viva voce; as, the election of a president or a mayor.",
    "elective": "1. Exerting the power of choice; selecting; as, an elective act. 2. Pertaining to, or consisting in, choice, or right of choosing; electoral.",
    "elephant": "1. (Zoöl.)  A mammal of the order Proboscidia, of which two living species, Elephas Indicus and E. Africanus, and several fossil species, are known.",
    "elevate": "Elevated; raised aloft.",
