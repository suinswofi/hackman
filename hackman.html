    "trading": "1. Carrying on trade or commerce; engaged in trade; as, a trading company. 2. Frequented by traders.",
    "tradition": "1. The act of delivering into the hands of another; delivery.",
    "traffic": "1. To pass goods and commodities from one person to another for an equivalent in goods or money; to buy or sell goods; to barter; to trade. 2. To trade meanly or mercenarily; to bargain.",
    "tragedy": "1. A dramatic poem, composed in elevated style, representing a signal action performed by some person or persons, and having a fatal issue; that species of drama which represents the sad or terrible phases of character and life.",
    "trailing": "a. & vb. n. from Trail.",
    "train": "1. To draw along; to trail; to drag.",
    "traitor": "1. One who violates his allegiance and betrays his country; one guilty of treason; one who, in breach of trust, delivers his country to an enemy, or yields up any fort or place intrusted to his defense, or surrenders an army or body of troops to the enemy, unless when vanquished; also, one who takes arms and levies war against his country; or one who aids an enemy in conquering his country.",
    "trance": "1. A tedious journey.",
    "tranquil": "Quiet; calm; undisturbed; peaceful; not agitated; as, the atmosphere is tranquil; the condition of the country is tranquil.",
    "transfer": "1. To convey from one place or person another; to transport, remove, or cause to pass, to another place or person; as, to transfer the laws of one country to another; to transfer suspicion. 2. To make over the possession or control of; to pass; to convey, as a right, from one person to another; to give; as, the title to land is transferred by deed. 3. To remove from one substance or surface to another; as, to transfer drawings or engravings to a lithographic stone.",
    "transform": "1. To change the form of; to change in shape or appearance; to metamorphose; as, a caterpillar is ultimately transformed into a butterfly.",
    "translate": "1. To bear, carry, or remove, from one place to another; to transfer; as, to translate a tree.",
    "transpire": "1. (Physiol.)  To pass off in the form of vapor or insensible perspiration; to exhale. 2. (Bot.)  To evaporate from living cells. 3. To escape from secrecy; to become public; as, the proceedings of the council soon transpired.",
    "transport": "1. To carry or bear from one place to another; to remove; to convey; as, to transport goods; to transport troops.",
    "transpose": "1. To change the place or order of; to substitute one for the other of; to exchange, in respect of position; as, to transpose letters, words, or propositions. 2. To change; to transform; to invert.",
    "trapdoor": "1. (Arch.)  A lifting or sliding door covering an opening in a roof or floor. 2. (Mining)  A door in a level for regulating the ventilating current; -- called also weather door.",
    "trapeze": "1. (Geom.)  A trapezium.",
    "trapper": "1. One who traps animals; one who makes a business of trapping animals for their furs.",
    "traps": "Small or portable articles for dress, furniture, or use; goods; luggage; things.",
    "trash": "1. That which is worthless or useless; rubbish; refuse.",
    "travel": "1. To labor; to travail.",
    "traverse": "Lying across; being in a direction across something else; as, paths cut with traverse trenches.",
    "travesty": "Disguised by dress so as to be ridiculous; travestied; -- applied to a book or shorter composition.",
    "tray": "To betray; to deceive.",
    "treachery": "Violation of allegiance or of faith and confidence; treasonable or perfidious conduct; perfidy; treason.",
    "treadmill": "A mill worked by persons treading upon steps on the periphery of a wide wheel having a horizontal axis.",
    "treason": "1. The offense of attempting to overthrow the government of the state to which the offender owes allegiance, or of betraying the state into the hands of a foreign power; disloyalty; treachery.",
    "treat": "1. To handle; to manage; to use; to bear one's self toward; as, to treat prisoners cruelly; to treat children kindly. 2. To discourse on; to handle in a particular manner, in writing or speaking; as, to treat a subject diffusely. 3. To entertain with food or drink, especially the latter, as a compliment, or as an expression of friendship or regard; as, to treat the whole company. 4. To negotiate; to settle; to make terms for.",
    "treble": "1. Threefold; triple.",
    "tree": "1. (Bot.)  Any perennial woody plant of considerable size (usually over twenty feet high) and growing with a single trunk.",
    "trekker": "One that treks.",
    "tremble": "1. To shake involuntarily, as with fear, cold, or weakness; to quake; to quiver; to shiver; to shudder; -- said of a person or an animal.",
    "trembling": "Shaking; tottering; quivering.",
    "tremor": "A trembling; a shivering or shaking; a quivering or vibratory motion; as, the tremor of a person who is weak, infirm, or old.",
    "trench": "1. To cut; to form or shape by cutting; to make by incision, hewing, or the like.",
    "trend": "To have a particular direction; to run; to stretch; to tend; as, the shore of the sea trends to the southwest.",
    "trespass": "1. To pass beyond a limit or boundary; hence, to depart; to go.",
    "trial": "1. The act of trying or testing in any manner.",
    "triangle": "1. (Geom.)  A figure bounded by three lines, and containing three angles.",
    "tribune": "1. (Rom.",
    "tributary": "1. Paying tribute to another, either from compulsion, as an acknowledgment of submission, or to secure protection, or for the purpose of purchasing peace.",
    "tribute": "1. An annual or stated sum of money or other valuable thing, paid by one ruler or nation to another, either as an acknowledgment of submission, or as the price of peace and protection, or by virtue of some treaty; as, the Romans made their conquered countries pay tribute.",
    "tricking": "Given to tricks; tricky.",
    "trickle": "To flow in a small, gentle stream; to run in drops.",
    "tricycle": "A three-wheeled velocipede.",
    "trident": "1. (Class Myth.)  A kind of scepter or spear with three prongs, -- the common attribute of Neptune. 2. (Rom.",
    "tried": "imp. & p. p. of Try.",
    "trifle": "1. A thing of very little value or importance; a paltry, or trivial, affair.",
    "trillion": "According to the French notation, which is used upon the Continent generally and in the United States, the number expressed by a unit with twelve ciphers annexed; a million millions; according to the English notation, the number produced by involving a million to the third power, or the number represented by a unit with eighteen ciphers annexed.",
    "trilogy": "A series of three dramas which, although each of them is in one sense complete, have a close mutual relation, and form one historical and poetical picture.",
    "trimmer": "1. One who trims, arranges, fits, or ornaments. 2. One who does not adopt extreme opinions in politics, or the like; one who fluctuates between parties, so as to appear to favor each; a timeserver.",
    "trimming": "a. from Trim, v. The Whigs are, essentially, an inefficient, trimming, halfway sort of a party.",
    "trinity": "1. (Christian Theol.)  The union of three persons (the Father, the Son, and the Holy Ghost) in one Godhead, so that all the three are one God as to substance, but three persons as to individuality. 2. Any union of three in one; three units treated as one; a triad, as the Hindoo trinity, or Trimurti. 3. Any symbol of the Trinity employed in Christian art, especially the triangle.",
    "trio": "1. Three, considered collectively; three in company or acting together; a set of three; three united.",
    "tripod": "1. Any utensil or vessel, as a stool, table, altar, caldron, etc., supported on three feet.",
    "triumph": "1. (Rom.",
    "trivial": "1. Found anywhere; common.",
    "trombone": "1. (Mus.)  A powerful brass instrument of the trumpet kind, thought by some to be the ancient sackbut, consisting of a tube in three parts, bent twice upon itself and ending in a bell.",
    "trophy": "1. (Gr. & Rom.",
    "tropical": "1. Of or pertaining to the tropics; characteristic of, or incident to, the tropics; being within the tropics; as, tropical climate; tropical latitudes; tropical heat; tropical diseases. 2. Etym: [From Trope.]  Rhetorically changed from its exact original sense; being of the nature of a trope; figurative; metaphorical.",
    "trouble": "1. To put into confused motion; to disturb; to agitate.",
    "trough": "1. A long, hollow vessel, generally for holding water or other liquid, especially one formed by excavating a log longitudinally on one side; a long tray; also, a wooden channel for conveying water, as to a mill wheel. 2. Any channel, receptacle, or depression, of a long and narrow shape; as, trough between two ridges, etc.",
    "trout": "1. (Zoöl.)  Any one of numerous species of fishes belonging to Salmo, Salvelinus, and allied genera of the family Salmonidæ. They are highly esteemed as game fishes and for the quality of their flesh.",
    "trowel": "1. A mason's tool, used in spreading and dressing mortar, and breaking bricks to shape them. 2. A gardener's tool, somewhat like a scoop, used in taking up plants, stirring the earth, etc. 3. (Founding)  A tool used for smoothing a mold.",
    "truce": "1. (Mil.)  A suspension of arms by agreement of the commanders of opposing forces; a temporary cessation of hostilities, for negotiation or other purpose; an armistice. 2. Hence, intermission of action, pain, or contest; temporary cessation; short quiet.",
    "truck": "1. A small wheel, as of a vehicle; specifically (Ord.), a small strong wheel, as of wood or iron, for a gun carriage. 2. A low, wheeled vehicle or barrow for carrying goods, stone, and other heavy articles.",
    "truffle": "Any one of several kinds of roundish, subterranean fungi, usually of a blackish color.",
    "trump": "A wind instrument of music; a trumpet, or sound of a trumpet; - - used chiefly in Scripture and poetry.",
    "trustee": "A person to whom property is legally committed in trust, to be applied either for the benefit of specified individuals, or for public uses; one who is intrusted with property for the benefit of another; also, a person in whose hands the effects of another are attached in a trustee process.",
    "trustful": "1. Full of trust; trusting. 2. Worthy of trust; faithful; trusty; trustworthy.",
    "trusting": "Having or exercising trust; confiding; unsuspecting; trustful.",
    "trustless": "That may not be trusted; not worthy of trust; unfaithful.",
    "truth": "1. The quality or being true; as: -- (a) Conformity to fact or reality; exact accordance with that which is, or has been; or shall be. (b) Conformity to rule; exactness; close correspondence with an example, mood, object of imitation, or the like.",
    "try": "1. To divide or separate, as one sort from another; to winnow; to sift; to pick out; -- frequently followed by out; as, to try out the wild corn from the good.",
    "tubular": "Having the form of a tube, or pipe; consisting of a pipe; fistular; as, a tubular snout; a tubular calyx.",
    "tug": "1. To pull or draw with great effort; to draw along with continued exertion; to haul along; to tow; as, to tug a loaded cart; to tug a ship into port.",
    "tulip": "Any plant of the liliaceous genus Tulipa.",
    "tumble": "1. To roll over, or to and fro; to throw one's self about; as, a person on pain tumbles and tosses. 2. To roll down; to fall suddenly and violently; to be precipitated; as, to tumble from a scaffold.",
    "tumbling": "a. & vb. n. from Tumble, v. Tumbling barrel.",
    "turbine": "A water wheel, commonly horizontal, variously constructed, but usually having a series of curved floats or buckets, against which the water acts by its impulse or reaction in flowing either outward from a central chamber, inward from an external casing, or from above downward, etc.; -- also called turbine wheel.",
    "turbulent": "1. Disturbed; agitated; tumultuous; roused to violent commotion; as, the turbulent ocean.",
    "turf": "1. That upper stratum of earth and vegetable mold which is filled with the roots of grass and other small plants, so as to adhere and form a kind of mat; sward; sod.",
    "turkey": "An empire in the southeast of Europe and southwest of Asia.",
    "turmoil": "Harassing labor; trouble; molestation by tumult; disturbance; worrying confusion.",
    "turret": "1. (Arch.)  A little tower, frequently a merely ornamental structure at one of the angles of a larger structure. 2. (Anc.",
    "tutor": "One who guards, protects, watches over, or has the care of, some person or thing.",
    "tweak": "To pinch and pull with a sudden jerk and twist; to twitch; as, to tweak the nose.",
    "twelve": "One more that eleven; two and ten; twice six; a dozen.",
    "twenty": "1. One more that nineteen; twice; as, twenty men. 2. An indefinite number more or less that twenty.",
    "twice": "1. Two times; once and again.",
    "twiddle": "To touch lightly, or play with; to tweedle; to twirl; as, to twiddle one's thumbs; to twiddle a watch key.",
    "twig": "To twitch; to pull; to tweak.",
    "twilight": "1. The light perceived before the rising, and after the setting, of the sun, or when the sun is less than 18º below the horizon, occasioned by the illumination of the earth's atmosphere by the direct rays of the sun and their reflection on the earth. 2. faint light; a dubious or uncertain medium through which anything is viewed.",
    "twine": "1. A twist; a convolution.",
    "twirl": "To move or turn round rapidly; to whirl round; to move and turn rapidly with the fingers.",
    "twisted": "Contorted; crooked spirally; subjected to torsion; hence, perverted.",
    "twister": "1. One who twists; specifically, the person whose occupation is to twist or join the threads of one warp to those of another, in weaving. 2. The instrument used in twisting, or making twists.",
    "twisting": "a. & n. from Twist.",
    "twitch": "To pull with a sudden jerk; to pluck with a short, quick motion; to snatch; as, to twitch one by the sleeve; to twitch a thing out of another's hand; to twitch off clusters of grapes.",
    "tying": "p. pr. of Tie.",
    "udder": "1. (Anat.)  The glandular organ in which milk is secreted and stored; -- popularly called the bag in cows and other quadrupeds.",
    "ultimate": "1. Farthest; most remote in space or time; extreme; last; final.",
    "ultra": "Going beyond others, or beyond due limit; extreme; fanatical; uncompromising; as, an ultra reformer; ultra measures.",
    "umbilical": "1. (Anat.)  Of or pertaining to an umbilicus, or umbilical cord; umbilic. 2. Pertaining to the center; central.",
    "umbrella": "1. A shade, screen, or guard, carried in the hand for sheltering the person from the rays of the sun, or from rain or snow.",
    "umpire": "1. A person to whose sole decision a controversy or question between parties is referred; especially, one chosen to see that the rules of a game, as cricket, baseball, or the like, are strictly observed.",
    "unable": "Not able; not having sufficient strength, means, knowledge, skill, or the like; impotent' weak; helpless; incapable; -- now usually followed by an infinitive or an adverbial phrase; as, unable for work; unable to bear fatigue.",
    "unadvised": "1. Not prudent; not discreet; ill advised.",
    "unaware": "Not aware; not noticing; giving no heed; thoughtless; inattentive.",
    "unbend": "1. To free from flexure; to make, or allow to become, straight; to loosen; as, to unbend a bow. 2. A remit from a strain or from exertion; to set at ease for a time; to relax; as, to unbend the mind from study or care.",
    "unbiased": "Free from bias or prejudice; unprejudiced; impartial.",
    "unblessed": "Not blest; excluded from benediction; hence, accursed; wretched.",
    "unbounded": "Having no bound or limit; as, unbounded space; an, unbounded ambition.",
    "uncanny": "Not canny; unsafe; strange; weird; ghostly.",
    "uncertain": "1. Not certain; not having certain knowledge; not assured in mind; distrustful.",
    "unchain": "To free from chains or slavery; to let loose.",
    "uncivil": "1. Not civilized; savage; barbarous; uncivilized.",
    "uncle": "1. The brother of one's father or mother; also applied to an aunt's husband; -- the correlative of aunt in sex, and of nephew and niece in relationship. 2. A pawnbroker.",
    "uncloak": "To remove a cloak or cover from; to deprive of a cloak or cover; to unmask; to reveal.",
    "unclog": "To disencumber of a clog, or of difficulties and obstructions; to free from encumbrances; to set at liberty.",
    "unclothed": "1. Etym: [Properly p. p. of unclothe.]  Divested or stripped of clothing.",
    "uncommon": "Not common; unusual; infrequent; rare; hence, remarkable; strange; as, an uncommon season; an uncommon degree of cold or heat; uncommon courage.",
    "uncouple": "To loose, as dogs, from their couples; also, to set loose; to disconnect; to disjoin; as, to uncouple railroad cars.",
    "uncouth": "1. Unknown.",
    "uncover": "1. To take the cover from; to divest of covering; as, to uncover a box, bed, house, or the like; to uncover one's body. 2. To show openly; to disclose; to reveal.",
    "uncrown": "To deprive of a crown; to take the crown from; hence, to discrown; to dethrone.",
    "uncut": "1. Not cut; not separated or divided by cutting or otherwise; -- said especially of books, periodicals, and the like, when the leaves have not been separated by trimming in binding. 2. Not ground, or otherwise cut, into a certain shape; as, an uncut diamond.",
    "undated": "Rising and falling in waves toward the margin, as a leaf; waved.",
    "undaunted": "Not daunted; not subdued or depressed by fear.",
    "undercut": "The lower or under side of a sirloin of beef; the fillet.",
    "underfoot": "Under the feet; underneath; below.",
    "undergo": "1. To go or move below or under.",
    "underhand": "1. Secret; clandestine; hence, mean; unfair; fraudulent.",
    "underline": "1. To mark a line below, as words; to underscore. 2. To influence secretly.",
    "underling": "An inferior person or agent; a subordinate; hence, a mean, sorry fellow.",
    "undermine": "1. To excavate the earth beneath, or the part of, especially for the purpose of causing to fall or be overthrown; to form a mine under; to sap; as, to undermine a wall.",
    "undermost": "Lowest, as in place, rank, or condition.",
    "underrate": "To rate too low; to rate below the value; to undervalue.",
    "undertake": "1. To take upon one's self; to engage in; to enter upon; to take in hand; to begin to perform; to set about; to attempt.",
    "undivided": "1. Not divided; not separated or disunited; unbroken; whole; continuous; as, plains undivided by rivers or mountains. 2. Not set off, as a share in a firm; not made actually separate by division; as, a partner, owning one half in a firm, is said to own an undivided half so long as the business continues and his share is not set off to him. 3. Not directed or given to more than one object; as, undivided attention or affection.",
    "undoing": "1. The reversal of what has been done. 2. Ruin.",
    "undone": "p. p. of Undo.",
    "unearned": "Not earned; not gained by labor or service.",
    "unearth": "To drive or draw from the earth; hence, to uncover; to bring out from concealment; to bring to light; to disclose; as, to unearth a secret.",
    "unease": "Want of ease; uneasiness.",
    "uneasy": "1. Not easy; difficult.",
    "unequal": "1. Not equal; not matched; not of the same size, length, breadth, quantity, strength, talents, acquirements, age, station, or the like; as, the fingers are of unequal length; peers and commoners are unequal in rank. 2. Ill balanced or matched; disproportioned; hence, not equitable; partial; unjust; unfair.",
    "uneven": "1. Not even; not level; not uniform; rough; as, an uneven road or way; uneven ground. 2. Not equal; not of equal length.",
    "unfailing": "Not failing; not liable to fail; inexhaustible; certain; sure.",
    "unfair": "To deprive of fairness or beauty.",
    "unfeeling": "1. Destitute of feeling; void of sensibility; insensible; insensate. 2. Without kind feelings; cruel; hard-hearted.",
    "unfiled": "Not defiled; pure.",
    "unfold": "1. To open the folds of; to expand; to spread out; as, to unfold a tablecloth.",
    "unfounded": "1. Not founded; not built or established.",
    "unfreeze": "To thaw.",
    "unglue": "To separate, part, or open, as anything fastened with glue.",
    "ungodly": "1. Not godly; not having regard for God; disobedient to God; wicked; impious; sinful. 2. Polluted by sin or wickedness.",
    "unhappy": "1. Not happy or fortunate; unfortunate; unlucky; as, affairs have taken an unhappy turn. 2. In a degree miserable or wretched; not happy; sad; sorrowful; as, children render their parents unhappy by misconduct. 3. Marked by infelicity; evil; calamitous; as, an unhappy day.",
    "unheard": "1. Not heard; not perceived by the ear; as, words unheard by those present. 2. Not granted an audience or a hearing; not allowed to speak; not having made a defense, or stated one's side of a question; disregarded; unheeded; as, to condemunheard.",
    "unhinge": "1. To take from the hinges; as, to unhinge a door. 2. To displace; to unfix by violence.",
    "unholy": "Not holy; unhallowed; not consecrated; hence, profane; wicked; impious.",
    "unicorn": "1. A fabulous animal with one horn; the monoceros; -- often represented in heraldry as a supporter. 2. A two-horned animal of some unknown kind, so called in the Authorized Version of the Scriptures.",
    "uniformly": "In a uniform manner; without variation or diversity; by a regular, constant, or common ratio of change; with even tenor; as, a temper uniformly mild.",
    "unify": "To cause to be one; to make into a unit; to unite; to view as one.",
    "union": "1. The act of uniting or joining two or more things into one, or the state of being united or joined; junction; coalition; combination.",
    "unisexual": "Having one sex only, as plants which have the male and female flowers on separate individuals, or animals in which the sexes are in separate individuals; dioecious; -- distinguished from bisexual, or hermaphrodite.",
    "unison": "1. Harmony; agreement; concord; union. 2. (Mus.)  Identity in pitch; coincidence of sounds proceeding from an equality in the number of vibrations made in a given time by two or more sonorous bodies.",
    "unit": "1. A single thing or person. 2. (Arith.)  The least whole number; one.",
    "universal": "1. Of or pertaining to the universe; extending to, including, or affecting, the whole number, quantity, or space; unlimited; general; all-reaching; all-pervading; as, universal ruin; universal good; universal benevolence or benefice.",
    "universe": "All created things viewed as constituting one system or whole; the whole body of things, or of phenomena; the mundus of the Latins; the world; creation.",
    "unkempt": "1. Not combed; disheveled; as, an urchin with unkempt hair. 2. Fig.; Not smoothed; unpolished; rough.",
    "unkind": "Having no race or kindred; childless.",
    "unknown": "Not known; not apprehended.",
    "unlawful": "Not lawful; contrary to law.",
    "unlearned": "1. Not learned; untaught; uneducated; ignorant; illiterate. 2. Not gained by study; not known. 3. Not exhibiting learning; as, unlearned verses.",
    "unless": "Upon any less condition than (the fact or thing stated in the sentence or clause which follows); if not; supposing that not; if it be not; were it not that; except; as, we shall fail unless we are industrious.",
    "unlimited": "1. Not limited; having no bounds; boundless; as, an unlimited expanse of ocean. 2. Undefined; indefinite; not bounded by proper exceptions; as, unlimited terms.",
    "unlisted": "Not listed; specif.",
    "unlovely": "Not lovely; not amiable; possessing qualities that excite dislike; disagreeable; displeasing; unpleasant.",
    "unlucky": "1. Not lucky; not successful; unfortunate; ill-fated; unhappy; as, an unlucky man; an unlucky adventure; an unlucky throw of dice; an unlucky game.",
    "unmade": "1. Etym: [Pref. un- not + made.]  Not yet made or formed; as, an unmade grave.",
    "unmanned": "1. Etym: [Properly p. p. of unman.]  Deprived of manly qualities; deficient in vigor, strength, courage, etc.; weak; effeminate. 2. Etym: [Pref. un- not + man + -ed.] (Falconry)  Not tamed; not made familiar with, or subject to, man; -- also used figuratively.",
    "unmoral": "Having no moral perception, quality, or relation; involving no idea of morality; -- distinguished from both moral and immoral.",
    "unmovable": "Immovable.",
    "unmoved": "Not moved; fixed; firm; unshaken; calm; apathetic.",
    "unnatural": "Not natural; contrary, or not conforming, to the order of nature; being without natural traits; as, unnatural crimes.",
    "unnerve": "To deprive of nerve, force, or strength; to weaken; to enfeeble; as, to unnerve the arm.",
    "unpack": "1. To separate and remove, as things packed; to open and remove the contents of; as, to unpack a trunk. 2. To relieve of a pack or burden.",
    "unpaired": "Not paired; not suited or matched.",
    "unpaved": "1. Not paved; not furnished with a pavement.",
    "unpeeled": "1. Etym: [1st pref. un- (intensive) + peel.]  Thoroughly stripped; pillaged.",
    "unpicked": "Picked out; picked open. 2. Etym: [Pref. un- not + picked.]  Not picked.",

  function startup() {
    game.canvas = new engine.Canvas(
      "game", null, new engine.Dimension(game.GAME_W, game.GAME_H)
    );
    game.canvas.eventGameLoop = game.loop;
    game.canvas.eventKeyDown = game.keypress;

    game.init();
    game.canvas.start();
    game.canvas.focus();

    // resize the existing canvas rather than building a new one, which would
    // leave the previous render loop and its listeners alive
    window.addEventListener("resize", function () {
      game.resize();
    });
  }
