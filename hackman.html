    "idiom": "1. The syntactical or structural form peculiar to any language; the genius or cast of a language.",
    "ignition": "1. The act of igniting, kindling, or setting on fire. 2. The state of being ignited or kindled.",
    "ignore": "1. To be ignorant of or not acquainted with.",
    "iguana": "Any species of the genus Iguana, a genus of large American lizards of the family Iguanidæ. They are arboreal in their habits, usually green in color, and feed chiefly upon fruits.",
    "illusion": "1. An unreal image presented to the bodily or mental vision; a deceptive appearance; a false show; mockery; hallucination.",
    "illusive": "Deceiving by false show; deceitful; deceptive; false; illusory; unreal.",
    "image": "1. An imitation, representation, or similitude of any person, thing, or act, sculptured, drawn, painted, or otherwise made perceptible to the sight; a visible presentation; a copy; a likeness; an effigy; a picture; a semblance.",
    "imaginary": "Existing only in imagination or fancy; not real; fancied; visionary; ideal.",
    "imbecile": "Destitute of strength, whether of body or mind; feeble; impotent; esp., mentally wea; feeble-minded; as, hospitals for the imbecile and insane.",
    "imitate": "1. To follow as a pattern, model, or example; to copy or strive to copy, in acts, manners etc.",
    "imitation": "1. The act of imitating.",
    "immature": "1. Not mature; unripe; not arrived at perfection of full development; crude; unfinished; as, immature fruit; immature character; immature plans.",
    "immerse": "Immersed; buried; hid; sunk.",
    "immersion": "1. The act of immersing, or the state of being immersed; a sinking within a fluid; a dipping; as, the immersion of Achilles in the Styx. 2. Submersion in water for the purpose of Christian baptism, as, practiced by the Baptists. 3. The state of being overhelmed or deeply absorbed; deep engagedness.",
    "imminent": "1. Threatening to occur immediately; near at hand; impending; -- said especially of misfortune or peril.",
    "immobile": "Incapable of being moved; immovable; fixed; stable.",
    "immodest": "1. Not limited to due bounds; immoderate. 2. Not modest; wanting in the reserve or restraint which decorum and decency require; indecent; indelicate; obscene; lewd; as, immodest persons, behavior, words, pictures, etc.",
    "immortal": "1. Not mortal; exempt from liability to die; undying; imperishable; lasting forever; having unlimited, or eternal, existance.",
    "immovable": "1. Incapable of being moved; firmly fixed; fast; -- used of material things; as, an immovable foundatin.",
    "impale": "1. To pierce with a pale; to put to death by fixing on a sharp stake.",
    "impart": "1. To bestow a share or portion of; to give, grant, or communicate; to allow another to partake in; as, to impart food to the poor; the sun imparts warmth.",
    "impatient": "1. Not patient; not bearing with composure; intolerant; uneasy; fretful; restless, because of pain, delay, or opposition; eager for change, or for something expected; hasty; passionate; -- often followed by at, for, of, and under.",
    "impeach": "1. To hinder; to impede; to prevent.",
    "impending": "Hanging over; overhanging; suspended so as to menace; imminet; threatening.",
    "imperfect": "1. Not perfect; not complete in all its parts; wanting a part; deective; deficient.",
    "imperial": "1. Of or pertaining to an empire, or to an emperor; as, an imperial government; imperial authority or edict.",
    "implant": "To plant, or infix, for the purpose of growth; to fix deeply; to instill; to inculate; to introduce; as, to implant the seeds of virtue, or the principles of knowledge, in the minds of youth.",
    "implement": "That which fulfills or supplies a want or use; esp., an instrument, toll, or utensil, as supplying a requisite to an end; as, the implements of trade, of husbandry, or of war.",
    "implicate": "1. To infold; to fold together; to interweave.",
    "implicit": "1. Infolded; entangled; complicated; involved.",
    "implosion": "1. A burstion inwards, as of a vessel from which the air has been exhausted; -- contrasted with explosion. 2. (Phon.)  A sudden compression of the air in the mouth, simultaneously with and affecting the sound made by the closure of the organs in uttering p, t, or k, at the end of a syllable (see Guide to Pronunciation, §§159, 189); also, a similar compression made by an upward thrust of the larynx without any accompanying explosive action, as in the peculiar sound of b, d, and g, heard in Southern Germany.",
    "implosive": "Formed by implosion. -- n.  An implosive sound, an implodent.",
    "imply": "1. To infold or involve; to wrap up.",
    "impolite": "Not polite; not of polished manners; wanting in good manners; discourteous; uncivil; rude.",
    "important": "1. Full of, or burdened by, import; charged with great interests; restless; anxious.",
    "impose": "1. To lay on; to set or place; to put; to deposit.",
    "imposing": "1. Laying as a duty; enjoining. 2. Adapted to impress forcibly; impressive; commanding; as, an imposing air; an imposing spectacle.",
    "impotence": "1. The quality or condition of being impotent; want of strength or power, animal, intellectual, or moral; weakness; feebleness; inability; imbecility.",
    "impotency": "1. The quality or condition of being impotent; want of strength or power, animal, intellectual, or moral; weakness; feebleness; inability; imbecility.",
    "impotent": "1. Not potent; wanting power, strength. or vigor. whether physical, intellectual, or moral; deficient in capacity; destitute of force; weak; feeble; infirm.",
    "impound": "To shut up or place in an inclosure called a pound; hence, to hold in the custody of a court; as, to impound stray cattle; to impound a document for safe keeping.",
    "imprint": "1. To impress; to mark by pressure; to indent; to stamp.",
    "imprison": "1. To put in prison or jail; To arrest and detain in custody; to confine.",
    "improper": "1. Not proper; not suitable; not fitted to the circumstances, design, or end; unfit; not becoming; incongruous; inappropriate; indecent; as, an improper medicine; improper thought, behavior, language, dress.",
    "improve": "1. To disprove or make void; to refute.",
    "improving": "Tending to improve, beneficial; growing better.",
    "improvise": "1. To compose, recite, or sing extemporaneously, especially in verse; to extemporize; also, to play upon an instrument, or to act, extemporaneously. 2. To bring about, arrange, or make, on a sudden, or without previous preparation.",
    "imprudent": "Not prudent; wanting in prudence or discretion; indiscreet; injudicious; not attentive to consequence; improper.",
    "impulse": "1. The act of impelling, or driving onward with sudden force; impulsion; especially, force so communicated as to produced motion suddenly, or immediately.",
    "impulsive": "1. Having the power of driving or impelling; giving an impulse; moving; impellent.",
    "impure": "1. Not pure; not clean; dirty; foul; filthy; containing something which is unclean or unwholesome; mixed or impregnated extraneous substances; adulterated; as, impure water or air; impure drugs, food, etc. 2. Defiled by sin or guilt; unholy; unhallowed; -- said of persons or things. 3. Unchaste; lewd; unclean; obscene; as, impure language or ideas.",
    "impurity": "1. The condition or quality of being impure in any sense; defilement; foulness; adulteration.",
    "iodine": "A nonmetallic element, of the halogen group, occurring always in combination, as in the iodides.",
    "iodize": "To treat or impregnate with iodine or its compounds; as, to iodize a plate for photography.",
    "ion": "One of the elements which appear at the respective poles when a body is subjected to electro-chemical decomposition.",
    "irate": "Angry; incensed; enraged.",
    "irk": "To weary; to give pain; to annoy; -- used only impersonally at present.",
    "iron": "1. (Chem.)  The most common and most useful metallic element, being of almost universal occurrence, usually in the form of an oxide (as hematite, magnetite, etc.), or a hydrous oxide (as limonite, turgite, etc.). It is reduced on an enormous scale in three principal forms; viz., cast iron, steel, and wrought iron.",
    "irregular": "Not regular; not conforming to a law, method, or usage recognized as the general rule; not according to common form; not conformable to nature, to the rules of moral rectitude, or to established principles; not normal; unnatural; immethodical; unsymmetrical; erratic; no straight; not uniform; as, an irregular line; an irregular figure; an irregular verse; an irregular physician; an irregular proceeding; irregular motion; irregular conduct, etc.",
    "irritable": "1. Capable of being irriated. 2. Very susceptible of anger or passion; easily inflamed or exasperated; as, an irritable temper.",
    "irritant": "Rendering null and void; conditionally invalidating.",
    "irritate": "To render null and void.",
    "isolated": "Placed or standing alone; detached; separated from others.",
    "isolation": "The act of isolating, or the state of being isolated; insulation; separation; loneliness.",
    "issue": "1. The act of passing or flowing out; a moving out from any inclosed place; egress; as, the issue of water from a pipe, of blood from a wound, of air from a bellows, of people from a house. 2. The act of sending out, or causing to go forth; delivery; issuance; as, the issue of an order from a commanding officer; the issue of money from a treasury. 3. That which passes, flows, or is sent out; the whole quantity sent forth or emitted at one time; as, an issue of bank notes; the daily issue of a newspaper. 4. Progeny; a child or children; offspring.",
    "itinerary": "Itinerant; traveling; passing from place to place; done on a journey.",
    "ivory": "1. The hard, white, opaque, fine-grained substance constituting the tusks of the elephant.",
    "ivy": "A plant of the genus Hedera (H. helix), common in Europe.",
    "jab": "To thrust; to stab; to punch.",
    "jackal": "1. (Zoöl.)  Any one of several species of carnivorous animals inhabiting Africa and Asia, related to the dog and wolf.",
    "jacket": "1. A short upper garment, extending downward to the hips; a short coat without skirts. 2. An outer covering for anything, esp. a covering of some nonconducting material such as wood or felt, used to prevent radiation of heat, as from a steam boiler, cylinder, pipe, etc. 3. (Mil.)  In ordnance, a strengthening band surrounding and reënforcing the tube in which the charge is fired. 4. A garment resembling a waistcoat lined with cork, to serve as a life preserver; -- called also cork jacket.",
    "jackknife": "A large, strong clasp knife for the pocket; a pocket knife.",
    "jailer": "The keeper of a jail or prison.",
    "jam": "A kind of frock for children.",
    "january": "The first month of the year, containing thirty-one days.",
    "jargon": "Confused, unintelligible language; gibberish; hence, an artificial idiom or dialect; cant language; slang.",
    "jarring": "Shaking; disturbing; discordant.",
    "jasmine": "A shrubby plant of the genus Jasminum, bearing flowers of a peculiarly fragrant odor.",
    "jaundice": "A morbid condition, characterized by yellowness of the eyes, skin, and urine, whiteness of the fæces, constipation, uneasiness in the region of the stomach, loss of appetite, and general languor and lassitude.",
    "jaunt": "1. To ramble here and there; to stroll; to make an excursion. 2. To ride on a jaunting car.",
    "java": "1. One of the islands of the Malay Archipelago belonging to the Netherlands. 2. Java coffee, a kind of coffee brought from Java.",
    "jawed": "Having jaws; -- chiefly in composition; as, lantern-jawed.",
    "jelly": "1. Anything brought to a gelatinous condition; a viscous, translucent substance in a condition between liquid and solid; a stiffened solution of gelatin, gum, or the like. 2. The juice of fruits or meats boiled with sugar to an elastic consistence; as, currant jelly; calf's-foot jelly.",
    "jersey": "1. The finest of wool separated from the rest; combed wool; also, fine yarn of wool. 2. A kind of knitted jacket; hence, in general, a closefitting jacket or upper garment made of an elastic fabric (as stockinet). 3. One of a breed of cattle in the Island of Jersey.",
    "jester": "1. A buffoon; a merry-andrew; a court fool.",
    "jet": "Same as 2d Get.",
    "jiffy": "A moment; an instant; as, I will be ready in a jiffy.",
    "jimmy": "A short crowbar used by burglars in breaking open doors.",
    "jingle": "1. To sound with a fine, sharp, rattling, clinking, or tinkling sound; as, sleigh bells jingle.",
    "jingling": "The act or process of producing a jingle; also, the sound itself; a chink.",
    "jinx": "A person, object, influence, or supernatural being which is supposed to bring bad luck or to cause things to go wrong.",
    "job": "1. A sudden thrust or stab; a jab. 2. A piece of chance or occasional work; any definite work undertaken in gross for a fixed price; as, he did the job for a thousand dollars. 3. A public transaction done for private profit; something performed ostensibly as a part of official duty, but really for private gain; a corrupt official business. 4. Any affair or event which affects one, whether fortunately or unfortunately.",
    "jockey": "1. A professional rider of horses in races.",
    "jogger": "One who jogs.",
    "john": "A proper name of a man.",
    "jolliness": "Jollity; noisy mirth.",
    "jolly": "1. Full of life and mirth; jovial; joyous; merry; mirthful.",
    "jolt": "To shake with short, abrupt risings and fallings, as a carriage moving on rough ground; as, the coach jolts.",
    "jot": "An iota; a point; a tittle; the smallest particle.",
    "jovial": "1. Of or pertaining to the god, or the planet, Jupiter.",
    "joyous": "Glad; gay; merry; joyful; also, affording or inspiring joy; with of before the word or words expressing the cause of joy.",
    "jubilant": "Uttering songs of triumph; shouting with joy; triumphant; exulting.",
    "judge": "1. (Law)  A public officer who is invested with authority to hear and determine litigated causes, and to administer justice between parties in courts held for that purpose.",
    "judicial": "1. Pertaining or appropriate to courts of justice, or to a judge; practiced or conformed to in the administration of justice; sanctioned or ordered by a court; as, judicial power; judicial proceedings; a judicial sale.",
    "judiciary": "Of or pertaining to courts of judicature, or legal tribunals; judicial; as, a judiciary proceeding.",
    "juggle": "1. To play tricks by sleight of hand; to cause amusement and sport by tricks of skill; to conjure. 2. To practice artifice or imposture.",

    "juicy": "A bounding with juice; succulent.",

    "july": "The seventh month of the year, containing thirty-one days.",

    "jump": "(a) A kind of loose jacket for men. (b) pl.",
    "junction": "1. The act of joining, or the state of being joined; union; combination; coalition; as, the junction of two armies or detachments; the junction of paths. 2. The place or point of union, meeting, or junction; specifically, the place where two or more lines of railway meet or cross.",
    "juncture": "1. A joining; a union; an alliance.",
    "june": "The sixth month of the year, containing thirty days.",
    "junior": "1. Less advanced in age than another; younger.",
    "juniper": "Any evergreen shrub or tree, of the genus Juniperus and order Coniferæ. Note: The common juniper (J. communis) is a shrub of a low, spreading form, having awl-shaped, rigid leaves in whorls of threes, and bearing small purplish blue berries (or galbuli), of a warm, pungent taste, used as diuretic and in flavoring gin.",
    "jurist": "One who professes the science of law; one versed in the law, especially in the civil law; a writer on civil and international law.",
    "juror": "1. (Law)  A member of a jury; a juryman.",
    "jury": "For temporary use; -- applied to a temporary contrivance.",
    "justice": "1. The quality of being just; conformity to the principles of righteousness and rectitude in all things; strict performance of moral obligations; practical conformity to human or divine law; integrity in the dealings of men with each other; rectitude; equity; uprightness.",
    "justifier": "One who justifies; one who vindicates, supports, defends, or absolves.",
    "justify": "1. To prove or show to be just; to vindicate; to maintain or defend as conformable to law, right, justice, propriety, or duty.",
    "justly": "In a just manner; in conformity to law, justice, or propriety; by right; honestly; fairly; accurately.",
    "justness": "The quality of being just; conformity to truth, propriety, accuracy, exactness, and the like; justice; reasonableness; fairness; equity; as, justness of proportions; the justness of a description or representation; the justness of a cause.",
    "juvenile": "1. Young; youthful; as, a juvenile appearance.",
    "kangaroo": "Any one of numerous species of jumping marsupials of the family Macropodidæ. They inhabit Australia, New Guinea, and adjacent islands, They have long and strong hind legs and a large tail, while the fore legs are comparatively short and feeble.",
    "karma": "One's acts considered as fixing one's lot in the future existence.",

    "kelp": "1. The calcined ashes of seaweed, -- formerly much used in the manufacture of glass, now used in the manufacture of iodine. 2. (Bot.)  Any large blackish seaweed.",
    "kennel": "The water course of a street; a little canal or channel; a gutter; also, a puddle.",
    "kept": "of Keep.",
    "kerchief": "1. A square of fine linen worn by women as a covering for the head; hence, anything similar in form or material, worn for ornament on other parts of the person; -- mostly used in compounds; as, neckerchief; breastkerchief; and later, handkerchief.",
    "kerosene": "An oil used for illuminating purposes, formerly obtained from the distillation of mineral wax, bituminous shale, etc., and hence called also coal oil.",
    "kettle": "A metallic vessel, with a wide mouth, often without a cover, used for heating and boiling water or other liguids.",
    "kick": "To strike, thrust, or hit violently with the foot; as, a horse kicks a groom; a man kicks a dog.",
    "kilometer": "A measure of length, being a thousand meters.",
    "kilt": "p. p. from Kill.",
    "kindle": "To bring forth young.",

    "kindred": "1. Relationship by birth or marriage; consanguinity; affinity; kin.",
    "kinetic": "Moving or causing motion; motory; active, as opposed to latent.",

    "kitchen": "1. A cookroom; the room of a house appropriated to cookery.",
    "kite": "1. (Zoöl.)  Any raptorial bird of the subfamily Milvinæ, of which many species are known.",

    "kitty": "1. A kitten; also, a pet name or calling name for the cat. 2.  [Etym. uncertain.] (Gaming) The percentage taken out of a pool to pay for refreshments, or for the expenses of the table.",
    "knapsack": "A case of canvas or leather, for carrying on the back a soldier's necessaries, or the clothing, etc., of a traveler.",
    "knee": "1. In man, the joint in the middle part of the leg. 2. (Anat.) (a) The joint, or region of the joint, between the thigh and leg. (b) In the horse and allied animals, the carpal joint, corresponding to the wrist in man. 3. (Mech.",
    "knoll": "A little round hill; a mound; a small elevation of earth; the top or crown of a hill.",

    "krypton": "An inert gaseous element of the argon group, occurring in air to the extent of about one volume in a million.",

    "ladder": "1. A frame usually portable, of wood, metal, or rope, for ascent and descent, consisting of two side pieces to which are fastened cross strips or rounds forming steps.",
    "ladle": "1. A cuplike spoon, often of large size, with a long handle, used in lading or dipping.",
    "ladylike": "1. Like a lady in appearance or manners; well-bred.",
    "lagoon": "1. A shallow sound, channel, pond, or lake, especially one into which the sea flows; as, the lagoons of Venice. 2. A lake in a coral island, often occupying a large portion of its area, and usually communicating with the sea.",
    "lair": "1. A place in which to lie or rest; especially, the bed or couch of a wild beast. 2. A burying place.",
    "lake": "A pigment formed by combining some coloring matter, usually by precipitation, with a metallic oxide or earth, esp. with aluminium hydrate; as, madder lake; Florentine lake; yellow lake, etc.",
    "lance": "1. A weapon of war, consisting of a long shaft or handle and a steel blade or head; a spear carried by horsemen, and often decorated with a small flag; also, a spear or harpoon used by whalers and fishermen.",
    "landed": "1. Having an estate in land.",
    "landfall": "1. A sudden transference of property in land by the death of its owner. 2. (Naut.)  Sighting or making land when at sea.",
    "landing": "Of, pertaining to or used for, setting, bringing, or going, on shore.",
    "landlord": "1. The lord of a manor, or of land; the owner of land or houses which he leases to a tenant or tenants. 2. The master of an inn or of a lodging house.",
    "landmark": "1. A mark to designate the boundary of land; any , mark or fixed object (as a marked tree, a stone, a ditch, or a heap of stones) by which the limits of a farm, a town, or other portion of territory may be known and preserved. 2. Any conspicuous object on land that serves as a guide; some prominent object, as a hill or steeple.",
    "landscape": "1. A portion of land or territory which the eye can comprehend in a single view, including all the objects it contains. 2. A picture representing a scene by land or sea, actual or fancied, the chief subject being the general aspect of nature, as fields, hills, forests, water. etc. 3. The pictorial aspect of a country.",
    "language": "1. Any means of conveying or communicating ideas; specifically, human speech; the expression of ideas by the voice; sounds, expressive of thought, articulated by the organs of the throat and mouth.",
    "lanky": "Somewhat lank.",
    "lantern": "1. Something inclosing a light, and protecting it from wind, rain, etc. ; -- sometimes portable, as a closed vessel or case of horn, perforated tin, glass, oiled paper, or other material, having a lamp or candle within; sometimes fixed, as the glazed inclosure of a street light, or of a lighthouse light. 2. (Arch.) (a) An open structure of light material set upon a roof, to give light and air to the interior. (b) A cage or open chamber of rich architecture, open below into the building or tower which it crowns. (c) A smaller and secondary cupola crowning a larger one, for ornament, or to admit light; such as the lantern of the cupola of the Capitol at Washington, or that of the Florence cathedral. 3. (Mach.)  A lantern pinion or trundle wheel.",
    "lapel": "That part of a garment which is turned back; specifically, the lap, or fold, of the front of a coat in continuation of collar.",
    "lapping": "A kind of machine blanket or wrapping material used by calico printers.",
    "lard": "1. Bacon; the flesh of swine.",
    "large": "1. Exceeding most other things of like in bulk, capacity, quantity, superficial dimensions, or number of constituent units; big; great; capacious; extensive; -- opposed to small; as, a nlarge horse; a large house or room; a large lake or pool; a large jug or spoon; a large vineyard; a large army; a large city.",
    "lark": "A frolic; a jolly time.",
    "lash": "1. The thong or braided cord of a whip, with which the blow is given.",
    "lasso": "A rope or long thong of leather with, a running noose, used for catching horses, cattle, etc.",
    "last": "of Last, to endure, contracted from lasteth.",
    "latch": "To smear; to anoint.",
    "lather": "1. Foam or froth made by soap moistened with water. 2. Foam from profuse sweating, as of a horse.",
    "latitude": "1. Extent from side to side, or distance sidewise from a given point or line; breadth; width.",
    "latter": "1. Later; more recent; coming or happening after something else; -- opposed to former; as, the former and latter rain. 2. Of two things, the one mentioned second.",

    "laurel": "1. (Bot.)  An evergreen shrub, of the genus Laurus (L. nobilis), having aromatic leaves of a lanceolate shape, with clusters of small, yellowish white flowers in their axils; -- called also sweet bay.",

    "left": "of Leave.",
    "legacy": "1. A gift of property by will, esp. of money or personal property; a bequest.",
    "legal": "1. Created by, permitted by, in conformity with, or relating to, law; as, a legal obligation; a legal standard or test; a legal procedure; a legal claim; a legal trade; anything is legal which the laws do not forbid. 2. (Theol.) (a) According to the law of works, as distinguished from free grace; or resting on works for salvation. (b) According to the old or Mosaic dispensation; in accordance with the law of Moses 3. (Law)  Governed by the rules of law as distinguished from the rules of equity; as, legal estate; legal assets.",
    "legend": "1. That which is appointed to be read; especially, a chronicle or register of the lives of saints, formerly read at matins, and in the refectories of religious houses. 2. A story respecting saints; especially, one of a marvelous nature.",
    "legible": "1. Capable of being read or deciphered; distinct to the eye; plain; - - used of writing or printing; as, a fair, legible manuscript.",
    "legislate": "To make or enact a law or laws.",
    "legume": "1. (Bot.)  A pod dehiscent into two pieces or valves, and having the seed attached at one suture, as that of the pea.",
    "lemon": "1. (Bot.)  An oval or roundish fruit resembling the orange, and containing a pulp usually intensely acid.",
    "lend": "1. To allow the custody and use of, on condition of the return of the same; to grant the temporary use of; as, to lend a book; -- opposed to borrow.",
    "length": "1. The longest, or longer, dimension of any object, in distinction from breadth or width; extent of anything from end to end; the longest line which can be drawn through a body, parallel to its sides; as, the length of a church, or of a ship; the length of a rope or line. 2. A portion of space or of time considered as measured by its length; -- often in the plural.",
    "lens": "A piece of glass, or other transparent substance, ground with two opposite regular surfaces, either both curved, or one curved and the other plane, and commonly used, either singly or combined, in optical instruments, for changing the direction of rays of light, and thus magnifying objects, or otherwise modifying vision.",
    "lent": "imp. & p. p. of Lend.",
    "lesser": "Less; smaller; inferior.",
    "lethargic": "Pertaining to, affected with, or resembling, lethargy; morbidly drowsy; dull; heavy.",
    "lethargy": "1. Morbid drowsiness; continued or profound sleep, from which a person can scarcely be awaked. 2. A state of inaction or indifference.",
    "letter": "One who lets or permits; one who lets anything for hire.",
    "lettuce": "A composite plant of the genus Lactuca (L. sativa), the leaves of which are used as salad.",
    "level": "1. A line or surface to which, at every point, a vertical or plumb line is perpendicular; a line or surface which is everywhere parallel to the surface of still water; -- this is the true level, and is a curve or surface in which all points are equally distant from the center of the earth, or rather would be so if the earth were an exact sphere. 2. A horizontal line or plane; that is, a straight line or a plane which is tangent to a true level at a given point and hence parallel to the horizon at that point; -- this is the apparent level at the given point. 3. An approximately horizontal line or surface at a certain degree of altitude, or distance from the center of the earth; as, to climb from the level of the coast to the l of the plateau and then descent to the level of the valley or of the sea.",
    "leverage": "The action of a lever; mechanical advantage gained by the lever.",
    "levitate": "To rise, or tend to rise, as if lighter than the surrounding medium; to become buoyant; -- opposed to gravitate.",
    "liability": "1. The state of being liable; as, the liability of an insurer; liability to accidents; liability to the law. 2. That which one is under obligation to pay, or for which one is liable.",
    "liable": "1. Bound or obliged in law or equity; responsible; answerable; as, the surety is liable for the debt of his principal. 2. Exposed to a certain contingency or casualty, more or less probable; -- with to and an infinitive or noun; as, liable to slip; liable to accident.",
    "liberty": "1. The state of a free person; exemption from subjection to the will of another claiming ownership of the person or services; freedom; -- opposed to slavery, serfdom, bondage, or subjection.",
    "librarian": "1. One who has the care or charge of a library. 2. One who copies manuscript books.",
    "library": "1. A considerable collection of books kept for use, and not as merchandise; as, a private library; a public library. 2. A building or apartment appropriated for holding such a collection of books.",
    "licking": "1. A lapping with the tongue. 2. A flogging or castigation.",
    "licorice": "1. (Bot.)  A plant of the genus Glycyrrhiza (G. glabra), the root of which abounds with a juice, and is much used in demulcent compositions. 2. The inspissated juice of licorice root, used as a confection and medicinal purposes.",
    "lid": "1. That which covers the opening of a vessel or box, etc. ; a movable cover; as, the lid of a chest or trunk. 2. The cover of the eye; an eyelid.",
    "life": "1. The state of being which begins with generation, birth, or germination, and ends with death; also, the time during which this state continues; that state of an animal or plant in which all or any of its organs are capable of performing all or any of their functions; -- used of all animal and vegetable organisms. 2. Of human being: The union of the soul and body; also, the duration of their union; sometimes, the deathless quality or existence of the soul; as, man is a creature having an immortal life.",
    "lifting": "Used in, or for, or by, lifting.",
    "ligament": "1. Anything that ties or unites one thing or part to another; a bandage; a bond.",
    "likely": "1. Worthy of belief; probable; credible; as, a likely story.",
    "likeness": "1. The state or quality of being like; similitude; resemblance; similarity; as, the likeness of the one to the other is remarkable. 2. Appearance or form; guise.",
    "likewise": "In like manner; also; moreover; too.",
    "liking": "Looking; appearing; as, better or worse liking.",
    "lilac": "1. (Bot.)  A shrub of the genus Syringa.",
    "lily": "1. (Bot.)  A plant and flower of the genus Lilium, endogenous bulbous plants, having a regular perianth of six colored pieces, six stamens, and a superior three-celled ovary.",
    "limb": "1. A part of a tree which extends from the trunk and separates into branches and twigs; a large branch. 2. An arm or a leg of a human being; a leg, arm, or wing of an animal.",
    "limelight": "That part of the stage upon which the limelight as cast, usually where the most important action is progressing or where the leading player or players are placed and upon which the attention of the spectators is therefore concentrated.",
    "limit": "1. That which terminates, circumscribes, restrains, or confines; the bound, border, or edge; the utmost extent; as, the limit of a walk, of a town, of a country; the limits of human knowledge or endeavor.",
    "line": "1. Flax; linen.",
    "lingo": "Language; speech; dialect.",
    "linguist": "1. A master of the use of language; a talker.",
    "lining": "1. The act of one who lines; the act or process of making lines, or of inserting a lining. 2. That which covers the inner surface of anything, as of a garment or a box; also, the contents of anything.",
    "linoleum": "1. Linseed oil brought to various degrees of hardness by some oxidizing process, as by exposure to heated air, or by treatment with chloride of sulphur.",
    "linseed": "The seeds of flax, from which linseed oil is obtained.",
    "lint": "1. Flax. 2. Linen scraped or otherwise made into a soft, downy or fleecy substance for dressing wounds and sores; also, fine ravelings, down, fluff, or loose short fibers from yarn or fabrics.",
    "lion": "1. (Zoöl.)  A large carnivorous feline mammal (Felis leo), found in Southern Asia and in most parts of Africa, distinct varieties occurring in the different countries.",
    "lip": "1. One of the two fleshy folds which surround the orifice of the mouth in man and many other animals.",
    "liquefy": "To convert from a solid form to that of a liquid; to melt; to dissolve; and technically, to melt by the sole agency of heat.",
    "liqueur": "An aromatic alcoholic cordial.",
    "liquid": "1. Flowing freely like water; fluid; not solid.",
    "lisp": "1. To pronounce the sibilant letter s imperfectly; to give s and z the sound of th; -- a defect common among children. 2. To speak with imperfect articulation; to mispronounce, as a child learning to talk.",
    "list": "A line inclosing or forming the extremity of a piece of ground, or field of combat; hence, in the plural (lists), the ground or field inclosed for a race or combat.",
    "litigate": "To make the subject of a lawsuit; to contest in law; to prosecute or defend by pleadings, exhibition of evidence, and judicial debate in a court; as, to litigate a cause.",
    "litmus": "A dyestuff extracted from certain lichens (Roccella tinctoria, Lecanora tartarea, etc.), as a blue amorphous mass which consists of a compound of the alkaline carbonates with certain coloring matters related to orcin and orcein.",
    "litter": "1. A bed or stretcher so arranged that a person, esp. a sick or wounded person, may be easily carried in or upon it.",
    "little": "1. Small in size or extent; not big; diminutive; -- opposed to big or large; as, a little body; a little animal; a little piece of ground; a little hill; a little distance; a little child.",
    "livable": "1. Such as can be lived. 2. Such as in pleasant to live in; fit or suitable to live in.",
    "lively": "1. Endowed with or manifesting life; living.",
    "liver": "1. One who, or that which, lives.",
    "living": "1. Being alive; having life; as, a living creature. 2. Active; lively; vigorous; -- said esp. of states of the mind , and sometimes of abstract things; as, a living faith; a living principle.",
    "lizard": "1. (Zoöl.)  Any one of the numerous species of reptiles belonging to the order Lacertilia; sometimes, also applied to reptiles of other orders, as the Hatteria.",
    "lubricant": "Lubricating.",
    "lubricate": "1. To make smooth or slippery; as, mucilaginous and saponaceous remedies lubricate the parts to which they are applied.",
    "lucid": "1. Shining; bright; resplendent; as, the lucid orbs of heaven.",
    "luckiness": "1. The state or quality of being lucky; as, the luckiness of a man or of an event. 2. Good fortune; favorable issue or event.",
    "luckless": "Being without luck; unpropitious; unfortunate; unlucky; meeting with ill success or bad fortune; as, a luckless gamester; a luckless maid.",
    "lucrative": "1. Yielding lucre; gainful; profitable; making increase of money or goods; as, a lucrative business or office.",
    "ludicrous": "Adapted to excite laughter, without scorn or contempt; sportive.",
    "lukewarm": "Moderately warm; neither cold nor hot; tepid; not ardent; not zealous; cool; indifferent.",
    "lullaby": "1. A song to quiet babes or lull them to sleep; that which quiets.",
    "lumber": "1. A pawnbroker's shop, or room for storing articles put in pawn; hence, a pledge, or pawn.",
    "luminous": "1. Shining; emitting or reflecting light; brilliant; bright; as, the is a luminous body; a luminous color.",
    "lumping": "Bulky; heavy.",
    "lumpish": "Like a lump; inert; gross; heavy; dull; spiritless.",
    "lunacy": "1. Insanity or madness; properly, the kind of insanity which is broken by intervals of reason, -- formerly supposed to be influenced by the changes of the moon; any form of unsoundness of mind, except idiocy; mental derangement or alienation.",
    "lunar": "1. Of or pertaining to the moon; as, lunar observations. 2. Resembling the moon; orbed.",
    "luncheon": "1. A lump of food.",
    "lung": "An organ for aërial respiration; -- commonly in the plural.",
    "lurch": "To swallow or eat greedily; to devour; hence, to swallow up.",
    "lure": "1. A contrivance somewhat resembling a bird, and often baited with raw meat; -- used by falconers in recalling hawks.",
    "lurk": "1. To lie hid; to lie in wait.",
    "luster": "One who lusts.",
    "lustrous": "Bright; shining; luminous.",
    "lusty": "1. Exhibiting lust or vigor; stout; strong; vigorous; robust; healthful; able of body.",
    "luxurious": "Of or pertaining to luxury; ministering to luxury; supplied with the conditions of luxury; as, a luxurious life; a luxurious table; luxurious ease.",
    "luxury": "1. A free indulgence in costly food, dress, furniture, or anything expensive which gratifies the appetites or tastes.",
    "lyricism": "A lyric composition.",
    "macaroni": "1. Long slender tubes made of a paste chiefly of wheat flour, and used as an article of food; Italian or Genoese paste.",
    "macaw": "Any parrot of the genus Sittace, or Macrocercus.",
    "mace": "A money of account in China equal to one tenth of a tael; also, a weight of 57.98 grains.",
    "machine": "1. In general, any combination of bodies so connected that their relative motions are constrained, and by means of which force and motion may be transmitted and modified, as a screw and its nut, or a lever arranged to turn about a fulcrum or a pulley about its pivot, etc.; especially, a construction, more or less complex, consisting of a combination of moving parts, or simple mechanical elements, as wheels, levers, cams, etc., with their supports and connecting framework, calculated to constitute a prime mover, or to receive force and motion from a prime mover or from another machine, and transmit, modify, and apply them to the production of some desired mechanical effect or work, as weaving by a loom, or the excitation of electricity by an electrical machine.",
    "magazine": "1. A receptacle in which anything is stored, especially military stores, as ammunition, arms, provisions, etc.",
    "magenta": "An aniline dye obtained as an amorphous substance having a green bronze surface color, which dissolves to a shade of red; also, the color; -- so called from Magenta, in Italy, in allusion to the battle fought there about the time the dye was discovered.",
    "maggot": "1. (Zoöl.)  The footless larva of any fly.",
    "magical": "1. Pertaining to the hidden wisdom supposed to be possessed by the Magi; relating to the occult powers of nature, and the producing of effects by their agency. 2. Performed by, or proceeding from, occult and superhuman agencies; done by, or seemingly done by, enchantment or sorcery.",
    "magma": "1. Any crude mixture of mineral or organic matters in the state of a thin paste.",
    "magnesium": "A light silver-white metallic element, malleable and ductile, quite permanent in dry air but tarnishing in moist air.",
    "magnetic": "1. Pertaining to the magnet; possessing the properties of the magnet, or corresponding properties; as, a magnetic bar of iron; a magnetic needle. 2. Of or pertaining to, or characterized by,, the earth's magnetism; as, the magnetic north; the magnetic meridian. 3. Capable of becoming a magnet; susceptible to magnetism; as, the magnetic metals. 4. Endowed with extraordinary personal power to excite the feelings and to win the affections; attractive; inducing attachment.",
    "magnetism": "The property, quality, or state, of being magnetic; the manifestation of the force in nature which is seen in a magnet. 2. The science which treats of magnetic phenomena. 3. Power of attraction; power to excite the feelings and to gain the affections.",
    "magnetize": "1. To communicate magnetic properties to; as, to magnetize a needle. 2. To attract as a magnet attracts, or like a magnet; to move; to influence.",
    "magnify": "1. To make great, or greater; to increase the dimensions of; to amplify; to enlarge, either in fact or in appearance; as, the microscope magnifies the object by a thousand diameters.",
    "magnitude": "1. Extent of dimensions; size; -- applied to things that have length, breath, and thickness.",
    "magnolia": "A genus of American and Asiatic trees, with aromatic bark and large sweet-scented whitish or reddish flowers.",
    "mahogany": "1. (Bot.)  A large tree of the genus Swietenia (S. Mahogoni), found in tropical America.",
    "majestic": "Possessing or exhibiting majesty; of august dignity, stateliness, or imposing grandeur; lofty; noble; grand.",
    "majesty": "The dignity and authority of sovereign power; quality or state which inspires awe or reverence; grandeur; exalted dignity, whether proceeding from rank, character, or bearing; imposing loftiness; stateliness; -- usually applied to the rank and dignity of sovereigns.",
    "majority": "1. The quality or condition of being major or greater; superiority.",
    "maker": "1. One who makes, forms, or molds; a manufacturer; specifically, the Creator.",
    "makeshift": "That with which one makes shift; a temporary expedient.",
    "making": "1. The act of one who makes; workmanship; fabrication; construction; as, this is cloth of your own making; the making of peace or war was in his power. 2. Composition, or structure. 3. a poem.[Obs.] Sir J. Davies. 4. That which establishes or places in a desirable state or condition; the material of which something may be made; as, early misfortune was the making of him. 5. External appearance; from.",
    "malt": "Barley or other grain, steeped in water and dried in a kiln, thus forcing germination until the saccharine principle has been evolved.",
    "mammal": "One of the Mammalia.",
    "manager": "1. One who manages; a conductor or director; as, the manager of a theater.",
    "manatee": "Any species of Trichechus, a genus of sirenians; -- called alsosea cow.",
    "mandarin": "1. A Chinese public officer or nobleman; a civil or military official in China and Annam. 2. (Bot.)  A small orange, with easily separable rind.",
    "mandate": "1. An official or authoritative command; an order or injunction; a commission; a judicial precept.",
    "mandatory": "Containing a command; preceptive; directory.",
    "mangle": "1. To cut or bruise with repeated blows or strokes, making a ragged or torn wound, or covering with wounds; to tear in cutting; to cut in a bungling manner; to lacerate; to mutilate.",
    "mango": "1. The fruit of the mango tree.",
    "manhood": "1. The state of being man as a human being, or man as distinguished from a child or a woman. 2. Manly quality; courage; bravery; resolution.",
    "manicure": "A person who makes a business of taking care of people's hands, especially their nails.",
    "manifesto": "A public declaration, usually of a prince, sovereign, or other person claiming large powers, showing his intentions, or proclaiming his opinions and motives in reference to some act done or contemplated by him; as, a manifesto declaring the purpose of a prince to begin war, and explaining his motives.",
    "manila": "Of or pertaining to Manila or Manilla, the capital of the Philippine Islands; made in, or exported from, that city.",
    "mankind": "1. The human race; man, taken collectively.",
    "manlike": "Like man, or like a man, in form or nature; having the qualities of a man, esp. the nobler qualities; manly.",
    "manly": "Having qualities becoming to a man; not childish or womanish; manlike, esp. brave, courageous, resolute, noble.",
    "mannish": "1. Resembling a human being in form or nature; human.",
    "manor": "1. (Eng.",
    "mantis": "Any one of numerous species of voracious orthopterous insects of the genus Mantis, and allied genera.",
    "mantra": "A prayer; an invocation; a religious formula; a charm.",
    "manual": "Of or pertaining to the hand; done or made by the hand; as, manual labor; the king's sign manual.",
    "many": "A retinue of servants; a household.",
    "map": "1. A representation of the surface of the earth, or of some portion of it, showing the relative position of the parts represented; -- usually on a flat surface.",
    "marbled": "1. Made of, or faced with, marble.",
    "marbling": "1. The art or practice of variegating in color, in imitation of marble. 2. An intermixture of fat and lean in meat, giving it a marbled appearance. 3. pl.",
    "march": "The third month of the year, containing thirty-one days.",
    "margarine": "1. Artificial butter; oleomargarine.",
    "margin": "1. A border; edge; brink; verge; as, the margin of a river or lake. 2. Specifically: The part of a page at the edge left uncovered in writing or printing. 3. (Com.)  The difference between the cost and the selling price of an article. 4. Something allowed, or reserved, for that which can not be foreseen or known with certainty. 5. (Brokerage)  Collateral security deposited with a broker to secure him from loss on contracts entered into by him on behalf of his principial, as in the speculative buying and selling of stocks, wheat, etc.",
    "marigold": "A name for several plants with golden yellow blossoms, especially the Calendula officinalis (see Calendula), and the cultivated species of Tagetes.",
    "marine": "1. Of or pertaining to the sea; having to do with the ocean, or with navigation or naval affairs; nautical; as, marine productions or bodies; marine shells; a marine engine. 2. (Geol.)  Formed by the action of the currents or waves of the sea; as, marine deposits.",
    "marital": "Of or pertaining to a husband; as, marital rights, duties, authority.",
    "maritime": "1. Bordering on, or situated near, the ocean; connected with the sea by site, interest, or power; having shipping and commerce or a navy; as, maritime states.",
    "marmalade": "A preserve or confection made of the pulp of fruit, as the quince, pear, apple, orange, etc., boiled with sugar, and brought to a jamlike consistence.",
    "maroon": "In the West Indies and Guiana, a fugitive slave, or a free negro, living in the mountains.",
    "marrow": "1. (Anat.)  The tissue which fills the cavities of most bones; the medulla.",
    "marry": "1. To unite in wedlock or matrimony; to perform the ceremony of joining, as a man and a woman, for life; to constitute (a man and a woman) husband and wife according to the laws or customs of the place.",
    "marshy": "1. Resembling a marsh; wet; boggy; fenny. 2. Pertaining to, or produced in, marshes; as, a marshy weed.",
    "marsupial": "1. (Zoöl.)  Having a pouch for carrying the immature young; of or pertaining to the Marsupialia. 2. (Anat.",
    "marvelous": "1. Exciting wonder or surprise; astonishing; wonderful.",
    "masculine": "1. Of the male sex; not female.",
    "massive": "1. Forming, or consisting of, a large mass; compacted; weighty; heavy; massy.",
    "mastiff": "A breed of large dogs noted for strength and courage.",
    "matador": "1. The killer; the man appointed to kill the bull in bullfights. 2. (Card Playing)  In the game of quadrille or omber, the three principal trumps, the ace of spades being the first, the ace of clubs the third, and the second being the deuce of a black trump or the seven of a red one.",
    "matcher": "One who, or that which, matches; a matching machine.",
    "matchless": "1. Having no equal; unequaled.",
    "material": "1. Consisting of matter; not spiritual; corporeal; physical; as, material substance or bodies.",
    "maternal": "Of or pertaining to a mother; becoming to a mother; motherly; as, maternal love; maternal tenderness.",
    "math": "A mowing, or that which is gathered by mowing; -- chiefly used in composition; as, an aftermath.",
    "matrimony": "1. The union of man and woman as husband and wife; the nuptial state; marriage; wedlock.",
    "matrix": "1. (Anat.)  The womb.",
    "matron": "1. A wife or a widow, especially, one who has borne children; a woman of staid or motherly manners.",
    "matted": "Having a dull surface; unburnished; as, matted gold leaf or gilding.",
    "matter": "1. That of which anything is composed; constituent substance; material; the material or substantial part of anything; the constituent elements of conception; that into which a notion may be analyzed; the essence; the pith; the embodiment.",
    "maturely": "1. In a mature manner; with ripeness; completely. 2. With caution; deliberately.",
    "mauve": "A color of a delicate purple, violet, or lilac.",
    "maximize": "To increase to the highest degree.",
    "maximum": "The greatest quantity or value attainable in a given case; or, the greatest value attained by a quantity which first increases and then begins to decrease; the highest point or degree; -- opposed to Ant: minimum.",
    "maybe": "Perhaps; possibly; peradventure.",
    "mobile": "1. Capable of being moved; not fixed in place or condition; movable.",
    "mobility": "1. The quality or state of being mobile; as, the mobility of a liquid, of an army, of the populace, of features, of a muscle.",
    "mocha": "1. A seaport town of Arabia, on the Red Sea. 2. A variety of coffee brought from Mocha. 3. An Abyssinian weight, equivalent to a Troy grain.",
    "mocker": "1. One who, or that which, mocks; a scorner; a scoffer; a derider. 2. A deceiver; an impostor. 3. (Zoöl.)  A mocking bird.",
    "modify": "1. To change somewhat the form or qualities of; to alter somewhat; as, to modify a contrivance adapted to some mechanical purpose; to modify the terms of a contract. 2. To limit or reduce in extent or degree; to moderate; to qualify; to lower.",
    "modulator": "One who, or that which, modulates.",
    "module": "1. A model or measure. 2. (Arch.)  The size of some one part, as the diameter of semi-diameter of the base of a shaft, taken as a unit of measure by which the proportions of the other parts of the composition are regulated.",
    "moisten": "1. To make damp; to wet in a small degree.",
    "moisture": "1. A moderate degree of wetness.",
    "molar": "Of or pertaining to a mass of matter; -- said of the properties or motions of masses, as distinguished from those of molecules or atoms.",
    "molasses": "The thick, brown or dark colored, viscid, uncrystallizable sirup which drains from sugar, in the process of manufacture; any thick, viscid, sweet sirup made from vegetable juice or sap, as of the sorghum or maple.",
    "mold": "A spot; a blemish; a mole.",
    "molecular": "Pertaining to, connected with, produced by, or consisting of, molecules; as, molecular forces; molecular groups of atoms, etc.",
    "molecule": "1. One of the very small invisible particles of which all matter is supposed to consist. 2. (Physics)  The smallest part of any substance which possesses the characteristic properties and qualities of that substance, and which can exist alone in a free state. 3. (Chem.)  A group of atoms so united and combined by chemical affinity that they form a complete, integrated whole, being the smallest portion of any particular compound that can exist in a free state; as, a molecule of water consists of two atoms of hydrogen and one of oxygen.",
    "molehill": "A little hillock of earth thrown up by moles working under ground; hence, a very small hill, or an insignificant obstacle or difficulty.",
    "mollusk": "One of the Mollusca.",
    "monastery": "A house of religious retirement, or of secusion from ordinary temporal concerns, especially for monks; -- more rarely applied to such a house for females.",
    "monetary": "Of or pertaining to money, or consisting of money; pecuniary.",
    "moneyless": "Destitute of money; penniless; impecunious.",
    "mongoose": "A species of ichneumon (Herpestes griseus), native of India.",
    "mongrel": "The progeny resulting from a cross between two breeds, as of domestic animals; anything of mixed breed.",
    "monitor": "1. One who admonishes; one who warns of faults, informs of duty, or gives advice and instruction by way of reproof or caution.",
    "monkhood": "1. The character or condition of a monk.",
    "monogamy": "1. Single marriage; marriage with but one person, husband or wife, at the same time; -- opposed to polygamy.",
    "monogram": "1. A character or cipher composed of two or more letters interwoven or combined so as to represent a name, or a part of it (usually the initials). Monograms are often used on seals, ornamental pins, rings, buttons, and by painters, engravers, etc., to distinguish their works.",
    "monologue": "1. A speech uttered by a person alone; soliloquy; also, talk or discourse in company, in the strain of a soliloquy; as, an account in monologue.",
    "monopoly": "1. The exclusive power, or privilege of selling a commodity; the exclusive power, right, or privilege of dealing in some article, or of trading in some market; sole command of the traffic in anything, however obtained; as, the proprietor of a patented article is given a monopoly of its sale for a limited time; chartered trading companies have sometimes had a monopoly of trade with remote regions; a combination of traders may get a monopoly of a particular product.",
    "monsieur": "1. The common title of civility in France in speaking to, or of, a man; Mr. or Sir.",
    "monstrous": "1. Marvelous; strange.",
    "monthly": "1. Continued a month, or a performed in a month; as, the monthly revolution of the moon. 2. Done, happening, payable, published, etc., once a month, or every month; as, a monthly visit; monthly charges; a monthly installment; a monthly magazine.",
    "monument": "1. Something which stands, or remains, to keep in remembrance what is past; a memorial.",
    "moody": "1. Subject to varying moods, especially to states of mind which are unamiable or depressed. 2. Hence: Out of humor; peevish; angry; fretful; also, abstracted and pensive; sad; gloomy; melancholy.",
    "mooned": "Of or resembling the moon; symbolized by the moon.",
    "moonlit": "Illumined by the moon.",
    "moonshine": "1. The light of the moon. 2. Hence, show without substance or reality. 3. A month.",
    "moonstone": "A nearly pellucid variety of feldspar, showing pearly or opaline reflections from within.",

    "mortuary": "1. A sort of ecclesiastical heriot, a customary gift claimed by, and due to, the minister of a parish on the death of a parishioner.",
    "mosaic": "1. (Fine Arts)  A surface decoration made by inlaying in patterns small pieces of variously colored glass, stone, or other material; -- called also mosaic work. 2. A picture or design made in mosaic; an article decorated in mosaic.",

    "motion": "1. The act, process, or state of changing place or position; movement; the passing of a body from one place or position to another, whether voluntary or involuntary; -- opposed to rest.",

    "motto": "1. (Her.)  A sentence, phrase, or word, forming part of an heraldic achievment. 2. A sentence, phrase, or word, prefixed to an essay, discourse, chapter, canto, or the like, suggestive of its subject matter; a short, suggestive expression of a guiding principle; a maxim.",
    "mountain": "1. A large mass of earth and rock, rising above the common level of the earth or adjacent land; earth and rock forming an isolated peak or a ridge; an eminence higher than a hill; a mount. 2. pl.",

    "mournful": "Full of sorrow; expressing, or intended to express, sorrow; mourning; grieving; sad; also, causing sorrow; saddening; grievous; as, a mournful person; mournful looks, tones, loss.",
    "mouse": "1. (Zoöl.)  Any one of numerous species of small rodents belonging to the genus Mus and various related genera of the family Muridæ. The common house mouse (Mus musculus) is found in nearly all countries.",
    "mouth": "1. The opening through which an animal receives food; the aperture between the jaws or between the lips; also, the cavity, containing the tongue and teeth, between the lips and the pharynx; the buccal cavity. 2. Hence:  An opening affording entrance or exit; orifice; aperture; as: (a) The opening of a vessel by which it is filled or emptied, charged or discharged; as, the mouth of a jar or pitcher; the mouth of the lacteal vessels, etc. (b) The opening or entrance of any cavity, as a cave, pit, well, or den. (c) The opening of a piece of ordnance, through which it is discharged. (d) The opening through which the waters of a river or any stream are discharged. (e) The entrance into a harbor. 3. (Saddlery)  The crosspiece of a bridle bit, which enters the mouth of an animal. 4. A principal speaker; one who utters the common opinion; a mouthpiece.",
    "movable": "1. Capable of being moved, lifted, carried, drawn, turned, or conveyed, or in any way made to change place or posture; susceptible of motion; not fixed or stationary; as, a movable steam engine. 2. Changing from one time to another; as, movable feasts, i. e., church festivals, the date of which varies from year to year.",
    "move": "1. To cause to change place or posture in any manner; to set in motion; to carry, convey, draw, or push from one place to another; to impel; to stir; as, the wind moves a vessel; the horse moves a carriage. 2. (Chess, Checkers, etc.)  To transfer (a piece or man) from one space or position to another, according to the rules of the game; as, to move a king. 3. To excite to action by the presentation of motives; to rouse by representation, persuasion, or appeal; to influence.",
    "movie": "A moving picture or a moving picture show; -- commonly used in pl.",
    "moving": "1. Changing place or posture; causing motion or action; as, a moving car, or power. 2. Exciting movement of the mind; adapted to move the sympathies, passions, or affections; touching; pathetic; as, a moving appeal.",

    "mustard": "1. (Bot.)  The name of several cruciferous plants of the genus Brassica (formerly Sinapis), as white mustard (B. alba), black mustard (B. Nigra), wild mustard or charlock (B. Sinapistrum). Note: There are also many herbs of the same family which are called mustard, and have more or less of the flavor of the true mustard; as, bowyer's mustard (Lepidium ruderale); hedge mustard (Sisymbrium officinale); Mithridate mustard (Thlaspi arvense); tower mustard (Arabis perfoliata); treacle mustard (Erysimum cheiranthoides). 2. A powder or a paste made from the seeds of black or white mustard, used as a condiment and a rubefacient.",
    "muster": "1. Something shown for imitation; a pattern.",
    "musty": "1. Having the rank, pungent, offencive odor and taste which substances of organic origin acquire during warm, moist weather; foul or sour and fetid; moldy; as, musty corn; musty books.",

    "mystify": "1. To involve in mystery; to make obscure or difficult to understand; as, to mystify a passage of Scripture. 2. To perplex the mind of; to puzzle; to impose upon the credulity of ; as, to mystify an opponent.",

    "operable": "Practicable.",
    "operate": "1. To perform a work or labor; to exert power or strengh, physical or mechanical; to act. 2. To produce an appropriate physical effect; to issue in the result designed by nature; especially (Med.), to take appropriate effect on the human system. 3. To act or produce effect on the mind; to exert moral power or influence.",

    "plod": "1. To travel slowly but steadily; to trudge.",
    "plop": "To fall, drop, or move in any way, with a sudden splash or slap, as on the surface of water.",
    "plot": "1. A small extent of ground; a plat; as, a garden plot.",
    "plow": "1. A well-known implement, drawn by horses, mules, oxen, or other power, for turning up the soil to prepare it for bearing crops; also used to furrow or break up the soil for other purposes; as, the subsoil plow; the draining plow.",
    "ploy": "Sport; frolic.",
    "pluck": "1. To pull; to draw.",
    "plug": "1. Any piece of wood, metal, or other substance used to stop or fill a hole; a stopple. 2. A flat oblong cake of pressed tobacco.",
    "plunder": "1. To take the goods of by force, or without right; to pillage; to spoil; to sack; to strip; to rob; as, to plunder travelers.",
    "plural": "Relating to, or containing, more than one; designating two or more; as, a plural word.",
    "plus": "1. (Math.)  More, required to be added; positive, as distinguished from negative; -- opposed to Ant: minus. 2. Hence, in a literary sense, additional; real; actual.",
    "poach": "1. To cook, as eggs, by breaking them into boiling water; also, to cook with butter after breaking in a vessel.",
    "pod": "1. A bag; a pouch.",
    "poet": "One skilled in making poetry; one who has a particular genius for metrical composition; the author of a poem; an imaginative thinker or writer.",
    "pointed": "1. Sharp; having a sharp point; as, a pointed rock. 2. Characterized by sharpness, directness, or pithiness of expression; terse; epigrammatic; especially, directed to a particular person or thing.",
    "pointer": "One who, or that which, points.",
    "pointless": "Having no point; blunt; wanting keenness; obtuse; as, a pointless sword; a pointless remark.",
    "poise": "1. Weight; gravity; that which causes a body to descend; heaviness.",
    "poison": "1. Any agent which, when introduced into the animal organism, is capable of producing a morbid, noxious, or deadly effect upon it; as, morphine is a deadly poison; the poison of pestilential diseases. 2. That which taints or destroys moral purity or health; as, the poison of evil example; the poison of sin.",
    "poker": "1. One who pokes. 2. That which pokes or is used in poking, especially a metal bar or rod used in stirring a fire of coals. 3. A poking-stick.",
    "poking": "Drudging; servile.",
    "polar": "1. Of or pertaining to one of the poles of the earth, or of a sphere; situated near, or proceeding from, one of the poles; as, polar regions; polar seas; polar winds. 2. Of or pertaining to the magnetic pole, or to the point to which the magnetic needle is directed. 3. (Geom.)  Pertaining to, reckoned from, or having a common radiating point; as, polar coördinates.",
    "police": "1. A judicial and executive system, for the government of a city, town, or district, for the preservation of rights, order, cleanliness, health, etc., and for the enforcement of the laws and prevention of crime; the administration of the laws and regulations of a city, incorporated town, or borough. 2. That which concerns the order of the community; the internal regulation of a state. 3. The organized body of civil officers in a city, town, or district, whose particular duties are the preservation of good order, the prevention and detection of crime, and the enforcement of the laws. 4. (Mil.)  Military police, the body of soldiers detailed to preserve civil order and attend to sanitary arrangements in a camp or garrison. 5. The cleaning of a camp or garrison, or the state Police commissioner, a civil officer, usually one of a board, commissioned to regulate and control the appointment, duties, and discipline of the police.",
    "policy": "1. Civil polity.",
    "politely": "1. In a polished manner; so as to be smooth or glossy.",
    "polka": "1. A dance of Polish origin, but now common everywhere.",
    "polygon": "A plane figure having many angles, and consequently many sides; esp., one whose perimeter consists of more than four sides; any figure having many angles.",
    "polygraph": "1. An instrument for multiplying copies of a writing; a manifold writer; a copying machine. 2. In bibliography, a collection of different works, either by one or several authors.",
    "polymer": "Any one of two or more substances related to each other by polymerism; specifically, a substance produced from another substance by chemical polymerization.",
    "poncho": "1. A kind of cloak worn by the Spanish Americans, having the form of a blanket, with a slit in the middle for the head to pass through.",
    "pond": "A body of water, naturally or artificially confined, and usually of less extent than a lake.",
    "pony": "1. A small horse. 2. Twenty-five pounds sterling.",
    "pope": "1. Any ecclesiastic, esp. a bishop.",
    "poplar": "1. Any tree of the genus Populus; also, the timber, which is soft, and capable of many uses.",
    "popper": "A utensil for popping corn, usually a wire basket with a long handle.",
    "poppy": "Any plant or species of the genus Papaver, herbs with showy polypetalous flowers and a milky juice.",
    "populace": "The common people; the vulgar; the multitude, -- comprehending all persons not distinguished by rank, office, education, or profession.",
    "popular": "1. Of or pertaining to the common people, or to the whole body of the people, as distinguished from a select portion; as, the popular voice; popular elections.",
    "populate": "Populous.",
    "porcupine": "1. (Zoöl.)  Any Old Word rodent of the genus Hystrix, having the back covered with long, sharp, erectile spines or quills, sometimes a foot long.",
    "porous": "Full of pores; having interstices in the skin or in the substance of the body; having spiracles or passages for fluids; permeable by liquids; as, a porous skin; porous wood.",
    "portable": "1. Capable of being borne or carried; easily transported; conveyed without difficulty; as, a portable bed, desk, engine.",
    "portal": "1. A door or gate; hence, a way of entrance or exit, especially one that is grand and imposing.",
    "porthole": "An embrasure in a ship's side.",
    "portion": "1. That which is divided off or separated, as a part from a whole; a separated part of anything. 2. A part considered by itself, though not actually cut off or separated from the whole.",
    "portly": "1. Having a dignified port or mien; of a noble appearance; imposing. 2. Bulky; corpulent.",
    "poser": "One who, or that which, puzzles; a difficult or inexplicable question or fact.",
    "possible": "Capable of existing or occurring, or of being conceived or thought of; able to happen; capable of being done; not contrary to the nature of things; -- sometimes used to express extreme improbability; barely able to be, or to come to pass; as, possibly he is honest, as it is possible that Judas meant no wrong.",
    "possibly": "In a possible manner; by possible means; especially, by extreme, remote, or improbable intervention, change, or exercise of power; by a chance; perhaps; as, possibly he may recover.",
    "possum": "An opossum.",
    "postage": "The price established by law to be paid for the conveyance of a letter or other mailable matter by a public post.",
    "postal": "Belonging to the post office or mail service; as, postal arrangements; postal authorities.",
    "posting": "1. The act of traveling post. 2. (Bookkeeping)  The act of transferring an account, as from the journal to the ledger.",
    "posture": "1. The position of the body; the situation or disposition of the several parts of the body with respect to each other, or for a particular purpose; especially (Fine Arts), the position of a figure with regard to the several principal members by which action is expressed; attitude.",
    "pouch": "1. A small bag; usually, a leathern bag; as, a pouch for money; a shot pouch; a mail pouch, etc. 2. That which is shaped like, or used as, a pouch; as: (a) A protuberant belly; a paunch; -- so called in ridicule. (b) (Zoöl.) A sac or bag for carrying food or young; as, the cheek pouches of certain rodents, and the pouch of marsupials. (c) (Med.) A cyst or sac containing fluid.",
    "pounce": "1. A fine powder, as of sandarac, or cuttlefish bone, -- formerly used to prevent ink from spreading on manuscript. 2. Charcoal dust, or some other colored powder for making patterns through perforated designs, -- used by embroiderers, lace makers, etc.",
    "pouncing": "1. The art or practice of transferring a design by means of pounce. 2. Decorative perforation of cloth.",
    "pound": "1. To strike repeatedly with some heavy instrument; to beat.",
    "pout": "The young of some birds, as grouse; a young fowl.",
    "powdered": "1. Reduced to a powder; sprinkled with, or as with, powder. 2. Sprinkled with salt; salted; corned.",
    "powdering": "a. & n. from Powder, v. t. Powdering tub. (a) A tub or vessel in which meat is corned or salted. (b) A heated tub in which an infected lecher was placed for cure.",
    "powdery": "1. Easily crumbling to pieces; friable; loose; as, a powdery spar. 2. Sprinkled or covered with powder; dusty; as, the powdery bloom on plums. 3. Resembling powder; consisting of powder.",
    "powwow": "1. A priest, or conjurer, among the North American Indians.",
    "pox": "Strictly, a disease by pustules or eruptions of any kind, but chiefly or wholly restricted to three or four diseases, -- the smallpox, the chicken pox, and the vaccine and the venereal diseases.",
    "prance": "1. To spring or bound, as a horse in high mettle.",
    "pranker": "One who dresses showily; a prinker.",
    "praying": "a. & n. from Pray, v. Praying insect, locust, or mantis (Zoöl.), a mantis, especially Mantis religiosa.",
    "preacher": "1. One who preaches; one who discourses publicly on religious subjects.",
    "preaching": "The act of delivering a religious discourse; the art of sermonizing; also, a sermon; a public religious discourse; serious, earnest advice.",
    "preamble": "A introductory portion; an introduction or preface, as to a book, document, etc.; specifically, the introductory part of a statute, which states the reasons and intent of the law.",
    "precinct": "1. The limit or exterior line encompassing a place; a boundary; a confine; limit of jurisdiction or authority; -- often in the plural; as, the precincts of a state.",
    "precise": "1. Having determinate limitations; exactly or sharply defined or stated; definite; exact; nice; not vague or equivocal; as, precise rules of morality.",
    "precision": "The quality or state of being precise; exact limitation; exactness; accuracy; strict conformity to a rule or a standard; definiteness.",
    "predict": "To tell or declare beforehand; to foretell; to prophesy; to presage; as, to predict misfortune; to predict the return of a comet.",
    "preface": "1. Something spoken as introductory to a discourse, or written as introductory to a book or essay; a proem; an introduction, or series of preliminary remarks.",
    "prefix": "1. To put or fix before, or at the beginning of, another thing; as, to prefix a syllable to a word, or a condition to an agreement. 2. To set or appoint beforehand; to settle or establish antecedently.",
    "pregnancy": "1. The condition of being pregnant; the state of being with young. 2. Figuratively: The quality of being heavy with important contents, issue, significance, etc.; unusual consequence or capacity; fertility.",
    "pregnant": "1. Being with young, as a female; having conceived; great with young; breeding; teeming; gravid; preparing to bring forth. 2. Heavy with important contents, significance, or issue; full of consequence or results; weighty; as, pregnant replies.",
    "prelude": "An introductory performance, preceding and preparing for the principal matter; a preliminary part, movement, strain, etc.; especially (Mus.), a strain introducing the theme or chief subject; a movement introductory to a fugue, yet independent; -- with recent composers often synonymous with overture.",
    "premium": "1. A reward or recompense; a prize to be won by being before another, or others, in a competition; reward or prize to be adjudged; a bounty; as, a premium for good behavior or scholarship, for discoveries, etc.",
    "preoccupy": "1. To take possession of before another; as, to preoccupy a country not before held. 2. To prepossess; to engage, occupy, or engross the attention of, beforehand; hence, to prejudice.",
    "preorder": "To order to arrange beforehand; to foreordain.",
    "prescribe": "1. To lay down authoritatively as a guide, direction, or rule of action; to impose as a peremptory order; to dictate; to appoint; to direct.",
    "president": "Precedent.",
    "press": "An East Indian insectivore (Tupaia ferruginea). It is arboreal in its habits, and has a bushy tail.",
    "presume": "1. To assume or take beforehand; esp., to do or undertake without leave or authority previously obtained.",
    "pretended": "Making a false appearance; unreal; false; as, pretended friend.",
    "pretender": "1. One who lays claim, or asserts a title (to something); a claimant.",
    "pretense": "1. The act of laying claim; the claim laid; assumption; pretension.",
    "pretext": "Ostensible reason or motive assigned or assumed as a color or cover for the real reason or motive; pretense; disguise.",
    "pretty": "1. Pleasing by delicacy or grace; attracting, but not striking or impressing; of a pleasing and attractive form a color; having slight or diminutive beauty; neat or elegant without elevation or grandeur; pleasingly, but not grandly, conceived or expressed; as, a pretty face; a pretty flower; a pretty poem.",
    "prevail": "1. To overcome; to gain the victory or superiority; to gain the advantage; to have the upper hand, or the mastery; to succeed; -- sometimes with over or against.",
    "prevalent": "1. Gaining advantage or superiority; having superior force, influence, or efficacy; prevailing; predominant; successful; victorious.",
    "prevent": "1. To go before; to precede; hence, to go before as a guide; to direct.",
    "previous": "Going before in time; being or happening before something else; antecedent; prior; as, previous arrangements; a previous illness.",
    "prideful": "Full of pride; haughty.",
    "primal": "First; primary; original; chief.",
    "primary": "1. First in order of time or development or in intention; primitive; fundamental; original.",
    "primer": "One who, or that which, primes; specifically, an instrument or device for priming; esp., a cap, tube, or water containing percussion powder or other capable for igniting a charge of gunpowder.",
    "primp": "To be formal or affected in dress or manners; -- often with up.",
    "princess": "1. A female prince; a woman having sovereign power, or the rank of a prince.",
    "print": "1. To fix or impress, as a stamp, mark, character, idea, etc., into or upon something.",
    "prior": "Preceding in the order of time; former; antecedent; anterior; previous; as, a prior discovery; prior obligation; -- used elliptically in cases like the following: he lived alone [in the time] prior to his marriage.",
    "prism": "1. (Geom.)  A solid whose bases or ends are any similar, equal, and parallel plane figures, and whose sides are parallelograms.",
    "prison": "1. A place where persons are confined, or restrained of personal liberty; hence, a place or state o Bring my soul out of prison, that I may praise thy name.",
    "privacy": "1. The state of being in retirement from the company or observation of others; seclusion. 2. A place of seclusion from company or observation; retreat; solitude; retirement.",
    "private": "1. Belonging to, or concerning, an individual person, company, or interest; peculiar to one's self; unconnected with others; personal; one's own; not public; not general; separate; as, a man's private opinion; private property; a private purse; private expenses or interests; a private secretary. 2. Sequestered from company or observation; appropriated to an individual; secret; secluded; lonely; solitary; as, a private room or apartment; private prayer.",
    "prize": "1. That which is taken from another; something captured; a thing seized by force, stratagem, or superior power.",
    "probable": "1. Capable of being proved.",
    "probably": "In a probable manner; in likelihood.",
    "probation": "1. The act of proving; also, that which proves anything; proof.",
    "probe": "1. To examine, as a wound, an ulcer, or some cavity of the body, with a probe. 2. Fig.: to search to the bottom; to scrutinize or examine thoroughly.",
    "problem": "1. A question proposed for solution; a matter stated for examination or proof; hence, a matter difficult of solution or settlement; a doubtful case; a question involving doubt.",
    "procedure": "1. The act or manner of proceeding or moving forward; progress; process; operation; conduct.",
    "process": "1. The act of proceeding; continued forward movement; procedure; progress; advance.",
    "proclaim": "1. To make known by public announcement; to give wide publicity to; to publish abroad; to promulgate; to declare; as, to proclaim war or peace.",
    "procurer": "1. One who procures, or obtains; one who, or that which, brings on, or causes to be done, esp. by corrupt means. 2. One who procures the gratification of lust for another; a pimp; a pander.",
    "prodigal": "Given to extravagant expenditure; expending money or other things without necessity; recklessly or viciously profuse; lavish; wasteful; not frugal or economical; as, a prodigal man; the prodigal son; prodigal giving; prodigal expenses.",
    "prodigy": "1. Something extraordinary, or out of the usual course of nature, from which omens are drawn; a portent; as, eclipses and meteors were anciently deemed prodigies.",
    "produce": "1. To bring forward; to lead forth; to offer to view or notice; to exhibit; to show; as, to produce a witness or evidence in court.",
    "product": "1. Anything that is produced, whether as the result of generation, growth, labor, or thought, or by the operation of involuntary causes; as, the products of the season, or of the farm; the products of manufactures; the products of the brain.",
    "profane": "1. Not sacred or holy; not possessing peculiar sanctity; unconsecrated; hence, relating to matters other than sacred; secular; -- opposed to sacred, religious, or inspired; as, a profane place.",
    "profanity": "1. The quality or state of being profane; profaneness; irreverence; esp., the use of profane language; blasphemy. 2. That which is profane; profane language or acts.",
    "professed": "Openly declared, avowed, acknowledged, or claimed; as, a professed foe; a professed tyrant; a professed Christian.",
    "professor": "1. One who professed, or makes open declaration of, his sentiments or opinions; especially, one who makes a public avowal of his belief in the Scriptures and his faith in Christ, and thus unites himself to the visible church.",
    "profile": "1. An outline, or contour; as, the profile of an apple. 2. (Paint & Sculp.)  A human head represented sidewise, or in a side view; the side face or half face. 3. (a) (Arch.) A section of any member, made at right angles with its main lines, showing the exact shape of moldings and the like. (b) (Civil Engin.) A drawing exhibiting a vertical section of the ground along a surveyed line, or graded work, as of a railway, showing elevations, depressions, grades, etc.",
    "profound": "1. Descending far below the surface; opening or reaching to a great depth; deep.",
    "progeny": "Descendants of the human kind, or offspring of other animals; children; offspring; race, lineage.",
