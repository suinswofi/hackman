<!DOCTYPE html>
<html>
<title>Hackman</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #05010E;
  }

  canvas {
    display: block;
    outline: none;
    cursor: none;
  }
</style>
<script>
  "use strict";

  // ---------------------------------------------------------------------------
  // GAME
  //
  // Hackman is a password-cracking game. Guess letters and digits before the
  // clock runs out or the trace completes.
  //
  // Visual direction: each reference owns one layer. Outrun owns the world
  // (sky, sun, perspective grid). Tron owns the chrome (angular bezels, hard
  // glow, no corner radius). Matrix owns data in flux (the scramble reveal,
  // the rain, the corruption). Text that moves is Matrix; text that sits
  // still is Tron.
  // ---------------------------------------------------------------------------

  var game = {
    title: "HACKMAN",
    subtitle: "PASSWORD CRACKING SIMULATOR",

    // virtual resolution -- all layout is authored against this and letterboxed
    // into whatever the window happens to be
    GAME_W: 1920,
    GAME_H: 1080,
    HORIZON: 430,

    PHASE_MENU: 0,
    PHASE_PLAY: 1,
    PHASE_RESULT: 2,

    FONT_STACK: "ui-monospace, Menlo, Consolas, monospace",

    // semantic palette -- colour carries meaning, not mood
    VOID: "#05010E",
    DEEP: "#1A0B3B",
    CYAN: "#22E4FF",     // system and UI chrome
    PHOSPHOR: "#6BFF9E", // your progress
    MAGENTA: "#FF2E88",  // the trace
    AMBER: "#FFB347",    // time pressure

    // one entry per difficulty: label, words in the password, seconds, attempts
    tiers: [
      { name: "EASY", words: 1, seconds: 75, attempts: 14, multiplier: 1 },
      { name: "NORMAL", words: 2, seconds: 60, attempts: 11, multiplier: 2 },
      { name: "HARD", words: 3, seconds: 45, attempts: 8, multiplier: 3 }
    ],

    MIN_WORD: 4,
    MAX_WORD: 9,

    // hint panel grows downward from HINT_TOP and must stay clear of the
    // password strip, so the type size steps down until the whole definition
    // fits the band rather than the text being cut
    HINT_TOP: 142,
    HINT_BOTTOM: 405,
    HINT_X: 200,
    HINT_W: 1520,
    HINT_LABEL_W: 140,
    HINT_PAD: 32,
    HINT_SIZES: [20, 18, 16, 14, 12],
    COMBO_MAX: 5,
    POINTS_PER_LETTER: 100,
    POINTS_PER_SECOND: 25,
    POINTS_PER_ATTEMPT: 100,

    SCRAMBLE_CHARS: "アイウエオカキクケコサシスセソタチツテトナニヌネノABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@$*+=<>/|",
    RAIN_CHARS: "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロ0123456789",
    KEYS: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",

    team_score: 0,
    best_score: 0,
    last_score: 0,
    time: 0
  };

  /**
   * Builds a canvas font string at game-space size.
   * @param {number} size - Font size in game units.
   * @param {string} [weight] - Optional font weight.
   * @returns {string}
   */
  game.typeface = function (size, weight) {
    return (weight ? weight + " " : "") + size + "px " + game.FONT_STACK;
  };

  // ---------------------------------------------------------------------------
  // World -- the outrun layer
  // ---------------------------------------------------------------------------

  /**
   * Draws the gradient sky, reddening as the trace closes in.
   */
  game.drawSky = function () {
    var horizon = game.HORIZON;
    var corrupt = game.corruption;

    game.canvas.fillGradientRect(
      new engine.Rectangle(0, 0, game.GAME_W, horizon),
      [
        [0, engine.mixColor(game.VOID, "#2A0038", corrupt * 0.6)],
        [0.55, engine.mixColor(game.DEEP, "#4A0033", corrupt * 0.7)],
        [1, engine.mixColor("#7A1B6B", game.MAGENTA, corrupt * 0.5)]
      ]
    );

    game.canvas.fillRect(
      new engine.Rectangle(0, horizon, game.GAME_W, game.GAME_H - horizon),
      game.VOID
    );
  };

  /**
   * Draws the sliced outrun sun sitting on the horizon.
   */
  game.drawSun = function () {
    var horizon = game.HORIZON;
    var radius = 150;

    // sits low so only a cap breaks the horizon -- the sky above it belongs to
    // the interface, and a taller sun fights every centred panel for it
    var centre = new engine.Point(game.GAME_W * 0.5, horizon + 10);
    var top = centre.y - radius;

    game.canvas.clipRect(new engine.Rectangle(0, 0, game.GAME_W, horizon));
    game.canvas.clipCircle(centre, radius);

    game.canvas.fillGradientRect(
      new engine.Rectangle(centre.x - radius, top, radius * 2, radius * 2),
      [
        [0, "#FFE27A"],
        [0.35, game.AMBER],
        [1, game.MAGENTA]
      ]
    );

    // punch horizontal slices out of the lower half, thickening downward
    var y = centre.y - radius * 0.35;
    var thickness = 3;
    while (y < horizon) {
      game.canvas.fillRect(new engine.Rectangle(centre.x - radius, y, radius * 2, thickness), game.VOID);
      y += thickness + 12;
      thickness += 1.6;
    }

    game.canvas.restore();
    game.canvas.restore();
  };

  /**
   * Draws the perspective grid scrolling toward the viewer.
   * @param {number} dt - Seconds since the previous frame.
   */
  game.drawGrid = function (dt) {
    var horizon = game.HORIZON;
    var ground = game.GAME_H - horizon;
    var corrupt = game.corruption;
    var lines = 22;
    var i;

    game.grid_phase = (game.grid_phase + dt * 0.35) % 1;

    var colour = engine.mixColor(game.CYAN, game.MAGENTA, corrupt);

    // horizontal lines bunch toward the horizon and accelerate outward
    for (i = 0; i < lines; i++) {
      var t = (i + game.grid_phase) / lines;
      var y = horizon + ground * Math.pow(t, 2.6);
      var jitter = corrupt > 0 ? (Math.random() - 0.5) * corrupt * 10 : 0;
      game.canvas.drawLine(
        new engine.Point(0, y + jitter),
        new engine.Point(game.GAME_W, y + jitter),
        colour, 1 + t * 2, 0.12 + t * 0.45
      );
    }

    // verticals converge on the vanishing point
    var vanish = new engine.Point(game.GAME_W * 0.5, horizon);
    for (i = -9; i <= 9; i++) {
      var x = game.GAME_W * 0.5 + i * 230;
      game.canvas.drawLine(vanish, new engine.Point(x, game.GAME_H), colour, 2, 0.28);
    }

    // horizon glow
    game.canvas.drawLine(
      new engine.Point(0, horizon), new engine.Point(game.GAME_W, horizon),
      colour, 3, 0.9, 18
    );
  };

  // ---------------------------------------------------------------------------
  // Rain -- the matrix layer
  // ---------------------------------------------------------------------------

  /**
   * Rebuilds the rain columns. Called once at startup.
   */
  game.initRain = function () {
    game.rain = [];
    for (var i = 0; i < 46; i++) {
      game.rain.push(game.makeRainColumn(true));
    }
  };

  /**
   * Creates a single rain column.
   * @param {boolean} scatter - Whether to scatter the start position vertically.
   * @returns {object}
   */
  game.makeRainColumn = function (scatter) {
    var length = 6 + Math.floor(Math.random() * 14);
    var chars = [];
    for (var i = 0; i < length; i++) {
      chars.push(game.RAIN_CHARS.charAt(Math.floor(Math.random() * game.RAIN_CHARS.length)));
    }
    return {
      x: Math.floor(Math.random() * game.GAME_W),
      y: scatter ? Math.random() * game.GAME_H : -length * 26,
      speed: 90 + Math.random() * 260,
      chars: chars,
      cell: 26
    };
  };

  /**
   * Advances and draws the rain. Density rises with corruption.
   * @param {number} dt - Seconds since the previous frame.
   */
  game.drawRain = function (dt) {
    var visible = Math.floor(14 + game.corruption * 32);
    var font = game.typeface(20);

    for (var i = 0; i < game.rain.length; i++) {
      var col = game.rain[i];
      col.y += col.speed * dt;

      if (col.y - col.chars.length * col.cell > game.GAME_H) {
        game.rain[i] = game.makeRainColumn(false);
        continue;
      }

      if (i >= visible) continue;

      for (var j = 0; j < col.chars.length; j++) {
        var y = col.y - j * col.cell;
        if (y < -col.cell || y > game.GAME_H) continue;
        var head = j === 0;
        var fade = 1 - (j / col.chars.length);
        game.canvas.drawGlyph(
          col.chars[j], new engine.Point(col.x, y), font,
          head ? "#FFFFFF" : game.PHOSPHOR,
          head ? 0.55 : fade * 0.22, head ? 10 : 0
        );
      }
    }
  };

  // ---------------------------------------------------------------------------
  // Chrome -- the tron layer
  // ---------------------------------------------------------------------------

  /**
   * Draws an angular bezelled panel with corner ticks.
   * @param {engine.Rectangle} rect - Panel bounds.
   * @param {string} colour - Line colour.
   * @param {number} [fill] - Background alpha.
   * @param {number} [line] - Border alpha.
   */
  game.drawPanel = function (rect, colour, fill, line) {
    // panels sit over a busy world, so the plate has to be close to opaque or
    // the grid and the rain read straight through the text
    fill = fill === undefined ? 0.92 : fill;
    line = line === undefined ? 0.5 : line;

    game.canvas.fillRect(rect, game.VOID, fill);
    game.canvas.drawRect(rect, colour, 2, line);

    // corner ticks -- the detail that makes it read as tron rather than a box
    var tick = 14;
    var corners = [
      [rect.x, rect.y, 1, 1],
      [rect.x + rect.width, rect.y, -1, 1],
      [rect.x, rect.y + rect.height, 1, -1],
      [rect.x + rect.width, rect.y + rect.height, -1, -1]
    ];
    for (var i = 0; i < corners.length; i++) {
      var c = corners[i];
      game.canvas.drawLine(
        new engine.Point(c[0], c[1]), new engine.Point(c[0] + tick * c[2], c[1]),
        colour, 3, Math.min(1, line + 0.45)
      );
      game.canvas.drawLine(
        new engine.Point(c[0], c[1]), new engine.Point(c[0], c[1] + tick * c[3]),
        colour, 3, Math.min(1, line + 0.45)
      );
    }
  };

  /**
   * Draws a labelled meter bar.
   * @param {engine.Rectangle} rect - Bar bounds.
   * @param {number} fraction - Fill fraction from 0 to 1.
   * @param {string} colour - Fill colour.
   */
  game.drawBar = function (rect, fraction, colour) {
    game.canvas.fillRect(rect, colour, 0.12);
    game.canvas.fillRect(
      new engine.Rectangle(rect.x, rect.y, rect.width * engine.clamp(fraction, 0, 1), rect.height),
      colour, 0.85
    );
    game.canvas.drawRect(rect, colour, 2, 0.7);
  };

  // ---------------------------------------------------------------------------
  // Decode cells -- the signature element
  // ---------------------------------------------------------------------------

  /**
   * Computes the layout for the password cell row.
   * @param {number} centre_y - Vertical centre of the row.
   * @returns {object}
   */
  game.cellLayout = function (centre_y) {
    var count = game.cells.length;
    var size = Math.min(66, Math.floor(1680 / Math.max(1, count)) - 8);
    var gap = Math.max(4, Math.floor(size * 0.16));
    var stride = size + gap;
    var total = stride * count - gap;
    return {
      size: size,
      stride: stride,
      x: (game.GAME_W - total) * 0.5,
      y: centre_y - size * 0.5
    };
  };

  /**
   * Advances the reveal animation on every cell.
   * @param {number} dt - Seconds since the previous frame.
   */
  game.updateCells = function (dt) {
    for (var i = 0; i < game.cells.length; i++) {
      var cell = game.cells[i];
      if (cell.scramble > 0) {
        cell.scramble = Math.max(0, cell.scramble - dt);
        if (cell.scramble === 0) {
          cell.lock = 0.0001;
          game.burstAt(i);
          game.audio.blip(660 + i * 40, 0.05, "square", 0.16);
        }
      } else if (cell.lock > 0 && cell.lock < 1) {
        cell.lock = Math.min(1, cell.lock + dt / 0.22);
      }
      if (cell.flash > 0) {
        cell.flash = Math.max(0, cell.flash - dt / 0.4);
      }
    }
  };

  /**
   * Draws the password cell row.
   * @param {number} centre_y - Vertical centre of the row.
   * @param {boolean} [expose] - Whether to show unrevealed characters in magenta.
   */
  game.drawCells = function (centre_y, expose) {
    var layout = game.cellLayout(centre_y);
    var font = game.typeface(Math.floor(layout.size * 0.62), "bold");

    // a console strip spanning the full width, so the password always reads
    // no matter what the world is doing behind it
    var strip = new engine.Rectangle(0, layout.y - 22, game.GAME_W, layout.size + 44);
    game.canvas.fillRect(strip, game.VOID, 0.93);
    game.canvas.drawLine(
      new engine.Point(0, strip.y), new engine.Point(game.GAME_W, strip.y),
      game.CYAN, 2, 0.5
    );
    game.canvas.drawLine(
      new engine.Point(0, strip.y + strip.height),
      new engine.Point(game.GAME_W, strip.y + strip.height),
      game.CYAN, 2, 0.5
    );

    for (var i = 0; i < game.cells.length; i++) {
      var cell = game.cells[i];
      var x = layout.x + i * layout.stride;
      var rect = new engine.Rectangle(x, layout.y, layout.size, layout.size);
      var centre = new engine.Point(x + layout.size * 0.5, layout.y + layout.size * 0.5);
      var settled = cell.revealed && cell.scramble === 0;

      var colour = game.CYAN;
      if (settled) colour = game.PHOSPHOR;
      if (expose && !cell.revealed) colour = game.MAGENTA;

      game.canvas.fillRect(rect, colour, settled ? 0.14 : 0.05);
      game.canvas.drawRect(rect, colour, 2, settled ? 0.8 : 0.42);

      if (cell.flash > 0) {
        var spread = (1 - cell.flash) * layout.size * 0.5;
        var wide = new engine.Rectangle(
          rect.x - spread, rect.y - spread,
          rect.width + spread * 2, rect.height + spread * 2
        );
        game.canvas.drawRect(wide, "#FFFFFF", 3, cell.flash * 0.8);
      }

      if (cell.scramble > 0) {
        var glyph = game.SCRAMBLE_CHARS.charAt(
          (Math.floor(game.time * 30) + i * 7) % game.SCRAMBLE_CHARS.length
        );
        game.canvas.drawGlyph(glyph, centre, font, game.PHOSPHOR, 0.9, 12, true);
      } else if (cell.revealed || expose) {
        var pop = cell.lock > 0 && cell.lock < 1
          ? engine.easeOutBack(cell.lock)
          : 1;
        game.canvas.drawGlyph(
          cell.char.toUpperCase(), centre, font, colour, 1, 16, true, 0.6 + pop * 0.4
        );
      } else {
        game.canvas.fillRect(
          new engine.Rectangle(centre.x - layout.size * 0.18, centre.y, layout.size * 0.36, 2),
          game.CYAN, 0.35
        );
      }
    }
  };

  /**
   * Fires a particle burst from a cell that has just locked.
   * @param {number} index - Cell index.
   */
  game.burstAt = function (index) {
    var layout = game.cellLayout(game.cell_row_y);
    var centre = new engine.Point(
      layout.x + index * layout.stride + layout.size * 0.5,
      layout.y + layout.size * 0.5
    );
    game.particles.burst(centre, 16, {
      colour: game.PHOSPHOR,
      alt: game.CYAN,
      speed: 150,
      spread: Math.PI * 2,
      life: 0.75,
      gravity: 260,
      kind: "spark"
    });
    game.cells[index].flash = 1;
  };

  // ---------------------------------------------------------------------------
  // Round setup
  // ---------------------------------------------------------------------------

  /**
   * Builds the eligible word list once at startup. Everything downstream reads
   * this rather than the raw dictionary, so the dictionary can grow freely.
   */
  game.buildWordIndex = function () {
    game.words = [];
    var keys = Object.keys(wordlist);
    for (var i = 0; i < keys.length; i++) {
      var word = keys[i];
      if (word.length < game.MIN_WORD || word.length > game.MAX_WORD) continue;
      if (!/^[a-z]+$/.test(word)) continue;
      game.words.push(word);
    }
  };

  /**
   * Normalises a dictionary definition for display. The whole definition is
   * kept -- the panel resizes to fit it rather than the text being cut.
   * @param {string} text - Raw definition.
   * @returns {string}
   */
  game.cleanHint = function (text) {
    var hint = text.replace(/\s+/g, " ").trim();

    // a lone leading "1." is noise, but once there is a second sense the
    // numbering is what separates them, so it stays
    if (!/\s\d+\.\s/.test(hint)) {
      hint = hint.replace(/^\s*\d+\.\s*/, "");
    }
    return hint;
  };

  /**
   * Wraps every hint to a column width, tagging the first line of each with
   * its target label.
   * @param {number} columns - Maximum characters per line.
   * @returns {Array}
   */
  game.wrapHints = function (columns) {
    var lines = [];

    for (var i = 0; i < game.hints.length; i++) {
      var wrapped = engine.wrapText(game.hints[i], columns);
      for (var w = 0; w < wrapped.length; w++) {
        lines.push({ label: w === 0 ? "TARGET " + (i + 1) : "", text: wrapped[w] });
      }
    }
    return lines;
  };

  /**
   * Chooses the largest type size at which the full definitions fit the band
   * between the HUD and the password strip, and returns the laid out lines.
   *
   * Smaller type wins twice over -- more lines fit the band and more characters
   * fit each line -- so stepping down one size roughly doubles the capacity.
   * Against the shipped dictionary the first size holds almost every round.
   *
   * @returns {object}
   */
  game.buildHintLayout = function () {
    var text_width = game.HINT_W - game.HINT_LABEL_W - 24;
    var available = game.HINT_BOTTOM - game.HINT_TOP - game.HINT_PAD;
    var layout = null;

    for (var s = 0; s < game.HINT_SIZES.length; s++) {
      var size = game.HINT_SIZES[s];
      var advance = game.canvas.measureAdvance(game.typeface(size));
      var line_height = Math.round(size * 1.35);

      layout = {
        size: size,
        line_height: line_height,
        columns: Math.max(8, Math.floor(text_width / advance)),
        max_lines: Math.max(1, Math.floor(available / line_height))
      };
      layout.lines = game.wrapHints(layout.columns);

      if (layout.lines.length <= layout.max_lines) {
        break;
      }
    }

    // the dictionary is editable, so an entry could still outrun the smallest
    // size -- drop the overflow rather than run text past the panel
    if (layout.lines.length > layout.max_lines) {
      layout.lines = layout.lines.slice(0, layout.max_lines);
      var last = layout.lines[layout.lines.length - 1];
      last.text = last.text.substring(0, Math.max(1, layout.columns - 3)) + "...";
    }

    layout.panel = new engine.Rectangle(
      game.HINT_X, game.HINT_TOP, game.HINT_W,
      game.HINT_PAD + layout.lines.length * layout.line_height
    );
    return layout;
  };

  /**
   * Starts a round at the given difficulty.
   * @param {number} tier_index - Index into game.tiers.
   */
  game.startRound = function (tier_index) {
    var tier = game.tiers[tier_index];
    var chosen = [];
    var digits = "";
    var i;

    game.difficulty = tier_index;
    game.score = 0;
    game.combo = 1;
    game.combo_flash = 0;
    game.wrong = 0;
    game.corruption = 0;
    game.outcome = null;
    game.outro = null;
    game.bonus_time = 0;
    game.bonus_attempts = 0;
    game.message = "AWAITING INPUT";
    game.message_colour = game.CYAN;
    game.guessed = {};
    game.popups = [];
    game.hint_reveal = 0;
    game.last_tick = -1;

    for (i = 0; i < tier.words; i++) {
      var word;
      var guard = 0;
      do {
        word = game.words[Math.floor(Math.random() * game.words.length)];
        guard++;
      } while (chosen.indexOf(word) !== -1 && guard < 40);
      chosen.push(word);
      digits += Math.floor(Math.random() * 10);
    }

    game.password = chosen.join("") + digits;
    game.hints = [];
    for (i = 0; i < chosen.length; i++) {
      game.hints.push(game.cleanHint(wordlist[chosen[i]]));
    }

    // laid out once here rather than per frame -- the hints cannot change
    // mid-round and the wrapping is the only expensive part of drawing them
    game.hint_layout = game.buildHintLayout();

    game.cells = [];
    for (i = 0; i < game.password.length; i++) {
      game.cells.push({ char: game.password.charAt(i), revealed: false, scramble: 0, lock: 0, flash: 0 });
    }

    game.timer = new engine.Timer(tier.seconds * 1000);
    game.timer.start();
    game.phase = game.PHASE_PLAY;
    game.phase_transitioning = true;
    game.audio.sweep(220, 880, 0.3, "square", 0.14);
  };

  /**
   * Seconds remaining in the current round.
   * @returns {number}
   */
  game.timeLeft = function () {
    var limit = game.tiers[game.difficulty].seconds;
    if (game.outcome) return Math.max(0, game.frozen_time);
    return Math.max(0, limit - game.timer.timePassedMillis() / 1000);
  };

  /**
   * Attempts remaining before the trace completes.
   * @returns {number}
   */
  game.attemptsLeft = function () {
    return game.tiers[game.difficulty].attempts - game.wrong;
  };

  /**
   * Ends the round and starts the outro beat before the result screen.
   * @param {string} outcome - One of "cracked", "traced" or "timeout".
   */
  game.finish = function (outcome) {
    var tier = game.tiers[game.difficulty];

    // freeze before flagging the outcome -- timeLeft reads frozen_time once an
    // outcome exists, so the order here decides whether the time bonus is real
    game.frozen_time = game.timeLeft();
    game.outcome = outcome;
    game.outro = new engine.Timer(1500);
    game.outro.start();

    if (outcome === "cracked") {
      game.bonus_time = Math.floor(game.frozen_time) * game.POINTS_PER_SECOND * tier.multiplier;
      game.bonus_attempts = game.attemptsLeft() * game.POINTS_PER_ATTEMPT * tier.multiplier;
      game.message = "PASSWORD CRACKED — ACCESS GRANTED";
      game.message_colour = game.PHOSPHOR;
      game.audio.arpeggio([523, 659, 784, 1047], 0.09);
      for (var i = 0; i < game.cells.length; i++) {
        game.cells[i].flash = 1;
      }
      game.particles.burst(
        new engine.Point(game.GAME_W * 0.5, game.cell_row_y), 90,
        { colour: game.PHOSPHOR, alt: game.CYAN, speed: 520, spread: Math.PI * 2, life: 1.4, gravity: 340, kind: "spark" }
      );
    } else {
      game.bonus_time = 0;
      game.bonus_attempts = 0;
      game.message = outcome === "traced"
        ? "TRACE COMPLETE — ACCESS PERMANENTLY BLOCKED"
        : "TIMEOUT — CONNECTION DROPPED";
      game.message_colour = game.MAGENTA;
      game.canvas.shake(26, 0.9);
      game.canvas.glitch(1, game.MAGENTA);
      game.audio.sweep(320, 40, 0.9, "sawtooth", 0.2);
      game.audio.noise(0.5, 0.12);
    }
  };

  /**
   * Handles a single letter or digit guess.
   * @param {string} char - Lowercase character guessed.
   */
  game.guess = function (char) {
    if (game.guessed[char]) return;
    game.guessed[char] = true;

    var tier = game.tiers[game.difficulty];
    var hits = 0;
    var i;

    for (i = 0; i < game.cells.length; i++) {
      if (game.cells[i].char === char && !game.cells[i].revealed) {
        game.cells[i].revealed = true;
        game.cells[i].scramble = 0.28;
        hits++;
      }
    }

    if (hits > 0) {
      var points = game.POINTS_PER_LETTER * hits * game.combo * tier.multiplier;
      game.score += points;
      game.combo = Math.min(game.COMBO_MAX, game.combo + 1);
      game.combo_flash = 1;
      game.message = hits + " × " + char.toUpperCase();
      game.message_colour = game.PHOSPHOR;
      // below the strip, over dark grid -- above it they would rise onto the
      // sun, where phosphor on amber is unreadable. Jittered so a fast streak
      // does not stack popups into one blur.
      game.popups.push({
        x: game.GAME_W * 0.5 + (Math.random() - 0.5) * 300,
        y: game.cell_row_y + 78,
        text: "+" + points, life: 1, colour: game.PHOSPHOR
      });
      game.audio.sweep(440 + game.combo * 90, 880 + game.combo * 120, 0.12, "square", 0.13);

      var cracked = true;
      for (i = 0; i < game.cells.length; i++) {
        if (!game.cells[i].revealed) { cracked = false; break; }
      }
      if (cracked) game.finish("cracked");
      return;
    }

    game.wrong++;
    game.combo = 1;
    game.corruption = engine.clamp(game.wrong / tier.attempts, 0, 1);
    game.message = "NO MATCH — " + char.toUpperCase() + " REJECTED";
    game.message_colour = game.MAGENTA;
    game.canvas.shake(10 + game.corruption * 14, 0.32);
    game.canvas.glitch(0.45 + game.corruption * 0.5, game.MAGENTA);
    game.audio.sweep(240, 70, 0.26, "sawtooth", 0.16);
    game.audio.noise(0.14, 0.07);
    game.particles.burst(
      new engine.Point(game.GAME_W * 0.5, game.trace_row_y), 26,
      { colour: game.MAGENTA, alt: game.AMBER, speed: 320, spread: Math.PI * 2, life: 0.7, gravity: 520, kind: "block" }
    );

    if (game.attemptsLeft() <= 0) game.finish("traced");
  };

  // ---------------------------------------------------------------------------
  // Screens
  // ---------------------------------------------------------------------------

  /**
   * Draws the title, difficulty panels and running scores.
   */
  game.drawMenu = function () {
    var entrance = engine.easeOutCubic(engine.clamp(game.menu_timer.timePassedMillis() / 900, 0, 1));
    var glitching = entrance < 0.85;
    var i;

    // eyebrow sits above the title rather than below it, which keeps the band
    // between the title and the horizon clear for the sun
    game.canvas.drawTracked(
      game.subtitle, new engine.Point(game.GAME_W * 0.5, 54),
      game.typeface(20), game.CYAN, 8, true, 0, entrance * 0.7
    );

    // title -- chromatic offset standing in for a channel split
    var title_y = 138;
    if (glitching) {
      var jog = (1 - entrance) * 26;
      game.canvas.drawTracked(
        game.title, new engine.Point(game.GAME_W * 0.5 - jog, title_y),
        game.typeface(104, "bold"), game.MAGENTA, 18, true, 0, 0.7
      );
      game.canvas.drawTracked(
        game.title, new engine.Point(game.GAME_W * 0.5 + jog, title_y),
        game.typeface(104, "bold"), game.PHOSPHOR, 18, true, 0, 0.7
      );
    }
    game.canvas.drawTracked(
      game.title, new engine.Point(game.GAME_W * 0.5, title_y),
      game.typeface(104, "bold"), game.CYAN, 18, true, 26, entrance
    );

    // difficulty panels -- staggered slide, numbered because the keys are the labels
    var panel_w = 480;
    var gap = 40;
    var start_x = (game.GAME_W - (panel_w * 3 + gap * 2)) * 0.5;

    for (i = 0; i < game.tiers.length; i++) {
      var tier = game.tiers[i];
      var stagger = engine.clamp((entrance - i * 0.12) / 0.6, 0, 1);
      var slide = (1 - engine.easeOutCubic(stagger)) * 70;
      var x = start_x + i * (panel_w + gap);
      var rect = new engine.Rectangle(x, 360 + slide, panel_w, 300);
      var colour = [game.PHOSPHOR, game.CYAN, game.MAGENTA][i];

      game.drawPanel(rect, colour, 0.95 * stagger, 0.6 * stagger);

      game.canvas.drawText(
        "[" + (i + 1) + "]", new engine.Point(rect.x + 32, rect.y + 30),
        game.typeface(38, "bold"), colour, false, 14, stagger
      );
      game.canvas.drawText(
        tier.name, new engine.Point(rect.x + panel_w - 32, rect.y + 34),
        game.typeface(34, "bold"), colour, false, 10, stagger, "right"
      );

      game.canvas.drawLine(
        new engine.Point(rect.x + 24, rect.y + 96),
        new engine.Point(rect.x + panel_w - 24, rect.y + 96),
        colour, 1, 0.4 * stagger
      );

      var rows = [
        tier.words + (tier.words === 1 ? " WORD" : " WORDS") + " + " + tier.words + (tier.words === 1 ? " DIGIT" : " DIGITS"),
        tier.seconds + " SECONDS",
        tier.attempts + " ATTEMPTS",
        "SCORE ×" + tier.multiplier
      ];
      for (var r = 0; r < rows.length; r++) {
        game.canvas.drawText(
          rows[r], new engine.Point(rect.x + 32, rect.y + 128 + r * 42),
          game.typeface(22), colour, false, 0, 0.8 * stagger
        );
      }
    }

    // score ledger
    var ledger = new engine.Rectangle(start_x, 712, panel_w * 3 + gap * 2, 108);
    game.drawPanel(ledger, game.CYAN, 0.92 * entrance, 0.35 * entrance);

    var stats = [
      ["TEAM SCORE", game.team_score, game.PHOSPHOR],
      ["LAST RUN", game.last_score, game.CYAN],
      ["PERSONAL BEST", game.best_score, game.AMBER]
    ];
    var third = ledger.width / 3;
    for (i = 0; i < stats.length; i++) {
      var cx = ledger.x + third * i + third * 0.5;
      game.canvas.drawText(
        stats[i][0], new engine.Point(cx, ledger.y + 20),
        game.typeface(18), stats[i][2], true, 0, 0.55 * entrance
      );
      game.canvas.drawText(
        engine.formatNumber(stats[i][1]), new engine.Point(cx, ledger.y + 48),
        game.typeface(40, "bold"), stats[i][2], true, 12, entrance
      );
    }

    game.canvas.drawText(
      "PRESS 1 · 2 · 3 TO CONNECT", new engine.Point(game.GAME_W * 0.5, 880),
      game.typeface(26, "bold"), game.AMBER, true, 14,
      entrance * (0.6 + Math.sin(game.time * 4) * 0.4)
    );

    game.drawFooter();
  };

  /**
   * Draws the in-round HUD, hints, cells and key grid.
   * @param {number} dt - Seconds since the previous frame.
   */
  game.drawPlay = function (dt) {
    var tier = game.tiers[game.difficulty];
    var time_left = game.timeLeft();
    var critical = time_left <= 5;
    var warning = time_left <= 15;
    var i;

    game.hint_reveal = Math.min(1, game.hint_reveal + dt / 1.1);

    // top-left: score and combo
    var score_panel = new engine.Rectangle(48, 36, 460, 96);
    game.drawPanel(score_panel, game.CYAN);
    game.canvas.drawText("SCORE", new engine.Point(score_panel.x + 22, score_panel.y + 16),
      game.typeface(18), game.CYAN, false, 0, 0.6);
    game.canvas.drawText(engine.formatNumber(game.score),
      new engine.Point(score_panel.x + 22, score_panel.y + 42),
      game.typeface(40, "bold"), game.CYAN, false, 12);

    var combo_colour = game.combo > 1 ? game.AMBER : game.CYAN;
    game.canvas.drawText("COMBO", new engine.Point(score_panel.x + score_panel.width - 22, score_panel.y + 16),
      game.typeface(18), combo_colour, false, 0, 0.6, "right");
    game.canvas.drawText("×" + game.combo,
      new engine.Point(score_panel.x + score_panel.width - 22, score_panel.y + 42),
      game.typeface(40, "bold"), combo_colour, false, game.combo > 1 ? 16 : 0,
      0.8 + game.combo_flash * 0.2, "right");

    // top-right: clock
    var time_panel = new engine.Rectangle(game.GAME_W - 508, 36, 460, 96);
    var time_colour = critical ? game.MAGENTA : (warning ? game.AMBER : game.CYAN);
    game.drawPanel(time_panel, time_colour);
    game.canvas.drawText("TIME", new engine.Point(time_panel.x + 22, time_panel.y + 16),
      game.typeface(18), time_colour, false, 0, 0.6);
    game.canvas.drawText(time_left.toFixed(1) + "s",
      new engine.Point(time_panel.x + time_panel.width - 22, time_panel.y + 10),
      game.typeface(40, "bold"), time_colour, false, critical ? 18 : 8,
      critical ? 0.7 + Math.sin(game.time * 14) * 0.3 : 1, "right");
    game.drawBar(
      new engine.Rectangle(time_panel.x + 22, time_panel.y + 62, time_panel.width - 44, 18),
      time_left / tier.seconds, time_colour
    );

    // hints -- wrapped and sized once per round by game.buildHintLayout
    var hints = game.hint_layout;
    var hint_font = game.typeface(hints.size);
    var label_font = game.typeface(hints.size, "bold");

    game.drawPanel(hints.panel, game.CYAN, 0.92, 0.3);

    var total_chars = 0;
    for (i = 0; i < hints.lines.length; i++) {
      total_chars += hints.lines[i].text.length;
    }
    var shown = Math.floor(total_chars * game.hint_reveal);
    var consumed = 0;

    for (i = 0; i < hints.lines.length; i++) {
      var line = hints.lines[i];
      var take = engine.clamp(shown - consumed, 0, line.text.length);
      consumed += line.text.length;
      var y = hints.panel.y + 16 + i * hints.line_height;

      if (line.label) {
        game.canvas.drawText(line.label, new engine.Point(hints.panel.x + 22, y),
          label_font, game.AMBER, false, 0, 0.85);
      }
      if (take > 0) {
        game.canvas.drawText(line.text.substring(0, take),
          new engine.Point(hints.panel.x + game.HINT_LABEL_W, y), hint_font, game.CYAN, false, 0, 0.9);
      }
    }

    // the password itself
    game.drawCells(game.cell_row_y, false);

    // message
    game.canvas.drawText(game.message, new engine.Point(game.GAME_W * 0.5, 612),
      game.typeface(26, "bold"), game.message_colour, true, 12, 0.95);

    // trace -- one element carrying both the fiction and the attempt count
    var blocks = tier.attempts;
    var block_w = 34;
    var block_gap = 8;
    var trace_total = blocks * (block_w + block_gap) - block_gap;
    var trace_x = (game.GAME_W - trace_total) * 0.5;

    game.canvas.drawText("TRACE", new engine.Point(trace_x - 24, game.trace_row_y - 4),
      game.typeface(20, "bold"), game.MAGENTA, false, 0, 0.8, "right");

    for (i = 0; i < blocks; i++) {
      var burned = i < game.wrong;
      var block = new engine.Rectangle(trace_x + i * (block_w + block_gap), game.trace_row_y - 10, block_w, 26);
      if (burned) {
        var pulse = 0.7 + Math.sin(game.time * 6 + i) * 0.3;
        game.canvas.fillRect(block, game.MAGENTA, pulse);
      } else {
        game.canvas.fillRect(block, game.CYAN, 0.1);
        game.canvas.drawRect(block, game.CYAN, 2, 0.45);
      }
    }

    game.canvas.drawText(
      game.attemptsLeft() + " LEFT",
      new engine.Point(trace_x + trace_total + 24, game.trace_row_y - 4),
      game.typeface(20, "bold"), game.attemptsLeft() <= 2 ? game.MAGENTA : game.CYAN, false, 0, 0.8
    );

    // key grid -- replaces the old comma-joined list of bad letters
    var key_size = 42;
    var key_gap = 6;
    var key_total = game.KEYS.length * (key_size + key_gap) - key_gap;
    var key_x = (game.GAME_W - key_total) * 0.5;

    for (i = 0; i < game.KEYS.length; i++) {
      var key = game.KEYS.charAt(i);
      var lower = key.toLowerCase();
      var rect = new engine.Rectangle(key_x + i * (key_size + key_gap), game.key_row_y, key_size, key_size);
      var state = "idle";
      if (game.guessed[lower]) {
        state = game.password.indexOf(lower) !== -1 ? "hit" : "miss";
      }
      var key_colour = state === "hit" ? game.PHOSPHOR : (state === "miss" ? game.MAGENTA : game.CYAN);
      var strength = state === "idle" ? 0.22 : 0.85;

      game.canvas.fillRect(rect, key_colour, state === "hit" ? 0.2 : 0.05);
      game.canvas.drawRect(rect, key_colour, 2, strength * 0.7);
      game.canvas.drawGlyph(
        key, new engine.Point(rect.x + key_size * 0.5, rect.y + key_size * 0.5),
        game.typeface(22, "bold"), key_colour, strength, state === "hit" ? 10 : 0, true
      );
      if (state === "miss") {
        game.canvas.drawLine(
          new engine.Point(rect.x + 8, rect.y + key_size - 8),
          new engine.Point(rect.x + key_size - 8, rect.y + 8),
          game.MAGENTA, 2, 0.7
        );
      }
    }

    game.drawFooter();

    // clock tick
    var second = Math.ceil(time_left);
    if (!game.outcome && second !== game.last_tick && second <= 5 && second > 0) {
      game.last_tick = second;
      game.audio.blip(180, 0.09, "sine", 0.18);
      game.canvas.shake(4, 0.12);
    }

    if (!game.outcome && time_left <= 0) game.finish("timeout");

    if (game.outcome && game.outro.alarm()) {
      game.last_score = game.score + game.bonus_time + game.bonus_attempts;
      game.phase = game.PHASE_RESULT;
      game.phase_transitioning = true;
      game.result_timer = new engine.Timer(1);
      game.result_timer.start();
    }
  };

  /**
   * Draws the end-of-round verdict and score breakdown.
   */
  game.drawResult = function () {
    var elapsed = game.result_timer.timePassedMillis() / 1000;
    var cracked = game.outcome === "cracked";
    var colour = cracked ? game.PHOSPHOR : game.MAGENTA;
    var total = game.score + game.bonus_time + game.bonus_attempts;
    var i;

    game.canvas.drawTracked(
      cracked ? "ACCESS GRANTED" : "ACCESS DENIED",
      new engine.Point(game.GAME_W * 0.5, 128),
      game.typeface(76, "bold"), colour, 12, true, 28
    );
    game.canvas.drawText(game.message, new engine.Point(game.GAME_W * 0.5, 214),
      game.typeface(24), colour, true, 0, 0.8);

    game.canvas.drawText("PASSWORD", new engine.Point(game.GAME_W * 0.5, 262),
      game.typeface(18), game.CYAN, true, 0, 0.55);
    game.drawCells(366, true);

    // breakdown
    var rows = [
      ["LETTERS CRACKED", game.score, game.CYAN],
      ["TIME BONUS", game.bonus_time, game.AMBER],
      ["UNUSED ATTEMPTS", game.bonus_attempts, game.PHOSPHOR]
    ];
    var panel = new engine.Rectangle(game.GAME_W * 0.5 - 400, 490, 800, 260);
    game.drawPanel(panel, colour, 0.6, 0.4);

    for (i = 0; i < rows.length; i++) {
      var fade = engine.clamp((elapsed - i * 0.16) / 0.3, 0, 1);
      var y = panel.y + 28 + i * 48;
      game.canvas.drawText(rows[i][0], new engine.Point(panel.x + 32, y),
        game.typeface(24), rows[i][2], false, 0, 0.75 * fade);
      game.canvas.drawText(engine.formatNumber(rows[i][1]),
        new engine.Point(panel.x + panel.width - 32, y),
        game.typeface(24, "bold"), rows[i][2], false, 0, fade, "right");
    }

    var total_fade = engine.clamp((elapsed - 0.55) / 0.35, 0, 1);
    game.canvas.drawLine(
      new engine.Point(panel.x + 32, panel.y + 178),
      new engine.Point(panel.x + panel.width - 32, panel.y + 178),
      colour, 1, 0.4 * total_fade
    );
    game.canvas.drawText("RUN TOTAL", new engine.Point(panel.x + 32, panel.y + 200),
      game.typeface(30, "bold"), colour, false, 0, 0.8 * total_fade);
    game.canvas.drawText(engine.formatNumber(total),
      new engine.Point(panel.x + panel.width - 32, panel.y + 196),
      game.typeface(44, "bold"), colour, false, 16, total_fade, "right");

    var team_fade = engine.clamp((elapsed - 0.9) / 0.4, 0, 1);
    game.canvas.drawText("TEAM SCORE", new engine.Point(game.GAME_W * 0.5, 796),
      game.typeface(20), game.CYAN, true, 0, 0.6 * team_fade);
    game.canvas.drawText(engine.formatNumber(game.team_score + total),
      new engine.Point(game.GAME_W * 0.5, 826),
      game.typeface(52, "bold"), game.CYAN, true, 18, team_fade);

    game.canvas.drawText("PRESS SPACE TO RECONNECT", new engine.Point(game.GAME_W * 0.5, 940),
      game.typeface(26, "bold"), game.AMBER, true, 14,
      0.55 + Math.sin(game.time * 4) * 0.45);

    game.drawFooter();
  };

  /**
   * Draws the persistent control hints along the bottom edge.
   */
  game.drawFooter = function () {
    var hints = game.phase === game.PHASE_PLAY
      ? "ESC ABORT      M " + (game.audio.muted ? "UNMUTE" : "MUTE")
      : "M " + (game.audio.muted ? "UNMUTE" : "MUTE");
    game.canvas.drawText(hints, new engine.Point(game.GAME_W - 48, 1032),
      game.typeface(18), game.CYAN, false, 0, 0.4, "right");
  };

  // ---------------------------------------------------------------------------
  // Loop and input
  // ---------------------------------------------------------------------------

  game.loop = function (dt) {
    game.phase_transitioning = false;
    game.time += dt;
    game.combo_flash = Math.max(0, game.combo_flash - dt / 0.35);

    // corruption relaxes on the menu so the world calms between runs
    if (game.phase !== game.PHASE_PLAY && game.phase !== game.PHASE_RESULT) {
      game.corruption = Math.max(0, game.corruption - dt * 0.5);
    }

    game.drawSky();
    game.drawSun();
    game.drawGrid(dt);
    game.drawRain(dt);

    switch (game.phase) {
      case game.PHASE_MENU:
        game.drawMenu();
        break;

      case game.PHASE_PLAY:
        game.updateCells(dt);
        game.drawPlay(dt);
        break;

      case game.PHASE_RESULT:
        game.updateCells(dt);
        game.drawResult();
        break;
    }

    // floating score popups
    for (var i = game.popups.length - 1; i >= 0; i--) {
      var pop = game.popups[i];
      pop.life -= dt / 1.1;
      pop.y -= dt * 90;
      if (pop.life <= 0) {
        game.popups.splice(i, 1);
        continue;
      }
      game.canvas.drawText(pop.text, new engine.Point(pop.x, pop.y),
        game.typeface(34, "bold"), pop.colour, true, 9, engine.clamp(pop.life, 0, 1));
    }

    game.particles.update(dt);
    game.particles.draw(game.canvas);

    game.canvas.scanlines(0.06 + game.corruption * 0.08);
    game.canvas.vignette(game.VOID, 0.55 + game.corruption * 0.25);

    if (document.activeElement !== game.canvas.canvas) {
      game.canvas.focus();
    }
  };

  game.keypress = function (key) {
    if (key === engine.KEY_M) {
      game.audio.toggleMute();
      return;
    }

    game.audio.unlock();
    if (game.phase_transitioning) return;

    switch (game.phase) {
      case game.PHASE_MENU:
        if (key >= engine.KEY_1 && key <= engine.KEY_3) {
          game.startRound(key - engine.KEY_1);
        }
        break;

      case game.PHASE_PLAY:
        if (game.outcome) return;
        if (key === engine.KEY_ESCAPE) {
          game.toMenu(false);
          return;
        }
        if ((key >= engine.KEY_A && key <= engine.KEY_Z) || (key >= engine.KEY_0 && key <= engine.KEY_9)) {
          game.guess(String.fromCharCode(key).toLowerCase());
        }
        break;

      case game.PHASE_RESULT:
        if (key === engine.KEY_SPACE) {
          game.toMenu(true);
        }
        break;
    }
  };

  /**
   * Returns to the menu, optionally banking the round score.
   * @param {boolean} bank - Whether to add the run total to the team score.
   */
  game.toMenu = function (bank) {
    if (bank) {
      var total = game.score + game.bonus_time + game.bonus_attempts;
      game.team_score += total;
      game.last_score = total;
      if (total > game.best_score) {
        game.best_score = total;
        engine.store.set("hackman.best", game.best_score);
      }
      engine.store.set("hackman.team", game.team_score);
      game.audio.blip(880, 0.08, "square", 0.12);
    } else {
      game.audio.sweep(400, 120, 0.2, "sawtooth", 0.12);
    }

    game.phase = game.PHASE_MENU;
    game.phase_transitioning = true;
    game.outcome = null;
    game.menu_timer = new engine.Timer(900);
    game.menu_timer.start();
  };

  game.resize = function () {
    game.canvas.resize(null, new engine.Dimension(game.GAME_W, game.GAME_H));
  };

  game.init = function () {
    game.phase = game.PHASE_MENU;
    game.phase_transitioning = false;
    game.difficulty = 1;
    game.score = 0;
    game.combo = 1;
    game.combo_flash = 0;
    game.wrong = 0;
    game.corruption = 0;
    game.password = "";
    game.cells = [];
    game.hints = [];
    game.guessed = {};
    game.popups = [];
    game.message = "";
    game.message_colour = game.CYAN;
    game.outcome = null;
    game.outro = null;
    game.bonus_time = 0;
    game.bonus_attempts = 0;
    game.frozen_time = 0;
    game.hint_reveal = 0;
    game.hint_layout = null;
    game.last_tick = -1;
    game.grid_phase = 0;

    // row positions shared between drawing and particle spawning
    game.cell_row_y = 470;
    game.trace_row_y = 690;
    game.key_row_y = 900;

    game.timer = new engine.Timer(1000);
    game.menu_timer = new engine.Timer(900);
    game.menu_timer.start();
    game.result_timer = new engine.Timer(1);
    game.particles = new engine.ParticleSystem(700);
    game.audio = new engine.Audio();

    game.team_score = Number(engine.store.get("hackman.team", 0)) || 0;
    game.best_score = Number(engine.store.get("hackman.best", 0)) || 0;
    game.last_score = 0;

    game.buildWordIndex();
    game.initRain();
  };

  // ---------------------------------------------------------------------------
  // ENGINE
  //
  // Generic 2D canvas engine. Knows nothing about Hackman.
  // ---------------------------------------------------------------------------

  var engine = {
    MOUSE_LEFT: 1,
    MOUSE_MIDDLE: 2,
    MOUSE_RIGHT: 3,
    KEY_UP: 38,
    KEY_DOWN: 40,
    KEY_LEFT: 37,
    KEY_RIGHT: 39,
    KEY_SHIFT: 16,
    KEY_CONTROL: 17,
    KEY_ALT: 18,
    KEY_BACKSPACE: 8,
    KEY_SPACE: 32,
    KEY_ENTER: 13,
    KEY_ESCAPE: 27,
    KEY_TAB: 9,
    KEY_CAPSLOCK: 20,
    KEY_0: 48,
    KEY_1: 49,
    KEY_2: 50,
    KEY_3: 51,
    KEY_4: 52,

      // a single word wider than the line would otherwise overflow, so break it
      while (word.length > max_chars) {
        if (line.length > 0) {
          lines.push(line);
          line = "";
        }
        lines.push(word.substring(0, max_chars));
        word = word.substring(max_chars);

      var candidate = line.length === 0 ? word : line + " " + word;
      if (candidate.length > max_chars && line.length > 0) {
        lines.push(line);

  /**

   * @param {number} [x] - Horizontal grid position.
   * @param {number} [y] - Vertical grid position.
   */

    this.y = 0;

    }

    if (y) {

      this.y >= rect.y && this.y <= rect.y + rect.height;

    }

    if (height) {
      this.height = height;

  /**
   * Rectangle serves as a selection area within an image used in drawing or positioning.
   * @constructor
   * @param {number} [x] - Horizontal grid position.
   * @param {number} [y] - Vertical grid position.
   * @param {number} [width] - Width of grid.
   * @param {number} [height] - Height of grid.
   */
  engine.Rectangle = function (x, y, width, height) {
    this.x = 0;
    this.y = 0;
    this.width = 0;
    this.height = 0;

      this.x = x;
    }

    if (y) {
      this.y = y;

    if (width) {

    }

    if (height) {
      this.height = height;
    }

  /**
   * Returns whether or not the rectangle intersects/collides with another rectangle or point.
   * @param {engine.Rectangle|engine.Point} area - Rectangle or point to see if rectangle intersects.
   * @returns {boolean}
   */
  engine.Rectangle.prototype.intersects = function (area) {
    // check if area has a width and height
    if (area instanceof engine.Rectangle) {
      // handle area as a rectangle
      var xleft = Math.max(this.x, area.x);
      var xright = Math.min(this.x + this.width, area.x + area.width);
      var xtop = Math.max(this.y, area.y);
      var xbottom = Math.min(this.y + this.height, area.y + area.height);
      return xright > xleft && xbottom > xtop;
    } else if (area instanceof engine.Point) {
      // handle area as a point
      return area.x >= this.x && area.x <= (this.x + this.width) && area.y >= this.y && area.y <= (this.y + this.height);

  /**

   * @param {engine.Point} origin - Where to spawn from.

   * @param {object} options - colour, alt, speed, spread, life, gravity, kind.
   */
  engine.ParticleSystem.prototype.burst = function (origin, count, options) {
    for (var i = 0; i < count; i++) {
      var particle = this.particles[this.next];
      this.next = (this.next + 1) % this.capacity;

      var angle = Math.random() * (options.spread || Math.PI * 2);
      var speed = (options.speed || 200) * (0.35 + Math.random() * 0.65);

      particle.x = origin.x;
      particle.y = origin.y;
      particle.vx = Math.cos(angle) * speed;
      particle.vy = Math.sin(angle) * speed;
      particle.max_life = (options.life || 0.8) * (0.6 + Math.random() * 0.4);
      particle.life = particle.max_life;
      particle.gravity = options.gravity || 0;
      particle.drag = options.drag || 0.94;
      particle.size = options.size || (1.5 + Math.random() * 2.5);
      particle.kind = options.kind || "spark";

  /**
   * Advances every live particle.
   * @param {number} dt - Seconds since the previous frame.

      if (particle.life <= 0) continue;

      particle.life -= dt;
      particle.vy += particle.gravity * dt;
      particle.vx *= Math.pow(particle.drag, dt * 60);
      particle.vy *= Math.pow(particle.drag, dt * 60);
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
    }
  };

  /**
   * Draws every live particle.
   * @param {engine.Canvas} canvas - Canvas to draw to.

      var particle = this.particles[i];
      if (particle.life <= 0) continue;

      var fade = engine.clamp(particle.life / particle.max_life, 0, 1);

      if (particle.kind === "block") {

          new engine.Rectangle(particle.x, particle.y, particle.size * 2, particle.size * 2),
          particle.colour, fade

      } else {

        var tail = 0.03;
        canvas.drawLine(
          new engine.Point(particle.x, particle.y),
          new engine.Point(particle.x - particle.vx * tail, particle.y - particle.vy * tail),
          particle.colour, particle.size, fade
        );
      }
    }
  };

    var dy = Math.floor(rect.y * this.canvas_game_ratio.y);
    var dw = Math.floor(Math.max(1, rect.width) * this.canvas_game_ratio.x);

    this.context.save();
    this.context.beginPath();
    this.context.arc(
      Math.floor(centre.x * this.canvas_game_ratio.x),
      Math.floor(centre.y * this.canvas_game_ratio.y),
      Math.floor(radius * this.canvas_game_ratio.x),
      0, Math.PI * 2
    );
    this.context.clip();
  };

  /**
   * Clips subsequent drawing to a rectangle. Pair with restore().
   * @param {engine.Rectangle} rect - Clip bounds.
   */
  engine.Canvas.prototype.clipRect = function (rect) {
    this.context.save();
    this.context.beginPath();
    this.context.rect(
      Math.floor(rect.x * this.canvas_game_ratio.x),
      Math.floor(rect.y * this.canvas_game_ratio.y),
      Math.floor(rect.width * this.canvas_game_ratio.x),
      Math.floor(rect.height * this.canvas_game_ratio.y)
    );
    this.context.clip();
  };

  /**
   * Pops one saved context state, undoing a clip.
   */
  engine.Canvas.prototype.restore = function () {
    this.context.restore();
  };

  /**
   * Rasterises text to an offscreen canvas and caches it.
   * @param {string} text - Text to rasterise.
   * @param {string} font - Font at game-space size.
   * @param {string} color - Text color.
   * @param {number} glow - Glow radius in game units.
   * @returns {Element}
   */
  engine.Canvas.prototype.cacheText = function (text, font, color, glow) {
    var key = text + "|" + font + "|" + color + "|" + glow;

    if (key in this.text_cache) {
      return this.text_cache[key];
    }

    // dynamic strings such as the score produce a new entry every frame, so the
    // cache is dropped wholesale once it grows past a sane working set
    if (this.text_cache_size > 420) {
      this.text_cache = {};
      this.text_cache_size = 0;
    }

    var scale = this.canvas_game_ratio.x;
    var device_font = engine.scaleFont(font, scale);
    var pad = Math.ceil((glow * scale) + 4);

    var text_canvas = document.createElement("canvas");
    var text_context = text_canvas.getContext("2d");
    text_context["font"] = device_font;

    var width = Math.ceil(text_context.measureText(text).width) + pad * 2;
    var height = Math.ceil(text_context.measureText("M").width * 2.2) + pad * 2;
    text_canvas.width = width;
    text_canvas.height = height;

    text_context = text_canvas.getContext("2d");
    text_context["font"] = device_font;
    text_context["fillStyle"] = color;
    text_context["textBaseline"] = "top";
    text_context["textAlign"] = "left";

    if (glow > 0) {
      text_context["shadowColor"] = color;
      text_context["shadowBlur"] = glow * scale;
      text_context.fillText(text, pad, pad);
      text_context.fillText(text, pad, pad);
    }
    text_context["shadowBlur"] = 0;
    text_context.fillText(text, pad, pad);

    this.text_cache[key] = text_canvas;
    this.text_cache_size++;
    return text_canvas;
  };

  /**
   * Draw text to the canvas for a single frame, cached for speed.
   * @param {string} text - Text to draw.
   * @param {engine.Point} pos - Position to draw text to.
   * @param {string} font - Font to draw (face, size, weight) at game-space size.
   * @param {string} color - Color of font.
   * @param {boolean} [centered] - Whether or not to center the text horizontally.
   * @param {number} [glow] - Glow radius in game units.
   * @param {number} [alpha] - Alpha channel (1.0=no transparency, 0=transparency).
   * @param {string} [align] - Pass "right" to right-align against pos instead.
   */
  engine.Canvas.prototype.drawText = function (text, pos, font, color, centered, glow, alpha, align) {
    glow = glow || 0;
    alpha = (alpha !== undefined) ? alpha : 1;
    if (!this.running) {
      this.refresh();
    }
    if (text.length === 0 || alpha <= 0) {
      return;
    }

    var text_canvas = this.cacheText(text, font, color, glow);
    var scale = this.canvas_game_ratio.x;
    var pad = Math.ceil((glow * scale) + 4);
    var ink = text_canvas.width - pad * 2;

    var dx = Math.floor(pos.x * this.canvas_game_ratio.x) - pad;
    if (centered) {
      dx -= Math.floor(ink * 0.5);
    } else if (align === "right") {
      dx -= ink;
    }
    var dy = Math.floor(pos.y * this.canvas_game_ratio.y) - pad;

    this.context.save();
    this.context["globalAlpha"] = alpha;
    this.context.drawImage(text_canvas, dx, dy);
    this.context.restore();
  };

  /**
   * Draws a single character, cached separately from full strings because the
   * glyph set is small and reused heavily by the rain and the decode cells.
   * @param {string} char - Character to draw.
   * @param {engine.Point} pos - Position to draw to.
   * @param {string} font - Font at game-space size.
   * @param {string} color - Color of the glyph.
   * @param {number} [alpha] - Alpha channel (1.0=no transparency, 0=transparency).
   * @param {number} [glow] - Glow radius in game units.
   * @param {boolean} [centered] - Whether to center on pos both horizontally and vertically.
   * @param {number} [scale] - Optional scale multiplier applied about pos.
   */
  engine.Canvas.prototype.drawGlyph = function (char, pos, font, color, alpha, glow, centered, scale) {
    glow = glow || 0;
    alpha = (alpha !== undefined) ? alpha : 1;
    scale = scale || 1;
    if (!this.running) {
      this.refresh();
    }
    if (alpha <= 0) {
      return;
    }

    var key = char + "|" + font + "|" + color + "|" + glow;
    var glyph_canvas = this.glyph_cache[key];

    if (!glyph_canvas) {
      var ratio = this.canvas_game_ratio.x;
      var device_font = engine.scaleFont(font, ratio);
      var pad = Math.ceil((glow * ratio) + 4);

      glyph_canvas = document.createElement("canvas");
      var glyph_context = glyph_canvas.getContext("2d");
      glyph_context["font"] = device_font;

      var metrics = glyph_context.measureText(char);
      glyph_canvas.width = Math.ceil(metrics.width) + pad * 2;
      glyph_canvas.height = Math.ceil(glyph_context.measureText("M").width * 2.2) + pad * 2;

      glyph_context = glyph_canvas.getContext("2d");
      glyph_context["font"] = device_font;
      glyph_context["fillStyle"] = color;
      glyph_context["textBaseline"] = "middle";
      glyph_context["textAlign"] = "center";

      if (glow > 0) {
        glyph_context["shadowColor"] = color;
        glyph_context["shadowBlur"] = glow * ratio;
        glyph_context.fillText(char, glyph_canvas.width * 0.5, glyph_canvas.height * 0.5);
      }
      glyph_context["shadowBlur"] = 0;
      glyph_context.fillText(char, glyph_canvas.width * 0.5, glyph_canvas.height * 0.5);

      this.glyph_cache[key] = glyph_canvas;
    }

    var dw = glyph_canvas.width * scale;
    var dh = glyph_canvas.height * scale;
    var dx = Math.floor(pos.x * this.canvas_game_ratio.x) - (centered ? dw * 0.5 : 0);
    var dy = Math.floor(pos.y * this.canvas_game_ratio.y) - (centered ? dh * 0.5 : 0);

    this.context.save();
    this.context["globalAlpha"] = alpha;
    this.context.drawImage(glyph_canvas, dx, dy, dw, dh);
    this.context.restore();
  };

  /**
   * Draws text with manual letter spacing, glyph by glyph.
   * @param {string} text - Text to draw.
   * @param {engine.Point} pos - Position to draw to.
   * @param {string} font - Font at game-space size.
   * @param {string} color - Text color.
   * @param {number} tracking - Extra space between characters in game units.
   * @param {boolean} [centered] - Whether to center the run horizontally on pos.
   * @param {number} [glow] - Glow radius in game units.
   * @param {number} [alpha] - Alpha channel (1.0=no transparency, 0=transparency).
   */
  engine.Canvas.prototype.drawTracked = function (text, pos, font, color, tracking, centered, glow, alpha) {
    alpha = (alpha !== undefined) ? alpha : 1;
    if (!this.running) {
      this.refresh();
    }
    if (text.length === 0 || alpha <= 0) {
      return;
    }

    // monospace, so one measurement covers every glyph
    var advance = this.measureAdvance(font) + tracking;
    var total = advance * text.length - tracking;
    var x = centered ? pos.x - total * 0.5 : pos.x;

    for (var i = 0; i < text.length; i++) {
      this.drawGlyph(
        text.charAt(i),
        new engine.Point(x + advance * i + advance * 0.5, pos.y),
        font, color, alpha, glow, true
      );
    }
  };

  /**
   * Measures the advance width of one character in game units.
   * @param {string} font - Font at game-space size.
   * @returns {number}
   */
  engine.Canvas.prototype.measureAdvance = function (font) {
    if (!this.advance_cache) {
      this.advance_cache = {};
    }
    if (!(font in this.advance_cache)) {
      var scratch = document.createElement("canvas").getContext("2d");
      scratch["font"] = font;
      this.advance_cache[font] = scratch.measureText("M").width;
    }
    return this.advance_cache[font];
  };

  /**
   * Overlays horizontal CRT scanlines across the whole canvas.
   * @param {number} strength - Line alpha from 0 to 1.
   */
  engine.Canvas.prototype.scanlines = function (strength) {
    if (strength <= 0) {
      return;
    }

    this.context.save();
    this.context.setTransform(1, 0, 0, 1, 0, 0);
    this.context["fillStyle"] = "#000000";
    this.context["globalAlpha"] = strength;
    for (var y = 0; y < this.canvas_size.height; y += 3) {
      this.context.fillRect(0, y, this.canvas_size.width, 1);
    }
    this.context.restore();
  };

  /**
   * Darkens the edges of the canvas.
   * @param {string} color - Vignette color.
   * @param {number} strength - Edge alpha from 0 to 1.
   */
  engine.Canvas.prototype.vignette = function (color, strength) {
    var w = this.canvas_size.width;
    var h = this.canvas_size.height;

    this.context.save();
    this.context.setTransform(1, 0, 0, 1, 0, 0);
    var gradient = this.context.createRadialGradient(
      w * 0.5, h * 0.5, Math.min(w, h) * 0.32,
      w * 0.5, h * 0.5, Math.max(w, h) * 0.75
    );
    gradient.addColorStop(0, "rgba(0,0,0,0)");
    gradient.addColorStop(1, color);
    this.context["fillStyle"] = gradient;
    this.context["globalAlpha"] = strength;
    this.context.fillRect(0, 0, w, h);
    this.context.restore();
  };

  /**
   * Triggers a decaying screen shake.
   * @param {number} magnitude - Peak displacement in game units.
   * @param {number} duration - Seconds for the shake to decay over.
   */
  engine.Canvas.prototype.shake = function (magnitude, duration) {
    this.shake_magnitude = Math.max(this.shake_magnitude, magnitude);
    this.shake_duration = duration;
    this.shake_time = duration;
  };

  /**
   * Triggers a decaying glitch pass applied after the frame is drawn.
   * @param {number} intensity - Strength from 0 to 1.
   * @param {string} color - Tint color for the displaced bands.
   */
  engine.Canvas.prototype.glitch = function (intensity, color) {
    this.glitch_intensity = Math.max(this.glitch_intensity, intensity);
    this.glitch_colour = color;
  };

  /**
   * Applies the glitch pass by displacing horizontal bands of the finished
   * frame sideways and tinting them.
   * @param {number} dt - Seconds since the previous frame.
   */
  engine.Canvas.prototype.applyGlitch = function (dt) {
    if (this.glitch_intensity <= 0.001) {
      this.glitch_intensity = 0;
      return;
    }

    var w = this.canvas_size.width;
    var h = this.canvas_size.height;
    var strength = this.glitch_intensity;
    var bands = 3 + Math.floor(strength * 9);

    this.context.save();
    this.context.setTransform(1, 0, 0, 1, 0, 0);

    for (var i = 0; i < bands; i++) {
      var band_h = 6 + Math.random() * 46 * strength;
      var sy = Math.random() * (h - band_h);
      var shift = (Math.random() - 0.5) * 90 * strength;

      this.context.drawImage(
        this.canvas,
        0, sy, w, band_h,
        shift, sy, w, band_h
      );

      this.context["fillStyle"] = this.glitch_colour;
      this.context["globalAlpha"] = 0.12 * strength;
      this.context.fillRect(0, sy, w, band_h);
      this.context["globalAlpha"] = 1;
    }

    this.context["fillStyle"] = this.glitch_colour;
    this.context["globalAlpha"] = 0.07 * strength;
    this.context.fillRect(0, 0, w, h);
    this.context.restore();

    this.glitch_intensity = Math.max(0, this.glitch_intensity - dt * 3.2);
  };

  /**
   * Refreshes the canvas for internal use only.
   */
  engine.Canvas.prototype.refresh = function () {
    // obtain context for batching
    this.context = this.canvas.getContext("2d");

    // keep gameloop going if running
    if (this.running) {
      var now = new Date().getTime();
      var dt = this.last_frame === 0 ? 0.016 : (now - this.last_frame) / 1000;
      this.last_frame = now;

      // a backgrounded tab can produce an enormous delta on return
      dt = engine.clamp(dt, 0, 0.05);

      // reset key/mouse states when focus is lost (make sure canvas objects have a tabindex associated with them)
      if (!this.hasFocus()) {
        this.key_pressed = [];
        this.mouse_clicked = [];
      }

      // clear the full device canvas, including the letterbox bars
      this.context.setTransform(1, 0, 0, 1, 0, 0);
      this.context["fillStyle"] = "#000000";
      this.context.fillRect(0, 0, this.canvas_size.width, this.canvas_size.height);

      // fold the letterbox offset and the shake into one transform so that no
      // draw call has to know about either
      var shake_x = 0;
      var shake_y = 0;
      if (this.shake_time > 0) {
        this.shake_time = Math.max(0, this.shake_time - dt);
        var decay = this.shake_duration > 0 ? this.shake_time / this.shake_duration : 0;
        var amount = this.shake_magnitude * decay * decay * this.canvas_game_ratio.x;
        shake_x = (Math.random() - 0.5) * 2 * amount;
        shake_y = (Math.random() - 0.5) * 2 * amount;
        if (this.shake_time === 0) {
          this.shake_magnitude = 0;
        }
      }

      this.context.setTransform(1, 0, 0, 1, this.offset.x + shake_x, this.offset.y + shake_y);
      this.eventGameLoop(dt);

      this.applyGlitch(dt);

      // calculate fps
      this.fps_counter++;
      if (this.fps_timer.alarm()) {
        this.fps = this.fps_counter;
        this.fps_counter = 0;
        this.fps_timer.start();
      }

      var self = this;
      this.anim_frame = requestAnimationFrame(function () {
        self.refresh();
      });
    }
  };

  /**
   * Starts the game loop and begins drawing the canvas.
   */
  engine.Canvas.prototype.start = function () {
    this.stop();
    this.fps_timer.start();
    this.last_frame = 0;

    var self = this;
    this.anim_frame = requestAnimationFrame(function () {
      self.refresh();
    });

    this.running = true;
  };

  /**
   * Stops the game loop and ends drawing the canvas.
   */
  engine.Canvas.prototype.stop = function () {
    if (this.anim_frame !== -1) {
      this.fps_timer.stop();
      cancelAnimationFrame(this.anim_frame);
      this.anim_frame = -1;
    }

    this.running = false;
  };

  /**
   * Gets focus for the canvas.
   */
  engine.Canvas.prototype.focus = function () {
    this.canvas.focus();
  };

  /**
   * Returns whether the canvas currently has focus or not.
   * @returns {boolean}
   */
  engine.Canvas.prototype.hasFocus = function () {
    return this.canvas.ownerDocument.activeElement === this.canvas;
  };

  /**
   * A small synthesiser. Every sound is generated, so there are no assets to
   * embed and the page stays self contained.
   * @constructor
   */
  engine.Audio = function () {
    this.context = null;
    this.muted = engine.store.get("hackman.muted", "0") === "1";
  };

  /**
   * Creates the audio context. Must be called from a user gesture, which is why
   * it is deferred until the first keypress rather than done at startup.
   */
  engine.Audio.prototype.unlock = function () {
    if (this.context) {
      if (this.context.state === "suspended") {
        this.context.resume();
      }
      return;
    }

    try {
      var Constructor = window.AudioContext || window.webkitAudioContext;
      if (Constructor) {
        this.context = new Constructor();
      }
    } catch (e) {
      this.context = null;
    }
  };

  /**
   * Toggles mute and remembers the choice.
   */
  engine.Audio.prototype.toggleMute = function () {
    this.muted = !this.muted;
    engine.store.set("hackman.muted", this.muted ? "1" : "0");
    if (!this.muted) {
      this.unlock();
      this.blip(880, 0.06, "square", 0.1);
    }
  };

  /**
   * Returns whether sound can currently be produced.
   * @returns {boolean}
   */
  engine.Audio.prototype.ready = function () {
    return !this.muted && this.context !== null;
  };

  /**
   * Plays a single tone.
   * @param {number} freq - Frequency in hertz.
   * @param {number} duration - Length in seconds.
   * @param {string} type - Oscillator type.
   * @param {number} gain - Peak gain from 0 to 1.
   */
  engine.Audio.prototype.blip = function (freq, duration, type, gain) {
    if (!this.ready()) {
      return;
    }

    var now = this.context.currentTime;
    var osc = this.context.createOscillator();
    var amp = this.context.createGain();

    osc["type"] = type;
    osc["frequency"].setValueAtTime(freq, now);
    amp["gain"].setValueAtTime(0, now);
    amp["gain"].linearRampToValueAtTime(gain, now + 0.008);
    amp["gain"].exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(amp);
    amp.connect(this.context.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  };

  /**
   * Plays a tone that slides between two frequencies.
   * @param {number} from - Start frequency in hertz.
   * @param {number} to - End frequency in hertz.
   * @param {number} duration - Length in seconds.
   * @param {string} type - Oscillator type.
   * @param {number} gain - Peak gain from 0 to 1.
   */
  engine.Audio.prototype.sweep = function (from, to, duration, type, gain) {
    if (!this.ready()) {
      return;
    }

    var now = this.context.currentTime;
    var osc = this.context.createOscillator();
    var amp = this.context.createGain();

    osc["type"] = type;
    osc["frequency"].setValueAtTime(from, now);
    osc["frequency"].exponentialRampToValueAtTime(Math.max(1, to), now + duration);
    amp["gain"].setValueAtTime(0, now);
    amp["gain"].linearRampToValueAtTime(gain, now + 0.01);
    amp["gain"].exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(amp);
    amp.connect(this.context.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  };

  /**
   * Plays a burst of filtered white noise.
   * @param {number} duration - Length in seconds.
   * @param {number} gain - Peak gain from 0 to 1.
   */
  engine.Audio.prototype.noise = function (duration, gain) {
    if (!this.ready()) {
      return;
    }

    var now = this.context.currentTime;
    var rate = this.context.sampleRate;
    var frames = Math.max(1, Math.floor(rate * duration));
    var buffer = this.context.createBuffer(1, frames, rate);
    var data = buffer.getChannelData(0);

    for (var i = 0; i < frames; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    }

    var source = this.context.createBufferSource();
    var filter = this.context.createBiquadFilter();
    var amp = this.context.createGain();

    source["buffer"] = buffer;
    filter["type"] = "lowpass";
    filter["frequency"].setValueAtTime(1400, now);
    amp["gain"].setValueAtTime(gain, now);
    amp["gain"].exponentialRampToValueAtTime(0.0001, now + duration);

    source.connect(filter);
    filter.connect(amp);
    amp.connect(this.context.destination);
    source.start(now);
  };

  /**
   * Plays a sequence of tones in quick succession.
   * @param {Array} freqs - Frequencies in hertz.
   * @param {number} step - Seconds between notes.
   */
  engine.Audio.prototype.arpeggio = function (freqs, step) {
    if (!this.ready()) {
      return;
    }

    var self = this;
    for (var i = 0; i < freqs.length; i++) {
      (function (freq, delay) {
        window.setTimeout(function () {
          self.blip(freq, 0.18, "square", 0.13);
        }, delay * 1000);
      })(freqs[i], step * i);
    }
  };

  /**
   * A general purpose timer that doesn't use callbacks like the default available timers provide.
   * @constructor
   * @param {number} [alarm] - How long in milliseconds the alarm should toggle to true.
   */
  engine.Timer = function (alarm) {
    this.time_alarm = 0;
    this.time_stop = 0;
    this.time_start = new Date().getTime();

    if (alarm) {
      this.time_alarm = alarm;
    }
  };

  /**
   * Starts the timer and provides a modifier if you want to push the start in the future or past.
   * @param {number} [modifier] - The amount in milliseconds to push start time forward or back.
   */
  engine.Timer.prototype.start = function (modifier) {
    if (!modifier) {
      modifier = 0;
    }

    this.time_stop = 0;
    this.time_start = new Date().getTime() + modifier;
  };

  /**
   * Resumes a timer after a pause.
   */
  engine.Timer.prototype.resume = function () {
    this.time_start = new Date().getTime() - this.time_stop;
    this.time_stop = 0;
  };

  /**
   * Stops the timer so time is no longer tracked.
   */
  engine.Timer.prototype.stop = function () {
    this.time_stop = new Date().getTime();
  };

  /**
   * Returns whether or not the alarm has triggered.
   * @param {number} [delta] - The amount in milliseconds to add to time before checking alarm.
   * @returns {boolean}
   */
  engine.Timer.prototype.alarm = function (delta) {
    return this.timePassedMillis() + (delta === undefined ? 0 : delta) >= this.time_alarm;
  };

  /**
   * Returns the amount of time passed in milliseconds since the timer was started.
   * @returns {number}
   */
  engine.Timer.prototype.timePassedMillis = function () {
    var stop = this.time_stop;

    if (stop === 0) {
      stop = new Date().getTime();
    }

    return stop - this.time_start;
  };

  /**
   * Returns the amount of time passed in seconds since the timer was started.
   * @returns {number}
   */
  engine.Timer.prototype.timePassedSecs = function () {
    return Math.floor(this.timePassedMillis() / 1000);
  };

  /**
   * Returns the amount of time passed in minutes since the timer was started.
   * @returns {number}
   */
  engine.Timer.prototype.timePassedMins = function () {
    return Math.floor(this.timePassedSecs() / 60);
  };

  /**
   * Returns the amount of time passed in hours since the timer was started.
   * @returns {number}
   */
  engine.Timer.prototype.timePassedHours = function () {
    return Math.floor(this.timePassedMins() / 60);
  };

  /**
   * Returns the amount of time passed in days since the timer was started.
   * @returns {number}
   */
  engine.Timer.prototype.timePassedDays = function () {
    return Math.floor(this.timePassedHours() / 24);
  };

  /**
   * Returns the percent of time passed since the timer was started.
   * @returns {number}
   */
  engine.Timer.prototype.timePassedPercent = function () {
    var percent = 0;

    if (this.time_alarm > 0) {
      percent = Math.min(1, this.timePassedMillis() / this.time_alarm);
    }

    return percent;
  };

  /**
   * Returns the amount of time passed (days, hours, mins) as a string representation useful for printing.
   * @returns {string}
   */
  engine.Timer.prototype.timePassedString = function () {

    "atlas": "1. One who sustains a great burden. 2. (Anat.)  The first vertebra of the neck, articulating immediately with the skull, thus sustaining the globe of the head, whence the name. 3. A collection of maps in a volume; -- Note: supposed to be so called from a picture of Atlas supporting the world, prefixed to some collections.",
