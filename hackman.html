    "progress": "1. A moving or going forward; a proceeding onward; an advance; specifically: (a) In actual space, as the progress of a ship, carriage, etc. (b) In the growth of an animal or plant; increase. (c) In business of any kind; as, the progress of a negotiation; the progress of art. (d) In knowledge; in proficiency; as, the progress of a child at school. (e) Toward ideal completeness or perfection in respect of quality or condition; -- applied to individuals, communities, or the race; as, social, moral, religious, or political progress. 2. A journey of state; a circuit; especially, one made by a sovereign through parts of his own dominions.",
    "projector": "One who projects a scheme or design; hence, one who forms fanciful or chimerical schemes.",
    "prologue": "1. The preface or introduction to a discourse, poem, or performance; as, the prologue of Chaucer's \"Canterbury Tales;\" esp., a discourse or poem spoken before a dramatic performance 2. One who delivers a prologue.",
    "promenade": "1. A walk for pleasure, display, or exercise.",
    "prominent": "1. Standing out, or projecting, beyond the line surface of something; jutting; protuberant; in high relief; as, a prominent figure on a vase. 2. Hence; Distinctly manifest; likely to attract attention from its size or position; conspicuous; as, a prominent feature of the face; a prominent building. 3. Eminent; distinguished above others; as, a prominent character.",
    "promoter": "1. One who, or that which, forwards, advances, or promotes; an encourager; as, a promoter of charity or philosophy.",
    "promotion": "The act of promoting, advancing, or encouraging; the act of exalting in rank or honor; also, the condition of being advanced, encouraged, or exalted in honor; preferment.",
    "prone": "1. Bending forward; inclined; not erect.",
    "prong": "1. A sharp-pointed instrument.",
    "pronounce": "1. To utter articulately; to speak out or distinctly; to utter, as words or syllables; to speak with the proper sound and accent as, adults rarely learn to pronounce a foreign language correctly. 2. To utter officially or solemnly; to deliver, as a decree or sentence; as, to pronounce sentence of death.",
    "propeller": "1. One who, or that which, propels. 2. A contrivance for propelling a steam vessel, usually consisting of a screw placed in the stern under water, and made to revolve by an engine; a propeller wheel. 3. A steamboat thus propelled; a screw steamer.",
    "properly": "1. In a proper manner; suitably; fitly; strictly; rightly; as, a word properly applied; a dress properly adjusted.",
    "property": "1. That which is proper to anything; a peculiar quality of a thing; that which is inherent in a subject, or naturally essential to it; an attribute; as, sweetness is a property of sugar.",
    "proposal": "1. That which is proposed, or propounded for consideration or acceptance; a scheme or design; terms or conditions proposed; offer; as, to make proposals for a treaty of peace; to offer proposals for erecting a building; to make proposals of marriage.",
    "propose": "1. To set forth.",
    "prorate": "To divide or distribute proportionally; to assess pro rata.",
    "protector": "1. One who, or that which, defends or shields from injury, evil, oppression, etc.; a defender; a guardian; a patron.",
    "prototype": "An original or model after which anything is copied; the pattern of anything to be engraved, or otherwise copied, cast, or the like; a primary form; exemplar; archetype.",
    "protract": "1. To draw out or lengthen in time or (rarely) in space; to continue; to prolong; as, to protract an argument; to protract a war. 2. To put off to a distant time; to delay; to defer; as, to protract a decision or duty.",
    "protrude": "1. To thrust forward; to drive or force along.",
    "proud": "1. Feeling or manifesting pride, in a good or bad sense; as: (a) Possessing or showing too great self-esteem; overrating one's excellences; hence, arrogant; haughty; lordly; presumptuous.",
    "provable": "Capable of being proved; demonstrable.",
    "proven": "Proved.",
    "provided": "On condition; by stipulation; with the understanding; if; -- usually followed by that; as, provided that nothing in this act shall prejudice the rights of any person whatever.",
    "province": "1. (Roman Hist.)  A country or region, more or less remote from the city of Rome, brought under the Roman government; a conquered country beyond the limits of Italy.",
    "provoke": "To call forth; to call into being or action; esp., to incense to action, a faculty or passion, as love, hate, or ambition; hence, commonly, to incite, as a person, to action by a challenge, by taunts, or by defiance; to exasperate; to irritate; to offend intolerably; to cause to retaliate.",
    "provoking": "Having the power or quality of exciting resentment; tending to awaken passion or vexation; as, provoking words or treatment.",
    "prowess": "Distinguished bravery; valor; especially, military bravery and skill; gallantry; intrepidity; fearlessness.",
    "prowler": "One that prowls.",
    "prowling": "Accustomed to prowl, or engaged in roving stealthily, as for prey.",
    "proximity": "The quality or state of being next in time, place, causation, influence, etc.; immediate nearness, either in place, blood, or alliance.",
    "proxy": "1. The agency for another who acts through the agent; authority to act for another, esp. to vote in a legislative or corporate capacity.",
    "prude": "A woman of affected modesty, reserve, or coyness; one who is overscrupulous or sensitive; one who affects extraordinary prudence in conduct and speech.",
    "prune": "1. To lop or cut off the superfluous parts, branches, or shoots of; to clear of useless material; to shape or smooth by trimming; to trim: as, to prune trees; to prune an essay.",
    "pruning": "1. The act of trimming, or removing what is superfluous. 2. (Falconry)  That which is cast off by bird in pruning her feathers; leavings.",
    "pry": "A lever; also, leverage.",
    "psychic": "1. Of or pertaining to the human soul, or to the living principle in man.",
    "public": "1. Of or pertaining to the people; belonging to the people; relating to, or affecting, a nation, state, or community; -- opposed to private; as, the public treasury.",
    "publisher": "One who publishes; as, a publisher of a book or magazine.",
    "pucker": "To gather into small folds or wrinkles; to contract into ridges and furrows; to corrugate; -- often with up; as, to pucker up the mouth.",
    "pueblo": "A communistic building erected by certain Indian tribes of Arizona and New Mexico.",
    "pug": "1. To mix and stir when wet, as clay for bricks, pottery, etc. 2. To fill or stop with clay by tamping; to fill in or spread with mortar, as a floor or partition, for the purpose of deadening sound.",
    "pull": "1. To draw, or attempt to draw, toward one; to draw forcibly.",
    "pulmonary": "Of or pertaining to the lungs; affecting the lungs; pulmonic.",
    "pulp": "A moist, slightly cohering mass, consisting of soft, undissolved animal or vegetable matter.",
    "pulsate": "To throb, as a pulse; to beat, as the heart.",
    "pulse": "Leguminous plants, or their seeds, as beans, pease, etc.",
    "pulverize": "To reduce of fine powder or dust, as by beating, grinding, or the like; as, friable substances may be pulverized by grinding or beating, but to pulverize malleable bodies other methods must be pursued.",
    "puma": "A large American carnivore (Felis concolor), found from Canada to Patagonia, especially among the mountains.",
    "pumice": "A very light porous volcanic scoria, usually of a gray color, the pores of which are capillary and parallel, giving it a fibrous structure.",
    "punch": "A beverage composed of wine or distilled liquor, water (or milk), sugar, and the juice of lemon, with spice or mint; -- specifically named from the kind of spirit used; as rum punch, claret punch, champagne punch, etc.",
    "punctual": "1. Consisting in a point; limited to a point; unextended.",
    "pungent": "1. Causing a sharp sensation, as of the taste, smell, or feelings; pricking; biting; acrid; as, a pungent spice.",
    "punk": "1. Wood so decayed as to be dry, crumbly, and useful for tinder; touchwood. 2. A fungus (Polyporus fomentarius, etc.) sometimes dried for tinder; agaric. 3. An artificial tinder.",
    "pupil": "The aperture in the iris; the sight, apple, or black of the eye.",
    "puppet": "1. A small image in the human form; a doll. 2. A similar figure moved by the hand or by a wire in a mock drama; a marionette; a wooden actor in a play.",
    "puppy": "1. (Zoöl.)  The young of a canine animal, esp. of the common dog; a whelp. 2. A name of contemptuous reproach for a conceited and impertinent person.",
    "purchase": "1. To pursue and obtain; to acquire by seeking; to gain, obtain, or acquire.",
    "purely": "1. In a pure manner (in any sense of the adjective). 2. Nicely; prettily.",
    "purgatory": "Tending to cleanse; cleansing; expiatory.",
    "purge": "1. To cleanse, clear, or purify by separating and carrying off whatever is impure, heterogeneous, foreign, or superfluous.",
    "purging": "That purges; cleansing.",
    "purify": "1. To make pure or clear from material defilement, admixture, or imperfection; to free from extraneous or noxious matter; as, to purify liquors or metals; to purify the blood; to purify the air. 2. Hence, in figurative uses: (a) To free from guilt or moral defilement; as, to purify the heart.",
    "purist": "1. One who aims at excessive purity or nicety, esp. in the choice of language.",
    "puritan": "1. (Eccl.",
    "purity": "The condition of being pure.",
    "purple": "1. A color formed by, or resembling that formed by, a combination of the primary colors red and blue.",
    "purplish": "Somewhat purple.",
    "purposely": "With purpose or design; intentionally; with predetermination; designedly.",
    "purr": "To murmur as a cat.",
    "purse": "1. A small bag or pouch, the opening of which is made to draw together closely, used to carry money in; by extension, any receptacle for money carried on the person; a wallet; a pocketbook; a portemonnaie.",
    "pursuable": "Capable of being, or fit to be, pursued, followed, or prosecuted.",
    "pursuant": "Acting in consequence or in prosecution (of anything); hence, agreeable; conformable; following; according; -- with to or of.",
    "pursuit": "1. The act of following or going after; esp., a following with haste, either for sport or in hostility; chase; prosecution; as, the pursuit of game; the pursuit of an enemy.",
    "purveyor": "1. One who provides victuals, or whose business is to make provision for the table; a victualer; a caterer. 2. An officer who formerly provided, or exacted provision, for the king's household.",
    "pushing": "Pressing forward in business; enterprising; driving; energetic; also, forward; officious, intrusive.",
    "pushpin": "A child's game played with pins.",
    "putt": "A stroke made on the putting green to play the ball into a hole.",
    "pyramid": "1. A solid body standing on a triangular, square, or polygonal base, and terminating in a point at the top; especially, a structure or edifice of this shape. 2. (Geom.)  A solid figure contained by a plane rectilineal figure as base and several triangles which have a common vertex and whose bases are sides of the base. 3. pl.",
    "python": "1. (Zoöl.)  Any species of very large snakes of the genus Python, and allied genera, of the family Pythonidæ. They are nearly allied to the boas.",
    "quack": "1. To utter a sound like the cry of a duck. 2. To make vain and loud pretensions; to boast.",
    "quadrant": "1. The fourth part; the quarter.",
    "quail": "1. To die; to perish; hence, to wither; to fade.",
    "quaintly": "In a quaint manner.",
    "quake": "1. To be agitated with quick, short motions continually repeated; to shake with fear, cold, etc.; to shudder; to tremble.",
    "quaking": "a. & n. from Quake, v. Quaking aspen (Bot.), an American species of poplar (Populus tremuloides), the leaves of which tremble in the lightest breeze.",
    "qualified": "1. Fitted by accomplishments or endowments. 2. Modified; limited; as, a qualified statement.",
    "qualify": "1. To make such as is required; to give added or requisite qualities to; to fit, as for a place, office, occupation, or character; to furnish with the knowledge, skill, or other accomplishment necessary for a purpose; to make capable, as of an employment or privilege; to supply with legal power or capacity.",
    "quality": "1. The condition of being of such and such a sort as distinguished from others; nature or character relatively considered, as of goods; character; sort; rank.",
    "qualm": "1. Sickness; disease; pestilence; death.",
    "quantum": "1. Quantity; amount.",
    "quarrel": "1. An arrow for a crossbow; -- so named because it commonly had a square head.",
    "quarry": "Same as 1st Quarrel.",
    "quarterly": "1. Containing, or consisting of, a fourth part; as, quarterly seasons. 2. Recurring during, or at the end of, each quarter; as, quarterly payments of rent; a quarterly meeting.",
    "quench": "1. To extinguish; to overwhelm; to make an end of; -- said of flame and fire, of things burning, and figuratively of sensations and emotions; as, to quench flame; to quench a candle; to quench thirst, love, hate, etc.",
    "query": "1. A question; an inquiry to be answered or solved.",
    "quicken": "1. To make alive; to vivify; to revive or resuscitate, as from death or an inanimate state; hence, to excite; to, stimulate; to incite.",
    "quickness": "1. The condition or quality of being quick or living; life.",
    "quicksand": "Sand easily moved or readily yielding to pressure; especially, a deep mass of loose or moving sand mixed with water, sometimes found at the mouth of a river or along some coasts, and very dangerous, from the difficulty of extricating a person who begins sinking into it.",
    "quiet": "1. In a state of rest or calm; without stir, motion, or agitation; still; as, a quiet sea; quiet air.",
    "quill": "1. One of the large feathers of a bird's wing, or one of the rectrices of the tail; also, the stock of such a feather. 2. A pen for writing made by sharpening and splitting the point or nib of the stock of a feather; as, history is the proper subject of his quill.",
    "quilt": "Anything that is quilted; esp., a quilted bed cover, or a skirt worn by women; any cover or garment made by putting wool, cotton, etc., between two cloths and stitching them together; also, any outer bed cover.",
    "quintuple": "Multiplied by five; increased to five times the amount; fivefold.",
    "quirk": "1. A sudden turn; a starting from the point or line; hence, an artful evasion or subterfuge; a shift; a quibble; as, the quirks of a pettifogger.",
    "quit": "Any one of numerous species of small passerine birds native of tropical America.",
    "quiver": "Nimble; active.",
    "quizzical": "Relating to quizzing: given to quizzing; of the nature of a quiz; farcical; sportive.",
    "quotable": "Capable or worthy of being quoted; as, a quotable writer; a quotable sentence.",
    "quotation": "1. The act of quoting or citing. 2. That which is quoted or cited; a part of a book or writing named, repeated, or adduced as evidence or illustration.",
    "quote": "1. To cite, as a passage from some author; to name, repeat, or adduce, as a passage from an author or speaker, by way of authority or illustration; as, to quote a passage from Homer. 2. To cite a passage from; to name as the authority for a statement or an opinion; as, to quote Shakespeare. 3. (Com.)  To name the current price of. 4. To notice; to observe; to examine.",
    "rabid": "1. Furious; raging; extremely violent.",
    "race": "A game, match, etc., open only to losers in early stages of contests.",
    "rack": "Same as Arrack.",
    "radial": "Of or pertaining to a radius or ray; consisting of, or like, radii or rays; radiated; as, (Bot.) radial projections; (Zoöl.) radial vessels or canals; (Anat.) the radial artery.",
    "radiance": "The quality of being radiant; brilliancy; effulgence; vivid brightness; as, the radiance of the sun.",
    "radish": "The pungent fleshy root of a well-known cruciferous plant (Paphanus sativus); also, the whole plant.",
    "raffle": "1. A kind of lottery, in which several persons pay, in shares, the value of something put up as a stake, and then determine by chance (as by casting dice) which one of them shall become the sole possessor. 2. A game of dice in which he who threw three alike won all the stakes.",
    "raft": "imp. & p. p. of Reave.",
    "rage": "1. Violent excitement; eager passion; extreme vehemence of desire, emotion, or suffering, mastering the will.",
    "ragged": "1. Rent or worn into tatters, or till the texture is broken; as, a ragged coat; a ragged sail. 2. Broken with rough edges; having jags; uneven; rough; jagged; as, ragged rocks. 3. Hence, harsh and disagreeable to the ear; dissonant.",
    "ragweed": "A common American composite weed (Ambrosia artemisiæfolia) with finely divided leaves; hogweed.",
    "raider": "One who engages in a raid.",
    "railing": "Expressing reproach; insulting.",
    "railroad": "1. A road or way consisting of one or more parallel series of iron or steel rails, patterned and adjusted to be tracks for the wheels of vehicles, and suitably supported on a bed or substructure.",
    "railway": "1. A road or way consisting of one or more parallel series of iron or steel rails, patterned and adjusted to be tracks for the wheels of vehicles, and suitably supported on a bed or substructure.",
    "raisin": "1. A grape, or a bunch of grapes.",
    "rake": "1. An implement consisting of a headpiece having teeth, and a long handle at right angles to it, -- used for collecting hay, or other light things which are spread over a large surface, or for breaking and smoothing the earth. 2. A toothed machine drawn by a horse, -- used for collecting hay or grain; a horserake. 3. Etym: [Perhaps a different word.] (Mining)  A fissure or mineral vein traversing the strata vertically, or nearly so; -- called also rake-vein.",
    "ramble": "1. To walk, ride, or sail, from place to place, without any determinate object in view; to roam carelessly or irregularly; to rove; to wander; as, to ramble about the city; to ramble over the world.",
    "ramp": "1. To spring; to leap; to bound; to rear; to prance; to become rampant; hence, to frolic; to romp. 2. To move by leaps, or by leaps; hence, to move swiftly or with violence.",
    "ranch": "To wrench; to tear; to sprain; to injure by violent straining or contortion.",
    "rancidity": "The quality or state of being rancid; a rancid scent or flavor, as of old oil.",
    "random": "1. Force; violence.",
    "ranger": "1. One who ranges; a rover; sometimes, one who ranges for plunder; a roving robber. 2. That which separates or arranges; specifically, a sieve.",
    "ransack": "1. To search thoroughly; to search every place or part of; as, to ransack a house.",
    "rare": "Early.",
    "rarity": "1. The quality or state of being rare; rareness; thinness; as, the rarity (contrasted with the density) of gases. 2. That which is rare; an uncommon thing; a thing valued for its scarcity.",
    "rascal": "1. One of the rabble; a low, common sort of person or creature; collectively, the rabble; the common herd; also, a lean, ill- conditioned beast, esp. a deer.",
    "rash": "1. To pull off or pluck violently.",
    "ravage": "Desolation by violence; violent ruin or destruction; devastation; havoc; waste; as, the ravage of a lion; the ravages of fire or tempest; the ravages of an army, or of time.",
    "raven": "A large black passerine bird (Corvus corax), similar to the crow, but larger.",
    "ravine": "Food obtained by violence; plunder; prey; raven.",
    "raving": "Talking irrationally and wildly; as, a raving lunatic.",
    "reach": "An effort to vomit.",
    "reaction": "1. Any action in resisting other action or force; counter tendency; movement in a contrary direction; reverse action. 2. (Chem.)  The mutual or reciprocal action of chemical agents upon each other, or the action upon such chemical agents of some form of energy, as heat, light, or electricity, resulting in a chemical change in one or more of these agents, with the production of new compounds or the manifestation of distinctive characters.",
    "reactive": "Having power to react; tending to reaction; of the nature of reaction.",
    "ream": "Cream; also, the cream or froth on ale.",
    "reason": "1. A thought or a consideration offered in support of a determination or an opinion; a just ground for a conclusion or an action; that which is offered or accepted as an explanation; the efficient cause of an occurrence or a phenomenon; a motive for an action or a determination; proof, more or less decisive, for an opinion or a conclusion; principle; efficient cause; final cause; ground of argument.",
    "reassure": "1. To assure anew; to restore confidence to; to free from fear or terror.",
    "rebate": "1. To beat to obtuseness; to deprive of keenness; to blunt; to turn back the point of, as a lance used for exercise.",
    "rebel": "Pertaining to rebels or rebellion; acting in revolt; rebellious; as, rebel troops.",
    "rebound": "1. To spring back; to start back; to be sent back or reverberated by elastic force on collision with another body; as, a rebounding echo.",
    "rebuff": "1. Repercussion, or beating back; a quick and sudden resistance.",
    "recall": "1. To call back; to summon to return; as, to recall troops; to recall an ambassador. 2. To revoke; to annul by a subsequent act; to take back; to withdraw; as, to recall words, or a decree.",
    "recant": "To withdraw or repudiate formally and publicly (opinions formerly expressed); to contradict, as a former declaration; to take back openly; to retract; to recall.",
    "recapture": "1. The act of retaking or recovering by capture; especially, the retaking of a prize or goods from a captor. 2. That which is captured back; a prize retaken.",
    "recast": "1. To throw again.",
    "recede": "1. To move back; to retreat; to withdraw.",
    "recent": "1. Of late origin, existence, or occurrence; lately come; not of remote date, antiquated style, or the like; not already known, familiar, worn out, trite, etc.; fresh; novel; new; modern; as, recent news.",
    "recess": "1. A withdrawing or retiring; a moving back; retreat; as, the recess of the tides.",
    "recipient": "A receiver; the person or thing that receives; one to whom, or that to which, anything is given or communicated; specifically, the receiver of a still.",
    "recital": "1. The act of reciting; the repetition of the words of another, or of a document; rehearsal; as, the recital of testimony. 2. A telling in detail and due order of the particulars of anything, as of a law, an adventure, or a series of events; narration.",
    "recite": "1. To repeat, as something already prepared, written down, committed to memory, or the like; to deliver from a written or printed document, or from recollection; to rehearse; as, to recite the words of an author, or of a deed or covenant. 2. To tell over; to go over in particulars; to relate; to narrate; as, to recite past events; to recite the particulars of a voyage. 3. To rehearse, as a lesson to an instructor. 4. (Law)  To state in or as a recital.",
    "reckless": "1. Inattentive to duty; careless; neglectful; indifferent.",
    "reclaim": "To claim back; to demand the return of as a right; to attempt to recover possession of.",
    "reclining": "(a) Bending or curving gradually back from the perpendicular. (b) Recumbent.",
    "recluse": "Shut up, sequestered; retired from the world or from public notice; solitary; living apart; as, a recluse monk or hermit; a recluse life In meditation deep, recluse From human converse.",
    "reclusive": "Affording retirement from society.",
    "recognize": "1. To know again; to perceive the identity of, with a person or thing previously known; to recover or recall knowledge of.",
    "recoil": "1. To start, roll, bound, spring, or fall back; to take a reverse motion; to be driven or forced backward; to return.",
    "recollect": "1. To recover or recall the knowledge of; to bring back to the mind or memory; to remember. 2. Reflexively, to compose one's self; to recover self-command; as, to recollect one's self after a burst of anger; -- sometimes, formerly, in the perfect participle.",
    "reconcile": "1. To cause to be friendly again; to conciliate anew; to restore to friendship; to bring back to harmony; to cause to be no longer at variance; as, to reconcile persons who have quarreled.",
    "reconfirm": "To confirm anew.",
    "record": "1. To recall to mind; to recollect; to remember; to meditate.",
    "recount": "To count or reckon again.",
    "recoup": "1. (Law)  To keep back rightfully (a part), as if by cutting off, so as to diminish a sum due; to take off (a part) from damages; to deduct; as, where a landlord recouped the rent of premises from damages awarded to the plaintiff for eviction. 2. To get an equivalent or compensation for; as, to recoup money lost at the gaming table; to recoup one's losses in the share market. 3. To reimburse; to indemnify; -- often used reflexively and in the passive.",
    "recovery": "1. The act of recovering, regaining, or retaking possession. 2. Restoration from sickness, weakness, faintness, or the like; restoration from a condition of mistortune, of fright, etc. 3. (Law)  The obtaining in a suit at law of a right to something by a verdict and judgment of court. 4. The getting, or gaining, of something not previously had.",
    "recreate": "To give fresh life to; to reanimate; to revive; especially, to refresh after wearying toil or anxiety; to relieve; to cheer; to divert; to amuse; to gratify.",
    "rectangle": "A four-sided figure having only right angles; a right-angled parallelogram.",
    "rectify": "1. To make or set right; to correct from a wrong, erroneous, or false state; to amend; as, to rectify errors, mistakes, or abuses; to rectify the will, the judgment, opinions; to rectify disorders.",
    "reenter": "1. To enter again. 2. (Engraving)  To cut deeper, as engraved lines on a plate of metal, when the engraving has not been deep enough, or the plate has become worn in printing.",
    "reentry": "1. A second or new entry; as, a reëntry into public life. 2. (Law)  A resuming or retaking possession of what one has lately foregone; -- applied especially to land; the entry by a lessor upon the premises leased, on failure of the tenant to pay rent or perform the covenants in the lease.",
    "reexamine": "To examine anew.",
    "referable": "Capable of being referred, or considered in relation to something else; assignable; ascribable.",
    "referee": "One to whom a thing is referred; a person to whom a matter in dispute has been referred, in order that he may settle it.",
    "reference": "1. The act of referring, or the state of being referred; as, reference to a chart for quidance. 2. That which refers to something; a specific direction of the attention; as, a reference in a text-book. 3. Relation; regard; respect.",
    "refined": "Freed from impurities or alloy; purifed; polished; cultured; delicate; as; refined gold; refined language; refined sentiments.",
    "reflector": "1. One who, or that which, reflects.",
    "reflex": "1. Directed back; attended by reflection; retroactive; introspective.",
    "reflux": "Returning, or flowing back; reflex; as, reflux action.",
    "reformed": "1. Corrected; amended; restored to purity or excellence; said, specifically, of the whole body of Protestant churches originating in the Reformation.",
    "refrain": "1. To hold back; to restrain; to keep within prescribed bounds; to curb; to govern.",
    "refresh": "1. To make fresh again; to restore strength, spirit, animation, or the like, to; to relieve from fatigue or depression; to reinvigorate; to enliven anew; to reanimate; as, sleep refreshes the body and the mind.",
    "refusal": "1. The act of refusing; denial of anything demanded, solicited, or offered for acceptance.",
    "refuse": "1. To deny, as a request, demand, invitation, or command; to decline to do or grant.",
    "refute": "To disprove and overthrow by argument, evidence, or countervailing proof; to prove to be false or erroneous; to confute; as, to refute arguments; to refute testimony; to refute opinions or theories; to refute a disputant.",
    "regain": "To gain anew; to get again; to recover, as what has escaped or been lost; to reach again.",
    "regalia": "1. That which belongs to royalty.",
    "regime": "1. Mode or system of rule or management; character of government, or of the prevailing social system.",
    "region": "1. One of the grand districts or quarters into which any space or surface, as of the earth or the heavens, is conceived of as divided; hence, in general, a portion of space or territory of indefinite extent; country; province; district; tract.",
    "register": "1. A written account or entry; an official or formal enumeration, description, or record; a memorial record; a list or roll; a schedule.",
    "registrar": "One who registers; a recorder; a keeper of records; as, a registrar of births, deaths, and marriages.",
    "registry": "1. The act of recording or writing in a register; enrollment; registration. 2. The place where a register is kept. 3. A record; an account; a register.",
    "regress": "1. The act of passing back; passage back; return; retrogression.",
    "regretful": "Full of regret; indulging in regrets; repining.",
    "regular": "1. Conformed to a rule; agreeable to an established rule, law, principle, or type, or to established customary forms; normal; symmetrical; as, a regular verse in poetry; a regular piece of music; a regular verb; regular practice of law or medicine; a regular building. 2. Governed by rule or rules; steady or uniform in course, practice, or occurence; not subject to unexplained or irrational variation; returning at stated intervals; steadily pursued; orderlly; methodical; as, the regular succession of day and night; regular habits. 3. Constituted, selected, or conducted in conformity with established usages, rules, or discipline; duly authorized; permanently organized; as, a regular meeting; a regular physican; a regular nomination; regular troops. 4. Belonging to a monastic order or community; as, regular clergy, in distinction dfrom the secular clergy. 5. Thorough; complete; unmitigated; as, a regular humbug.",
    "regulate": "1. To adjust by rule, method, or established mode; to direct by rule or restriction; to subject to governing principles or laws.",
    "regulator": "1. One who, or that which, regulates. 2. (Mach.)  A contrivance for regulating and controlling motion, as: (a) The lever or index in a watch, which controls the effective length of the hairspring, and thus regulates the vibrations of the balance. (b) The governor of a steam engine. (c) A valve for controlling the admission of steam to the steam chest, in a locomotive. 3. A clock, or other timepiece, used as a standard of correct time.",
    "reheat": "1. To heat again. 2. To revive; to cheer; to cherish.",
    "reimburse": "1. To replace in a treasury or purse, as an equivalent for what has been taken, lost, or expended; to refund; to pay back; to restore; as, to reimburse the expenses of a war. 2. To make restoration or payment of an equivalent to (a person); to pay back to; to indemnify; -- often reflexive; as, to reimburse one's self by successful speculation.",
    "reissue": "To issue a second time.",
    "reiterate": "To repeat again and again; to say or do repeatedly; sometimes, to repeat.",
    "rejoice": "To feel joy; to experience gladness in a high degree; to have pleasurable satisfaction; to be delighted.",
    "rejoicing": "1. Joy; gladness; delight.",
    "rejoin": "1. To join again; to unite after separation. 2. To come, or go, again into the presence of; to join the company of again.",
    "relapse": "1. To slip or slide back, in a literal sense; to turn back.",
    "relapsing": "Marked by a relapse; falling back; tending to return to a former worse state.",
    "relation": "1. The act of relating or telling; also, that which is related; recital; account; narration; narrative; as, the relation of historical events. relation doth well figure them.",
    "relative": "1. Having relation or reference; referring; respecting; standing in connection; pertaining; as, arguments not relative to the subject.",
    "relax": "1. To make lax or loose; to make less close, firm, rigid, tense, or the like; to slacken; to loosen; to open; as, to relax a rope or cord; to relax the muscles or sinews.",
    "reliable": "Suitable or fit to be relied on; worthy of dependance or reliance; trustworthy.",
    "reliance": "1. The act of relying, or the condition or quality of being reliant; dependence; confidence; trust; repose of mind upon what is deemed sufficient support or authority.",
    "relic": "1. That which remains; that which is left after loss or decay; a remaining portion; a remnant.",
    "relieve": "1. To lift up; to raise again, as one who has fallen; to cause to rise.",
    "relieving": "Serving or tending to relieve.",
    "relish": "1. To taste or eat with pleasure; to like the flavor of; to partake of with gratification; hence, to enjoy; to be pleased with or gratified by; to experience pleasure from; as, to relish food.",
    "relive": "To live again; to revive.",
    "reluctant": "1. Striving against; opposed in desire; unwilling; disinclined; loth.",
    "rely": "To rest with confidence, as when fully satisfied of the veracity, integrity, or ability of persons, or of the certainty of facts or of evidence; to have confidence; to trust; to depend; -- with on, formerly also with in.",
    "remark": "1. To mark in a notable manner; to distinquish clearly; to make noticeable or conspicuous; to piont out.",
    "remedial": "Affording a remedy; intended for a remedy, or for the removal or abatement of an evil; as, remedial treatment.",
    "remedy": "1. That which relieves or cures a disease; any medicine or application which puts an end to disease and restores health; -- with for; as, a remedy for the gout. 2. That which corrects or counteracts an evil of any kind; a corrective; a counteractive; reparation; cure; -- followed by for or against, formerly by to.",
    "remember": "1. To have ( a notion or idea) come into the mind again, as previously perceived, known, or felt; to have a renewed apprehension of; to bring to mind again; to think of again; to recollect; as, I remember the fact; he remembers the events of his childhood; I cannot remember dates.",
    "remindful": "Tending or adapted to remind; careful to remind.",
    "remission": "-- Forgiveness, Pardon.",
    "remnant": "Remaining; yet left.",
    "remorse": "1. The anguish, like gnawing pain, excited by a sense of guilt; compunction of conscience for a crime committed, or for the sins of one's past life.",
    "remote": "1. Removed to a distance; not near; far away; distant; -- said in respect to time or to place; as, remote ages; remote lands.",
    "removable": "Admitting of being removed.",
    "removed": "1. Changed in place. 2. Dismissed from office. 3. Distant in location; remote.",
    "remover": "One who removes; as, a remover of landmarks.",
    "rendering": "The act of one who renders, or that which is rendered.",
    "rendition": "1. The act of rendering; especially, the act of surrender, as of fugitives from justice, at the claim of a foreign government; also, surrender in war.",
    "renegade": "One faithless to principle or party.",
    "renewable": "Capable of being renewed; as, a lease renewable at pleasure.",
    "renounce": "1. To declare against; to reject or decline formally; to refuse to own or acknowledge as belonging to one; to disclaim; as, to renounce a title to land or to a throne. 2. To cast off or reject deliberately; to disown; to dismiss; to forswear.",
    "renovate": "To make over again; to restore to freshness or vigor; to renew.",
    "renovator": "One who, or that which, renovates.",
    "repair": "1. To return.",
    "repayment": "1. The act of repaying; reimbursement.",
    "repeal": "1. To recall; to summon again, as persons.",
    "repeater": "One who, or that which, repeats.",
    "repent": "1. (Bot.)  Prostrate and rooting; -- said of stems.",
    "replace": "1. To place again; to restore to a former place, position, condition, or the like.",
    "reply": "1. To make a return in words or writing; to respond; to answer.",
    "reporter": "One who reports.",
    "repose": "1. To cause to stop or to rest after motion; hence, to deposit; to lay down; to lodge; to reposit.",
    "repossess": "To possess again; as, to repossess the land.",
    "reprimand": "Severe or formal reproof; reprehension, private or public.",
    "reprint": "1. To print again; to print a second or a new edition of. 2. To renew the impression of.",
    "reprise": "1. A taking by way of retaliation.",
    "reproach": "1. To come back to, or come home to, as a matter of blame; to bring shame or disgrace upon; to disgrace.",
    "reproduce": "To produce again.",
    "reptile": "1. Creeping; moving on the belly, or by means of small and short legs. 2. Hence: Groveling; low; vulgar; as, a reptile race or crew; reptile vices.",
    "reptilian": "Belonging to the reptiles.",
    "repugnant": "Disposed to fight against; hostile; at war with; being at variance; contrary; inconsistent; refractory; disobedient; also, distasteful in a high degree; offensive; -- usually followed by to, rarely and less properly by with; as, all rudeness was repugnant to her nature.",
    "repulsive": "1. Serving, or able, to repulse; repellent; as, a repulsive force.",
    "reputable": "Having, or worthy of, good repute; held in esteem; honorable; praiseworthy; as, a reputable man or character; reputable conduct.",
    "request": "1. The act of asking for anything desired; expression of desire or demand; solicitation; prayer; petition; entreaty.",
    "require": "1. To demand; to insist upon having; to claim as by right and authority; to exact; as, to require the surrender of property.",
    "requisite": "That which is required, or is necessary; something indispensable.",
    "resale": "A sale at second hand, or at retail; also, a second sale.",
    "research": "Diligent inquiry or examination in seeking facts or principles; laborius or continued search after truth; as, researches of human wisdom.",
    "resemble": "1. To be like or similar to; to bear the similitude of, either in appearance or qualities; as, these brothers resemble each other.",
    "resend": "1. To send again; as, to resend a message. 2. To send back; as, to resend a gift.",
    "resent": "1. To be sensible of; to feel; as: (a) In a good sense, to take well; to receive with satisfaction.",
    "residence": "1. The act or fact of residing, abiding, or dwelling in a place for some continuance of time; as, the residence of an American in France or Italy for a year.",
    "residency": "1. Residence.",
    "resident": "1. Dwelling, or having an abode, in a place for a continued length of time; residing on one's own estate; -- opposed to nonresident; as, resident in the city or in the country. 2. Fixed; stable; certain.",
    "residual": "Pertaining to a residue; remaining after a part is taken.",
    "residue": "1. That which remains after a part is taken, separated, removed, or designated; remnant; remainder.",
    "resigned": "Submissive; yielding; not disposed to resist or murmur.",
    "resistant": "Making resistance; resisting. -- n.  One who, or that which, resists.",
    "resisting": "Making resistance; opposing; as, a resisting medium.",
    "resolute": "1. Having a decided purpose; determined; resolved; fixed in a determination; hence, bold; firm; steady.",
    "resolved": "Having a fixed purpose; determined; resolute; -- usually placed after its noun; as, a man resolved to be rich.",
    "resonant": "Returning, or capable of returning, sound; fitted to resound; resounding; echoing back.",
    "resort": "Active power or movement; spring.",
    "resource": "1. That to which one resorts orr on which one depends for supply or support; means of overcoming a difficulty; resort; expedient.",
    "respect": "1. To take notice of; to regard with special attention; to regard as worthy of special consideration; hence, to care for; to heed.",
    "result": "1. To leap back; to rebound.",
    "resume": "A summing up; a condensed statement; an abridgment or brief recapitulation.",
    "resurrect": "1. To take from the grave; to disinter.",
    "retail": "The sale of commodities in small quantities or parcels; -- opposed to wholesale; sometimes, the sale of commodities at second hand.",
    "retainer": "1. One who, or that which, retains. 2. One who is retained or kept in service; an attendant; an adherent; a hanger-on. 3. Hence, a servant, not a domestic, but occasionally attending and wearing his master's livery.",
    "retaliate": "To return the like for; to repay or requite by an act of the same kind; to return evil for (evil). [Now seldom used except in a bad sense.] One ambassador sent word to the duke's son that his visit should be retaliated.",
    "retention": "1. The act of retaining, or the state of being ratined. 2. The power of retaining; retentiveness.",
    "retinal": "Of or pertaining to the retina.",
    "retired": "1. Private; secluded; quiet; as, a retired life; a person of retired habits.",
    "retiring": "1. Reserved; shy; not forward or obtrusive; as, retiring modesty; retiring manners. 2. Of or pertaining to retirement; causing retirement; suited to, or belonging to, retirement.",
    "retouch": "1. To touch again, or rework, in order to improve; to revise; as, to retouch a picture or an essay. 2. (Photog.)  To correct or change, as a negative, by handwork.",
    "retrace": "1. To trace back, as a line.",
    "retract": "1. To draw back; to draw up or shorten; as, the cat can retract its claws; to retract a muscle. 2. Ti withdraw; to recall; to disavow; to recant; to take back; as, to retract an accusation or an assertion.",
    "retreat": "1. The act of retiring or withdrawing one's self, especially from what is dangerous or disagreeable.",
    "return": "1. To turn back; to go or come again to the same place or condition.",
    "reunite": "To unite again; to join after separation or variance.",
    "reveal": "1. To make known (that which has been concealed or kept secret); to unveil; to disclose; to show.",
    "reveler": "One who revels.",
    "revenge": "1. To inflict harm in return for, as an injury, insult, etc.; to exact satisfaction for, under a sense of injury; to avenge; -- followed either by the wrong received, or by the person or thing wronged, as the object, or by the reciprocal pronoun as direct object, and a preposition before thewrong done or the wrongdoer.",
    "revenue": "1. That which returns, or comes back, from an investment; the annual rents, profits, interest, or issues of any species of property, real or personal; income.",
    "reverb": "To echo.",
    "reverence": "1. Profound respect and esteem mingled with fear and affection, as for a holy being or place; the disposition to revere; veneration.",
    "reverend": "Worthy of reverence; entitled to respect mingled with fear and affection; venerable.",
    "reversal": "Intended to reverse; implying reversal.",
    "reverse": "1. Turned backward; having a contrary or opposite direction; hence; opposite or contrary in kind; as, the reverse order or method.",
    "reversing": "Serving to effect reversal, as of motion; capable of being reversed.",
    "reversion": "1. The act of returning, or coming back; return.",
    "revert": "1. To turn back, or to the contrary; to reverse.",
    "revise": "1. To look at again for the detection of errors; to reëxamine; to review; to look over with care for correction; as, to revise a writing; to revise a translation. 2. (Print.)  To compare (a proof) with a previous proof of the same matter, and mark again such errors as have not been corrected in the type. 3. To review, alter, and amend; as, to revise statutes; to revise an agreement; to revise a dictionary.",
    "revision": "1. The act of revising; reëxamination for correction; review; as, the revision of a book or writing, or of a proof sheet; a revision of statutes. 2. That which is made by revising.",
    "revisit": "1. To visit again.",
    "revival": "The act of reviving, or the state of being revived.",
    "reviving": "Returning or restoring to life or vigor; reanimating.",
    "revocable": "Capable of being revoked; as, a revocable edict or grant; a revocable covenant.",
    "revoke": "1. To call or bring back; to recall.",
    "revolt": "1. To turn away; to abandon or reject something; specifically, to turn away, or shrink, with abhorrence.",
    "revolving": "Making a revolution or revolutions; rotating; -- used also figuratively of time, seasons, etc., depending on the revolution of the earth.",
    "reward": "To give in return, whether good or evil; -- commonly in a good sense; to requite; to recompense; to repay; to compensate.",
    "reword": "1. To repeat in the same words; to reëcho.",
    "rewrite": "To write again.",
    "rhyme": "1. An expression of thought in numbers, measure, or verse; a composition in verse; a rhymed tale; poetry; harmony of language.",
    "ribbon": "1. A fillet or narrow woven fabric, commonly of silk, used for trimming some part of a woman's attire, for badges, and other decorative purposes. 2. A narrow strip or shred; as, a steel or magnesium ribbon; sails torn to ribbons. 3. (Shipbuilding)  Same as Rib-band. 4. pl.",
    "rice": "A well-known cereal grass (Oryza sativa) and its seed.",
    "riches": "1. That which makes one rich; an abundance of land, goods, money, or other property; wealth; opulence; affluence.",
    "riddance": "1. The act of ridding or freeing; deliverance; a cleaning up or out.",
    "ride": "1. To be carried on the back of an animal, as a horse.",
    "riding": "One of the three jurisdictions into which the county of York, in England, is divided; -- formerly under the government of reeve.",
    "rifling": "(a) The act or process of making the grooves in a rifled cannon or gun barrel. (b) The system of grooves in a rifled gun barrel or cannon.",
    "rift": "p. p. of Rive.",
    "rigging": "DRess; tackle; especially (Naut.), the ropes, chains, etc., that support the masts and spars of a vessel, and serve as purchases for adjusting the sails, etc.",
    "rigid": "1. Firm; stiff; unyielding; not pliant; not flexible.",
    "rigor": "1. Rigidity; stiffness. 2. (ed.)  A sense of chilliness, with contraction of the skin; a convulsive shuddering or tremor, as in the chill preceeding a fever.",
    "rind": "The external covering or coat, as of flesh, fruit, trees, etc.; skin; hide; bark; peel; shell.",
    "rinse": "1. To wash lightly; to cleanse with a second or repeated application of water after washing. 2. To cleancse by the introduction of water; -- applied especially to hollow vessels; as, to rinse a bottle.",
    "riot": "1. Wanton or unrestrained behavior; uproar; tumult.",
    "ripeness": "The state or quality of being ripe; maturity;; completeness; perfection; as, the ripeness of grain; ripeness of manhood; ripeness of judgment.",
    "rise": "1. To move from a lower position to a higher; to ascend; to mount up.",
    "rising": "1. Attaining a higher place; taking, or moving in, an upward direction; appearing above the horizon; ascending; as, the rising moon. 2. Increasing in wealth, power, or distinction; as, a rising state; a rising character.",
    "risk": "1. Hazard; danger; peril; exposure to loss, injury, or destruction.",
    "rival": "1. A person having a common right or privilege with another; a partner.",
    "riveting": "1. The act of joining with rivets; the act of spreading out and clinching the end, as of a rivet, by beating or pressing. 2. The whole set of rivets, collectively.",
    "roast": "1. To cook by exposure to radiant heat before a fire; as, to roast meat on a spit, or in an oven open toward the fire and having reflecting surfaces within; also, to cook in a close oven. 2. To cook by surrounding with hot embers, ashes, sand, etc.; as, to roast a potato in ashes.",
    "robe": "1. An outer garment; a dress of a rich, flowing, and elegant style or make; hence, a dress of state, rank, office, or the like.",
    "robin": "(a) A small European singing bird (Erythacus rubecula), having a reddish breast; -- called also robin redbreast, robinet, and ruddock. (b) An American singing bird (Merula migratoria), having the breast chestnut, or dull red.",
    "robust": "1. Evincing strength; indicating vigorous health; strong; sinewy; muscular; vigorous; sound; as, a robust body; robust youth; robust health. 2. Violent; rough; rude.",
    "rocker": "1. One who rocks; specifically, one who rocks a cradle.",
    "rocket": "(a) A cruciferous plant (Eruca sativa) sometimes eaten in Europe as a salad. (b) Damewort. (c) Rocket larkspur.",
    "rockfish": "(a) Any one of several California scorpænoid food fishes of the genus Sebastichthys, as the red rockfish (S. ruber). They are among the most important of California market fishes.",
    "rocking": "Having a swaying, rolling, or back-and-forth movement; used for rocking.",
    "rocky": "1. Full of, or abounding in, rocks; consisting of rocks; as, a rocky mountain; a rocky shore. 2. Like a rock; as, the rocky orb of a shield.",
    "rogue": "1. (Eng.Law)  A vagrant; an idle, sturdy beggar; a vagabond; a tramp.",
    "roman": "1. Of or pertaining to Rome, or the Roman people; like or characteristic of Rome, the Roman people, or things done by Romans; as, Roman fortitude; a Roman aqueduct; Roman art. 2. Of or pertaining to the Roman Catholic religion; professing that religion. 3. (Print.) (a) Upright; erect; -- said of the letters or kind of type ordinarily used, as distinguished from Italic characters. (b) Expressed in letters, not in figures, as I., IV., i., iv., etc.; -- said of numerals, as distinguished from the Arabic numerals, 1, 4, etc.",
    "rope": "1. A large, stout cord, usually one not less than an inch in circumference, made of strands twisted or braided together.",
    "rosy": "Resembling a rose in color, form, or qualities; blooming; red; blushing; also, adorned with roses.",
    "rotten": "Having rotted; putrid; decayed; as, a rotten apple; rotten meat.",
    "rotunda": "A round building; especially, one that is round both on the outside and inside, like the Pantheon at Rome.",
    "roulette": "1. A game of chance, in which a small ball is made to move round rapidly on a circle divided off into numbered red and black spaces, the one on which it stops indicating the result of a variety of wagers permitted by the game. 2. (Fine Arts) (a) A small toothed wheel used by engravers to roll over a plate in order to order to produce rows of dots. (b) A similar wheel used to roughen the surface of a plate, as in making alterations in a mezzotint. 3. (Geom.)  the curve traced by any point in the plane of a given curve when the latter rolls, without sliding, over another fixed curve.",
    "roundish": "Somewhat round; as, a roundish seed; a roundish figure.",
    "roundness": "1. The quality or state of being round in shape; as, the roundness of the globe, of the orb of the sun, of a ball, of a bowl, a column, etc. 2. Fullness; smoothness of flow; as, the roundness of a period; the roundness of a note; roundness of tone. 3. Openess; plainess; boldness; positiveness; as, the roundness of an assertion.",
    "rover": "1. One who practices robbery on the seas; a pirate.",
    "roving": "1. The operatin of forming the rove, or slightly twisted sliver or roll of wool or cotton, by means of a machine for the purpose, called a roving frame, or roving machine. 2. A roll or sliver of wool or cotton drawn out and slightly twisted; a rove.",
    "royal": "1. Kingly; pertaining to the crown or the sovereign; suitable for a king or queen; regal; as, royal power or prerogative; royal domains; the royal family; royal state. 2. Noble; generous; magnificent; princely.",
    "rubber": "1. One who, or that which, rubs.",
    "rubble": "1. Water-worn or rough broken stones; broken bricks, etc., used in coarse masonry, or to fill up between the facing courses of walls.",
    "ruby": "1. (Min.)  A precious stone of a carmine red color, sometimes verging to violet, or intermediate between carmine and hyacinth red.",
    "rudder": "A riddle or sieve.",
    "rug": "1. A kind of coarse, heavy frieze, formerly used for garments.",
    "rule": "1. That which is prescribed or laid down as a guide for conduct or action; a governing direction for a specific purpose; an authoritative enactment; a regulation; a prescription; a precept; as, the rules of various societies; the rules governing a school; a rule of etiquette or propriety; the rules of cricket.",
    "rumble": "1. To make a low, heavy, continued sound; as, the thunder rumbles at a distance.",
    "rummage": "1. (Naut.)  A place or room for the stowage of cargo in a ship; also, the act of stowing cargo; the pulling and moving about of packages incident to close stowage; -- formerly written romage.",
    "rumor": "1. A flying or popular report; the common talk; hence, public fame; notoriety.",
    "runner": "1. One who, or that which, runs; a racer. 2. A detective.",
    "running": "1. Moving or advancing by running.",
    "runt": "1. (Zoöl.)  Any animal which is unusually small, as compared with others of its kind; -- applied particulary to domestic animals. 2. (Zoöl.)  A variety of domestic pigeon, related to the barb and carrier. 3. A dwarf; also, a mean, despicable, boorish person; -- used opprobriously.",
    "rupture": "1. The act of breaking apart, or separating; the state of being asunder; as, the rupture of the skin; the rupture of a vessel or fiber; the rupture of a lutestring.",
    "rural": "1. Of or pertaining to the country, as distinguished from a city or town; living in the country; suitable for, or resembling, the country; rustic; as, rural scenes; a rural prospect.",
    "ruse": "An artifice; trick; stratagem; wile; fraund; deceit.",
    "rush": "1. (Bot.)  A name given to many aquatic or marsh-growing endogenous plants with soft, slender stems, as the species of Juncus and Scirpus.",
    "rust": "1. (Chem.)  The reddish yellow coating formed on iron when exposed to moist air, consisting of ferric oxide or hydroxide; hence, by extension, any metallic film of corrosion. 2. (Bot.)  A minute mold or fungus forming reddish or rusty spots on the leaves and stems of cereal and other grasses (Trichobasis Rubigo- vera), now usually believed to be a form or condition of the corn mildew (Puccinia graminis). As rust, it has solitary reddish spores; as corn mildew, the spores are double and blackish.",
    "rut": "1. (Physiol.)  Sexual desire or oestrus of deer, cattle, and various other mammals; heat; also, the period during which the oestrus exists. 2. Roaring, as of waves breaking upon the shore; rote.",
    "sabbath": "1. A season or day of rest; one day in seven appointed for rest or worship, the observance of which was enjoined upon the Jews in the Decalogue, and has been continued by the Christian church with a transference of the day observed from the last to the first day of the week, which is called also Lord's Day.",
    "sacrament": "1. The oath of allegiance taken by Roman soldiers; hence, a sacred ceremony used to impress an obligation; a solemn oath-taking; an oath.",
    "sacred": "1. Set apart by solemn religious ceremony; especially, in a good sense, made holy; set apart to religious use; consecrated; not profane or common; as, a sacred place; a sacred day; sacred service. 2. Relating to religion, or to the services of religion; not secular; religious; as, sacred history.",
    "sacrifice": "1. The offering of anything to God, or to a god; consecratory rite.",
    "sadden": "To make sad.",
    "sadly": "1. Wearily; heavily; firmly.",
    "sadness": "1. Heaviness; firmness.",
    "safeguard": "1. One who, or that which, defends or protects; defense; protection.",
    "saffron": "1. (Bot.)  A bulbous iridaceous plant (Crocus sativus) having blue flowers with large yellow stigmas.",
    "saga": "A Scandinavian legend, or heroic or mythic tradition, among the Norsemen and kindred people; a northern European popular historical or religious tale of olden time.",
    "sage": "(a) A suffriticose labiate plant (Salvia officinalis) with grayish green foliage, much used in flavoring meats, etc.",
    "sagging": "A bending or sinking between the ends of a thing, in consequence of its own, or an imposed, weight; an arching downward in the middle, as of a ship after straining.",
    "saint": "1. A person sanctified; a holy or godly person; one eminent for piety and virtue; any true Christian, as being redeemed and consecrated to God.",
    "sake": "Final cause; end; purpose of obtaining; cause; motive; reason; interest; concern; account; regard or respect; -- used chiefly in such phrases as, for the sake, for his sake, for man's sake, for mercy's sake, and the like; as, to commit crime for the sake of gain; to go abroad for the sake of one's health.",
    "salad": "1. A preparation of vegetables, as lettuce, celery, water cress, onions, etc., usually dressed with salt, vinegar, oil, and spice, and eaten for giving a relish to other food; as, lettuce salad; tomato salad, etc.",
    "saline": "1. Consisting of salt, or containing salt; as, saline particles; saline substances; a saline cathartic. 2. Of the quality of salt; salty; as, a saline taste.",
    "salon": "An apartment for the reception of company; hence, in the plural, faschionable parties; circles of fashionable society.",
    "saloon": "1. A spacious and elegant apartment for the reception of company or for works of art; a hall of reception, esp. a hall for public entertainments or amusements; a large room or parlor; as, the saloon of a steamboat.",
    "salt": "1. The chloride of sodium, a substance used for seasoning food, for the preservation of meat, etc.",
    "salutary": "1. Wholesome; healthful; promoting health; as, salutary exercise. 2. Promotive of, or contributing to, some beneficial purpose; beneficial; advantageous; as, a salutary design.",
    "salute": "1. To adress, as with expressions of kind wishes and courtesy; to greet; to hail.",
    "salvage": "1. The act of saving a vessel, goods, or life, goods, or life, from perils of the sea.",
    "salvation": "1. The act of saving; preservation or deliverance from destruction, danger, or great calamity. 2. (Theol.)  The redemption of man from the bondage of sin and liability to eternal death, and the conferring on him of everlasting happiness.",
    "same": "1. Not different or other; not another or others; identical; unchanged.",
    "sample": "1. Example; pattern.",
    "sanction": "1. Solemn or ceremonious ratification; an official act of a superior by which he ratifies and gives validity to the act of some other person or body; establishment or furtherance of anything by authority to it; confirmation; approbation.",
    "sanctity": "1. The state or quality of being sacred or holy; holiness; saintliness; moral purity; godliness.",
    "sanctuary": "A sacred place; a consecrated spot; a holy and inviolable site.",
    "sandal": "Same as Sendal.",
    "sanded": "1. Covered or sprinkled with sand; sandy; barren.",
    "sandpaper": "Paper covered on one side with sand glued fast, -- used for smoothing and polishing.",
    "sandstone": "A rock made of sand more or less firmly united.",
    "sandworm": "(a) Any one of numerous species of annelids which burrow in the sand of the seashore. (b) Any species of annelids of the genus Sabellaria.",
    "sanitary": "Of or pertaining to health; designed to secure or preserve health; relating to the preservation or restoration of health; hygienic; as, sanitary regulations.",
    "sapling": "A young tree.",
    "sappy": "1. Abounding with sap; full of sap; juisy; succulent. 2. Hence, young, not firm; weak, feeble.",
    "sarcasm": "A keen, reproachful expression; a satirical remark uttered with some degree of scorn or contempt; a taunt; a gibe; a cutting jest.",
    "sarcastic": "Expressing, or expressed by, sarcasm; characterized by, or of the nature of, sarcasm; given to the use of sarcasm; bitterly satirical; scornfully severe; taunting.",
    "sardine": "Any one of several small species of herring which are commonly preserved in olive oil for food, especially the pilchard, or European sardine (Clupea pichardus). The California sardine (Clupea sagax) is similar.",
    "sash": "A scarf or band worn about the waist, over the shoulder, or otherwise; a belt; a girdle, -- worn by women and children as an ornament; also worn as a badge of distinction by military officers, members of societies, etc.",
    "satchel": "A little sack or bag for carrying papers, books, or small articles of wearing apparel; a hand bag.",
    "satin": "A silk cloth, of a thick, close texture, and overshot woof, which has a glossy surface.",
    "satirical": "1. Of or pertaining to satire; of the nature of satire; as, a satiric style. 2. Censorious; severe in language; sarcastic; insulting.",
    "satisfy": "1. In general, to fill up the measure of a want of (a person or a thing); hence, to grafity fully the desire of; to make content; to supply to the full, or so far as to give contentment with what is wished for.",
    "saturate": "1. To cause to become completely penetrated, impregnated, or soaked; to fill fully; to sate.",
    "sauciness": "The quality or state of being saucy; that which is saucy; impertinent boldness; contempt of superiors; impudence.",
    "saucy": "1. Showing impertinent boldness or pertness; transgressing the rules of decorum; treating superiors with contempt; impudent; insolent; as, a saucy fellow.",
    "savage": "1. Of or pertaining to the forest; remote from human abodes and cultivation; in a state of nature; nature; wild; as, a savage wilderness. 2. Wild; untamed; uncultivated; as, savage beasts.",
    "savanna": "A tract of level land covered with the vegetable growth usually found in a damp soil and warm climate, -- as grass or reeds, -- but destitute of trees.",
    "savor": "1. That property of a thing which affects the organs of taste or smell; taste and odor; flavor; relish; scent; as, the savor of an orange or a rose; an ill savor.",
    "say": "Saw.",
    "scabbed": "1. Abounding with scabs; diseased with scabs. 2. Fig.: Mean; paltry; vile; worthless.",
    "scabby": "1. Affected with scabs; full of scabs. 2. Diseased with the scab, or mange; mangy.",
    "scale": "1. The dish of a balance; hence, the balance itself; an instrument or machine for weighing; as, to turn the scale; -- chiefly used in the plural when applied to the whole instrument or apparatus for weighing.",
    "scallion": "1. (Bot.)  A kind of small onion (Allium Ascalonicum), native of Palestine; the eschalot, or shallot. 2. Any onion which does not \"bottom out,\" but remains with a thick stem like a leek.",
    "scallop": "1. (Zoöl.)  Any one of numerous species of marine bivalve mollusks of the genus Pecten and allied genera of the family Pectinidæ. The shell is usually radially ribbed, and the edge is therefore often undulated in a characteristic manner.",
    "scalping": "a. & n. from Scalp.",
    "scandal": "1. Offense caused or experienced; reproach or reprobation called forth by what is regarded as wrong, criminal, heinous, or flagrant: opprobrium or disgrace.",
    "scant": "1. Not full, large, or plentiful; scarcely sufficient; less than is wanted for the purpose; scanty; meager; not enough; as, a scant allowance of provisions or water; a scant pattern of cloth for a garment.",
    "scapegoat": "1. (Jewish Antiq.)  A goat upon whose head were symbolically placed the sins of the people, after which he was suffered to escape into the wilderness.",
    "scarce": "1. Not plentiful or abundant; in small quantity in proportion to the demand; not easily to be procured; rare; uncommon.",
    "scarcity": "The quality or condition of being scarce; smallness of quantity in proportion to the wants or demands; deficiency; lack of plenty; short supply; penury; as, a scarcity of grain; a great scarcity of beauties.",
    "scarecrow": "1. Anything set up to frighten crows or other birds from cornfields; hence, anything terifying without danger.",
    "scarf": "A cormorant.",
    "scarring": "A scar; a mark.",
    "scary": "Barren land having only a thin coat of grass.",
    "scavenger": "A person whose employment is to clean the streets of a city, by scraping or sweeping, and carrying off the fifth.",
    "scenic": "Of or pertaining to scenery; of the nature of scenery; theatrical.",
    "schedule": "A written or printed scroll or sheet of paper; a document; especially, a formal list or inventory; a list or catalogue annexed to a larger document, as to a will, a lease, a statute, etc.",
    "scheme": "1. A combination of things connected and adjusted by design; a system.",
    "scheming": "Given to forming schemes; artful; intriguing.",
    "schnapps": "Holland gin.",
    "scholar": "1. One who attends a school; one who learns of a teacher; one under the tuition of a preceptor; a pupil; a disciple; a learner; a student.",
    "science": "1. Knowledge; lnowledge of principles and causes; ascertained truth of facts.",
    "scientist": "One learned in science; a scientific investigator; one devoted to scientific study; a savant.",
    "scion": "1. (Bot.) (a) A shoot or sprout of a plant; a sucker. (b) A piece of a slender branch or twig cut for grafting.",
    "scoff": "1. Derision; ridicule; mockery; derisive or mocking expression of scorn, contempt, or reproach.",
    "scolding": "a. & n. from Scold, v. Scolding bridle, an iron frame.",
    "scone": "A cake, thinner than a bannock, made of wheat or barley or oat meal.",
    "scoop": "1. A large ladle; a vessel with a long handle, used for dipping liquids; a utensil for bailing boats. 2. A deep shovel, or any similar implement for digging out and dipping or shoveling up anything; as, a flour scoop; the scoop of a dredging machine. 3. (Surg.)  A spoon-shaped instrument, used in extracting certain substances or foreign bodies. 4. A place hollowed out; a basinlike cavity; a hollow.",
    "scope": "1. That at which one aims; the thing or end to which the mind directs its view; that which is purposed to be reached or accomplished; hence, ultimate design, aim, or purpose; intention; drift; object.",
    "scorch": "1. To burn superficially; to parch, or shrivel, the surface of, by heat; to subject to so much heat as changes color and texture without consuming; as, to scorch linen.",
    "scorn": "1. Extreme and lofty contempt; haughty disregard; that disdain which aprings from the opinion of the utter meanness and unworthiness of an object.",
    "scorpion": "1. (Zoöl.)  Any one of numerous species of pulmonate arachnids of the order scorpiones, having a suctorial mouth, large claw-bearing palpi, and a caudal sting.",
    "scotch": "Of or pertaining to Scotland, its language, or its inhabitants; Scottish.",
    "scoundrel": "A mean, worthless fellow; a rascal; a villain; a man without honor or virtue.",
    "scrabble": "1. To scrape, paw, or scratch with the hands; to proceed by clawing with the hands and feet; to scramble; as, to scrabble up a cliff or a tree.",
    "scrap": "1. Something scraped off; hence, a small piece; a bit; a fragment; a detached, incomplete portion.",
    "scratch": "1. To rub and tear or mark the surface of with something sharp or ragged; to scrape, roughen, or wound slightly by drawing something pointed or rough across, as the claws, the nails, a pin, or the like.",
    "screen": "1. Anything that separates or cuts off inconvience, injury, or danger; that which shelters or conceals from view; a shield or protection; as, a fire screen.",
    "script": "1. A writing; a written document.",
    "scroll": "1. A roll of paper or parchment; a writing formed into a roll; a schedule; a list.",
    "scrubber": "1. One who, or that which, scrubs; esp., a brush used in scrubbing. 2. (Gas Manuf.)  A gas washer.",
    "scrunch": "To scranch; to crunch.",
    "scrutiny": "1. Close examination; minute inspection; critical observation.",
    "scuff": "The back part of the neck; the scruff.",
    "sculpture": "1. The art of carving, cutting, or hewing wood, stone, metal, etc., into statues, ornaments, etc., or into figures, as of men, or other things; hence, the art of producing figures and groups, whether in plastic or hard materials. 2. Carved work modeled of, or cut upon, wood, stone, metal, etc.",
    "scurvy": "1. Covered or affected with scurf or scabs; scabby; scurfy; specifically, diseased with the scurvy.",
    "scuttle": "1. A broad, shallow basket. 2. A wide-mouthed vessel for holding coal: a coal hod.",
    "seclusion": "The act of secluding, or the state of being secluded; separation from society or connection; a withdrawing; privacy; as, to live in seclusion.",
    "second": "1. Immediately following the first; next to the first in order of place or time; hence, occuring again; another; other.",
    "secrecy": "1. The state or quality of being hidden; as, his movements were detected in spite of their secrecy.",
    "secret": "1. Hidden; concealed; as, secret treasure; secret plans; a secret vow.",
    "sectional": "1. Of or pertaining to a sections or distinct part of larger body or territory; local.",
    "sector": "1. (Geom.)  A part of a circle comprehended between two radii and the included arc. 2. A mathematical instrument, consisting of two rulers connected at one end by a joint, each arm marked with several scales, as of equal parts, chords, sines, tangents, etc., one scale of each kind on each arm, and all on lines radiating from the common center of motion.",
    "secular": "1. Coming or observed once in an age or a century.",
    "securely": "In a secure manner; without fear or apprehension; without danger; safely.",
    "security": "1. The condition or quality of being secure; secureness.",
    "sedan": "A portable chair or covered vehicle for carrying a single person, -- usually borne on poles by two men.",
    "sedate": "Undisturbed by passion or caprice; calm; tranquil; serene; not passionate or giddy; composed; staid; as, a sedate soul, mind, or temper.",
    "sedation": "The act of calming, or the state of being calm.",
    "sedative": "Tending to calm, moderate, or tranquilize; specifically (Med.), allaying irritability and irritation; assuaging pain.",
    "seduce": "1. To draw aside from the path of rectitude and duty in any manner; to entice to evil; to lead astray; to tempt and lead to iniquity; to corrupt.",
    "seducing": "Seductive.",
    "segment": "1. One of the parts into which any body naturally separates or is divided; a part divided or cut off; a section; a portion; as, a segment of an orange; a segment of a compound or divided leaf. 2. (Geom.)  A part cut off from a figure by a line or plane; especially, that part of a circle contained between a chord and an arc of that circle, or so much of the circle as is cut off by the chord; as, the segment acb in the Illustration. 3. (Mach.) (a) A piece in the form of the sector of a circle, or part of a ring; as, the segment of a sectional fly wheel or flywheel rim. (b) A segment gear. 4. (Biol.) (a) One of the cells or division formed by segmentation, as in egg cleavage or in fissiparous cell formation. (b) One of the divisions, rings, or joints into which many animal bodies are divided; a somite; a metamere; a somatome.",
    "seismic": "Of or pertaining to an earthquake; caused by an earthquake.",
    "seldom": "Rarely; not often; not frequently.",
    "selection": "The act of selecting, or the state of being selected; choice, by preference. 2. That which is selected; a collection of things chosen; as, a choice selection of books.",
    "selective": "Selecting; tending to select.",
    "self": "Same; particular; very; identical.",
    "senate": "1. An assembly or council having the highest deliberative and legislative functions.",
    "senator": "1. A member of a senate.",
    "send": "1. To cause to go in any manner; to dispatch; to commission or direct to go; as, to send a messenger.",
    "sensation": "1. (Physiol.)  An impression, or the consciousness of an impression, made upon the central nervous organ, through the medium of a sensory or afferent nerve or one of the organs of sense; a feeling, or state of consciousness, whether agreeable or disagreeable, produced either by an external object (stimulus), or by some change in the internal state of the body.",
    "sensitive": "1. Having sense of feeling; possessing or exhibiting the capacity of receiving impressions from external objects; as, a sensitive soul. 2. Having quick and acute sensibility, either to the action of external objects, or to impressions upon the mind and feelings; highly susceptible; easily and acutely affected.",
    "sensuous": "1. Of or pertaining to the senses, or sensible objects; addressing the senses; suggesting pictures or images of sense.",
    "sepia": "1. (Zoöl.) (a) The common European cuttlefish. (b) A genus comprising the common cuttlefish and numerous similar species.",
    "septic": "Of the seventh degree or order. -- n. (Alg.)  A quantic of the seventh degree.",
    "septum": "1. A wall separating two cavities; a partition; as, the nasal septum. 2. (Bot.)  A partition that separates the cells of a fruit. 3. (Zoöl.) (a) One of the radial calcareous plates of a coral. (b) One of the transverse partitions dividing the shell of a mollusk, or of a rhizopod, into several chambers.",
    "sequel": "1. That which follows; a succeeding part; continuation; as, the sequel of a man's advantures or history.",
    "sequence": "1. The state of being sequent; succession; order of following; arrangement.",
    "sequester": "1. (Law)  To separate from the owner for a time; to take from parties in controversy and put into the possession of an indifferent person; to seize or take possession of, as property belonging to another, and hold it till the profits have paid the demand for which it is taken, or till the owner has performed the decree of court, or clears himself of contempt; in international law, to confiscate.",
    "series": "1. A number of things or events standing or succeeding in order, and connected by a like relation; sequence; order; course; a succession of things; as, a continuous series of calamitous events.",
    "sermon": "1. A discourse or address; a talk; a writing; as, the sermens of Chaucer.",
    "serpent": "1. (Zoöl.)  Any reptile of the order Ophidia; a snake, especially a large snake.",
    "serrated": "1. Notched on the edge, like a saw. 2. (Bot.)  Beset with teeth pointing forwards or upwards; as, serrate leaves.",
    "serve": "1. To work for; to labor in behalf of; to exert one's self continuously or statedly for the benefit of; to do service for; to be in the employment of, as an inferior, domestic, serf, slave, hired assistant, official helper, etc.; specifically, in a religious sense, to obey and worship.",
    "service": "A name given to several trees and shrubs of the genus Pyrus, as Pyrus domestica and P. torminalis of Europe, the various species of mountain ash or rowan tree, and the American shad bush (see Shad bush, under Shad). They have clusters of small, edible, applelike berries.",
    "serving": "a & n. from Serve.",
    "sesame": "Either of two annual herbaceous plants of the genus Sesamum (S. Indicum, and S. orientale), from the seeds of which an oil is expressed; also, the small obovate, flattish seeds of these plants, sometimes used as food.",
    "setback": "1. (Arch.)  Offset, n., 4. 2. A backset; a countercurrent; an eddy.",
    "setting": "1. The act of one who, or that which, sets; as, the setting of type, or of gems; the setting of the sun; the setting (hardening) of moist plaster of Paris; the setting (set) of a current. 2. The act of marking the position of game, as a setter does; also, hunting with a setter.",
    "settle": "1. A seat of any kind.",
    "settling": "1. The act of one who, or that which, settles; the act of establishing one's self, of colonizing, subsiding, adjusting, etc. 2. pl.",
    "sevenfold": "Repeated seven times; having seven thicknesses; increased to seven times the size or amount.",
    "seventh": "1. Next in order after the sixth;; coming after six others.",
    "severity": "The quality or state of being severe.",
    "shabby": "1. Torn or worn to rage; poor; mean; ragged.",
    "shack": "1. To shed or fall, as corn or grain at harvest.",
    "shadow": "1. Shade within defined limits; obscurity or deprivation of light, apparent on a surface, and representing the form of the body which intercepts the rays of light; as, the shadow of a man, of a tree, or of a tower.",
    "shady": "1. Abounding in shade or shades; overspread with shade; causing shade.",
    "shaft": "1. The slender, smooth stem of an arrow; hence, an arrow.",
    "shaky": "1. Shaking or trembling; as, a shaky spot in a marsh; a shaky hand.",
    "shale": "1. A shell or husk; a cod or pod.",
    "shallow": "1. Not deep; having little depth; shoal.",
    "shame": "1. A painful sensation excited by a consciousness of guilt or impropriety, or of having done something which injures reputation, or of the exposure of that which nature or modesty prompts us to conceal.",
    "shampoo": "1. To press or knead the whole surface of the body of (a person), and at the same time to stretch the limbs and joints, in connection with the hot bath. 2. To wash throughly and rub the head of (a person), with the fingers, using either soap, or a soapy preparation, for the more thorough cleansing.",
    "shamrock": "A trifoliate plant used as a national emblem by the Irish.",
    "shanty": "Jaunty; showy.",
    "shape": "1. To form or create; especially, to mold or make into a particular form; to give proper form or figure to.",
    "share": "1. The part (usually an iron or steel plate) of a plow which cuts the ground at the bottom of a furrow; a plowshare. 2. The part which opens the ground for the reception of the seed, in a machine for sowing seed.",
    "sharper": "A person who bargains closely, especially, one who cheats in bargains; a swinder; also, a cheating gamester.",
    "sharpie": "A long, sharp, flat-bottomed boat, with one or two masts carrying a triangular sail.",
    "sharply": "In a sharp manner,; keenly; acutely.",
    "shawl": "A square or oblong cloth of wool, cotton, silk, or other textile or netted fabric, used, especially by women, as a loose covering for the neck and shoulders.",
    "sheath": "1. A case for the reception of a sword, hunting knife, or other long and slender instrument; a scabbard.",
    "shed": "A slight or temporary structure built to shade or shelter something; a structure usually open in front; an outbuilding; a hut; as, a wagon shed; a wood shed.",
    "sheep": "1. (Zoöl.)  Any one of several species of ruminants of the genus Ovis, native of the higher mountains of both hemispheres, but most numerous in Asia.",
