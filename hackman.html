    "elevation": "1. The act of raising from a lower place, condition, or quality to a higher; -- said of material things, persons, the mind, the voice, etc.; as, the elevation of grain; elevation to a throne; elevation of mind, thoughts, or character. 2. Condition of being elevated; height; exaltation.",
    "elevator": "One who, or that which, raises or lifts up anything; as: (a) A mechanical contrivance, usually an endless belt or chain with a series of scoops or buckets, for transferring grain to an upper loft for storage. (b) A cage or platform and the hoisting machinery in a hotel, warehouse, mine, etc., for conveying persons, goods, etc., to or from different floors or levels; -- called in England a lift; the cage or platform itself. (c) A building for elevating, storing, and discharging, grain. (d) (Anat.) A muscle which serves to raise a part of the body, as the leg or the eye. (e) (Surg.) An instrument for raising a depressed portion of a bone.",
    "elf": "1. An imaginary supernatural being, commonly a little sprite, much like a fairy; a mythological diminutive spirit, supposed to haunt hills and wild places, and generally represented as delighting in mischievous tricks.",
    "eligible": "1. That may be selected; proper or qualified to be chosen; legally qualified to be elected and to hold office. 2. Worthy to be chosen or selected; suitable; desirable; as, an eligible situation for a house.",
    "eliminate": "1. To put out of doors; to expel; to discharge; to release; to set at liberty.",
    "elixir": "1. (Med.)  A tincture with more than one base; a compound tincture or medicine, composed of various substances, held in solution by alcohol in some form. 2. (Alchemy)  An imaginary liquor capable of transmuting metals into gold; also, one for producing life indefinitely; as, elixir vitæ, or the elixir of life. 3. The refined spirit; the quintessence.",
    "elk": "A large deer, of several species.",
    "ellipse": "1. (Geom.)  An oval or oblong figure, bounded by a regular curve, which corresponds to an oblique projection of a circle, or an oblique section of a cone through its opposite sides.",
    "elliptic": "1. Of or pertaining to an ellipse; having the form of an ellipse; oblong, with rounded ends.",
    "elm": "A tree of the genus Ulmus, of several species, much used as a shade tree, particularly in America.",
    "elope": "To run away, or escape privately, from the place or station to which one is bound by duty; -- said especially of a woman or a man, either married or unmarried, who runs away with a paramour or a sweetheart.",
    "eloquence": "1. Fluent, forcible, elegant, and persuasive speech in public; the power of expressing strong emotions in striking and appropriate language either spoken or written, thereby producing conviction or persuasion.",
    "eloquent": "1. Having the power of expressing strong emotions or forcible arguments in an elevated, impassioned, and effective manner; as, an eloquent orator or preacher.",
    "elude": "To avoid slyly, by artifice, stratagem, or dexterity; to escape from in a covert manner; to mock by an unexpected escape; to baffle; as, to elude an officer; to elude detection, inquiry, search, comprehension; to elude the force of an argument or a blow.",
    "elusive": "Tending to elude; using arts or deception to escape; adroitly escaping or evading; eluding the grasp; fallacious.",
    "embargo": "An edict or order of the government prohibiting the departure of ships of commerce from some or all of the ports within its dominions; a prohibition to sail.",
    "embark": "1. To cause to go on board a vessel or boat; to put on shipboard. 2. To engage, enlist, or invest (as persons, money, etc.) in any affair; as, he embarked his fortune in trade.",
    "embassy": "1. The public function of an ambassador; the charge or business intrusted to an ambassador or to envoys; a public message to; foreign court concerning state affairs; hence, any solemn message.",
    "embattled": "1. Having indentations like a battlement.",
    "embellish": "To make beautiful or elegant by ornaments; to decorate; to adorn; as, to embellish a book with pictures, a garden with shrubs and flowers, a narrative with striking anecdotes, or style with metaphors.",
    "ember": "A lighted coal, smoldering amid ashes; -- used chiefly in the plural, to signify mingled coals and ashes; the smoldering remains of a fire.",
    "embezzle": "1. To appropriate fraudulently to one's own use, as property intrusted to one's care; to apply to one's private uses by a breach of trust; as, to embezzle money held in trust. 2. To misappropriate; to waste; to dissipate in extravagance.",
    "emblaze": "1. To adorn with glittering embellishments.",
    "emblem": "1. Inlay; inlaid or mosaic work; something ornamental inserted in a surface.",
    "embody": "To form into a body; to invest with a body; to collect into a body, a united mass, or a whole; to incorporate; as, to embody one's ideas in a treatise.",
    "embolism": "1. Intercalation; the insertion of days, months, or years, in an account of time, to produce regularity; as, the embolism of a lunar month in the Greek year. 2. Intercalated time.",
    "emboss": "1. To arise the surface of into bosses or protuberances; particularly, to ornament with raised work.",
    "embroider": "To ornament with needlework; as, to embroider a scarf.",
    "emerald": "1. (Min.)  A precious stone of a rich green color, a variety of beryl.",
    "emergency": "1. Sudden or unexpected appearance; an unforeseen occurrence; a sudden occasion.",
    "emission": "1. The act of sending or throwing out; the act of sending forth or putting into circulation; issue; as, the emission of light from the sun; the emission of heat from a fire; the emission of bank notes. issue bank notes. 2. That which is sent out, issued, or put in circulation at one time; issue; as, the emission was mostly blood.",
    "emit": "1. To send forth; to throw or give out; to cause to issue; to give vent to; to eject; to discharge; as, fire emits heat and smoke; boiling water emits steam; the sun emits light.",
    "emotion": "A moving of the mind or soul; excitement of the feelings, whether pleasing or painful; disturbance or agitation of mind caused by a specific exciting cause and manifested by some sensible effect on the body.",
    "emperor": "The sovereign or supreme monarch of an empire; -- a title of dignity superior to that of king; as, the emperor of Germany or of Austria; the emperor or Czar of Russia.",
    "emphasis": "1. (Rhet.)  A particular stress of utterance, or force of voice, given in reading and speaking to one or more words whose signification the speaker intends to impress specially upon his audience.",
    "emphatic": "1. Uttered with emphasis; made prominent and impressive by a peculiar stress of voice; laying stress; deserving of stress or emphasis; forcible; impressive; strong; as, to remonstrate in am emphatic manner; an emphatic word; an emphatic tone; emphatic reasoning. 2. Striking the sense; attracting special attention; impressive; forcible.",
    "empirical": "1. Pertaining to, or founded upon, experiment or experience; depending upon the observation of phenomena; versed in experiments.",
    "emporium": "1. A place of trade; a market place; a mart; esp., a city or town with extensive commerce; the commercial center of a country.",
    "empower": "1. To give authority to; to delegate power to; to commission; to authorize (having commonly a legal force); as, the Supreme Court is empowered to try and decide cases, civil or criminal; the attorney is empowered to sign an acquittance, and discharge the debtor. 2. To give moral or physical power, faculties, or abilities to.",
    "emptiness": "1. The state of being empty; absence of contents; void space; vacuum; as, the emptiness of a vessel; emptiness of the stomach. 2. Want of solidity or substance; unsatisfactoriness; inability to satisfy desire; vacuity; hollowness; the emptiness of earthly glory. 3. Want of knowledge; lack of sense; vacuity of mind.",
    "empty": "1. Containing nothing; not holding or having anything within; void of contents or appropriate contents; not filled; -- said of an inclosure, as a box, room, house, etc.; as, an empty chest, room, purse, or pitcher; an empty stomach; empty shackles. 2. Free; clear; devoid; -- often with of.",
    "emu": "A large Australian bird, of two species (Dromaius Novæ- Hollandiæ and D. irroratus), related to the cassowary and the ostrich.",
    "enable": "1. To give strength or ability to; to make firm and strong.",
    "enamel": "1. A variety of glass, used in ornament, to cover a surface, as of metal or pottery, and admitting of after decoration in color, or used itself for inlaying or application in varied colors. 2. (Min.)  A glassy, opaque bead obtained by the blowpipe. 3. That which is enameled; also, any smooth, glossy surface, resembling enamel, especially if variegated. 4. (Anat.)  The intensely hard calcified tissue entering into the composition of teeth.",
    "encircle": "To form a circle about; to inclose within a circle or ring; to surround; as, to encircle one in the arms; the army encircled the city.",
    "enclose": "To inclose.",
    "enclosure": "Inclosure.",
    "encore": "Once more; again; -- used by the auditors and spectators of plays, concerts, and other entertainments, to call for a repetition of a particular part.",
    "encounter": "To come against face to face; to meet; to confront, either by chance, suddenly, or deliberately; especially, to meet in opposition or with hostile intent; to engage in conflict with; to oppose; to struggle with; as, to encounter a friend in traveling; two armies encounter each other; to encounter obstacles or difficulties, to encounter strong evidence of a truth.",
    "encourage": "To give courage to; to inspire with courage, spirit, or hope; to raise, or to increase, the confidence of; to animate; enhearten; to incite; to help forward; -- the opposite of discourage.",
    "encroach": "To enter by gradual steps or by stealth into the possessions or rights of another; to trespass; to intrude; to trench; -- commonly with on or upon; as, to encroach on a neighbor; to encroach on the highway.",
    "encrust": "To incrust.",
    "endanger": "1. To put to hazard; to bring into danger or peril; to expose to loss or injury; as, to endanger life or peace.",
    "endearing": "Making dear or beloved; causing love.",
    "ending": "1. Termination; concluding part; result; conclusion; destruction; death. 2. (Gram.)  The final syllable or letter of a word; the part joined to the stem.",
    "endless": "1. Without end; having no end or conclusion; perpetual; interminable; -- applied to length, and to duration; as, an endless line; endless time; endless bliss; endless praise; endless clamor. 2. Infinite; excessive; unlimited.",
    "endorse": "Same as Indorse.",
    "endowment": "1. The act of bestowing a dower, fund, or permanent provision for support. 2. That which is bestowed or settled on a person or an institution; property, fund, or revenue permanently appropriated to any object; as, the endowment of a church, a hospital, or a college. 3. That which is given or bestowed upon the person or mind; gift of nature; accomplishment; natural capacity; talents; -- usually in the plural.",
    "endurable": "Capable of being endured or borne; sufferable.",
    "endurance": "1. A state or quality of lasting or duration; lastingness; continuance.",
    "enduring": "Lasting; durable; long-suffering; as, an enduring disposition.",
    "energetic": "1. Having energy or energies; possessing a capacity for vigorous action or for exerting force; active.",
    "energize": "To use strength in action; to act or operate with force or vigor; to act in producing an effect.",
    "energy": "1. Internal or inherent power; capacity of acting, operating, or producing an effect, whether exerted or not; as, men possessing energies may suffer them to lie inactive.",
    "enforced": "Compelled; forced; not voluntary.",
    "engaged": "1. Occupied; employed; busy. 2. Pledged; promised; especially, having the affections pledged; promised in marriage; affianced; betrothed. 3. Greatly interested; of awakened zeal; earnest. 4. Involved; esp., involved in a hostile encounter; as, the engaged ships continued the fight.",
    "engaging": "Tending to draw the attention or affections; attractive; as, engaging manners or address.",
    "engine": "1. (Pronounced, in this sense, [Obs.] A man hath sapiences three, Memory, engine, and intellect also.",
    "engorge": "1. To gorge; to glut.",
    "engraving": "1. The act or art of producing upon hard material incised or raised patterns, characters, lines, and the like; especially, the art of producing such lines, etc., in the surface of metal plates or blocks of wood.",
    "engross": "1. To make gross, thick, or large; to thicken; to increase in bulk or quantity.",
    "engulf": "To absorb or swallow up as in a gulf.",
    "enhance": "1. To raise or lift up; to exalt.",
    "enjoyable": "Capable of being enjoyed or of giving joy; yielding enjoyment.",
    "enjoyment": "1. The condition of enjoying anything; pleasure or satisfaction, as in the possession or occupancy of anything; possession and use; as, the enjoyment of an estate. 2. That which gives pleasure or keen satisfaction.",
    "enlarged": "Made large or larger; extended; swollen.",
    "enlighten": "1. To supply with light; to illuminate; as, the sun enlightens the earth.",
    "enrage": "To fill with rage; to provoke to frenzy or madness; to make furious.",
    "enrich": "1. To make rich with any kind of wealth; to render opulent; to increase the possessions of; as, to enrich the understanding with knowledge.",
    "enroll": "1. To insert in a roil; to register or enter in a list or catalogue or on rolls of court; hence, to record; to insert in records; to leave in writing; as, to enroll men for service; to enroll a decree or a law; also, reflexively, to enlist.",
    "enslave": "To reduce to slavery; to make a slave of; to subject to a dominant influence.",
    "ensnare": "To catch in a snare.",
    "ensure": "1. To make sure.",
    "entail": "1. That which is entailed.",
    "entertain": "1. To be at the charges of; to take or keep in one's service; to maintain; to support; to harbor; to keep.",
    "entire": "1. Complete in all parts; undivided; undiminished; whole; full and perfect; not deficient; as, the entire control of a business; entire confidence, ignorance.",
    "entitle": "1. To give a title to; to affix to as a name or appellation; hence, also, to dignify by an honorary designation; to denominate; to call; as, to entitle a book \"Commentaries;\" to entitle a man \"Honorable.\" That which . . . we entitle patience.",
    "entity": "A real being, whether in thought (as an ideal conception) or in fact; being; essence; existence.",
    "entomb": "To deposit in a tomb, as a dead body; to bury; to inter; to inhume.",
    "entourage": "Surroundings; specif., collectively, one's attendants or associates.",
    "entrap": "To catch in a trap; to insnare; hence, to catch, as in a trap, by artifices; to involve in difficulties or distresses; to catch or involve in contradictions; as, to be entrapped by the devices of evil men.",
    "entwine": "To twine, twist, or wreathe together or round.",
    "enunciate": "1. To make a formal statement of; to announce; to proclaim; to declare, as a truth.",
    "envelope": "1. That which envelops, wraps up, encases, or surrounds; a wrapper; an inclosing cover; esp., the cover or wrapper of a document, as of a letter. 2. (Astron.)  The nebulous covering of the head or nucleus of a comet; -- called also coma. 3. (Fort.)  A work of earth, in the form of a single parapet or of a small rampart.",
    "enviable": "Fitted to excite envy; capable of awakening an ardent desire to posses or to resemble.",
    "envious": "1. Malignant; mischievous; spiteful.",
    "envoy": "1. One dispatched upon an errand or mission; a messenger; esp., a person deputed by a sovereign or a government to negotiate a treaty, or transact other business, with a foreign sovereign or government; a minister accredited to a foreign government.",
    "envy": "1. Malice; ill will; spite.",
    "enzyme": "An unorganized or unformed ferment, in distinction from an organized or living ferment; a soluble, or chemical, ferment.",
    "epic": "Narrated in a grand style; pertaining to or designating a kind of narrative poem, usually called an heroic poem, in which real or fictitious events, usually the achievements of some hero, are narrated in an elevated style.",
    "epidemic": "1. (Med.)  Common to, or affecting at the same time, a large number in a community; -- applied to a disease which, spreading widely, attacks many persons at the same time; as, an epidemic disease; an epidemic catarrh, fever, etc.",
    "epidermis": "1. (Anat.)  The outer, nonsensitive layer of the skin; cuticle; scarfskin.",
    "epilepsy": "The \"falling sickness,\" so called because the patient falls suddenly to the ground; a disease characterized by paroxysms (or fits) occurring at interval and attended by sudden loss of consciousness, and convulsive motions of the muscles.",
    "epilogue": "1. (Drama)  A speech or short poem addressed to the spectators and recited by one of the actors, after the conclusion of the play.",
    "epiphany": "1. An appearance, or a becoming manifest.",
    "equal": "1. Agreeing in quantity, size, quality, degree, value, etc.; having the same magnitude, the same value, the same degree, etc.; -- applied to number, degree, quantity, and intensity, and to any subject which admits of them; neither inferior nor superior, greater nor less, better nor worse; corresponding; alike; as, equal quantities of land, water, etc. ; houses of equal size; persons of equal stature or talents; commodities of equal value. 2. Bearing a suitable relation; of just proportion; having competent power, abilities, or means; adequate; as, he is not equal to the task.",
    "equate": "To make equal; to reduce to an average; to make such an allowance or correction in as will reduce to a common standard of comparison; to reduce to mean time or motion; as, to equate payments; to equate lines of railroad for grades or curves; equated distances.",
    "equation": "1. A making equal; equal division; equality; equilibrium.",
    "equator": "1. (Geog.)  The imaginary great circle on the earth's surface, everywhere equally distant from the two poles, and dividing the earth's surface into two hemispheres. 2. (Astron.)  The great circle of the celestial sphere, coincident with the plane of the earth's equator; -- so called because when the sun is in it, the days and nights are of equal length; hence called also the equinoctial, and on maps, globes, etc., the equinoctial line.",
    "equinox": "1. The time when the sun enters one of the equinoctial points, that is, about March 21 and September 22. See Autumnal equinox, Vernal equinox, under Autumnal and Vernal.",
    "equipment": "1. The act of equipping, or the state of being equipped, as for a voyage or expedition.",
    "equity": "1. Equality of rights; natural justice or right; the giving, or desiring to give, to each man his due, according to reason, and the law of God to man; fairness in determination of conflicting claims; impartiality.",
    "equivocal": "1. (Literally, called equally one thing or the other; hence:) Having two significations equally applicable; capable of double interpretation; of doubtful meaning; ambiguous; uncertain; as, equivocal words; an equivocal sentence.",
    "eradicate": "1. To pluck up by the roots; to root up; as, an oak tree eradicated. 2. To root out; to destroy utterly; to extirpate; as, to eradicate diseases, or errors.",
    "erased": "1. Rubbed or scraped out; effaced; obliterated. 2. (Her.)  Represented with jagged and uneven edges, as is torn off; -- used esp. of the head or limb of a beast.",
    "errand": "A special business intrusted to a messenger; something to be told or done by one sent somewhere for the purpose; often, a verbal message; a commission; as, the servant was sent on an errand; to do an errand.",
    "errant": "1. Wandering; deviating from an appointed course, or from a direct path; roving.",
    "erratic": "1. Having no certain course; roving about without a fixed destination; wandering; moving; -- hence, applied to the planets as distinguished from the fixed stars.",
    "error": "1. A wandering; a roving or irregular course.",
    "erupt": "To cause to burst forth; to eject; as, to erupt lava.",
    "escapade": "1. The fling of a horse, or ordinary kicking back of his heels; a gambol. 2. Act by which one breaks loose from the rules of propriety or good sense; a freak; a prank.",
    "eskimo": "One of a peculiar race inhabiting Arctic America and Greenland.",
    "esophagus": "That part of the alimentary canal between the pharynx and the stomach; the gullet.",
    "esquire": "Originally, a shield-bearer or armor-bearer, an attendant on a knight; in modern times, a title of dignity next in degree below knight and above gentleman; also, a title of office and courtesy; -- often shortened to squire.",
    "essay": "1. An effort made, or exertion of body or mind, for the performance of anything; a trial; attempt; as, to make an essay to benefit a friend.",
    "essence": "1. The constituent elementary notions which constitute a complex notion, and must be enumerated to define it; sometimes called the nominal essence. 2. The constituent quality or qualities which belong to any object, or class of objects, or on which they depend for being what they are (distinguished as real essence); the real being, divested of all logical accidents; that quality which constitutes or marks the true nature of anything; distinctive character; hence, virtue or quality of a thing, separated from its grosser parts.",
    "essential": "1. Belonging to the essence, or that which makes an object, or class of objects, what it is.",
    "establish": "1. To make stable or firm; to fix immovably or firmly; to set (a thing) in a place and make it stable there; to settle; to confirm.",
    "estate": "1. Settled condition or form of existence; state; condition or circumstances of life or of any person; situation.",
    "estimate": "1. To judge and form an opinion of the value of, from imperfect data, -- either the extrinsic (money), or intrinsic (moral), value; to fix the worth of roughly or in a general way; as, to estimate the value of goods or land; to estimate the worth or talents of a person.",
    "estimator": "One who estimates or values; a valuer.",
    "etching": "1. The act, art, or practice of engraving by means of acid which eats away lines or surfaces left unprotected in metal, glass, or the like.",
    "eternal": "1. Without beginning or end of existence; always existing.",
    "eternity": "1. Infinite duration, without beginning in the past or end in the future; also, duration without end in the future; endless time.",
    "ether": "1. (Physics)  A medium of great elasticity and extreme tenuity, supposed to pervade all space, the interior of solid bodies not excepted, and to be the medium of transmission of light and heat; hence often called luminiferous ether. 2. Supposed matter above the air; the air itself. 3. (Chem.) (a) A light, volatile, mobile, inflammable liquid, (C2H5)2O, of a characteristic aromatic odor, obtained by the distillation of alcohol with sulphuric acid, and hence called also sulphuric ether.",
    "ethics": "The science of human duty; the body of rules of duty drawn from this science; a particular system of principles and rules concerting duty, whether true or false; rules of practice in respect to a single class of human actions; as, political or social ethics; medical ethics.",
    "evacuate": "1. To make empty; to empty out; to remove the contents of; as, to evacuate a vessel or dish. 2. Fig.: To make empty; to deprive.",
    "evade": "To get away from by artifice; to avoid by dexterity, subterfuge, address, or ingenuity; to elude; to escape from cleverly; as, to evade a blow, a pursuer, a punishment; to evade the force of an argument.",
    "evaporate": "1. To pass off in vapor, as a fluid; to escape and be dissipated, either in visible vapor, or in practice too minute to be visible. 2. To escape or pass off without effect; to be dissipated; to be wasted, as, the spirit of writer often evaporates in the process of translation.",
    "evasion": "The act of eluding or avoiding, particularly the pressure of an argument, accusation, charge, or interrogation; artful means of eluding.",
    "evasive": "Tending to evade, or marked by evasion; elusive; shuffling; avoiding by artifice.",
    "even": "Evening.",
    "everglade": "A swamp or low tract of land inundated with water and interspersed with hummocks, or small islands, and patches of high grass; as, the everglades of Florida.",
    "everyday": "Used or fit for every day; common; usual; as, an everyday suit or clothes.",
    "evict": "1. (Law)  To dispossess by a judicial process; to dispossess by paramount right or claim of such right; to eject; to oust.",
    "evidence": "1. That which makes evident or manifest; that which furnishes, or tends to furnish, proof; any mode of proof; the ground of belief or judgement; as, the evidence of our senses; evidence of the truth or falsehood of a statement.",
    "evident": "Clear to the vision; especially, clear to the understanding, and satisfactory to the judgment; as, the figure or color of a body is evident to the senses; the guilt of an offender can not always be made evident.",
    "evil": "1. Having qualities tending to injury and mischief; having a nature or properties which tend to badness; mischievous; not good; worthless or deleterious; poor; as, an evil beast; and evil plant; an evil crop.",
    "evoke": "1. To call out; to summon forth.",
    "evolution": "1. The act of unfolding or unrolling; hence, in the process of growth; development; as, the evolution of a flower from a bud, or an animal from the egg. 2. A series of things unrolled or unfolded.",
    "evolve": "1. To unfold or unroll; to open and expand; to disentangle and exhibit clearly and satisfactorily; to develop; to derive; to educe.",
    "exact": "1. Precisely agreeing with a standard, a fact, or the truth; perfectly conforming; neither exceeding nor falling short in any respect; true; correct; precise; as, the clock keeps exact time; he paid the exact debt; an exact copy of a letter; exact accounts.",
    "exalted": "Raised to lofty height; elevated; extolled; refined; dignified; sublime.",
    "example": "1. One or a portion taken to show the character or quality of the whole; a sample; a specimen. 2. That which is to be followed or imitated as a model; a pattern or copy.",
    "excavate": "1. To hollow out; to form cavity or hole in; to make hollow by cutting, scooping, or digging; as, to excavate a ball; to excavate the earth. 2. To form by hollowing; to shape, as a cavity, or anything that is hollow; as, to excavate a canoe, a cellar, a channel. 3. (Engin.)  To dig out and remove, as earth.",
    "exceeding": "More than usual; extraordinary; more than sufficient; measureless.",
    "exception": "1. The act of excepting or excluding; exclusion; restriction by taking out something which would otherwise be included, as in a class, statement, rule. 2. That which is excepted or taken out from others; a person, thing, or case, specified as distinct, or not included; as, almost every general rule has its exceptions.",
    "excess": "1. The state of surpassing or going beyond limits; the being of a measure beyond sufficiency, necessity, or duty; that which exceeds what is usual or prover; immoderateness; superfluity; superabundance; extravagance; as, an excess of provisions or of light.",
    "exchange": "1. The act of giving or taking one thing in return for another which is regarded as an equivalent; as, an exchange of cattle for grain. 2. The act of substituting one thing in the place of another; as, an exchange of grief for joy, or of a scepter for a sword, and the like; also, the act of giving and receiving reciprocally; as, an exchange of civilities or views. 3. The thing given or received in return; esp., a publication exchanged for another.",
    "exciting": "Calling or rousing into action; producing excitement; as, exciting events; an exciting story.",
    "exclaim": "To cry out from earnestness or passion; to utter with vehemence; to call out or declare loudly; to protest vehemently; to vociferate; to shout; as, to exclaim against oppression with wonder or astonishment; \"The field is won!\" he exclaimed.",
    "exclude": "1. To shut out; to hinder from entrance or admission; to debar from participation or enjoyment; to deprive of; to except; -- the opposite to admit; as, to exclude a crowd from a room or house; to exclude the light; to exclude one nation from the ports of another; to exclude a taxpayer from the privilege of voting.",
    "exclusion": "1. The act of excluding, or of shutting out, whether by thrusting out or by preventing admission; a debarring; rejection; prohibition; the state of being excluded.",
    "exclusive": "1. Having the power of preventing entrance; debarring from participation or enjoyment; possessed and enjoyed to the exclusion of others; as, exclusive bars; exclusive privilege; exclusive circles of society. 2. Not taking into the account; excluding from consideration; -- opposed to inclusive; as, five thousand troops, exclusive of artillery.",
    "excretion": "1. The act of excreting.",
    "excursion": "1. A running or going out or forth; an expedition; a sally.",
    "excusable": "That may be excused, forgiven, justified, or acquitted of blame; pardonable; as, the man is excusable; an excusable action.",
    "excuse": "1. To free from accusation, or the imputation of fault or blame; to clear from guilt; to release from a charge; to justify by extenuating a fault; to exculpate; to absolve; to acquit.",
    "exemplary": "1. Serving as a pattern; deserving to be proposed for imitation; commendable; as, an exemplary person; exemplary conduct.",
    "exemplify": "1. To show or illustrate by example.",
    "exert": "1. To thrust forth; to emit; to push out.",
    "exfoliate": "1. To separate and come off in scales or laminæ, as pieces of carious bone or of bark. 2. (Min.)  To split into scales, especially to become converted into scales at the result of heat or decomposition.",
    "exhale": "1. To breathe out.",
    "exhaust": "1. To draw or let out wholly; to drain off completely; as, to exhaust the water of a well; the moisture of the earth is exhausted by evaporation. 2. To empty by drawing or letting out the contents; as, to exhaust a well, or a treasury. 3. To drain, metaphorically; to use or expend wholly, or till the supply comes to an end; to deprive wholly of strength; to use up; to weary or tire out; to wear out; as, to exhaust one's strength, patience, or resources.",
    "exhume": "To dig out of the ground; to take out of a place of burial; to disinter.",
    "exile": "1. Forced separation from one's native country; expulsion from one's home by the civil authority; banishment; sometimes, voluntary separation from one's native country.",
    "exit": "He (or she ) goes out, or retires from view; as, exit Macbeth.",
    "exonerate": "1. To unload; to disburden; to discharge.",
    "exorcism": "1. The act of exorcising; the driving out of evil spirits from persons or places by conjuration; also, the form of conjuration used. 2. Conjuration for raising spirits.",
    "exorcist": "1. One who expels evil spirits by conjuration or exorcism.",
    "expand": "1. To lay open by extending; to open wide; to spread out; to diffuse; as, a flower expands its leaves.",
    "expanse": "That which is expanded or spread out; a wide extent of space or body; especially, the arch of the sky.",
    "expansion": "1. The act of expanding or spreading out; the condition of being expanded; dilation; enlargement. 2. That which is expanded; expanse; extend surface; as the expansion of a sheet or of a lake; the expansion was formed of metal.",
    "expansive": "Having a capacity or tendency to expand or dilate; diffusive; of much expanse; wide-extending; as, the expansive force of heat; the expansive quality of air.",
    "expectant": "Waiting in expectation; looking for; (Med.)  waiting for the efforts of nature, with little active treatment.",
    "expel": "1. To drive or force out from that within which anything is contained, inclosed, or situated; to eject; as to expel air from a bellows.",
    "expend": "To lay out, apply, or employ in any way; to consume by use; to use up or distribute, either in payment or in donations; to spend; as, they expend money for food or in charity; to expend time labor, and thought; to expend hay in feeding cattle, oil in a lamp, water in mechanical operations.",
    "expensive": "1. Occasioning expense; calling for liberal outlay; costly; dear; liberal; as, expensive dress; an expensive house or family.",
    "expert": "Taught by use, practice, or experience, experienced; having facility of operation or performance from practice; knowing and ready from much practice; clever; skillful; as, an expert surgeon; expert in chess or archery.",
    "expire": "1. To breathe out; to emit from the lungs; to throw out from the mouth or nostrils in the process of respiration; -- opposed to inspire.",
    "explain": "1. To flatten; to spread out; to unfold; to expand.",
    "expletive": "Filling up; hence, added merely for the purpose of filling up; superfluous.",
    "exploit": "1. A deed or act; especially, a heroic act; a deed of renown; an adventurous or noble achievement; as, the exploits of Alexander the Great.",
    "explore": "1. To seek for or after; to strive to attain by search; to look wisely and carefully for.",
    "exploring": "Employed in, or designed for, exploration.",
    "exponent": "1. (Alg.)  A number, letter, or any quantity written on the right hand of and above another quantity, and denoting how many times the latter is repeated as a factor to produce the power indicated; Note: thus a2 denotes the second power, and an the xth power, of a (2 and x being the exponents). A fractional exponent, or index, is used to denote the root of a quantity.",
    "expose": "1. To set forth; to set out to public view; to exhibit; to show; to display; as, to expose goods for sale; to expose pictures to public inspection.",
    "exposure": "1. The act of exposing or laying open, setting forth, laying bare of protection, depriving of care or concealment, or setting out to reprobation or contempt.",
    "express": "1. Exactly representing; exact.",
    "expulsion": "1. The act of expelling; a driving or forcing out; summary removal from membership, association, etc.",
    "exquisite": "1. Carefully selected or sought out; hence, of distinguishing and surpassing quality; exceedingly nice; delightfully excellent; giving rare satisfaction; as, exquisite workmanship.",
    "extent": "Extended.",
    "extenuate": "1. To make thin or slender; to draw out so as to lessen the thickness.",
    "exterior": "1. External; outward; pertaining to that which is external; -- opposed to interior; as, the exterior part of a sphere.",
    "external": "1. Outward; exterior; relating to the outside, as of a body; being without; acting from without; -- opposed to internal; as, the external form or surface of a body.",
    "extinct": "1. Extinguished; put out; quenched; as, a fire, a light, or a lamp, is extinct; an extinct volcano.",
    "extortion": "1. The act of extorting; the act or practice of wresting anything from a person by force, by threats, or by any undue exercise of power; undue exaction; overcharge. 2. (Law)  The offense committed by an officer who corruptly claims and takes, as his fee, money, or other thing of value, that is not due, or more than is due, or before it is due.",
    "extradite": "To deliver up by one government to another, as a fugitive from justice.",
    "extrude": "To thrust out; to force, press, or push out; to expel; to drive off or away.",
    "exuberant": "Characterized by abundance or superabundance; plenteous; rich; overflowing; copious or excessive in production; as, exuberant goodness; an exuberant intellect; exuberant foliage.",
    "fable": "1. A Feigned story or tale, intended to instruct or amuse; a fictitious narration intended to enforce some useful truth or precept; an apologue.",
    "fabric": "1. The structure of anything; the manner in which the parts of a thing are united; workmanship; texture; make; as cloth of a beautiful fabric. 2. That which is fabricated; as : (a) Framework; structure; edifice; building.",
    "fabulous": "1. Feigned, as a story or fable; related in fable; devised; invented; not real; fictitious; as, a fabulous description; a fabulous hero.",
    "facial": "Of or pertaining to the face; as, the facial artery, vein, or nerve.",
    "facility": "1. The quality of being easily performed; freedom from difficulty; ease; as, the facility of an operation.",
    "facing": "1. A covering in front, for ornament or other purpose; an exterior covering or sheathing; as, the facing of an earthen slope, sea wall, etc. , to strengthen it or to protect or adorn the exposed surface. 2. A lining placed near the edge of a garment for ornament or protection. 3. (Arch.)  The finishing of any face of a wall with material different from that of which it is chiefly composed, or the coating or material so used. 4. (Founding)  A powdered substance, as charcoal, bituminous coal, ect., applied to the face of a mold, or mixed with the sand that forms it, to give a fine smooth surface to the casting. 5. (Mil.) (a) pl.",
    "facsimile": "A copy of anything made, either so as to be deceptive or so as to give every part and detail of the original; an exact copy or likeness.",
    "faction": "1. (Anc.",
    "factor": "1. (Law)  One who transacts business for another; an agent; a substitute; especially, a mercantile agent who buys and sells goods and transacts business for others in commission; a commission merchant or consignee.",
    "factual": "Relating to, or containing, facts.",
    "faculty": "1. Ability to act or perform, whether inborn or cultivated; capacity for any natural function; especially, an original mental power or capacity for any of the well-known classes of mental activity; psychical or soul capacity; capacity for any of the leading kinds of soul activity, as knowledge, feeling, volition; intellectual endowment or gift; power; as, faculties of the mind or the soul.",
    "fade": "Weak; insipid; tasteless; commonplace.",
    "fading": "Losing freshness, color, brightness, or vigor. -- n.  Loss of color, freshness, or vigor.",
    "failing": "1. A failing short; a becoming deficient; failure; deficiency; imperfection; weakness; lapse; fault; infirmity; as, a mental failing.",
    "falcon": "1. (Zoöl.) (a) One of a family (Falconidæ) of raptorial birds, characterized by a short, hooked beak, strong claws, and powerful flight. (b) Any species of the genus Falco, distinguished by having a toothlike lobe on the upper mandible; especially, one of this genus trained to the pursuit of other birds, or game.",
    "fall": "1. To Descend, either suddenly or gradually; particularly, to descend by the force of gravity; to drop; to sink; as, the apple falls; the tide falls; the mercury falls in the barometer.",
    "false": "1. Uttering falsehood; unveracious; given to deceit; dishnest; as, a false witness. 2. Not faithful or loyal, as to obligations, allegiance, vows, etc.; untrue; treacherous; perfidious; as, a false friend, lover, or subject; false to promises.",
    "falsify": "1. To make false; to represent falsely.",
    "fame": "1. Public report or rumor.",
    "familiar": "1. Of or pertaining to a family; domestic.",
    "family": "1. The collective body of persons who live in one house, and under one head or manager; a household, including parents, children, and servants, and, as the case may be, lodgers or boarders. 2. The group comprising a husband and wife and their dependent children, constituting a fundamental unit in the organization of society.",
    "famine": "General scarcity of food; dearth; a want of provisions; destitution.",
    "fanatic": "Pertaining to, or indicating, fanaticism; extravagant in opinions; ultra; unreasonable; excessively enthusiastic, especially on religious subjects; as, fanatic zeal; fanatic notions.",
    "fancy": "1. The faculty by which the mind forms an image or a representation of anything perceived before; the power of combining and modifying such objects into new pictures or images; the power of readily and happily creating and recalling such objects for the purpose of amusement, wit, or embellishment; imagination.",
    "fanfare": "A flourish of trumpets, as in coming into the lists, etc.; also, a short and lively air performed on hunting horns during the chase.",
    "fang": "1. To catch; to seize, as with the teeth; to lay hold of; to gripe; to clutch.",
    "fantastic": "1. Existing only in imagination; fanciful; imaginary; not real; chimerical. 2. Having the nature of a phantom; unreal.",
    "fantasy": "1. Fancy; imagination; especially, a whimsical or fanciful conception; a vagary of the imagination; whim; caprice; humor.",
    "fastness": "1. The state of being fast and firm; firmness; fixedness; security; faithfulness.",
    "faucet": "1. A fixture for drawing a liquid, as water, molasses, oil, etc., from a pipe, cask, or other vessel, in such quantities as may be desired; -- called also tap, and cock.",
    "favorable": "1. Full of favor; favoring; manifesting partiality; kind; propitious; friendly.",
    "favoring": "That favors.",
    "favorite": "1. A person or thing regarded with peculiar favor; one treated with partiality; one preferred above others; especially, one unduly loved, trusted, and enriched with favors by a person of high rank or authority.",
    "feast": "1. A festival; a holiday; a solemn, or more commonly, a joyous, anniversary.",
    "federal": "1. Pertaining to a league or treaty; derived from an agreement or covenant between parties, especially between nations; constituted by a compact between parties, usually governments or their representatives.",
    "feeble": "1. Deficient in physical strenght; weak; infirm; debilitated.",
    "feed": "1. To give food to; to supply with nourishment; to satisfy the physical huger of.",
    "feel": "1. To perceive by the touch; to take cognizance of by means of the nerves of sensation distributed all over the body, especially by those of the skin; to have sensation excited by contact of (a thing) with the body or limbs.",
    "feminine": "1. Of or pertaining to a woman, or to women; characteristic of a woman; womanish; womanly.",
    "feminize": "To make womanish or effeminate.",
    "femur": "(a) The thigh bone. (b) The proximal segment of the hind limb containing the thigh bone; the thigh.",
    "fence": "1. That which fends off attack or danger; a defense; a protection; a cover; security; shield.",
    "fencing": "1. The art or practice of attack and defense with the sword, esp. with the s,allword.",
    "ferment": "1. That which causes fermentation, as yeast, barm, or fermenting beer.",
    "ferocious": "Fierce; savage; wild; indicating cruelty; ravenous; rapacious; as, ferocious look or features; a ferocious lion.",
    "ferocity": "Savage wildness or fierceness; fury; cruelty; as, ferocity of countenance.",
    "ferret": "An animal of the Weasel family (Mustela or Putorius furo), about fourteen inches in length, of a pale yellow or white color, with red eyes.",
    "ferry": "To carry or transport over a river, strait, or other narrow water, in a boat.",
    "fervor": "1. Heat; excessive warmth.",
    "fester": "1. To generate pus; to become imflamed and suppurate; as, a sore or a wound festers.",
    "festival": "Pertaining to a fest; festive; festal; appropriate to a festival; joyous; mirthful.",
    "festive": "Pertaining to, or becoming, a feast; festal; joyous; gay; mirthful; sportive.",
    "festivity": "1. The condition of being festive; social joy or exhilaration of spirits at an entertaintment; joyfulness; gayety.",
    "fetch": "1. To bear toward the person speaking, or the person or thing from whose point of view the action is contemplated; to go and bring; to get.",
    "fever": "1. (Med.)  A diseased state of the system, marked by increased heat, acceleration of the pulse, and a general derangement of the functions, including usually, thirst and loss of appetite.",
    "fiber": "1. One of the delicate, threadlike portions of which the tissues of plants and animals are in part constituted; as, the fiber of flax or of muscle. 2. Any fine, slender thread, or threadlike substance; as, a fiber of spun glass; especially, one of the slender rootlets of a plant. 3. Sinew; strength; toughness; as, a man of real fiber.",
    "fiction": "1. The act of feigning, inventing, or imagining; as, by a mere fiction of the mind.",
    "fiddle": "1. (Mus.)  A stringed instrument of music played with a bow; a violin; a kit. 2. (Bot.)  A kind of dock (Rumex pulcher) with fiddle-shaped leaves; -- called also fiddle dock. 3. (Naut.)  A rack or frame of bars connected by strings, to keep table furniture in place on the cabin table in bad weather.",
    "fidelity": "Faithfulness; adherence to right; careful and exact observance of duty, or discharge of obligations.",
    "fidgety": "Restless; uneasy.",
    "fifth": "1. Next in order after the fourth; -- the ordinal of five. 2. Consisting of one of five equal divisions of a thing.",
    "fiftieth": "1. Next in order after the forty-ninth; -- the ordinal of fifty. 2. Consisting of one of fifty equal parts or divisions.",
    "figment": "An invention; a fiction; something feigned or imagined.",
    "figure": "1. The form of anything; shape; outline; appearance.",
    "filler": "One who, or that which, fills; something used for filling.",
    "filling": "1. That which is used to fill a cavity or any empty space, or to supply a deficiency; as, filling for a cavity in a tooth, a depression in a roadbed, the space between exterior and interior walls of masonry, the pores of open-grained wood, the space between the outer and inner planks of a vessel, etc. 2. The woof in woven fabrics. 3. (Brewing)  Prepared wort added to ale to cleanse it.",
    "film": "1. A thin skin; a pellicle; a membranous covering, causing opacity; hence, any thin, slight covering.",
    "filter": "Any porous substance, as cloth, paper, sand, or charcoal, through which water or other liquid may passed to cleanse it from the solid or impure matter held in suspension; a chamber or device containing such substance; a strainer; also, a similar device for purifying air.",
    "filth": "1. Foul matter; anything that soils or defiles; dirt; nastiness. 2. Anything that sullies or defiles the moral character; corruption; pollution.",
    "filtrate": "To filter; to defecate; as liquid, by straining or percolation.",
    "finally": "1. At the end or conclusion; ultimately; lastly; as, the contest was long, but the Romans finally conquered.",
    "finance": "1. The income of a ruler or of a state; revennue; public money; sometimes, the income of an individual; often used in the plural for funds; available money; resources.",
    "financial": "Pertaining to finance.",
    "finch": "A small singing bird of many genera and species, belonging to the family Fringillidæ. Note: The word is often used in composition, as in chaffinch, goldfinch, grassfinch, pinefinch, etc.",
    "fineness": "1. The quality or condition of being fine. 2. Freedom from foreign matter or alloy; clearness; purity; as, the fineness of liquor.",
    "finicky": "Finical; unduly particular.",
    "finished": "Polished to the highest degree of excellence; complete; perfect; as, a finished poem; a finished education.",
    "finisher": "1. One who finishes, puts an end to, completes, or perfects; esp. used in the trades, as in hatting, weaving, etc., for the workman who gives a finishing touch to the work, or any part of it, and brings it to perfection.",
    "finishing": "The act or process of completing or perfecting; the final work upon or ornamentation of a thing.",
    "fit": "imp. & p. p. of Fight.",
    "five": "Four and one added; one more than four.",
    "flaccid": "Yielding to pressure for want of firmness and stiffness; soft and weak; limber; lax; drooping; flabby; as, a flaccid muscle; flaccid flesh.",
    "flagstone": "A flat stone used in paving, or any rock which will split into such stones.",
    "flail": "1. An instrument for threshing or beating grain from the ear by hand, consisting of a wooden staff or handle, at the end of which a stouter and shorter pole or club, called a swipe, is so hung as to swing freely.",
    "flaky": "Consisting of flakes or of small, loose masses; lying, or cleaving off, in flakes or layers; flakelike.",
    "flame": "1. A stream of burning vapor or gas, emitting light and heat; darting or streaming fire; a blaze; a fire. 2. Burning zeal or passion; elevated and noble enthusiasm; glowing imagination; passionate excitement or anger.",
    "flammable": "Inflammable.",
    "flap": "Anything broad and limber that hangs loose, or that is attached by one side or end and is easily moved; as, the flap of a garment.",
    "flaring": "1. That flares; flaming or blazing unsteadily; shining out with a dazzling light.",
    "flashing": "1. (Engineering)  The creation of an artifical flood by the sudden letting in of a body of water; -- called also flushing. 2. (Arch.)  Pieces of metal, built into the joints of a wall, so as to lap over the edge of the gutters or to cover the edge of the roofing; also, similar pieces used to cover the valleys of roofs of slate, shingles, or the like.",
    "flashy": "1. Dazzling for a moment; making a momentary show of brilliancy; transitorily bright.",
    "flask": "1. A small bottle-shaped vessel for holding fluids; as, a flask of oil or wine. 2. A narrow-necked vessel of metal or glass, used for various purposes; as of sheet metal, to carry gunpowder in; or of wrought iron, to contain quicksilver; or of glass, to heat water in, etc. 3. A bed in a gun carriage.",
    "flatly": "In a flat manner; evenly; horizontally; without spirit; dully; frigidly; peremptori;y; positively, plainly.",
    "flatten": "1. To reduce to an even surface or one approaching evenness; to make flat; to level; to make plane. 2. To throw down; to bring to the ground; to prostrate; hence, to depress; to deject; to dispirit. 3. To make vapid or insipid; to render stale. 4. (Mus.)  To lower the pitch of; to cause to sound less sharp; to let fall from the pitch.",
    "flatterer": "One who flatters.",
    "flattery": "The act or practice of flattering; the act of pleasing by artiful commendation or compliments; adulation; false, insincere, or excessive praise.",
    "flatware": "Articles for the table, as china or silverware, that are more or less flat, as distinguished from hollow ware.",
    "fleshed": "1. Corpulent; fat; having flesh. 2. Glutted; satiated; initiated.",
    "fleshy": "1. Full of, or composed of, flesh; plump; corpulent; fat; gross.",
    "flick": "To whip lightly or with a quick jerk; to flap; as, to flick a horse; to flick the dirt from boots.",
    "flier": "1. One who flies or flees; a runaway; a fugitive.",
    "flight": "1. The act or flying; a passing through the air by the help of wings; volitation; mode or style of flying.",
    "flinch": "1. To withdraw from any suffering or undertaking, from pain or danger; to fail in doing or perserving; to show signs of yielding or of suffering; to shrink; to wince; as, one of the parties flinched from the combat.",
    "fling": "1. To cast, send, to throw from the hand; to hurl; to dart; to emit with violence as if thrown from the hand; as, to fing a stone into the pond.",
    "flint": "1. (Min.)  A massive, somewhat impure variety of quartz, in color usually of a gray to brown or nearly black, breaking with a conchoidal fracture and sharp edge.",
    "flip": "A mixture of beer, spirit, etc., stirred and heated by a hot iron.",
    "flirt": "1. To throw with a jerk or quick effort; to fling suddenly; as, they flirt water in each other's faces; he flirted a glove, or a handkerchief. 2. To toss or throw about; to move playfully to and fro; as, to flirt a fan. 3. To jeer at; to treat with contempt; to mock.",
    "float": "1. Anything which floats or rests on the surface of a fluid, as to sustain weight, or to indicate the height of the surface, or mark the place of, something.",
    "flock": "1. A company or collection of living creatures; -- especially applied to sheep and birds, rarely to persons or (except in the plural) to cattle and other large animals; as, a flock of ravenous fowl.",
    "flogging": "from Flog, v. t. Flogging chisel (Mach.), a large cold chisel, used in chipping castings.",
    "flop": "1. To clap or strike, as a bird its wings, a fish its tail, etc.; to flap. 2. To turn suddenly, as something broad and flat.",
    "floral": "1. Pertaining to Flora, or to flowers; made of flowers; as, floral games, wreaths. 2. (Bot.)  Containing, or belonging to, a flower; as, a floral bud; a floral leaf; floral characters.",
    "floss": "1. (Bot.)  The slender styles of the pistillate flowers of maize; also called silk. 2. Untwisted filaments of silk, used in embroidering.",
    "flounder": "1. (Zoöl.)  A flatfish of the family Pleuronectidæ, of many species.",
    "flyaway": "Disposed to fly away; flighty; unrestrained; light and free; -- used of both persons and things. -- n.  A flyaway person or thing.",
    "flyer": "1. One that uses wings. 2. The fly of a flag: See Fly, n., 6. 3. Anything that is scattered abroad in great numbers as a theatrical programme, an advertising leaf, etc. 4. (Arch.)  One in a flight of steps which are parallel to each other(as in ordinary stairs), as distinguished from a winder. 5. The pair of arms attached to the spindle of a spinning frame, over which the thread passes to the bobbin; -- so called from their swift revolution.",
    "flying": "Moving in the air with, or as with, wings; moving lightly or rapidly; intended for rapid movement.",
    "foam": "The white substance, consisting of an aggregation of bubbles, which is formed on the surface of liquids,or in the mouth of an animal, by violent agitation or fermentation; froth; spume; scum; as, the foam of the sea.",
    "foe": "See Fiend, and cf.",
    "fog": "(a) A second growth of grass; aftergrass. (b) Dead or decaying grass remaining on land through the winter; -- called also foggage.",
    "foil": "1. To tread under foot; to trample.",
    "folk": "1. (Eng.",
    "follow": "1. To go or come after; to move behind in the same path or direction; hence, to go with (a leader, guide, etc.); to accompany; to attend.",
    "fondling": "The act of caressing; manifestation of tenderness.",
    "fondly": "1. Foolishly.",
    "fondness": "1. The quality or state of being fond; foolishness.",
    "food": "1. What is fed upon; that which goes to support life by being received within, and assimilated by, the organism of an animal or a plant; nutriment; aliment; especially, what is eaten by animals for nourishment.",
    "football": "An inflated ball to be kicked in sport, usually made in India rubber, or a bladder incased in Leather.",
    "footing": "1. Ground for the foot; place for the foot to rest on; firm foundation to stand on.",
    "footman": "1. A soldier who marches and fights on foot; a foot soldier. 2. A man in waiting; a male servant whose duties are to attend the door, the carriage, the table, etc. 3. Formerly, a servant who ran in front of his master's carriage; a runner.",
    "fossil": "1. Dug out of the eart; as, fossil coal; fossil salt. 2. (Paleon.)  Like or pertaining to fossils; contained in rocks. whether petrified or not; as, fossil plants, shells.",
    "foster": "1. To feed; to nourish; to support; to bring up.",
    "founder": "One who founds, establishes, and erects; one who lays a foundation; an author; one from whom anything originates; one who endows.",
    "fountain": "1. A spring of water issuing from the earth. 2. An artificially produced jet or stream of water; also, the structure or works in which such a jet or stream rises or flows; a basin built and constantly supplied with pure water for drinking and other useful purposes, or for ornament. 3. A reservoir or chamber to contain a liquid which can be conducted or drawn off as needed for use; as, the ink fountain in a printing press, etc. 4. The source from which anything proceeds, or from which anything is supplied continuously; origin; source.",
    "fox": "1. (Zoöl.)  A carnivorous animal of the genus Vulpes, family Canidæ, of many species.",
    "foyer": "1. A lobby in a theater; a greenroom. 2. The crucible or basin in a furnace which receives the molten metal.",
    "fraction": "1. The act of breaking, or state of being broken, especially by violence.",
    "fracture": "1. The act of breaking or snapping asunder; rupture; breach. 2. (Surg.)  The breaking of a bone. 3. (Min.)  The texture of a freshly broken surface; as, a compact fracture; an even, hackly, or conchoidal fracture.",
    "fragile": "Easily broken; brittle; frail; delicate; easily destroyed.",
    "fragility": "1. The condition or quality of being fragile; brittleness; frangibility.",
    "fragment": "A part broken off; a small, detached portion; an imperfect part; as, a fragment of an ancient writing.",
    "fragrance": "The quality of being fragrant; sweetness of smell; a sweet smell; a pleasing odor; perfume.",
    "fragrant": "[fragrans. -antis, p.pr. of fragrare to emit a smell of fragrance: cf.",
    "frail": "A basket made of rushes, used chiefly for containing figs and raisins. 2. The quantity of raisins -- about thirty-two, fifty-six, or seventy-five pounds, -- contained in a frail. 3. A rush for weaving baskets.",
    "frame": "1. (Arch.",
    "framing": "1. The act, process, or style of putting together a frame, or of constructing anything; a frame; that which frames. 2. (Arch.",
    "frantic": "Mad; raving; furious; violent; wild and disorderly; distracted.",
    "fraternal": "Pf, pertaining to, or involving, brethren; becoming to brothers; brotherly; as, fraternal affection; a fraternal embrace.",
    "fraying": "The skin which a deer frays from his horns.",
    "freckled": "Marked with freckles; spotted.",
    "freedom": "1. The state of being free; exemption from the power and control of another; liberty; independence.",
    "freely": "In a free manner; without restraint or compulsion; abundantly; gratuitously.",
    "freewill": "Of or pertaining to free will; voluntary; spontaneous; as, a freewill offering.",
    "freezing": "Tending to freeze; for freezing; hence, cold or distant in manner.",
    "freight": "1. That with which anything in fraught or laden for transportation; lading; cargo, especially of a ship, or a car on a railroad, etc.; as, a freight of cotton; a full freight. 2. (Law) (a) The sum paid by a party hiring a ship or part of a ship for the use of what is thus hired. (b) The price paid a common carrier for the carriage of goods.",
    "french": "Of or pertaining to France or its inhabitants.",
    "frenzied": "Affected with frenzy; frantic; maddened.",
    "frenzy": "Any violent agitation of the mind approaching to distraction; violent and temporary derangement of the mental faculties; madness; rage.",
    "frequency": "1. The condition of returning frequently; occurrence often repeated; common occurence; as, the frequency of crimes; the frequency of miracles.",
    "frequent": "1. Often to be met with; happening at short intervals; often repeated or occurring; as, frequent visits.",
    "fresh": "1. Possessed of original life and vigor; new and strong; unimpaired; sound. 2. New; original; additional.",
    "fretful": "Disposed to fret; ill-humored; peevish; angry; in a state of vexation; as, a fretful temper.",
    "friction": "1. The act of rubbing the surface of one body against that of another; attrition; in hygiene, the act of rubbing the body with the hand, with flannel, or with a brush etc., to excite the skin to healthy action. 2. (Mech.)  The resistance which a body meets with from the surface on which it moves.",
    "fridge": "To rub; to fray.",
    "friend": "1. One who entertains for another suo Want gives to know the flatterer from the friend.",
    "frighten": "To disturb with fear; to throw into a state of alarm or fright; to affright; to terrify.",
    "frightful": "1. Full of fright; affrighted; frightened.",
    "frigidity": "1. The condition or quality of being frigid; coldness; want of warmth.",
    "frill": "1. To shake or shiver as with cold; as, the hawk frills.",
    "fringe": "1. An ornamental appendage to the border of a piece of stuff, originally consisting of the ends of the warp, projecting beyond the woven fabric; but more commonly made separate and sewed on, consisting sometimes of projecting ends, twisted or plaited together, and sometimes of loose threads of wool, silk, or linen, or narrow strips of leather, or the like. 2. Something resembling in any respect a fringe; a line of objects along a border or edge; a border; an edging; a margin; a confine.",
    "frisk": "Lively; brisk; frolicsome; frisky.",
    "fritter": "1. A small quantity of batter, fried in boiling lard or in a frying pan.",
    "frivolous": "1. Of little weight or importance; not worth notice; slight; as, a frivolous argument.",
    "frolic": "Full of levity; dancing, playing, or frisking about; full of pranks; frolicsome; gay; merry.",
    "from": "Out of the neighborhood of; lessening or losing proximity to; leaving behind; by reason of; out of; by aid of; -- used whenever departure, setting out, commencement of action, being, state, occurrence, etc., or procedure, emanation, absence, separation, etc., are to be expressed.",
    "front": "1. The forehead or brow, the part of the face above the eyes; sometimes, also, the whole face.",
    "frostbite": "The freezing, or effect of a freezing, of some part of the body, as the ears or nose.",
    "frosted": "Covered with hoarfrost or anything resembling hoarfrost; ornamented with frosting; also, frost-bitten; as, a frosted cake; frosted glass.",
    "frosty": "1. Attended with, or producing, frost; having power to congeal water; cold; freezing; as, a frosty night. 2. Covered with frost; as, the grass is frosty. 3. Chill in affection; without warmth of affection or courage.",
    "froth": "1. The bubbles caused in fluids or liquors by fermentation or agitation; spume; foam; esp., a spume of saliva caused by disease or nervous excitement. 2. Any empty, senseless show of wit or eloquence; rhetoric without thought.",
    "frown": "1. To contract the brow in displeasure, severity, or sternness; to scowl; to put on a stern, grim, or surly look.",
    "frozen": "1. Congealed with cold; affected by freezing; as, a frozen brook.",
    "fructose": "Fruit sugar; levulose.",
    "frugality": "1. The quality of being frugal; prudent economy; that careful management of anything valuable which expends nothing unnecessarily, and applies what is used to a profitable purpose; thrift; --- opposed to extravagance.",
    "fruit": "1. Whatever is produced for the nourishment or enjoyment of man or animals by the processes of vegetable growth, as corn, grass, cotton, flax, etc.; -- commonly used in the plural.",
    "frustrate": "Vain; ineffectual; useless; unprofitable; null; voil; nugatory; of no effect.",
    "frying": "The process denoted by the verb fry.",
    "gab": "The hook on the end of an eccentric rod opposite the strap.",
    "gag": "1. To stop the mouth of, by thrusting sometimes in, so as to hinder speaking; hence, to silence by authority or by violence; not to allow freedom of speech to.",
    "gala": "Pomp, show, or festivity.",
    "gallantly": "In a polite or courtly manner; like a gallant or wooer.",
    "gallery": "1. A long and narrow corridor, or place for walking; a connecting passageway, as between one room and another; also, a long hole or passage excavated by a boring or burrowing animal. 2. A room for the exhibition of works of art; as, a picture gallery; hence, also, a large or important collection of paintings, sculptures, etc. 3. A long and narrow platform attached to one or more sides of public hall or the interior of a church, and supported by brackets or columns; -- sometimes intended to be occupied by musicians or spectators, sometimes designed merely to increase the capacity of the hall. 4. (Naut.)  A frame, like a balcony, projecting from the stern or quarter of a ship, and hence called stern galery or quarter gallry, -- seldom found in vessels built since 1850. 5. (Fort.)  Any communication which is covered overhead as well as at the sides.",
    "galley": "1. (Naut.)  A vessel propelled by oars, whether having masts and sails or not; as: (a) A large vessel for war and national purposes; -- common in the Middle Ages, and down to the 17th century. (b) A name given by analogy to the Greek, Roman, and other ancient vessels propelled by oars. (c) A light, open boat used on the Thames by customhouse officers, press gangs, and also for pleasure. (d) One of the small boats carried by a man-of-war.",
    "gallon": "A measure of capacity, containing four quarts; -- used, for the most part, in liquid measure, but sometimes in dry measure.",
    "gallows": "1. A frame from which is suspended the rope with which criminals are executed by hanging, usually consisting of two upright posts and a crossbeam on the top; also, a like frame for suspending anything.",
    "gallstone": "A concretion, or calculus, formed in the gall bladder or biliary passages.",
    "galvanize": "1. To affect with galvanism; to subject to the action of electrical currents. 2. To plate, as with gold, silver, etc., by means of electricity. 3. To restore to consciousness by galvanic action (as from a state of suspended animation); hence, to stimulate or excite to a factitious animation or activity. 4. To coat, as iron, with zinc.",
    "game": "Crooked; lame; as, a game leg.",
    "gangrene": "A term formerly restricted to mortification of the soft tissues which has not advanced so far as to produce complete loss of vitality; but now applied to mortification of the soft parts in any stage.",
    "gangway": "1. A passage or way into or out of any inclosed place; esp., a temporary way of access formed of planks. 2. In the English House of Commons, a narrow aisle across the house, below which sit those who do not vote steadly either with the government or with the opposition. 3. (Naut.)  The opening through the bulwarks of a vessel by which persons enter or leave it. 4. (Naut.)  That part of the spar deck of a vessel on each side of the booms, from the quarter-deck to the forecastle; -- more properly termed the waist.",
    "gap": "An opening in anything made by breaking or parting; as, a gap in a fence; an opening for a passage or entrance; an opening which implies a breach or defect; a vacant space or time; a hiatus; a mountain pass.",
    "garage": "1. A place for housing automobiles. 2.  (Aëronautics) A shed for housing an airship or flying machine; a hangar. 3.  A side way or space in a canal to enable vessels to pass each other; a siding.",
    "garbage": "Offal, as the bowels of an animal or fish; refuse animal or vegetable matter from a kitchen; hence, anything worthless, disgusting, or loathsome.",
    "garden": "1. A piece of ground appropriates to the cultivation of herbs, fruits, flowers, or vegetables. 2. A rich, well-cultivated spot or tract of country.",
    "garland": "1. The crown of a king.",
    "garlic": "1. (Bot.)  A plant of the genus Allium (A. sativum is the cultivated variety), having a bulbous root, a very strong smell, and an acrid, pungent taste.",
    "garment": "Any article of clothing, as a coat, a gown, etc.",
    "garnet": "A mineral having many varieties differing in color and in their constituents, but with the same crystallization (isometric), and conforming to the same general chemical formula.",
    "garnish": "1. To decorate with ornamental appendages; to set off; to adorn; to embellish.",
    "garter": "1. A band used to prevent a stocking from slipping down on the leg. 2. The distinguishing badge of the highest order of knighthood in Great Britain, called the Order of the Garter, instituted by Edward III.; also, the Order itself. 3. (Her.)  Same as Bendlet.",
    "gas": "1. An aëriform fluid; -- a term used at first by chemists as synonymous with air, but since restricted to fluids supposed to be permanently elastic, as oxygen, hydrogen, etc., in distinction from vapors, as steam, which become liquid on a reduction of temperature.",
    "gathering": "1. The act of collecting or bringing together. 2. That which is gathered, collected, or brought together; as: (a) A crowd; an assembly; a congregation. (b) A charitable contribution; a collection. (c) A tumor or boil suppurated or maturated; an abscess.",
    "gauze": "A very thin, slight, transparent stuff, generally of silk; also, any fabric resembling silk gauze; as, wire gauze; cotton gauze.",
    "gawk": "1. A cuckoo.",
    "gear": "1. Clothing; garments; ornaments.",
    "gecko": "Any lizard of the family Geckonidæ. The geckoes are small, carnivorous, mostly nocturnal animals with large eyes and vertical, elliptical pupils.",

    "gender": "1. Kind; sort.",
    "generous": "1. Of honorable birth or origin; highborn.",
    "gentile": "One of a non-Jewish nation; one neither a Jew nor a Christian; a worshiper of false gods; a heathen.",
    "gentleman": "1. A man well born; one of good family; one above the condition of a yeoman. 2. One of gentle or refined manners; a well-bred man. 3. (Her.)  One who bears arms, but has no title. 4. The servant of a man of rank.",
    "gently": "In a gentle manner.",
    "geography": "1. The science which treats of the world and its inhabitants; a description of the earth, or a portion of the earth, including its structure, fetures, products, political divisions, and the people by whom it is inhabited. 2. A treatise on this science.",
    "geology": "1. The science which treats: (a) Of the structure and mineral constitution of the globe; structural geology. (b) Of its history as regards rocks, minerals, rivers, valleys, mountains, climates, life, etc.; historical geology. (c) Of the causes and methods by which its structure, features, changes, and conditions have been produced; dynamical geology.",
    "geometric": "Pertaining to, or according to the rules or principles of, geometry; determined by geometry; as, a geometrical solution of a problem.",
    "geometry": "1. That branch of mathematics which investigates the relations, properties, and measurement of solids, surfaces, lines, and angles; the science which treats of the properties and relations of magnitudes; the science of the relations of space. 2. A treatise on this science.",
    "geranium": "1. (Bot.)  A genus of plants having a beaklike tours or receptacle, around which the seed capsules are arranged, and membranous projections, or stipules, at the joints.",
    "gerbil": "One of several species of small, jumping, murine rodents, of the genus Gerbillus.",
    "germinate": "To sprout; to bud; to shoot; to begin to vegetate, as a plant or its seed; to begin to develop, as a germ.",
    "gestation": "1. The act of wearing (clothes or ornaments). [Obs.] 2. The act of carrying young in the womb from conception to delivery; pregnancy. 3. Exercise in which one is borne or carried, as on horseback, or in a carriage, without the exertion of his own powers; passive exercise.",
    "gesture": "1. Manner of carrying the body; position of the body or limbs; posture.",
    "getting": "1. The act of obtaining or acquiring; acquisition.",
    "giant": "1. A man of extraordinari bulk and stature.",
    "gibberish": "Rapid and inarticulate talk; unintelligible language; unmeaning words; jargon.",
    "giddy": "1. Having in the head a sensation of whirling or reeling about; having lost the power of preserving the balance of the body, and therefore wavering and inclined to fall; lightheaded; dizzy.",
    "gift": "1. Anything given; anything voluntarily transferred by one person to another without compensation; a present; an offering.",
    "gigantic": "1. Of extraordinary size; like a giant. 2. Such as a giant might use, make, or cause; immense; tremendous; extraordinarly; as, gigantic deeds; gigantic wickedness.",
    "giggle": "To laugh with short catches of the breath or voice; to laugh in a light, affected, or silly manner; to titter with childish levity.",
    "giggly": "Prone to giggling.",

    "given": "p. p. & a. from Give, v. 1. (Math.",
    "giver": "One who gives; a donor; a bestower; a grantor; one who imparts or distributes.",
    "giving": "1. The act of bestowing as a gift; a conferring or imparting. 2. A gift; a benefaction.",
    "gizzard": "1. (Anat.)  The second, or true, muscular stomach of birds, in which the food is crushed and ground, after being softened in the glandular stomach (crop), or lower part of the esophagus; the gigerium. 2. (Zoöl.) (a) A thick muscular stomach found in many invertebrate animals. (b) A stomach armed with chitinous or shelly plates or teeth, as in certain insects and mollusks.",
    "glacial": "1. Pertaining to ice or to its action; consisting of ice; frozen; icy; esp., pertaining to glaciers; as, glacial phenomena.",
    "glacier": "An immense field or stream of ice, formed in the region of perpetual snow, and moving slowly down a mountain slope or valley, as in the Alps, or over an extended area, as in Greenland.",
    "glade": "1. An open passage through a wood; a grassy open or cleared space in a forest.",
    "gladly": "1. Preferably; by choice.",

    "glimmer": "To give feeble or scattered rays of light; to shine faintly; to show a faint, unsteady light; as, the glimmering dawn; a glimmering lamp.",

    "glisten": "To sparkle or shine; especially, to shine with a mild, subdued, and fitful luster; to emit a soft, scintillating light; to gleam; as, the glistening stars.",
    "glitter": "1. To sparkle with light; to shine with a brilliant and broken light or showy luster; to gleam; as, a glittering sword.",
    "gloomy": "1. Imperfectly illuminated; dismal through obscurity or darkness; dusky; dim; clouded; as, the cavern was gloomy.",
    "glorify": "1. To make glorious by bestowing glory upon; to confer honor and distinction upon; to elevate to power or happiness, or to celestial glory.",
    "glorious": "1. Exhibiting attributes, qualities, or acts that are worthy of or receive glory; noble; praiseworthy; excellent; splendid; illustrious; inspiring admiration; as, glorious deeds.",
    "glory": "1. Praise, honor, admiration, or distinction, accorded by common consent to a person or thing; high reputation; honorable fame; renown.",
    "gloss": "1. Bbrightness or luster of a body proceeding from a smooth surface; polish; as, the gloss of silk; cloth is calendered to give it a gloss.",

    "hydrogen": "A gaseous element, colorless, tasteless, and odorless, the lightest known substance, being fourteen and a half times lighter than air (hence its use in filling balloons), and over eleven thousand times lighter than water.",

    "hyphen": "A mark or short dash, thus [-], placed at the end of a line which terminates with a syllable of a word, the remainder of which is carried to the next line; or between the parts of many a compound word; as in fine-leaved, clear-headed.",
    "hypnotism": "A form of sleep or somnambulism brought on by artificial means, in which there is an unusual suspension of some powers, and an unusual activity of others.",
    "hypocrisy": "The act or practice of a hypocrite; a feigning to be what one is not, or to feel what one does not feel; a dissimulation, or a concealment of one's real character, disposition, or motives; especially, the assuming of false appearance of virtue or religion; a simulation of goodness.",
    "hypocrite": "One who plays a part; especially, one who, for the purpose of winning approbation of favor, puts on a fair outside seeming; one who feigns to be other and better than he is; a false pretender to virtue or piety; one who simulates virtue or piety.",
    "ice": "1. Water or other fluid frozen or reduced to the solid state by cold; frozen water.",
    "icon": "An image or representation; a portrait or pretended portrait.",
    "icy": "1. Pertaining to, resembling, or abounding in, ice; cold; frosty.",
    "idealize": "1. To make ideal; to give an ideal form or value to; to attribute ideal characteristics and excellences to; as, to idealize real life. 2. (Fine Arts)  To treat in an ideal manner.",
    "identical": "1. The same; the selfsame; the very same; not different; as, the identical person or thing.",
    "identify": "1. To make to be the same; to unite or combine in such a manner as to make one; to treat as being one or having the same purpose or effect; to consider as the same in any relation.",
    "identity": "1. The state or quality of being identical, or the same; sameness.",
    "ideology": "1. The science of ideas.",
